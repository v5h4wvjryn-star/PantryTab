<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pantry Tab</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Encodes the current path into the query string so index.html
      // can restore it before React Router initializes.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
