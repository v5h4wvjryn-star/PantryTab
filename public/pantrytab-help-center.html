ere is no way to change or remove someone else's. Comments are one level deep. You cannot reply to a specific comment — every comment attaches to the topic itself. If you are answering one person in a busy thread, name them in your comment so it is clear who you mean. Community Rules These are the rules shown in Kitchen Talk, in full: \"Be respectful and kind to fellow chefs.\" \"No spam, self promotion, or ads.\" \"Keep discussions relevant to cooking/kitchen.\" \"Verify health claims before posting.\" That last one carries weight. Kitchen Talk is full of confident advice about allergies, food safety and storage times. Check anything that affects someone's health against a reliable source before you post it, and treat what you read there the same way. Etiquette, and what not to post Kitchen Talk is public. Do not post your address, phone number, email address, or photos that show where you live. Do not post other people's personal information either — including a household member's allergies or health details. Give the detail people need to help you: the appliance model, the quantities, what went wrong. \"It burned\" is hard to answer. Say thank you when someone solves your problem, and post what worked. The next person searching will find it. Disagree with the cooking, not the cook. If something goes wrong \"Photo upload is not configured. Please use an image URL instead.\" Some setups cannot accept a photo file. Upload your picture somewhere you can get a public link to it, and put that link in the Content of your post instead. A photo will not attach. Check it is under the Max 5MB limit. A photo straight off a modern phone camera can exceed that — shrink it or take a lower resolution shot. You cannot edit or delete a post. Check it is actually yours. Editing and deleting are limited to your own topics and comments. Your reply is not under the comment you meant it for. Comments are one level deep, so every comment lands at the bottom of the topic. Quote or name the person you are answering. You posted something you regret. Delete your own topic or comment. Assume any other Pantry Tab user could have read it in the meantime. Good to know Kitchen Talk is a discussion forum, not support. It does not reach the Pantry Tab team. Topics and comments are visible to everyone signed in to Pantry Tab, not just your household. A recipe shared in Kitchen Talk is only text in a post. To share a recipe properly so people can filter for it and save it, publish it to the marketplace instead — see Publishing, rating, and reviewing recipes publishing recipes . Nothing you post in Kitchen Talk touches your pantry, your allergies or your household. It is a separate place. Related Publishing, rating, and reviewing recipes publishing recipes Browsing and saving community recipes browse marketplace How allergy warnings work, and their limits how allergy warnings work Your data and privacy privacy and your data "}, {"id": "plans-and-pricing", "title": "Plans, the free trial, and pricing", "category": "Account & Billing", "summary": "The 14-day free trial, the Monthly and Yearly plans with their exact prices, what is included, and how to subscribe.", "keywords": ["pricing", "plans", "free trial", "14 day trial", "monthly", "yearly", "subscribe", "cost", "price", "premium", "trial ended", "best value"], "html": "<p>Pantry Tab has one product and two ways to pay for it. This page covers the free trial, what each plan costs, and exactly what you get.<\/p>\n<h2 id=\"the-14-day-free-trial\">The 14-day free trial<\/h2>\n<ul>\n<li>The trial lasts <strong>14 days from when you created your account<\/strong>.<\/li>\n<li><strong>No credit card is required to start.<\/strong> You sign up and use the app.<\/li>\n<li>While the trial is running you have full access — the same features a paid subscription gets.<\/li>\n<\/ul>\n<p>Two places show you where you are:<\/p>\n<ul>\n<li>A trial banner in the app: \"You have N days left in your free trial.\" with a <strong>Subscribe Now<\/strong> button.<\/li>\n<li>The <strong>Billing<\/strong> page, which shows <strong>Free trial<\/strong> with an \"N days left\" badge.<\/li>\n<\/ul>\n<p>When the 14 days are up, the subscribe page heading changes from <strong>Subscribe to Pantry Tab<\/strong> to <strong>Your 14-day trial has ended.<\/strong>, with \"Subscribe to keep managing your pantry and allergies.\" Your data is still there — you subscribe to carry on using it.<\/p>\n<h2 id=\"the-two-plans\">The two plans<\/h2>\n<p>Both plans are on the subscribe page, reachable from <strong>Subscribe Now<\/strong> in the trial banner or <strong>View plans<\/strong> on the <strong>Billing<\/strong> page.<\/p>\n<p><strong>Monthly<\/strong><\/p>\n<ul>\n<li>\"Full access, billed monthly\"<\/li>\n<li><strong>$4.99 /month<\/strong><\/li>\n<li>Button: <strong>Subscribe Monthly<\/strong><\/li>\n<\/ul>\n<p><strong>Yearly<\/strong><\/p>\n<ul>\n<li>Badge: <strong>BEST VALUE<\/strong><\/li>\n<li>\"Full access, billed annually\"<\/li>\n<li><strong>$52.99 /year<\/strong><\/li>\n<li>\"~$4.42/mo — Save over 11%\"<\/li>\n<li>Button: <strong>Subscribe Yearly<\/strong><\/li>\n<\/ul>\n<p><strong>The two plans include exactly the same features.<\/strong> There is no higher tier, no feature held back on Monthly, and no limit that lifts on Yearly. The only difference is how often you are billed and what that works out to per month.<\/p>\n<p>The terms shown on both plans read: \"<strong>14-day free trial. No credit card required to start. Cancel anytime. All sales are final.<\/strong>\"<\/p>\n<h2 id=\"everything-included\">Everything included<\/h2>\n<p>Both plans list the same <strong>Everything included<\/strong> features:<\/p>\n<ul>\n<li>Snap a photo of your shelf to add items<\/li>\n<li>Receipt scanning<\/li>\n<li>Barcode scanning<\/li>\n<li>Expiry alerts and reorder points<\/li>\n<li>AI recipe suggestions from what you own<\/li>\n<li>AI weekly meal planning<\/li>\n<li>AI grocery list building<\/li>\n<li>Send your list to Kroger Pickup<\/li>\n<li>Per-person allergy protection<\/li>\n<li>Meal prep cook sheets<\/li>\n<li>Recipe import from photo, URL, or document<\/li>\n<li>Recipe marketplace<\/li>\n<li>Unlimited inventory items<\/li>\n<li>Unlimited household members<\/li>\n<\/ul>\n<p>Unlimited household members means one subscription covers everyone you invite into your household. They do not each need to pay.<\/p>\n<h2 id=\"subscribing\">Subscribing<\/h2>\n<ol>\n<li>Tap <strong>Subscribe Now<\/strong> in the trial banner, or open <strong>Billing<\/strong> and tap <strong>View plans<\/strong>.<\/li>\n<li>Choose <strong>Subscribe Monthly<\/strong> or <strong>Subscribe Yearly<\/strong>.<\/li>\n<li>Complete the checkout.<\/li>\n<li>When you come back you will see the toast <strong>Payment successful! Activating your subscription…<\/strong><\/li>\n<\/ol>\n<p>Use the <strong>same email address you sign in to Pantry Tab with<\/strong> at checkout. Your subscription is matched to your account by email, so paying with a different address leaves your account showing as Free. This is the single most common billing problem — see <a href=\"#managing-your-subscription\">Managing your subscription and billing<\/a>.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>You paid but the app still shows Free.<\/strong> Almost always the email address. Your subscription is matched by email address, so a checkout completed with a different email will not attach to your account. Contact support with both addresses.<\/li>\n<li><strong>The plan badge in the avatar menu says Free.<\/strong> That badge shows <strong>Premium<\/strong> or <strong>Free<\/strong>. If you have paid and it says <strong>Free<\/strong>, check the email address as above.<\/li>\n<li><strong>Your 14-day trial has ended.<\/strong> appears and you cannot use features. The trial runs 14 days from account creation and has run out. Pick a plan to carry on.<\/li>\n<li><strong>You want a refund.<\/strong> The terms state \"All sales are final.\" Cancelling stops future billing rather than refunding what you have paid.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>The trial is counted from account creation, not from first use. Signing up and coming back a fortnight later means the trial has already gone.<\/li>\n<li>There is no free tier after the trial and no partial plan. Both plans are full access.<\/li>\n<li>\"Cancel anytime\" means you cancel future billing yourself, through <strong>Manage subscription<\/strong> on the <strong>Billing<\/strong> page.<\/li>\n<li>The consent links shown at sign-up and on the subscribe page point at pages that may not load. The legal pages are currently placeholders.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#managing-your-subscription\">Managing your subscription and billing<\/a><\/li>\n<li><a href=\"#profile-and-settings\">Your profile and connected accounts<\/a><\/li>\n<li><a href=\"#create-your-account\">Creating your account and signing in<\/a><\/li>\n<li><a href=\"#welcome-to-pantry-tab\">Welcome to Pantry Tab<\/a><\/li>\n<\/ul>", "text": "Pantry Tab has one product and two ways to pay for it. This page covers the free trial, what each plan costs, and exactly what you get. The 14 day free trial The trial lasts 14 days from when you created your account . No credit card is required to start. You sign up and use the app. While the trial is running you have full access — the same features a paid subscription gets. Two places show you where you are: A trial banner in the app: \"You have N days left in your free trial.\" with a Subscribe Now button. The Billing page, which shows Free trial with an \"N days left\" badge. When the 14 days are up, the subscribe page heading changes from Subscribe to Pantry Tab to Your 14 day trial has ended. , with \"Subscribe to keep managing your pantry and allergies.\" Your data is still there — you subscribe to carry on using it. The two plans Both plans are on the subscribe page, reachable from Subscribe Now in the trial banner or View plans on the Billing page. Monthly \"Full access, billed monthly\" $4.99 /month Button: Subscribe Monthly Yearly Badge: BEST VALUE \"Full access, billed annually\" $52.99 /year \"~$4.42/mo — Save over 11%\" Button: Subscribe Yearly The two plans include exactly the same features. There is no higher tier, no feature held back on Monthly, and no limit that lifts on Yearly. The only difference is how often you are billed and what that works out to per month. The terms shown on both plans read: \" 14 day free trial. No credit card required to start. Cancel anytime. All sales are final. \" Everything included Both plans list the same Everything included features: Snap a photo of your shelf to add items Receipt scanning Barcode scanning Expiry alerts and reorder points AI recipe suggestions from what you own AI weekly meal planning AI grocery list building Send your list to Kroger Pickup Per person allergy protection Meal prep cook sheets Recipe import from photo, URL, or document Recipe marketplace Unlimited inventory items Unlimited household members Unlimited household members means one subscription covers everyone you invite into your household. They do not each need to pay. Subscribing 1. Tap Subscribe Now in the trial banner, or open Billing and tap View plans . 2. Choose Subscribe Monthly or Subscribe Yearly . 3. Complete the checkout. 4. When you come back you will see the toast Payment successful! Activating your subscription… Use the same email address you sign in to Pantry Tab with at checkout. Your subscription is matched to your account by email, so paying with a different address leaves your account showing as Free. This is the single most common billing problem — see Managing your subscription and billing managing your subscription . If something goes wrong You paid but the app still shows Free. Almost always the email address. Your subscription is matched by email address, so a checkout completed with a different email will not attach to your account. Contact support with both addresses. The plan badge in the avatar menu says Free. That badge shows Premium or Free . If you have paid and it says Free , check the email address as above. Your 14 day trial has ended. appears and you cannot use features. The trial runs 14 days from account creation and has run out. Pick a plan to carry on. You want a refund. The terms state \"All sales are final.\" Cancelling stops future billing rather than refunding what you have paid. Good to know The trial is counted from account creation, not from first use. Signing up and coming back a fortnight later means the trial has already gone. There is no free tier after the trial and no partial plan. Both plans are full access. \"Cancel anytime\" means you cancel future billing yourself, through Manage subscription on the Billing page. The consent links shown at sign up and on the subscribe page point at pages that may not load. The legal pages are currently placeholders. Related Managing your subscription and billing managing your subscription Your profile and connected accounts profile and settings Creating your account and signing in create your account Welcome to Pantry Tab welcome to pantry tab "}, {"id": "managing-your-subscription", "title": "Managing your subscription and billing", "category": "Account & Billing", "summary": "The Billing page and its states, the billing portal, cancelling, past-due payments, and why a paid account can still show as Free.", "keywords": ["billing", "subscription", "manage subscription", "billing portal", "invoice", "update card", "cancel", "past due", "payment failed", "still shows free"], "html": "<p>The <strong>Billing<\/strong> page is where you see the state of your subscription and get to the billing portal. Open it from the avatar menu, or go to <strong>Billing<\/strong> directly.<\/p>\n<h2 id=\"read-this-first-subscriptions-are-matched-by-email-address\">Read this first: subscriptions are matched by email address<\/h2>\n<p><strong>Your subscription is matched to your account by email address.<\/strong> If you paid with a different email than the one you sign in to Pantry Tab with, the payment will not attach to your account, and <strong>Pantry Tab will keep showing you as Free<\/strong> no matter how many times you refresh.<\/p>\n<p>Nothing is lost, and you have not been charged twice. The two records do not know about each other.<\/p>\n<p>What to do:<\/p>\n<ol>\n<li>Check which email you are signed in with. It is shown in the avatar menu.<\/li>\n<li>Check the email on your payment receipt.<\/li>\n<li>If they differ, contact support with both addresses so the subscription can be matched up.<\/li>\n<\/ol>\n<p>Whenever you subscribe, use the same email you sign in with. This is the most common billing problem by a wide margin, and everything below assumes the addresses match.<\/p>\n<h2 id=\"what-the-billing-page-shows\">What the Billing page shows<\/h2>\n<p>The page shows one of three states:<\/p>\n<ul>\n<li><strong>Free trial<\/strong>, with a badge showing \"N days left\" — you are inside your 14-day trial.<\/li>\n<li><strong>Your subscription<\/strong> with a status of <strong>Active<\/strong> — you have a paid subscription and everything is working.<\/li>\n<li><strong>Payment past due<\/strong> — \"Update your payment method to keep your subscription active.\" A charge did not go through.<\/li>\n<\/ul>\n<p>There are two buttons:<\/p>\n<ul>\n<li><strong>Manage subscription<\/strong> — opens the billing portal, run by Stripe, the payment provider.<\/li>\n<li><strong>View plans<\/strong> — takes you to the plans page to pick or change a plan.<\/li>\n<\/ul>\n<h2 id=\"what-you-can-do-in-the-billing-portal\">What you can do in the billing portal<\/h2>\n<p>Tap <strong>Manage subscription<\/strong> and the billing portal opens. From there you can:<\/p>\n<ul>\n<li>Update your card or other payment method.<\/li>\n<li>See your invoices and payment history.<\/li>\n<li>Cancel your subscription.<\/li>\n<\/ul>\n<p>The portal is where all of that lives — Pantry Tab does not have its own card form or invoice list.<\/p>\n<h2 id=\"after-you-pay\">After you pay<\/h2>\n<p>When you come back from checkout you will see the toast <strong>Payment successful! Activating your subscription…<\/strong> Activation takes a moment. If the page still shows the old state, refresh it.<\/p>\n<h2 id=\"cancelling\">Cancelling<\/h2>\n<p>Cancel through <strong>Manage subscription<\/strong> — that is the only route.<\/p>\n<ul>\n<li>Cancelling stops future billing.<\/li>\n<li>It does not refund payments you have already made. The plan terms state \"All sales are final.\"<\/li>\n<li>You can subscribe again later from <strong>View plans<\/strong>. Your pantry, recipes and household are not deleted by cancelling.<\/li>\n<\/ul>\n<h2 id=\"when-a-payment-fails\">When a payment fails<\/h2>\n<p>If a charge does not go through, the <strong>Billing<\/strong> page shows <strong>Payment past due<\/strong> — \"Update your payment method to keep your subscription active.\"<\/p>\n<ol>\n<li>Tap <strong>Manage subscription<\/strong>.<\/li>\n<li>Update the card in the billing portal.<\/li>\n<li>Come back to <strong>Billing<\/strong> and refresh to confirm the status has moved to <strong>Active<\/strong>.<\/li>\n<\/ol>\n<p>An expired card is the usual cause, closely followed by a card that has been reissued with a new number.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"Could not open the billing portal. Please try again.\"<\/strong> This means Pantry Tab could not find a billing record for your account. Two causes: no checkout has been completed on this account yet — in which case use <strong>View plans<\/strong> and subscribe first — or you paid using a different email address, in which case see the section at the top of this page. If neither applies, try again in a moment.<\/li>\n<li><strong>You paid and the app still shows Free.<\/strong> The email address. See the top of this page.<\/li>\n<li><strong>The billing page still shows Free trial after paying.<\/strong> Refresh the page. If it does not change, check the email address on your receipt.<\/li>\n<li><strong>You cannot find your invoice.<\/strong> Invoices live in the billing portal, behind <strong>Manage subscription<\/strong>, not in Pantry Tab.<\/li>\n<li><strong>You want to switch between Monthly and Yearly.<\/strong> Use <strong>View plans<\/strong> to see both, and <strong>Manage subscription<\/strong> to handle your existing subscription.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Billing is private to you. Other members of your household cannot see it, and one subscription covers everyone in the household.<\/li>\n<li><strong>Manage subscription<\/strong> leaves Pantry Tab and opens the payment provider's portal in the process. Come back to the <strong>Billing<\/strong> page afterwards to confirm the status changed.<\/li>\n<li>Signing in with a different login method (email and password versus Google, Apple or Facebook) can mean a different email address on the account. If your subscription vanished, check which account you are actually signed in to.<\/li>\n<li>Prices and what each plan includes are covered in <a href=\"#plans-and-pricing\">Plans, the free trial, and pricing<\/a>.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#plans-and-pricing\">Plans, the free trial, and pricing<\/a><\/li>\n<li><a href=\"#profile-and-settings\">Your profile and connected accounts<\/a><\/li>\n<li><a href=\"#create-your-account\">Creating your account and signing in<\/a><\/li>\n<li><a href=\"#troubleshooting\">Troubleshooting common problems<\/a><\/li>\n<\/ul>", "text": "The Billing page is where you see the state of your subscription and get to the billing portal. Open it from the avatar menu, or go to Billing directly. Read this first: subscriptions are matched by email address Your subscription is matched to your account by email address. If you paid with a different email than the one you sign in to Pantry Tab with, the payment will not attach to your account, and Pantry Tab will keep showing you as Free no matter how many times you refresh. Nothing is lost, and you have not been charged twice. The two records do not know about each other. What to do: 1. Check which email you are signed in with. It is shown in the avatar menu. 2. Check the email on your payment receipt. 3. If they differ, contact support with both addresses so the subscription can be matched up. Whenever you subscribe, use the same email you sign in with. This is the most common billing problem by a wide margin, and everything below assumes the addresses match. What the Billing page shows The page shows one of three states: Free trial , with a badge showing \"N days left\" — you are inside your 14 day trial. Your subscription with a status of Active — you have a paid subscription and everything is working. Payment past due — \"Update your payment method to keep your subscription active.\" A charge did not go through. There are two buttons: Manage subscription — opens the billing portal, run by Stripe, the payment provider. View plans — takes you to the plans page to pick or change a plan. What you can do in the billing portal Tap Manage subscription and the billing portal opens. From there you can: Update your card or other payment method. See your invoices and payment history. Cancel your subscription. The portal is where all of that lives — Pantry Tab does not have its own card form or invoice list. After you pay When you come back from checkout you will see the toast Payment successful! Activating your subscription… Activation takes a moment. If the page still shows the old state, refresh it. Cancelling Cancel through Manage subscription — that is the only route. Cancelling stops future billing. It does not refund payments you have already made. The plan terms state \"All sales are final.\" You can subscribe again later from View plans . Your pantry, recipes and household are not deleted by cancelling. When a payment fails If a charge does not go through, the Billing page shows Payment past due — \"Update your payment method to keep your subscription active.\" 1. Tap Manage subscription . 2. Update the card in the billing portal. 3. Come back to Billing and refresh to confirm the status has moved to Active . An expired card is the usual cause, closely followed by a card that has been reissued with a new number. If something goes wrong \"Could not open the billing portal. Please try again.\" This means Pantry Tab could not find a billing record for your account. Two causes: no checkout has been completed on this account yet — in which case use View plans and subscribe first — or you paid using a different email address, in which case see the section at the top of this page. If neither applies, try again in a moment. You paid and the app still shows Free. The email address. See the top of this page. The billing page still shows Free trial after paying. Refresh the page. If it does not change, check the email address on your receipt. You cannot find your invoice. Invoices live in the billing portal, behind Manage subscription , not in Pantry Tab. You want to switch between Monthly and Yearly. Use View plans to see both, and Manage subscription to handle your existing subscription. Good to know Billing is private to you. Other members of your household cannot see it, and one subscription covers everyone in the household. Manage subscription leaves Pantry Tab and opens the payment provider's portal in the process. Come back to the Billing page afterwards to confirm the status changed. Signing in with a different login method email and password versus Google, Apple or Facebook can mean a different email address on the account. If your subscription vanished, check which account you are actually signed in to. Prices and what each plan includes are covered in Plans, the free trial, and pricing plans and pricing . Related Plans, the free trial, and pricing plans and pricing Your profile and connected accounts profile and settings Creating your account and signing in create your account Troubleshooting common problems troubleshooting "}, {"id": "profile-and-settings", "title": "Your profile and connected accounts", "category": "Account & Billing", "summary": "What each card on the Profile page does, the avatar menu and its badges, changing your active person and location, and signing out.", "keywords": ["profile", "settings", "personal information", "connected accounts", "avatar menu", "role", "owner", "active person", "location", "sign out", "help"], "html": "<p>The <strong>Profile<\/strong> page holds your own account details and the links out to everything else you can manage. Open it from the avatar menu, or go to <strong>Profile<\/strong> directly.<\/p>\n<h2 id=\"the-profile-page-card-by-card\">The Profile page, card by card<\/h2>\n<p><strong>Personal Information<\/strong><\/p>\n<p>Your own details. Edit them and save; you will see the toast <strong>Profile updated<\/strong>. This is your account, not a person profile — the people you cook for live on the <strong>People<\/strong> page instead.<\/p>\n<p><strong>Subscription<\/strong><\/p>\n<p>\"Your current plan and status\". It shows <strong>Status<\/strong> and a <strong>Manage Subscription<\/strong> button, which takes you to your billing. For what each status means, cancelling, and the email-matching rule that catches most people out, see <a href=\"#managing-your-subscription\">Managing your subscription and billing<\/a>.<\/p>\n<p><strong>Connected Accounts<\/strong><\/p>\n<p>\"Link external services to power features in PantryTab\". Today this is where you connect Kroger for pickup ordering, coupons and store selection. The full walkthrough — connecting, choosing a store by ZIP, disconnecting, and the errors you may hit — is in <a href=\"#kroger-connect\">Connecting your Kroger account<\/a>.<\/p>\n<p><strong>Help &amp; How To<\/strong><\/p>\n<p>A link to the app's built-in help page. See the note at the end of this article before you rely on it.<\/p>\n<p><strong>Your role in the household<\/strong><\/p>\n<p>Shows whether you are the <strong>Owner<\/strong> or a <strong>Member<\/strong>. The role decides what you are allowed to do:<\/p>\n<ul>\n<li>Only the Owner can invite, edit or remove household members.<\/li>\n<li>Only the Owner can add, rename or delete locations, and only the Owner can update the household name.<\/li>\n<li>An Owner cannot remove themselves from their own household.<\/li>\n<\/ul>\n<p><strong>Manage Household<\/strong><\/p>\n<p>Takes you to <strong>Household Settings<\/strong>, where members, the household name and locations are managed. See <a href=\"#households-and-sharing\">Households: sharing your kitchen<\/a>.<\/p>\n<h2 id=\"the-avatar-menu\">The avatar menu<\/h2>\n<p>Tap your avatar in the header. It shows:<\/p>\n<ul>\n<li>Your name and email address.<\/li>\n<li>A plan badge — <strong>Premium<\/strong> or <strong>Free<\/strong>.<\/li>\n<li>A role badge — <strong>Owner<\/strong>.<\/li>\n<\/ul>\n<p>Then the links: <strong>Profile<\/strong>, <strong>Household<\/strong>, <strong>People<\/strong>, <strong>Billing<\/strong>, <strong>Sign out<\/strong>.<\/p>\n<p>The email shown here is worth knowing, because your subscription is matched to your account by email address. If your plan badge says <strong>Free<\/strong> after you have paid, compare this address with the one on your receipt.<\/p>\n<h2 id=\"your-active-person-and-your-location\">Your active person and your location<\/h2>\n<p>Neither of these is on the Profile page — both live in the header of the main app.<\/p>\n<ul>\n<li><strong>Active Person<\/strong> — the selector in the header. It controls whose allergy warnings you see. Switch it whenever you are cooking for someone else. Changing it shows the toast <strong>Active person changed<\/strong>. You can also set someone as active from the <strong>People<\/strong> page with <strong>Set Active<\/strong>.<\/li>\n<li><strong>Location<\/strong> — a second selector in the header, which only appears once your household has more than one location. One location is marked <strong>(Primary)<\/strong>. Locations each have their own inventory. See <a href=\"#multiple-locations\">Tracking a second location<\/a>.<\/li>\n<\/ul>\n<h2 id=\"signing-out\">Signing out<\/h2>\n<p>Tap your avatar and choose <strong>Sign out<\/strong>. Inside the Community marketplace, the sidebar has its own <strong>Sign Out<\/strong>.<\/p>\n<p>Sign out if you are on a shared or borrowed device. Nothing is deleted by signing out — your household, pantry and recipes are all still there when you sign back in.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>A button you need is greyed out or missing.<\/strong> Check <strong>Your role in the household<\/strong> on your Profile. Inviting members, renaming the household and managing locations are Owner-only.<\/li>\n<li><strong>The plan badge says Free but you have paid.<\/strong> Subscriptions are matched by email address. Compare the email in the avatar menu with the one on your receipt, then see <a href=\"#managing-your-subscription\">Managing your subscription and billing<\/a>.<\/li>\n<li><strong>There is no location selector in the header.<\/strong> It only appears when your household has more than one location. With one location there is nothing to switch between.<\/li>\n<li><strong>Allergy warnings are for the wrong person.<\/strong> Change the <strong>Active Person<\/strong> selector in the header.<\/li>\n<li><strong>A change you made is not showing on someone else's device.<\/strong> The app does not sync live between devices. They need to refresh.<\/li>\n<li><strong>The app looks out of date after an update.<\/strong> The installed app can hold on to an old cached version. See <a href=\"#app-not-updating\">The app looks out of date<\/a>.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li><strong>The built-in Help &amp; How To page is older than the current app.<\/strong> It describes things that have since changed — including a \"Snack\" meal type that does not exist and dashboard tiles that have been redesigned. This knowledge base is the current reference; treat the in-app help as background reading.<\/li>\n<li>Your profile, your billing, your Kroger connection and the recipes you save from the marketplace are private to you. Almost everything else — inventory, grocery list, recipes, meal plan, people, allergies, stores and locations — is shared with everyone in your household, with no per-member privacy.<\/li>\n<li>The legal pages linked from the app are currently placeholders.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#managing-your-subscription\">Managing your subscription and billing<\/a><\/li>\n<li><a href=\"#kroger-connect\">Connecting your Kroger account<\/a><\/li>\n<li><a href=\"#households-and-sharing\">Households: sharing your kitchen<\/a><\/li>\n<li><a href=\"#people-profiles\">People profiles and the active person<\/a><\/li>\n<\/ul>", "text": "The Profile page holds your own account details and the links out to everything else you can manage. Open it from the avatar menu, or go to Profile directly. The Profile page, card by card Personal Information Your own details. Edit them and save; you will see the toast Profile updated . This is your account, not a person profile — the people you cook for live on the People page instead. Subscription \"Your current plan and status\". It shows Status and a Manage Subscription button, which takes you to your billing. For what each status means, cancelling, and the email matching rule that catches most people out, see Managing your subscription and billing managing your subscription . Connected Accounts \"Link external services to power features in PantryTab\". Today this is where you connect Kroger for pickup ordering, coupons and store selection. The full walkthrough — connecting, choosing a store by ZIP, disconnecting, and the errors you may hit — is in Connecting your Kroger account kroger connect . Help & How To A link to the app's built in help page. See the note at the end of this article before you rely on it. Your role in the household Shows whether you are the Owner or a Member . The role decides what you are allowed to do: Only the Owner can invite, edit or remove household members. Only the Owner can add, rename or delete locations, and only the Owner can update the household name. An Owner cannot remove themselves from their own household. Manage Household Takes you to Household Settings , where members, the household name and locations are managed. See Households: sharing your kitchen households and sharing . The avatar menu Tap your avatar in the header. It shows: Your name and email address. A plan badge — Premium or Free . A role badge — Owner . Then the links: Profile , Household , People , Billing , Sign out . The email shown here is worth knowing, because your subscription is matched to your account by email address. If your plan badge says Free after you have paid, compare this address with the one on your receipt. Your active person and your location Neither of these is on the Profile page — both live in the header of the main app. Active Person — the selector in the header. It controls whose allergy warnings you see. Switch it whenever you are cooking for someone else. Changing it shows the toast Active person changed . You can also set someone as active from the People page with Set Active . Location — a second selector in the header, which only appears once your household has more than one location. One location is marked Primary . Locations each have their own inventory. See Tracking a second location multiple locations . Signing out Tap your avatar and choose Sign out . Inside the Community marketplace, the sidebar has its own Sign Out . Sign out if you are on a shared or borrowed device. Nothing is deleted by signing out — your household, pantry and recipes are all still there when you sign back in. If something goes wrong A button you need is greyed out or missing. Check Your role in the household on your Profile. Inviting members, renaming the household and managing locations are Owner only. The plan badge says Free but you have paid. Subscriptions are matched by email address. Compare the email in the avatar menu with the one on your receipt, then see Managing your subscription and billing managing your subscription . There is no location selector in the header. It only appears when your household has more than one location. With one location there is nothing to switch between. Allergy warnings are for the wrong person. Change the Active Person selector in the header. A change you made is not showing on someone else's device. The app does not sync live between devices. They need to refresh. The app looks out of date after an update. The installed app can hold on to an old cached version. See The app looks out of date app not updating . Good to know The built in Help & How To page is older than the current app. It describes things that have since changed — including a \"Snack\" meal type that does not exist and dashboard tiles that have been redesigned. This knowledge base is the current reference; treat the in app help as background reading. Your profile, your billing, your Kroger connection and the recipes you save from the marketplace are private to you. Almost everything else — inventory, grocery list, recipes, meal plan, people, allergies, stores and locations — is shared with everyone in your household, with no per member privacy. The legal pages linked from the app are currently placeholders. Related Managing your subscription and billing managing your subscription Connecting your Kroger account kroger connect Households: sharing your kitchen households and sharing People profiles and the active person people profiles "}, {"id": "troubleshooting", "title": "Troubleshooting common problems", "category": "Troubleshooting", "summary": "Look up the exact message you are seeing, what causes it, and what to do about it, grouped by area of the app.", "keywords": ["error", "error message", "problem", "not working", "failed", "rate limit", "session expired", "fix", "broken", "help"], "html": "<p>This is a lookup article. Find the message you are seeing on screen — every message below is quoted word for word — or scan the heading for the part of the app you are in. If nothing matches, start with the first steps at the end.<\/p>\n<h2 id=\"signing-in-and-your-session\">Signing in and your session<\/h2>\n<ul>\n<li><strong>\"Session expired. Please log in again.\"<\/strong> — your sign-in has run out. Sign in again at pantrytab.com. If it comes straight back, sign out from the avatar menu and sign back in.<\/li>\n<li><strong>Your plan badge says Free after you have paid.<\/strong> Your subscription is matched by <strong>email address<\/strong>. If you paid with a different email than the one you sign in with, Pantry Tab does not connect the two. Use the same email, or contact support.<\/li>\n<\/ul>\n<h2 id=\"ai-features-planning-grocery-generation-scanning-imports\">AI features (planning, grocery generation, scanning, imports)<\/h2>\n<ul>\n<li><strong>\"Rate limit reached. Please try again in a moment.\"<\/strong> — you used an AI feature too quickly in a row. Wait a moment and try again. Nothing was lost.<\/li>\n<li><strong>\"Rate limit exceeded. Please try again in a moment.\"<\/strong> — the same thing on recipe imports.<\/li>\n<li><strong>\"Rate limited. Please try again in a moment.\"<\/strong> — the same thing on receipt scanning.<\/li>\n<li><strong>\"Rate limited. Please try again.\"<\/strong> — the same thing on shelf scanning.<\/li>\n<li><strong>\"AI credits exhausted. Please add credits to continue.\"<\/strong> — this is a limit on the service side, not on your account, and waiting will not clear it. Contact support.<\/li>\n<\/ul>\n<h2 id=\"photos-receipts-and-shelf-scans\">Photos, receipts and shelf scans<\/h2>\n<ul>\n<li><strong>\"Image size exceeds 10MB limit\"<\/strong> — the photo is too big. Retake it at a lower resolution, or crop it before uploading. Some upload paths cap lower and say <strong>\"Image too large (max 8MB).\"<\/strong> instead.<\/li>\n<li><strong>\"No image provided\"<\/strong> — no photo reached the scanner. Take or choose the photo again.<\/li>\n<li><strong>\"No food items detected. Try a clearer shot or different angle.\"<\/strong> — the AI could not find food in the picture. Take a wide shot with labels facing the camera and good lighting.<\/li>\n<li><strong>\"This receipt is too long to read in one pass. Try photographing it in two halves.\"<\/strong> — photograph the top half, add those items, then <strong>Scan Another<\/strong> for the bottom half.<\/li>\n<li><strong>\"Failed to analyze receipt\"<\/strong> and <strong>\"Failed to analyze photo\"<\/strong> — the read did not complete. Retry with a sharper, better-lit photo.<\/li>\n<li><strong>Product not found<\/strong> on a barcode lookup — \"Please enter the details manually\". The barcode you scanned is kept, so fill in the name and details yourself.<\/li>\n<\/ul>\n<p>Nothing from a scan is saved until you confirm on the review step, so a failed scan never changes your inventory.<\/p>\n<h2 id=\"recipe-imports\">Recipe imports<\/h2>\n<ul>\n<li><strong>\"\\&lt;site&gt; blocks automated requests. Open the recipe in your browser, screenshot or print-to-PDF, then use the Photo or Document import.\"<\/strong> — this is the most common import failure. The recipe site refuses automated visits. Do what the message says: open the page yourself, screenshot it or print it to PDF, and import that instead. You may also see <strong>\"\\&lt;site&gt; served a bot-protection page...\"<\/strong>, which means the same thing.<\/li>\n<li><strong>\"Could not extract enough content from this page. The site may be blocking scrapers or require login.\"<\/strong> — same fix: import a screenshot or PDF.<\/li>\n<li><strong>\"Could not find a recipe on this page. Try a different URL.\"<\/strong> — the page has no recipe on it. Check you copied the recipe page link, not a category or search page.<\/li>\n<li><strong>\"Could not fetch page (HTTP \\&lt;status&gt;)\"<\/strong> — the page did not load. Check the link opens in your browser.<\/li>\n<li><strong>\"Invalid URL\"<\/strong>, <strong>\"Only http(s) URLs are supported\"<\/strong>, <strong>\"URL is too long\"<\/strong> — paste a plain web address that starts with http or https.<\/li>\n<li><strong>\"No recipe data extracted\"<\/strong> and <strong>\"Failed to analyze image\"<\/strong> — the photo could not be read as a recipe. Import one page at a time and make sure the text is in focus.<\/li>\n<li><strong>\"No document text provided\"<\/strong> — the file had no readable text. Supported formats are .pdf, .docx, .txt, .md, .html and .json.<\/li>\n<li><strong>\"Recipe service daily quota exceeded. Try again tomorrow.\"<\/strong> — the <strong>Discover something new<\/strong> half of <strong>What Can I Make?<\/strong> has hit its daily limit. Your own library results still work.<\/li>\n<\/ul>\n<h2 id=\"grocery-list-and-kroger\">Grocery list and Kroger<\/h2>\n<ul>\n<li><strong>\"All ingredients are already in your pantry!\"<\/strong> — nothing needed adding. This is a result, not a fault.<\/li>\n<li><strong>Failed to generate shopping list<\/strong> — the AI run did not finish. Try again in a moment.<\/li>\n<li><strong>\"Kroger account not connected. Please connect Kroger first.\"<\/strong> — go to <strong>Profile<\/strong> → <strong>Connected Accounts<\/strong> → <strong>Kroger<\/strong> → <strong>Connect<\/strong>.<\/li>\n<li><strong>\"No Kroger store selected. Set one in Profile.\"<\/strong> and <strong>\"No store location selected. Provide locationId or set a preferred store.\"<\/strong> — you are connected but have no store. In <strong>Connected Accounts<\/strong>, use <strong>Choose your store<\/strong>, enter a ZIP, <strong>Search<\/strong>, then <strong>Select<\/strong>.<\/li>\n<li><strong>\"No Kroger stores found near that ZIP\"<\/strong> — no store matched. Check the ZIP, or try a nearby one.<\/li>\n<li><strong>\"No items could be matched to Kroger products\"<\/strong> — none of your unchecked items found a product. Rename items to something a store search would find, such as \"milk\" rather than a household nickname.<\/li>\n<li><strong>The connection page timed out.<\/strong> The link Kroger sends you through is valid for <strong>15 minutes<\/strong>. If you took longer, press <strong>Connect<\/strong> again.<\/li>\n<\/ul>\n<h2 id=\"meal-planner-and-prep-sheets\">Meal planner and prep sheets<\/h2>\n<ul>\n<li><strong>\"No meals selected\"<\/strong> — tick at least one suggestion before saving.<\/li>\n<li><strong>\"Failed to save meals\"<\/strong> — the plan did not save. Try the run again.<\/li>\n<li><strong>\"No meals are tagged for prep in this week. Tap the chef-hat on a meal to tag it.\"<\/strong> — a prep sheet is built from tagged meals only. Tag them in week view first.<\/li>\n<li><strong>\"The tagged meals have no ingredients or steps yet. Add them to the recipes first.\"<\/strong> — the tagged recipes are empty. Fill in ingredients and instructions, then build again.<\/li>\n<li><strong>A meal you added replaced one that was there.<\/strong> There is one meal per meal type per day, per household. Adding a second dinner to a day replaces the first, without warning.<\/li>\n<li><strong>Print did nothing.<\/strong> <strong>Print<\/strong> opens a new window, so a pop-up blocker will stop it. Use <strong>Download<\/strong> and print the downloaded file instead.<\/li>\n<\/ul>\n<h2 id=\"household-people-and-locations\">Household, people and locations<\/h2>\n<ul>\n<li><strong>\"You are the only owner of your current household.\"<\/strong> — you cannot accept an invitation while you are the sole Owner of your own household. Your current household needs another Owner, or it needs deleting — and deleting a household deletes all of its data.<\/li>\n<li><strong>\"Invalid or expired invitation\"<\/strong> — invite links are single-use and expire. Ask for a fresh one.<\/li>\n<li><strong>\"No pending invitation found\"<\/strong> — nothing is waiting for the email address you signed in with. Check the invitation went to that exact address. Matching ignores capitals.<\/li>\n<li><strong>\"Cannot delete the active person. Please switch to a different person first.\"<\/strong> — change the header <strong>Active Person<\/strong> selector to someone else, then delete.<\/li>\n<li><strong>\"Maximum of 2 locations allowed\"<\/strong> — a household can have the primary location plus one more. Delete one to add another.<\/li>\n<li><strong>\"Only the household owner can add/update/delete locations\"<\/strong> and \"Only the household owner can update the name\" — ask the Owner to make the change.<\/li>\n<li><strong>\"Cannot delete the primary location\"<\/strong> — the primary location cannot be removed.<\/li>\n<\/ul>\n<h2 id=\"allergies\">Allergies<\/h2>\n<ul>\n<li><strong>\"This allergy already exists for this person\"<\/strong> — that person already has that allergen. Note that \"Peanut\" and \"Peanuts\" count as two different entries, so check for a near-duplicate.<\/li>\n<\/ul>\n<h2 id=\"community\">Community<\/h2>\n<ul>\n<li><strong>\"Photo upload is not configured. Please use an image URL instead.\"<\/strong> — photo attachments are unavailable on some setups. Post a link to an image instead of uploading a file.<\/li>\n<\/ul>\n<h2 id=\"billing\">Billing<\/h2>\n<ul>\n<li><strong>\"Could not open the billing portal. Please try again.\"<\/strong> — <strong>Manage subscription<\/strong> could not open. Usually there is no billing record for your account yet: no checkout was completed, or the payment was made with a different email address than the one you sign in with. Use <strong>View plans<\/strong> to start a subscription, and see <a href=\"#managing-your-subscription\">Managing your subscription and billing<\/a> for the email-matching rule.<\/li>\n<\/ul>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<p>Before digging further, these fix a lot:<\/p>\n<ol>\n<li><strong>Refresh the page.<\/strong> There is no live sync between devices, so a change made by another household member only appears after a refresh.<\/li>\n<li><strong>Hard refresh, or open pantrytab.com in a private window.<\/strong> If a feature everyone else can see is missing for you, you are looking at a cached older version of the app. See <a href=\"#app-not-updating\">The app looks out of date<\/a>.<\/li>\n<li><strong>Sign out and back in<\/strong> from the avatar menu.<\/li>\n<li><strong>Check the Active Person<\/strong> in the header. Allergy warnings follow whoever is selected.<\/li>\n<li><strong>Check the location selector<\/strong> in the header. Each location has its own inventory, so an item can look missing when you are viewing the other location.<\/li>\n<li><strong>Check you are in the right household.<\/strong> Accepting an invitation moves you out of your previous household, and your old household's inventory, recipes and plan go with it.<\/li>\n<\/ol>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Deleting cascades. Deleting a household deletes everything in it, deleting a location deletes that location's inventory, deleting a recipe deletes its meal-plan entries, and deleting a person deletes their allergies.<\/li>\n<li>Alerts are in-app only. There are no push notifications and no emails, so nothing will chase you outside the app.<\/li>\n<li>The app's own <strong>Help &amp; How To<\/strong> page is older than the current app. It mentions a Snack meal type that does not exist and dashboard tiles that have changed.<\/li>\n<li>The legal pages are currently placeholders, and some consent links on the sign-up and subscribe pages may not resolve.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#app-not-updating\">The app looks out of date<\/a><\/li>\n<li><a href=\"#limits-and-known-issues\">Limits and known issues<\/a><\/li>\n<li><a href=\"#privacy-and-your-data\">Your data and privacy<\/a><\/li>\n<li><a href=\"#managing-your-subscription\">Managing your subscription and billing<\/a><\/li>\n<\/ul>", "text": "This is a lookup article. Find the message you are seeing on screen — every message below is quoted word for word — or scan the heading for the part of the app you are in. If nothing matches, start with the first steps at the end. Signing in and your session \"Session expired. Please log in again.\" — your sign in has run out. Sign in again at pantrytab.com. If it comes straight back, sign out from the avatar menu and sign back in. Your plan badge says Free after you have paid. Your subscription is matched by email address . If you paid with a different email than the one you sign in with, Pantry Tab does not connect the two. Use the same email, or contact support. AI features planning, grocery generation, scanning, imports \"Rate limit reached. Please try again in a moment.\" — you used an AI feature too quickly in a row. Wait a moment and try again. Nothing was lost. \"Rate limit exceeded. Please try again in a moment.\" — the same thing on recipe imports. \"Rate limited. Please try again in a moment.\" — the same thing on receipt scanning. \"Rate limited. Please try again.\" — the same thing on shelf scanning. \"AI credits exhausted. Please add credits to continue.\" — this is a limit on the service side, not on your account, and waiting will not clear it. Contact support. Photos, receipts and shelf scans \"Image size exceeds 10MB limit\" — the photo is too big. Retake it at a lower resolution, or crop it before uploading. Some upload paths cap lower and say \"Image too large max 8MB .\" instead. \"No image provided\" — no photo reached the scanner. Take or choose the photo again. \"No food items detected. Try a clearer shot or different angle.\" — the AI could not find food in the picture. Take a wide shot with labels facing the camera and good lighting. \"This receipt is too long to read in one pass. Try photographing it in two halves.\" — photograph the top half, add those items, then Scan Another for the bottom half. \"Failed to analyze receipt\" and \"Failed to analyze photo\" — the read did not complete. Retry with a sharper, better lit photo. Product not found on a barcode lookup — \"Please enter the details manually\". The barcode you scanned is kept, so fill in the name and details yourself. Nothing from a scan is saved until you confirm on the review step, so a failed scan never changes your inventory. Recipe imports \"\\<site\\ blocks automated requests. Open the recipe in your browser, screenshot or print to PDF, then use the Photo or Document import.\" — this is the most common import failure. The recipe site refuses automated visits. Do what the message says: open the page yourself, screenshot it or print it to PDF, and import that instead. You may also see \"\\<site\\ served a bot protection page...\" , which means the same thing. \"Could not extract enough content from this page. The site may be blocking scrapers or require login.\" — same fix: import a screenshot or PDF. \"Could not find a recipe on this page. Try a different URL.\" — the page has no recipe on it. Check you copied the recipe page link, not a category or search page. \"Could not fetch page HTTP \\<status\\ \" — the page did not load. Check the link opens in your browser. \"Invalid URL\" , \"Only http s URLs are supported\" , \"URL is too long\" — paste a plain web address that starts with http or https. \"No recipe data extracted\" and \"Failed to analyze image\" — the photo could not be read as a recipe. Import one page at a time and make sure the text is in focus. \"No document text provided\" — the file had no readable text. Supported formats are .pdf, .docx, .txt, .md, .html and .json. \"Recipe service daily quota exceeded. Try again tomorrow.\" — the Discover something new half of What Can I Make? has hit its daily limit. Your own library results still work. Grocery list and Kroger \"All ingredients are already in your pantry!\" — nothing needed adding. This is a result, not a fault. Failed to generate shopping list — the AI run did not finish. Try again in a moment. \"Kroger account not connected. Please connect Kroger first.\" — go to Profile → Connected Accounts → Kroger → Connect . \"No Kroger store selected. Set one in Profile.\" and \"No store location selected. Provide locationId or set a preferred store.\" — you are connected but have no store. In Connected Accounts , use Choose your store , enter a ZIP, Search , then Select . \"No Kroger stores found near that ZIP\" — no store matched. Check the ZIP, or try a nearby one. \"No items could be matched to Kroger products\" — none of your unchecked items found a product. Rename items to something a store search would find, such as \"milk\" rather than a household nickname. The connection page timed out. The link Kroger sends you through is valid for 15 minutes . If you took longer, press Connect again. Meal planner and prep sheets \"No meals selected\" — tick at least one suggestion before saving. \"Failed to save meals\" — the plan did not save. Try the run again. \"No meals are tagged for prep in this week. Tap the chef hat on a meal to tag it.\" — a prep sheet is built from tagged meals only. Tag them in week view first. \"The tagged meals have no ingredients or steps yet. Add them to the recipes first.\" — the tagged recipes are empty. Fill in ingredients and instructions, then build again. A meal you added replaced one that was there. There is one meal per meal type per day, per household. Adding a second dinner to a day replaces the first, without warning. Print did nothing. Print opens a new window, so a pop up blocker will stop it. Use Download and print the downloaded file instead. Household, people and locations \"You are the only owner of your current household.\" — you cannot accept an invitation while you are the sole Owner of your own household. Your current household needs another Owner, or it needs deleting — and deleting a household deletes all of its data. \"Invalid or expired invitation\" — invite links are single use and expire. Ask for a fresh one. \"No pending invitation found\" — nothing is waiting for th"}, {"id": "app-not-updating", "title": "The app looks out of date", "category": "Troubleshooting", "summary": "Why a feature other people can see is missing for you, and how to force Pantry Tab to load the current version on a computer or a phone.", "keywords": ["stale", "cache", "out of date", "old version", "hard refresh", "clear cache", "not updating", "missing feature", "refresh", "incognito"], "html": "<p>If someone else can see a button or a feature that is not there for you, the app itself is almost certainly fine. Your device is showing you a stored copy of an older version. This is the single most common problem people write to support about.<\/p>\n<h2 id=\"why-it-happens\">Why it happens<\/h2>\n<p>Pantry Tab is a web app, and both your browser and the version installed on your phone home screen keep a copy of the app on the device so it opens quickly. When a new version ships, that stored copy can keep loading until something forces it to fetch the new one. Everything in your pantry, recipes and plan is stored with your account, not in that copy, so nothing is at risk here — you are only looking at an old shell.<\/p>\n<h2 id=\"fixes-in-order\">Fixes, in order<\/h2>\n<p>Work down this list and stop when the missing feature appears.<\/p>\n<ol>\n<li><strong>Hard refresh.<\/strong> This reloads the page and ignores the stored copy.\n   - Windows: <strong>Ctrl + F5<\/strong>, or <strong>Ctrl + Shift + R<\/strong>.\n   - Mac: <strong>Cmd + Shift + R<\/strong>.\n   - Phone or tablet: there is no key combination. Pull down on the page to refresh, and if that does not work, close the tab or the installed app fully — including swiping it out of your recent apps — and open it again.<\/li>\n<li><strong>Open pantrytab.com in a private or incognito window.<\/strong> A private window ignores the stored copy entirely, so this tells you which problem you have. If the feature is there in private browsing, it is a stale copy and step 3 will clear it. If it is missing there too, it is not a caching problem — see <a href=\"#troubleshooting\">Troubleshooting common problems<\/a>.<\/li>\n<li><strong>Clear the site's data.<\/strong> In your browser's settings, find site settings or site data, look up pantrytab.com, and clear its data. Then open pantrytab.com again. This signs you out, so have your password or your Google, Apple or Facebook sign-in ready. It does not delete anything in your pantry.<\/li>\n<li><strong>On a phone, remove and re-add the home screen app.<\/strong> Delete the Pantry Tab icon from your home screen the way you delete any app. Then open pantrytab.com again — in <strong>Safari<\/strong> on iPhone, or <strong>Chrome<\/strong> on Android — and add it to your home screen fresh. See <a href=\"#install-on-your-phone\">Installing Pantry Tab on your phone<\/a>.<\/li>\n<\/ol>\n<h2 id=\"two-related-things-that-look-like-a-bug\">Two related things that look like a bug<\/h2>\n<p><strong>Changes from other people do not appear on their own.<\/strong> A household shares one inventory, grocery list, recipe library and meal plan, but the app does not live-sync between devices. If someone ticks off a grocery item or adds a meal while you have the app open, your screen keeps showing what it loaded. Refresh the page to see their change. This is worth knowing when two of you are shopping from the same list in the same store — refresh before you assume something has not been picked up.<\/p>\n<p><strong>The meal planner reloads the page after you save an AI plan.<\/strong> When you accept suggestions from <strong>Plan this week's meals<\/strong>, the page reloads itself. That is deliberate, and it is how the new meals and the new recipes are brought into view. Let it finish rather than pressing back.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>The feature is still missing after all four steps.<\/strong> It may not be available to you. Check you are looking at the right household and the right location, and check it is not something your role restricts — only the Owner can invite members or add locations, for example.<\/li>\n<li><strong>You cleared the site's data and cannot sign back in.<\/strong> Use <strong>Forgot password<\/strong> on the sign-in page to set a new password.<\/li>\n<li>You see <strong>\"Session expired. Please log in again.\"<\/strong> after refreshing. Sign in again. Clearing the site's data and a long gap since your last visit both cause this.<\/li>\n<li><strong>Something looks wrong only on one device.<\/strong> Repeat these steps on that device. Each device keeps its own copy.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>A plain refresh is enough for most things. Reach for a hard refresh when a feature is missing rather than when data looks stale.<\/li>\n<li>The in-app <strong>Help &amp; How To<\/strong> page is older than the app itself and describes some screens that have changed, including a Snack meal type that does not exist. Refreshing will not fix that — the page itself is out of date.<\/li>\n<li>Prep sheets are not saved. A refresh clears a built prep sheet, so use <strong>Download<\/strong> first if you want to keep one. See <a href=\"#prep-sheets\">Meal prep cook sheets<\/a>.<\/li>\n<li>The shopping calculator's <strong>Budget<\/strong> also resets to 100 on reload.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#troubleshooting\">Troubleshooting common problems<\/a><\/li>\n<li><a href=\"#limits-and-known-issues\">Limits and known issues<\/a><\/li>\n<li><a href=\"#install-on-your-phone\">Installing Pantry Tab on your phone<\/a><\/li>\n<li><a href=\"#households-and-sharing\">Households: sharing your kitchen<\/a><\/li>\n<\/ul>", "text": "If someone else can see a button or a feature that is not there for you, the app itself is almost certainly fine. Your device is showing you a stored copy of an older version. This is the single most common problem people write to support about. Why it happens Pantry Tab is a web app, and both your browser and the version installed on your phone home screen keep a copy of the app on the device so it opens quickly. When a new version ships, that stored copy can keep loading until something forces it to fetch the new one. Everything in your pantry, recipes and plan is stored with your account, not in that copy, so nothing is at risk here — you are only looking at an old shell. Fixes, in order Work down this list and stop when the missing feature appears. 1. Hard refresh. This reloads the page and ignores the stored copy. Windows: Ctrl + F5 , or Ctrl + Shift + R . Mac: Cmd + Shift + R . Phone or tablet: there is no key combination. Pull down on the page to refresh, and if that does not work, close the tab or the installed app fully — including swiping it out of your recent apps — and open it again. 2. Open pantrytab.com in a private or incognito window. A private window ignores the stored copy entirely, so this tells you which problem you have. If the feature is there in private browsing, it is a stale copy and step 3 will clear it. If it is missing there too, it is not a caching problem — see Troubleshooting common problems troubleshooting . 3. Clear the site's data. In your browser's settings, find site settings or site data, look up pantrytab.com, and clear its data. Then open pantrytab.com again. This signs you out, so have your password or your Google, Apple or Facebook sign in ready. It does not delete anything in your pantry. 4. On a phone, remove and re add the home screen app. Delete the Pantry Tab icon from your home screen the way you delete any app. Then open pantrytab.com again — in Safari on iPhone, or Chrome on Android — and add it to your home screen fresh. See Installing Pantry Tab on your phone install on your phone . Two related things that look like a bug Changes from other people do not appear on their own. A household shares one inventory, grocery list, recipe library and meal plan, but the app does not live sync between devices. If someone ticks off a grocery item or adds a meal while you have the app open, your screen keeps showing what it loaded. Refresh the page to see their change. This is worth knowing when two of you are shopping from the same list in the same store — refresh before you assume something has not been picked up. The meal planner reloads the page after you save an AI plan. When you accept suggestions from Plan this week's meals , the page reloads itself. That is deliberate, and it is how the new meals and the new recipes are brought into view. Let it finish rather than pressing back. If something goes wrong The feature is still missing after all four steps. It may not be available to you. Check you are looking at the right household and the right location, and check it is not something your role restricts — only the Owner can invite members or add locations, for example. You cleared the site's data and cannot sign back in. Use Forgot password on the sign in page to set a new password. You see \"Session expired. Please log in again.\" after refreshing. Sign in again. Clearing the site's data and a long gap since your last visit both cause this. Something looks wrong only on one device. Repeat these steps on that device. Each device keeps its own copy. Good to know A plain refresh is enough for most things. Reach for a hard refresh when a feature is missing rather than when data looks stale. The in app Help & How To page is older than the app itself and describes some screens that have changed, including a Snack meal type that does not exist. Refreshing will not fix that — the page itself is out of date. Prep sheets are not saved. A refresh clears a built prep sheet, so use Download first if you want to keep one. See Meal prep cook sheets prep sheets . The shopping calculator's Budget also resets to 100 on reload. Related Troubleshooting common problems troubleshooting Limits and known issues limits and known issues Installing Pantry Tab on your phone install on your phone Households: sharing your kitchen households and sharing "}, {"id": "limits-and-known-issues", "title": "Limits and known issues", "category": "Troubleshooting", "summary": "Every limit and rough edge in Pantry Tab in one place, grouped by area, with what each one means for you day to day.", "keywords": ["limits", "known issues", "restrictions", "maximum", "not supported", "quirks", "gotchas", "missing features", "bugs"], "html": "<p>This is the honest list. Everything here is how the app works today, so you can plan around it instead of discovering it mid-week.<\/p>\n<h2 id=\"household-people-and-locations\">Household, people and locations<\/h2>\n<ul>\n<li><strong>Maximum of 2 locations per household<\/strong> — your primary location plus one more. The error is <strong>\"Maximum of 2 locations allowed\"<\/strong>. A third address means a second household and a second account view.<\/li>\n<li><strong>Only the Owner manages locations and members.<\/strong> Members cannot add, rename or delete a location, invite people, or rename the household.<\/li>\n<li><strong>One household per person at a time.<\/strong> Accepting an invitation moves you out of your current household and away from its inventory, recipes and plan. You cannot accept at all while you are the only Owner of your current household.<\/li>\n<li><strong>Deleting a location deletes that location's inventory.<\/strong> Grocery items survive but lose their location tag.<\/li>\n<li><strong>Nothing is private inside a household.<\/strong> Every member sees and can edit inventory, grocery list, recipes, the meal plan, people profiles and allergies.<\/li>\n<\/ul>\n<h2 id=\"meal-planning\">Meal planning<\/h2>\n<ul>\n<li><strong>One meal per meal type per day, per household.<\/strong> Adding a second dinner to a day replaces the first, with no warning and no undo prompt.<\/li>\n<li><strong>There is no Snack meal type.<\/strong> The choices are <strong>Breakfast<\/strong>, <strong>Lunch<\/strong> and <strong>Dinner<\/strong>. The app's own help page still mentions Snack; it is wrong.<\/li>\n<li><strong>The AI week planner does dinners only<\/strong>, for the seven days starting tomorrow. Breakfasts and lunches you add by hand.<\/li>\n<li><strong>It does not remember what you ate recently<\/strong>, so the same dish can come round again. Uncheck repeats on the review step.<\/li>\n<li><strong>Your recipe library grows every time you use it.<\/strong> Each accepted suggestion is saved as a new recipe, so the library fills up faster than you might expect. Tidy it now and then.<\/li>\n<li><strong>The page reloads after you save a plan.<\/strong> That is intentional, not a crash.<\/li>\n<li><strong>Month view shows up to 2 meal pills per date cell<\/strong>, then <strong>+N more<\/strong>. Open the day to see the rest.<\/li>\n<li><strong>Move to: only offers days in the week you are looking at.<\/strong> To move a meal into another week, delete it and add it there.<\/li>\n<\/ul>\n<h2 id=\"recipes\">Recipes<\/h2>\n<ul>\n<li><strong>Deleting a recipe deletes every meal-plan entry that used it.<\/strong> Check your plan before clearing out the library.<\/li>\n<li><strong>Anyone in your household can edit or delete any recipe<\/strong>, including ones you added.<\/li>\n<li><strong>Duplicate recipe names are allowed<\/strong>, so the same dish can appear twice with no warning.<\/li>\n<li><strong>Recipes discovered under Discover something new import with a prep time of 0<\/strong>, because that source only reports a total time. Edit the recipe if the split matters to you.<\/li>\n<li><strong>The discovery half of What Can I Make? has a daily quota<\/strong>: <strong>\"Recipe service daily quota exceeded. Try again tomorrow.\"<\/strong> Your own library results are unaffected.<\/li>\n<li><strong>Imports estimate what is not printed.<\/strong> If servings or times are missing from the photo or document, the AI fills in a figure. Check before saving.<\/li>\n<li><strong>Bot-blocked sites cannot be imported by link.<\/strong> Screenshot the page or print it to PDF and use the Photo or Document import instead.<\/li>\n<\/ul>\n<h2 id=\"prep-sheets\">Prep sheets<\/h2>\n<ul>\n<li><strong>Prep sheets are not saved.<\/strong> The sheet survives closing the dialog but is lost on refresh, and it does not sync to your other devices. Use <strong>Download<\/strong> to keep one.<\/li>\n<li><strong>Recipes with no ingredients or no instructions are skipped<\/strong> and listed under <strong>Skipped<\/strong>. Fill those recipes in and use <strong>Rebuild<\/strong>.<\/li>\n<li><strong>Download gives an .html file.<\/strong> Save it as a PDF from your browser if you need a PDF. <strong>Print<\/strong> opens a new window, so pop-up blocking stops it.<\/li>\n<\/ul>\n<h2 id=\"alerts\">Alerts<\/h2>\n<ul>\n<li><strong>Alerts are in-app only.<\/strong> There are no push notifications and no emails, for expiry, low stock, or anything else. You see them when you open the app.<\/li>\n<li><strong>Dismissed alerts can come back<\/strong> if the item is still inside the expiry window the next time the check runs.<\/li>\n<\/ul>\n<h2 id=\"kroger-coupons-and-prices\">Kroger, coupons and prices<\/h2>\n<ul>\n<li><strong>Kroger is pickup only.<\/strong> There is no delivery option, and no store other than Kroger.<\/li>\n<li><strong>Matching is imperfect.<\/strong> Sending your list takes the first Kroger search result for each item, so wrong products happen. Check the cart in the Kroger app before you order.<\/li>\n<li><strong>Pantry Tab cannot read your Kroger cart back.<\/strong> It can push items in, and that is all. Anything you change at Kroger's end is invisible here.<\/li>\n<li><strong>Long lists are matched one item at a time<\/strong>, so a big list takes a while.<\/li>\n<li><strong>Coupons are Kroger only, and Pantry Tab cannot clip them.<\/strong> You clip them in the Kroger app. Coupons can also be unavailable, in which case the list comes back empty.<\/li>\n<li><strong>AI price estimates are not real prices.<\/strong> The figures on generated grocery items are estimates in US dollars, not what your store charges.<\/li>\n<li><strong>Renaming a store does not rewrite old purchase history<\/strong>, because history records the store name as text.<\/li>\n<\/ul>\n<h2 id=\"grocery-list-and-the-calculator\">Grocery list and the calculator<\/h2>\n<ul>\n<li><strong>The list sorts by location name only.<\/strong> Items with no location sort last. There is no category or price sort, and no aisle order.<\/li>\n<li><strong>The budget resets to 100 on reload.<\/strong> The shopping calculator does not remember what you set.<\/li>\n<\/ul>\n<h2 id=\"allergies\">Allergies<\/h2>\n<ul>\n<li><strong>Matching is keyword-based.<\/strong> It compares ingredient text against the allergen name and any keywords you add. It can miss an allergen that is named differently, hidden in a brand name, written in another language, or not listed at all. Always read the actual product label. Pantry Tab is not a substitute for medical advice.<\/li>\n<li><strong>One entry per allergen per person.<\/strong> \"Peanut\" and \"Peanuts\" count as two separate entries, so near-duplicates are possible.<\/li>\n<li><strong>You cannot delete the person who is currently active.<\/strong> Switch the header <strong>Active Person<\/strong> first.<\/li>\n<\/ul>\n<h2 id=\"the-app-itself\">The app itself<\/h2>\n<ul>\n<li><strong>There is no live sync between devices.<\/strong> A change made by another household member appears after you refresh.<\/li>\n<li><strong>The Help &amp; How To page inside the app is older than the app.<\/strong> It describes a Snack meal type that does not exist and dashboard tiles that have since changed. Use this help center instead.<\/li>\n<li><strong>The legal pages are currently placeholders<\/strong>, and some consent links on the sign-up and subscribe pages may not resolve.<\/li>\n<li><strong>Your subscription is matched by email address.<\/strong> Pay with a different email than you sign in with and the app still shows you as Free.<\/li>\n<\/ul>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li>A feature described here as missing is missing, not broken. Nothing you do on your device will bring it back.<\/li>\n<li>If a feature you expected is absent but other people have it, that is a different problem — see <a href=\"#app-not-updating\">The app looks out of date<\/a>.<\/li>\n<li>For an exact error message you are seeing, see <a href=\"#troubleshooting\">Troubleshooting common problems<\/a>.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Deleting cascades in four places: a household takes everything with it, a location takes its inventory, a recipe takes its meal-plan entries, and a person takes their allergies.<\/li>\n<li>Inventory items and household members are unlimited. The limits above are on locations, meal slots and prep sheets, not on how much you can store.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#troubleshooting\">Troubleshooting common problems<\/a><\/li>\n<li><a href=\"#app-not-updating\">The app looks out of date<\/a><\/li>\n<li><a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a><\/li>\n<li><a href=\"#privacy-and-your-data\">Your data and privacy<\/a><\/li>\n<\/ul>", "text": "This is the honest list. Everything here is how the app works today, so you can plan around it instead of discovering it mid week. Household, people and locations Maximum of 2 locations per household — your primary location plus one more. The error is \"Maximum of 2 locations allowed\" . A third address means a second household and a second account view. Only the Owner manages locations and members. Members cannot add, rename or delete a location, invite people, or rename the household. One household per person at a time. Accepting an invitation moves you out of your current household and away from its inventory, recipes and plan. You cannot accept at all while you are the only Owner of your current household. Deleting a location deletes that location's inventory. Grocery items survive but lose their location tag. Nothing is private inside a household. Every member sees and can edit inventory, grocery list, recipes, the meal plan, people profiles and allergies. Meal planning One meal per meal type per day, per household. Adding a second dinner to a day replaces the first, with no warning and no undo prompt. There is no Snack meal type. The choices are Breakfast , Lunch and Dinner . The app's own help page still mentions Snack; it is wrong. The AI week planner does dinners only , for the seven days starting tomorrow. Breakfasts and lunches you add by hand. It does not remember what you ate recently , so the same dish can come round again. Uncheck repeats on the review step. Your recipe library grows every time you use it. Each accepted suggestion is saved as a new recipe, so the library fills up faster than you might expect. Tidy it now and then. The page reloads after you save a plan. That is intentional, not a crash. Month view shows up to 2 meal pills per date cell , then +N more . Open the day to see the rest. Move to: only offers days in the week you are looking at. To move a meal into another week, delete it and add it there. Recipes Deleting a recipe deletes every meal plan entry that used it. Check your plan before clearing out the library. Anyone in your household can edit or delete any recipe , including ones you added. Duplicate recipe names are allowed , so the same dish can appear twice with no warning. Recipes discovered under Discover something new import with a prep time of 0 , because that source only reports a total time. Edit the recipe if the split matters to you. The discovery half of What Can I Make? has a daily quota : \"Recipe service daily quota exceeded. Try again tomorrow.\" Your own library results are unaffected. Imports estimate what is not printed. If servings or times are missing from the photo or document, the AI fills in a figure. Check before saving. Bot blocked sites cannot be imported by link. Screenshot the page or print it to PDF and use the Photo or Document import instead. Prep sheets Prep sheets are not saved. The sheet survives closing the dialog but is lost on refresh, and it does not sync to your other devices. Use Download to keep one. Recipes with no ingredients or no instructions are skipped and listed under Skipped . Fill those recipes in and use Rebuild . Download gives an .html file. Save it as a PDF from your browser if you need a PDF. Print opens a new window, so pop up blocking stops it. Alerts Alerts are in app only. There are no push notifications and no emails, for expiry, low stock, or anything else. You see them when you open the app. Dismissed alerts can come back if the item is still inside the expiry window the next time the check runs. Kroger, coupons and prices Kroger is pickup only. There is no delivery option, and no store other than Kroger. Matching is imperfect. Sending your list takes the first Kroger search result for each item, so wrong products happen. Check the cart in the Kroger app before you order. Pantry Tab cannot read your Kroger cart back. It can push items in, and that is all. Anything you change at Kroger's end is invisible here. Long lists are matched one item at a time , so a big list takes a while. Coupons are Kroger only, and Pantry Tab cannot clip them. You clip them in the Kroger app. Coupons can also be unavailable, in which case the list comes back empty. AI price estimates are not real prices. The figures on generated grocery items are estimates in US dollars, not what your store charges. Renaming a store does not rewrite old purchase history , because history records the store name as text. Grocery list and the calculator The list sorts by location name only. Items with no location sort last. There is no category or price sort, and no aisle order. The budget resets to 100 on reload. The shopping calculator does not remember what you set. Allergies Matching is keyword based. It compares ingredient text against the allergen name and any keywords you add. It can miss an allergen that is named differently, hidden in a brand name, written in another language, or not listed at all. Always read the actual product label. Pantry Tab is not a substitute for medical advice. One entry per allergen per person. \"Peanut\" and \"Peanuts\" count as two separate entries, so near duplicates are possible. You cannot delete the person who is currently active. Switch the header Active Person first. The app itself There is no live sync between devices. A change made by another household member appears after you refresh. The Help & How To page inside the app is older than the app. It describes a Snack meal type that does not exist and dashboard tiles that have since changed. Use this help center instead. The legal pages are currently placeholders , and some consent links on the sign up and subscribe pages may not resolve. Your subscription is matched by email address. Pay with a different email than you sign in with and the app still shows you as Free. If something goes wrong A feature described here as missing is missing, not broken. Nothing you do on
