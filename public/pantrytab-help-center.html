d, comes from what you enter here.<\/p>\n<p>Set this up <strong>before<\/strong> you use any AI feature. The week planner, the grocery list generator and recipe suggestions are all told to avoid your household's allergens, so an allergy recorded up front keeps allergens out of your plans and lists from the start rather than after the fact.<\/p>\n<p>Allergy matching is keyword-based and can miss allergens. Always read the actual product label. Pantry Tab is not a substitute for medical advice.<\/p>\n<h2 id=\"the-two-sub-tabs\">The two sub-tabs<\/h2>\n<p>The <strong>Allergies<\/strong> tab has two views of the same information:<\/p>\n<ul>\n<li><strong>By Allergen<\/strong> — grouped by the allergen, so you can see everyone affected by dairy at once.<\/li>\n<li><strong>By Person<\/strong> — grouped by the eater, so you can see everything one person reacts to.<\/li>\n<\/ul>\n<p>Use whichever matches the question you are asking.<\/p>\n<p>If you have not recorded anything yet you will see <strong>No allergies tracked yet<\/strong> with \"Add allergies to get warnings when recipes contain allergens\" and an <strong>Add your first allergy<\/strong> button.<\/p>\n<h2 id=\"adding-an-allergy\">Adding an allergy<\/h2>\n<ol>\n<li>Tap <strong>Add Allergy<\/strong>. The dialog is headed \"Add an allergy for a household member\".<\/li>\n<li>Choose the <strong>Person<\/strong>. Allergies belong to a specific eater, not to the household as a whole. If the person is not in the list, add them first at <strong>Household Members<\/strong> — see <a href=\"#people-profiles\">People profiles and the active person<\/a>.<\/li>\n<li>Choose the <strong>Allergen<\/strong>. The preset list is Dairy, Eggs, Peanuts, Tree Nuts, Wheat/Gluten, Soy, Fish, Shellfish and Sesame. For anything else, choose <strong>+ Custom allergen...<\/strong> and type your own — mustard, celery, kiwi, a particular additive, whatever you need.<\/li>\n<li>Fill in the keywords field. The hint reads \"Keywords help detect this allergen in ingredients\". Read the next section before you skip this.<\/li>\n<li>Set the <strong>Severity<\/strong>: <strong>Mild<\/strong>, <strong>Medium<\/strong> or <strong>Severe<\/strong>.<\/li>\n<li>Save. You will see the toast <strong>Allergy added<\/strong>.<\/li>\n<\/ol>\n<h2 id=\"keywords-are-the-part-that-matters\">Keywords are the part that matters<\/h2>\n<p>Pantry Tab finds allergens by matching text. It compares the ingredient text on your items and recipes against the allergen name and against every keyword you add. An allergen that is written in a way you did not list is an allergen Pantry Tab will not flag.<\/p>\n<p>So the keywords field is not optional detail. <strong>Adding keywords meaningfully improves matching.<\/strong><\/p>\n<p>For a peanut allergy, good keywords look like this:<\/p>\n<ul>\n<li>peanut<\/li>\n<li>peanuts<\/li>\n<li>groundnut<\/li>\n<li>arachis<\/li>\n<li>peanut oil<\/li>\n<li>peanut butter<\/li>\n<\/ul>\n<p>That covers the singular and the plural, the older names, the botanical name that turns up in oils, and the two forms peanuts most often appear as in an ingredient list.<\/p>\n<p>Build your lists the same way for every allergy:<\/p>\n<ul>\n<li>Singular and plural — \"egg\" and \"eggs\".<\/li>\n<li>Alternative and older names — \"groundnut\" for peanut, \"gluten\" alongside \"wheat\".<\/li>\n<li>Ingredient-list names — \"casein\", \"whey\" and \"lactose\" for dairy; \"albumin\" for egg.<\/li>\n<li>Derived forms you actually buy — \"peanut oil\", \"soy sauce\", \"sesame oil\".<\/li>\n<li>Any spellings you see on the products in your own cupboard.<\/li>\n<\/ul>\n<p>Adding more keywords costs nothing. A short list is the main reason a warning fails to appear.<\/p>\n<h2 id=\"managing-an-allergy-you-have-already-added\">Managing an allergy you have already added<\/h2>\n<p>Each allergy entry carries its own controls:<\/p>\n<ul>\n<li><strong>Active<\/strong> / <strong>Alerts Off<\/strong> — turns warnings for that one entry on or off. <strong>Alerts Off<\/strong> keeps the entry on record but stops it producing badges and warnings. Use it for an allergy someone has grown out of, or one you are re-testing, rather than deleting the entry.<\/li>\n<li><strong>Edit Severity<\/strong> — changes <strong>Mild<\/strong>, <strong>Medium<\/strong> or <strong>Severe<\/strong> without re-adding the allergy. Toast: <strong>Severity updated<\/strong>.<\/li>\n<li>Removing an allergy deletes it and its warnings for good. Toast: <strong>Allergy removed<\/strong>.<\/li>\n<\/ul>\n<p>There is also a per-person switch. On a person's profile at <strong>Household Members<\/strong> there is an <strong>Allergy Alerts<\/strong> toggle, \"Show warnings for this person's allergies\". Turning it off silences every warning for that person at once, whatever their individual entries say.<\/p>\n<h2 id=\"one-entry-per-allergen-per-person\">One entry per allergen per person<\/h2>\n<p>A person can have each allergen recorded once. Try to add the same one twice and you get:<\/p>\n<p><strong>\"This allergy already exists for this person\"<\/strong><\/p>\n<p>The check is on the exact allergen text, so <strong>\"Peanut\" and \"Peanuts\" count as two different entries.<\/strong> Two people can each have a peanut allergy — the rule is per person, not per household.<\/p>\n<p>Because near-duplicates are allowed, keep one entry per allergen per person and put the variations in the keywords field, rather than creating \"Peanut\", \"Peanuts\" and \"Peanut oil\" as three entries.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"This allergy already exists for this person\"<\/strong> — that person already has an entry for that allergen. Edit the existing one, or check whether you have typed a variant such as \"Peanut\" against an existing \"Peanuts\".<\/li>\n<li><strong>The person you want is not in the Person list.<\/strong> People are added at <strong>Household Members<\/strong>, and adding a person there does not give them a login. Add the person, then come back.<\/li>\n<li><strong>You added an allergy but see no warnings anywhere.<\/strong> Check three things: the entry is <strong>Active<\/strong> and not <strong>Alerts Off<\/strong>; the person's <strong>Allergy Alerts<\/strong> toggle is on; and the header <strong>Active Person<\/strong> selector is set so that person's warnings are in view.<\/li>\n<li><strong>A household member's new allergy is not showing for you.<\/strong> There is no live sync between devices. Refresh the page.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Allergies are shared with everyone in your household and anyone in the household can edit them. They are also shared across both of your locations.<\/li>\n<li>Deleting a person deletes their allergies with them.<\/li>\n<li>Severity does not change whether something is flagged, only what the warning says. A <strong>Mild<\/strong> entry is matched exactly as hard as a <strong>Severe<\/strong> one.<\/li>\n<li>Warnings are keyword matching against ingredient text, not label analysis. Read <a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a> before you rely on them — this is important.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a><\/li>\n<li><a href=\"#people-profiles\">People profiles and the active person<\/a><\/li>\n<li><a href=\"#ai-week-planner\">Planning a week of dinners with AI<\/a><\/li>\n<li><a href=\"#ai-grocery-list\">Building your grocery list with AI<\/a><\/li>\n<\/ul>", "text": "The Allergies tab is where you tell Pantry Tab who in your household reacts to what. Every allergy badge and warning in the app, and every ingredient the AI steers around, comes from what you enter here. Set this up before you use any AI feature. The week planner, the grocery list generator and recipe suggestions are all told to avoid your household's allergens, so an allergy recorded up front keeps allergens out of your plans and lists from the start rather than after the fact. Allergy matching is keyword based and can miss allergens. Always read the actual product label. Pantry Tab is not a substitute for medical advice. The two sub tabs The Allergies tab has two views of the same information: By Allergen — grouped by the allergen, so you can see everyone affected by dairy at once. By Person — grouped by the eater, so you can see everything one person reacts to. Use whichever matches the question you are asking. If you have not recorded anything yet you will see No allergies tracked yet with \"Add allergies to get warnings when recipes contain allergens\" and an Add your first allergy button. Adding an allergy 1. Tap Add Allergy . The dialog is headed \"Add an allergy for a household member\". 2. Choose the Person . Allergies belong to a specific eater, not to the household as a whole. If the person is not in the list, add them first at Household Members — see People profiles and the active person people profiles . 3. Choose the Allergen . The preset list is Dairy, Eggs, Peanuts, Tree Nuts, Wheat/Gluten, Soy, Fish, Shellfish and Sesame. For anything else, choose + Custom allergen... and type your own — mustard, celery, kiwi, a particular additive, whatever you need. 4. Fill in the keywords field. The hint reads \"Keywords help detect this allergen in ingredients\". Read the next section before you skip this. 5. Set the Severity : Mild , Medium or Severe . 6. Save. You will see the toast Allergy added . Keywords are the part that matters Pantry Tab finds allergens by matching text. It compares the ingredient text on your items and recipes against the allergen name and against every keyword you add. An allergen that is written in a way you did not list is an allergen Pantry Tab will not flag. So the keywords field is not optional detail. Adding keywords meaningfully improves matching. For a peanut allergy, good keywords look like this: peanut peanuts groundnut arachis peanut oil peanut butter That covers the singular and the plural, the older names, the botanical name that turns up in oils, and the two forms peanuts most often appear as in an ingredient list. Build your lists the same way for every allergy: Singular and plural — \"egg\" and \"eggs\". Alternative and older names — \"groundnut\" for peanut, \"gluten\" alongside \"wheat\". Ingredient list names — \"casein\", \"whey\" and \"lactose\" for dairy; \"albumin\" for egg. Derived forms you actually buy — \"peanut oil\", \"soy sauce\", \"sesame oil\". Any spellings you see on the products in your own cupboard. Adding more keywords costs nothing. A short list is the main reason a warning fails to appear. Managing an allergy you have already added Each allergy entry carries its own controls: Active / Alerts Off — turns warnings for that one entry on or off. Alerts Off keeps the entry on record but stops it producing badges and warnings. Use it for an allergy someone has grown out of, or one you are re testing, rather than deleting the entry. Edit Severity — changes Mild , Medium or Severe without re adding the allergy. Toast: Severity updated . Removing an allergy deletes it and its warnings for good. Toast: Allergy removed . There is also a per person switch. On a person's profile at Household Members there is an Allergy Alerts toggle, \"Show warnings for this person's allergies\". Turning it off silences every warning for that person at once, whatever their individual entries say. One entry per allergen per person A person can have each allergen recorded once. Try to add the same one twice and you get: \"This allergy already exists for this person\" The check is on the exact allergen text, so \"Peanut\" and \"Peanuts\" count as two different entries. Two people can each have a peanut allergy — the rule is per person, not per household. Because near duplicates are allowed, keep one entry per allergen per person and put the variations in the keywords field, rather than creating \"Peanut\", \"Peanuts\" and \"Peanut oil\" as three entries. If something goes wrong \"This allergy already exists for this person\" — that person already has an entry for that allergen. Edit the existing one, or check whether you have typed a variant such as \"Peanut\" against an existing \"Peanuts\". The person you want is not in the Person list. People are added at Household Members , and adding a person there does not give them a login. Add the person, then come back. You added an allergy but see no warnings anywhere. Check three things: the entry is Active and not Alerts Off ; the person's Allergy Alerts toggle is on; and the header Active Person selector is set so that person's warnings are in view. A household member's new allergy is not showing for you. There is no live sync between devices. Refresh the page. Good to know Allergies are shared with everyone in your household and anyone in the household can edit them. They are also shared across both of your locations. Deleting a person deletes their allergies with them. Severity does not change whether something is flagged, only what the warning says. A Mild entry is matched exactly as hard as a Severe one. Warnings are keyword matching against ingredient text, not label analysis. Read How allergy warnings work, and their limits how allergy warnings work before you rely on them — this is important. Related How allergy warnings work, and their limits how allergy warnings work People profiles and the active person people profiles Planning a week of dinners with AI ai week planner Building your grocery list with AI ai grocery list "}, {"id": "how-allergy-warnings-work", "title": "How allergy warnings work, and their limits", "category": "Allergies & Safety", "summary": "Where allergy warnings appear in Pantry Tab, how keyword matching works, and the things it cannot catch. Always read the product label.", "keywords": ["allergy warning", "allergy alert", "allergen detection", "keyword matching", "severity", "active person", "cross contamination", "may contain", "product label", "safety", "limits"], "html": "<p>Pantry Tab flags food that matches an allergy you have recorded. This article explains where those flags appear and, as importantly, what they cannot catch.<\/p>\n<h2 id=\"read-this-first\">Read this first<\/h2>\n<p><strong>Pantry Tab's allergy warnings are a convenience aid, not a safety system. They are keyword matching against ingredient text, and they will miss things. Always read the actual product label before eating or serving anything. Pantry Tab is not a medical device and is not a substitute for medical advice.<\/strong><\/p>\n<p>Nothing below changes that. Use the warnings as a prompt to check, never as confirmation that something is safe.<\/p>\n<h2 id=\"where-warnings-appear\">Where warnings appear<\/h2>\n<p>Once an allergy is recorded, Pantry Tab surfaces matches in five places:<\/p>\n<ul>\n<li><strong>Inventory item cards<\/strong> — an <strong>Allergy Warning<\/strong> badge on any item whose text matches a household allergen.<\/li>\n<li><strong>Grocery list rows<\/strong> — an allergy badge on the row, with a detail block you can dismiss.<\/li>\n<li><strong>Meal planner meal cards<\/strong> — an allergy badge or triangle on meals in week view.<\/li>\n<li><strong>The Add a Meal recipe picker<\/strong> — so you see the problem while choosing, not after planning.<\/li>\n<li><strong>Recipe detail<\/strong> — the full treatment. A red <strong>Allergy Alert<\/strong> card names the person, the allergen and the severity, and the recipe has its own <strong>Allergy Check<\/strong> section.<\/li>\n<\/ul>\n<p>Dismissing the detail block on a grocery row hides that block. It does not resolve the allergy or mark the item safe.<\/p>\n<h2 id=\"the-three-severity-levels\">The three severity levels<\/h2>\n<p>Each allergy you record is <strong>Mild<\/strong>, <strong>Medium<\/strong> or <strong>Severe<\/strong>, and the recipe detail <strong>Allergy Alert<\/strong> card tells you which one applies, along with the person's name and the allergen.<\/p>\n<p>Severity is a label for you, not a filter. <strong>A Mild allergy is detected exactly the same way as a Severe one.<\/strong> It changes what the warning says, not how hard Pantry Tab looks.<\/p>\n<h2 id=\"what-the-active-person-selector-changes\">What the Active Person selector changes<\/h2>\n<p>The <strong>Active Person<\/strong> selector in the header controls whose allergy warnings you see. Switch the active person to someone with no allergies and you will see no warnings — even for food that would be dangerous for someone else in the household.<\/p>\n<p>So before you cook for the whole household, check the recipe with each affected person active. And remember that a person's <strong>Allergy Alerts<\/strong> toggle silences all of their warnings while it is off. A quiet screen is not the same as a clear one.<\/p>\n<h2 id=\"the-limits-plainly\">The limits, plainly<\/h2>\n<p>Matching compares the ingredient text Pantry Tab has against the allergen name and the keywords you entered. That is the whole mechanism. It follows that Pantry Tab can miss an allergen when the allergen is:<\/p>\n<ul>\n<li><strong>Named differently<\/strong> from anything you listed — \"groundnut\" when you only entered \"peanut\", \"casein\" when you only entered \"dairy\".<\/li>\n<li><strong>Hidden inside a brand name<\/strong> or a product name that does not spell out what is in it.<\/li>\n<li><strong>Inside a compound ingredient<\/strong> — an allergen within a sauce, a stock, a spice blend or a pre-made component listed as a single word.<\/li>\n<li><strong>Written in another language<\/strong> on an imported product.<\/li>\n<li><strong>Not listed at all<\/strong> in the ingredient text Pantry Tab holds.<\/li>\n<\/ul>\n<p>Beyond that:<\/p>\n<ul>\n<li><strong>It cannot detect cross-contamination<\/strong>, and it cannot see \"may contain\" or \"made in a facility that also processes\" warnings. That information is on the packaging and nowhere else.<\/li>\n<li><strong>Imported and AI-generated recipes may have incomplete ingredient lists.<\/strong> A recipe brought in from a photo, a document or a link, or generated by an AI feature, is only as complete as its source. An ingredient that was never captured cannot be matched.<\/li>\n<li>Ingredient and nutrition data from a barcode lookup comes from outside sources and may be wrong for the exact product on your shelf.<\/li>\n<\/ul>\n<p><strong>No warning does not mean no allergen. Read the label.<\/strong><\/p>\n<h2 id=\"ai-features-and-allergies\">AI features and allergies<\/h2>\n<p>The AI features — weekly meal planning, grocery list building and recipe suggestions — are instructed to avoid your household's allergens, and the grocery list flow shows <strong>Household allergies<\/strong> as something it \"will be avoided\". The AI week planner shows this generically rather than naming individual allergies, for privacy.<\/p>\n<p><strong>The same caution applies.<\/strong> These are instructions to an AI, not an enforced filter, and the suggestions the AI produces still carry incomplete ingredient lists. Check every AI suggestion against the label of what you actually buy.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>An item you know contains an allergen shows no warning.<\/strong> The ingredient wording does not match your keywords. Add the missing wording to that allergy's keywords, and check the label yourself in the meantime.<\/li>\n<li><strong>You see no warnings at all.<\/strong> Check the <strong>Active Person<\/strong> selector, that person's <strong>Allergy Alerts<\/strong> toggle, and whether the allergy entry is <strong>Active<\/strong> rather than <strong>Alerts Off<\/strong>.<\/li>\n<li><strong>A warning appears for something harmless<\/strong> — a keyword matched a word inside another ingredient. Leave it, or narrow that keyword. Do not delete the allergy to silence one false match.<\/li>\n<li><strong>A warning names the wrong person.<\/strong> Allergies are recorded per person. Open the <strong>By Person<\/strong> view on the <strong>Allergies<\/strong> tab and check where the entry sits.<\/li>\n<li><strong>A household member added an allergy and you cannot see it.<\/strong> There is no live sync between devices. Refresh the page.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Warnings depend entirely on the allergies you have recorded. Nothing is flagged for an allergy that is not in the app. See <a href=\"#allergies-setup\">Setting up allergies for your household<\/a>.<\/li>\n<li>Allergies are shared with your whole household and across both of your locations, but what you <em>see<\/em> is filtered by the <strong>Active Person<\/strong> selector.<\/li>\n<li>Deleting a person deletes their allergies, and their warnings with them.<\/li>\n<li>Dismissing the detail block on a grocery row is a display choice. It changes nothing about the item.<\/li>\n<li>The AI week planner shows household allergies generically, as \"will be avoided\", rather than naming them. That is deliberate, for privacy.<\/li>\n<\/ul>\n<h2 id=\"making-warnings-more-reliable\">Making warnings more reliable<\/h2>\n<p>Practical steps, in order of how much they help:<\/p>\n<ol>\n<li><strong>Fill in the keywords field on every allergy<\/strong> with alternative names, plurals, ingredient-list names and derived forms. This is the single biggest improvement you can make.<\/li>\n<li>Add the wording from products in your own cupboard whenever you spot a name Pantry Tab did not flag.<\/li>\n<li>Record allergies before you use any AI feature, so plans and lists are built around them from the start.<\/li>\n<li>Keep entries <strong>Active<\/strong> rather than deleting them, and leave each person's <strong>Allergy Alerts<\/strong> toggle on.<\/li>\n<li>Check recipes with each affected person set as the <strong>Active Person<\/strong>.<\/li>\n<li>Complete the ingredient list on imported recipes by hand before cooking from them.<\/li>\n<li><strong>Read the product label. Every time.<\/strong><\/li>\n<\/ol>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#allergies-setup\">Setting up allergies for your household<\/a><\/li>\n<li><a href=\"#people-profiles\">People profiles and the active person<\/a><\/li>\n<li><a href=\"#importing-recipes\">Importing recipes from a photo, file, or link<\/a><\/li>\n<li><a href=\"#limits-and-known-issues\">Limits and known issues<\/a><\/li>\n<\/ul>", "text": "Pantry Tab flags food that matches an allergy you have recorded. This article explains where those flags appear and, as importantly, what they cannot catch. Read this first Pantry Tab's allergy warnings are a convenience aid, not a safety system. They are keyword matching against ingredient text, and they will miss things. Always read the actual product label before eating or serving anything. Pantry Tab is not a medical device and is not a substitute for medical advice. Nothing below changes that. Use the warnings as a prompt to check, never as confirmation that something is safe. Where warnings appear Once an allergy is recorded, Pantry Tab surfaces matches in five places: Inventory item cards — an Allergy Warning badge on any item whose text matches a household allergen. Grocery list rows — an allergy badge on the row, with a detail block you can dismiss. Meal planner meal cards — an allergy badge or triangle on meals in week view. The Add a Meal recipe picker — so you see the problem while choosing, not after planning. Recipe detail — the full treatment. A red Allergy Alert card names the person, the allergen and the severity, and the recipe has its own Allergy Check section. Dismissing the detail block on a grocery row hides that block. It does not resolve the allergy or mark the item safe. The three severity levels Each allergy you record is Mild , Medium or Severe , and the recipe detail Allergy Alert card tells you which one applies, along with the person's name and the allergen. Severity is a label for you, not a filter. A Mild allergy is detected exactly the same way as a Severe one. It changes what the warning says, not how hard Pantry Tab looks. What the Active Person selector changes The Active Person selector in the header controls whose allergy warnings you see. Switch the active person to someone with no allergies and you will see no warnings — even for food that would be dangerous for someone else in the household. So before you cook for the whole household, check the recipe with each affected person active. And remember that a person's Allergy Alerts toggle silences all of their warnings while it is off. A quiet screen is not the same as a clear one. The limits, plainly Matching compares the ingredient text Pantry Tab has against the allergen name and the keywords you entered. That is the whole mechanism. It follows that Pantry Tab can miss an allergen when the allergen is: Named differently from anything you listed — \"groundnut\" when you only entered \"peanut\", \"casein\" when you only entered \"dairy\". Hidden inside a brand name or a product name that does not spell out what is in it. Inside a compound ingredient — an allergen within a sauce, a stock, a spice blend or a pre made component listed as a single word. Written in another language on an imported product. Not listed at all in the ingredient text Pantry Tab holds. Beyond that: It cannot detect cross contamination , and it cannot see \"may contain\" or \"made in a facility that also processes\" warnings. That information is on the packaging and nowhere else. Imported and AI generated recipes may have incomplete ingredient lists. A recipe brought in from a photo, a document or a link, or generated by an AI feature, is only as complete as its source. An ingredient that was never captured cannot be matched. Ingredient and nutrition data from a barcode lookup comes from outside sources and may be wrong for the exact product on your shelf. No warning does not mean no allergen. Read the label. AI features and allergies The AI features — weekly meal planning, grocery list building and recipe suggestions — are instructed to avoid your household's allergens, and the grocery list flow shows Household allergies as something it \"will be avoided\". The AI week planner shows this generically rather than naming individual allergies, for privacy. The same caution applies. These are instructions to an AI, not an enforced filter, and the suggestions the AI produces still carry incomplete ingredient lists. Check every AI suggestion against the label of what you actually buy. If something goes wrong An item you know contains an allergen shows no warning. The ingredient wording does not match your keywords. Add the missing wording to that allergy's keywords, and check the label yourself in the meantime. You see no warnings at all. Check the Active Person selector, that person's Allergy Alerts toggle, and whether the allergy entry is Active rather than Alerts Off . A warning appears for something harmless — a keyword matched a word inside another ingredient. Leave it, or narrow that keyword. Do not delete the allergy to silence one false match. A warning names the wrong person. Allergies are recorded per person. Open the By Person view on the Allergies tab and check where the entry sits. A household member added an allergy and you cannot see it. There is no live sync between devices. Refresh the page. Good to know Warnings depend entirely on the allergies you have recorded. Nothing is flagged for an allergy that is not in the app. See Setting up allergies for your household allergies setup . Allergies are shared with your whole household and across both of your locations, but what you see is filtered by the Active Person selector. Deleting a person deletes their allergies, and their warnings with them. Dismissing the detail block on a grocery row is a display choice. It changes nothing about the item. The AI week planner shows household allergies generically, as \"will be avoided\", rather than naming them. That is deliberate, for privacy. Making warnings more reliable Practical steps, in order of how much they help: 1. Fill in the keywords field on every allergy with alternative names, plurals, ingredient list names and derived forms. This is the single biggest improvement you can make. 2. Add the wording from products in your own cupboard whenever you spot a name Pantry Tab did not flag. 3. Record allergies before you use any AI feature, so "}, {"id": "price-tracking", "title": "Tracking and comparing prices", "category": "Prices & Savings", "summary": "How prices get into Pantry Tab, what each card on the Your Prices page tells you, and how stores are handled.", "keywords": ["prices", "price comparison", "log new price", "best value store", "stores tracked", "potential savings", "spending by store", "price history", "best price", "stores"], "html": "<p>The <strong>Prices<\/strong> tab records what you paid for things, where, and when — so you can see which store is actually cheaper for the food you buy rather than the food in the advert. It has two sub-tabs, <strong>Your Prices<\/strong> and <strong>Crowdsourced<\/strong>. This article covers <strong>Your Prices<\/strong>, which opens by default.<\/p>\n<p>The page is headed <strong>Price Comparison<\/strong> — \"Compare prices across stores\".<\/p>\n<h2 id=\"getting-prices-in\">Getting prices in<\/h2>\n<p>Pantry Tab has nothing to compare until you give it prices. Three things feed the record:<\/p>\n<ul>\n<li><strong>The Price (optional) and Store (optional) fields when you add an inventory item.<\/strong> Filling these in as you unpack the shopping is the least effort for the most data — you are already in the dialog.<\/li>\n<li><strong>Receipt scanning.<\/strong> A scanned receipt reads the store name, the date and the price of each line item, so one photo can log a whole shop. See <a href=\"#scanning-a-receipt\">Scanning a grocery receipt<\/a>.<\/li>\n<li><strong>Log New Price<\/strong>, for recording a price without adding the item to your pantry — the one to use while you are standing in an aisle.<\/li>\n<\/ul>\n<h2 id=\"using-log-new-price\">Using Log New Price<\/h2>\n<ol>\n<li>Open the <strong>Prices<\/strong> tab and stay on <strong>Your Prices<\/strong>.<\/li>\n<li>Tap <strong>Log New Price<\/strong>.<\/li>\n<li>Enter the <strong>Item<\/strong>.<\/li>\n<li>Enter the <strong>Price ($)<\/strong>.<\/li>\n<li>Choose or enter the <strong>Store<\/strong>.<\/li>\n<li>Tap <strong>Log Price<\/strong>. You will see the toast <strong>Price logged successfully!<\/strong><\/li>\n<\/ol>\n<p>Nothing is added to your inventory or your grocery list. You are only recording what something costs. Log the same item at a second store and the comparison cards have something to work with.<\/p>\n<p>Use the same item name each time. Prices are grouped by the name you type, so \"Milk\" and \"Whole milk\" build two separate histories.<\/p>\n<h2 id=\"what-each-card-tells-you\">What each card tells you<\/h2>\n<p>Once you have prices logged, the page fills with cards. The summary cards across the top:<\/p>\n<ul>\n<li><strong>Best Value Store<\/strong> — the store that comes out cheapest across what you have tracked.<\/li>\n<li><strong>Stores Tracked<\/strong> — how many stores you have prices for. With one store there is nothing to compare, so this doubles as a check on whether your data is worth trusting yet.<\/li>\n<li><strong>Potential Savings<\/strong> — \"by shopping smart\". What the record suggests you could keep by buying each item where it is cheapest.<\/li>\n<\/ul>\n<p>Then your shopping patterns:<\/p>\n<ul>\n<li><strong>Spending by Store<\/strong> — how your spending splits across the stores you use.<\/li>\n<li><strong>Most Visited<\/strong> — the store you buy from most often, which is not always the cheapest one.<\/li>\n<li><strong>Best Value<\/strong> — the cheapest option the record has found.<\/li>\n<\/ul>\n<p>Then the per-item detail:<\/p>\n<ul>\n<li><strong>Price History<\/strong> — how the price of an item has moved over time, with <strong>Lowest<\/strong> and <strong>Highest<\/strong> marking the ends of the range you have paid. This is how you tell a genuine sale from the usual price.<\/li>\n<li><strong>Best Price by Store<\/strong> — the cheapest price recorded at each store, side by side.<\/li>\n<li><strong>Prices by Store<\/strong> — the prices you have logged, broken out by store.<\/li>\n<li><strong>Best Price<\/strong> — the lowest price on record for that item.<\/li>\n<\/ul>\n<p>Before you have logged anything you will see <strong>No price data yet<\/strong> — \"Add items with prices to see comparisons\".<\/p>\n<h2 id=\"stores\">Stores<\/h2>\n<p>Stores belong to your household, and everyone in the household sees and uses the same list. Adding one shows the toast <strong>Store added!<\/strong><\/p>\n<p><strong>Store names must be unique within a household.<\/strong> You cannot have two stores with the same name, so give branches names that tell them apart — \"Kroger Oak St\" and \"Kroger Riverside\" rather than \"Kroger\" twice.<\/p>\n<p>One quirk worth knowing before you tidy up your store list:<\/p>\n<p><strong>Purchase history records the store name as text. Renaming a store does not go back and rewrite the older history.<\/strong> Records logged under the old name keep it, so a rename can split one store into two entries in your comparisons. Settle on your naming early.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>No price data yet<\/strong> — you have not logged anything, or you have added inventory items without filling in <strong>Price (optional)<\/strong> and <strong>Store (optional)<\/strong>. Log a price or start filling in those fields.<\/li>\n<li><strong>A store appears twice in your comparisons.<\/strong> Almost always a rename, or two spellings of the same name. Older history keeps the name it was logged under.<\/li>\n<li><strong>An item's history looks thin or split.<\/strong> Check you are using the same item name each time. Different names build different histories.<\/li>\n<li><strong>Comparisons look wrong after one shop.<\/strong> Two prices at one store is not a pattern. The cards get more useful the more you log.<\/li>\n<li><strong>A household member's price is not showing.<\/strong> There is no live sync between devices. Refresh the page.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Prices are shared across your whole household — anyone can log one and everyone sees the record.<\/li>\n<li>Everything here is what <em>you<\/em> recorded. It is your household's own history, not a live feed of shelf prices, so a price is only as current as the day it was logged.<\/li>\n<li>Prices generated by the AI grocery list are estimates in US dollars, not real store prices. Do not treat them as prices you have paid.<\/li>\n<li>The <strong>Shopping Calculator<\/strong> on the <strong>Grocery<\/strong> tab is a separate tool for tracking spend against a budget while you shop. See <a href=\"#shopping-calculator\">The shopping calculator and budgets<\/a>.<\/li>\n<li>For a rough outside check on whether a price is reasonable, the <strong>Crowdsourced<\/strong> sub-tab searches prices reported by other people.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#crowdsourced-prices\">Crowdsourced prices<\/a><\/li>\n<li><a href=\"#scanning-a-receipt\">Scanning a grocery receipt<\/a><\/li>\n<li><a href=\"#shopping-calculator\">The shopping calculator and budgets<\/a><\/li>\n<li><a href=\"#adding-items-manually\">Adding items to your pantry<\/a><\/li>\n<\/ul>", "text": "The Prices tab records what you paid for things, where, and when — so you can see which store is actually cheaper for the food you buy rather than the food in the advert. It has two sub tabs, Your Prices and Crowdsourced . This article covers Your Prices , which opens by default. The page is headed Price Comparison — \"Compare prices across stores\". Getting prices in Pantry Tab has nothing to compare until you give it prices. Three things feed the record: The Price optional and Store optional fields when you add an inventory item. Filling these in as you unpack the shopping is the least effort for the most data — you are already in the dialog. Receipt scanning. A scanned receipt reads the store name, the date and the price of each line item, so one photo can log a whole shop. See Scanning a grocery receipt scanning a receipt . Log New Price , for recording a price without adding the item to your pantry — the one to use while you are standing in an aisle. Using Log New Price 1. Open the Prices tab and stay on Your Prices . 2. Tap Log New Price . 3. Enter the Item . 4. Enter the Price $ . 5. Choose or enter the Store . 6. Tap Log Price . You will see the toast Price logged successfully! Nothing is added to your inventory or your grocery list. You are only recording what something costs. Log the same item at a second store and the comparison cards have something to work with. Use the same item name each time. Prices are grouped by the name you type, so \"Milk\" and \"Whole milk\" build two separate histories. What each card tells you Once you have prices logged, the page fills with cards. The summary cards across the top: Best Value Store — the store that comes out cheapest across what you have tracked. Stores Tracked — how many stores you have prices for. With one store there is nothing to compare, so this doubles as a check on whether your data is worth trusting yet. Potential Savings — \"by shopping smart\". What the record suggests you could keep by buying each item where it is cheapest. Then your shopping patterns: Spending by Store — how your spending splits across the stores you use. Most Visited — the store you buy from most often, which is not always the cheapest one. Best Value — the cheapest option the record has found. Then the per item detail: Price History — how the price of an item has moved over time, with Lowest and Highest marking the ends of the range you have paid. This is how you tell a genuine sale from the usual price. Best Price by Store — the cheapest price recorded at each store, side by side. Prices by Store — the prices you have logged, broken out by store. Best Price — the lowest price on record for that item. Before you have logged anything you will see No price data yet — \"Add items with prices to see comparisons\". Stores Stores belong to your household, and everyone in the household sees and uses the same list. Adding one shows the toast Store added! Store names must be unique within a household. You cannot have two stores with the same name, so give branches names that tell them apart — \"Kroger Oak St\" and \"Kroger Riverside\" rather than \"Kroger\" twice. One quirk worth knowing before you tidy up your store list: Purchase history records the store name as text. Renaming a store does not go back and rewrite the older history. Records logged under the old name keep it, so a rename can split one store into two entries in your comparisons. Settle on your naming early. If something goes wrong No price data yet — you have not logged anything, or you have added inventory items without filling in Price optional and Store optional . Log a price or start filling in those fields. A store appears twice in your comparisons. Almost always a rename, or two spellings of the same name. Older history keeps the name it was logged under. An item's history looks thin or split. Check you are using the same item name each time. Different names build different histories. Comparisons look wrong after one shop. Two prices at one store is not a pattern. The cards get more useful the more you log. A household member's price is not showing. There is no live sync between devices. Refresh the page. Good to know Prices are shared across your whole household — anyone can log one and everyone sees the record. Everything here is what you recorded. It is your household's own history, not a live feed of shelf prices, so a price is only as current as the day it was logged. Prices generated by the AI grocery list are estimates in US dollars, not real store prices. Do not treat them as prices you have paid. The Shopping Calculator on the Grocery tab is a separate tool for tracking spend against a budget while you shop. See The shopping calculator and budgets shopping calculator . For a rough outside check on whether a price is reasonable, the Crowdsourced sub tab searches prices reported by other people. Related Crowdsourced prices crowdsourced prices Scanning a grocery receipt scanning a receipt The shopping calculator and budgets shopping calculator Adding items to your pantry adding items manually "}, {"id": "crowdsourced-prices", "title": "Crowdsourced prices", "category": "Prices & Savings", "summary": "The Crowdsourced sub-tab searches prices reported by the community through Open Prices — useful as a sanity check, not as a guide to where to shop today.", "keywords": ["crowdsourced", "crowdsourced prices", "open prices", "openfoodfacts", "community prices", "price check", "search prices", "no crowdsourced prices found"], "html": "<p>The <strong>Prices<\/strong> tab has two sub-tabs. <strong>Your Prices<\/strong> is your household's own record of what you paid. <strong>Crowdsourced<\/strong> is the other thing entirely: prices that other people have reported, from stores around the world.<\/p>\n<h2 id=\"where-the-data-comes-from\">Where the data comes from<\/h2>\n<p>The <strong>Crowdsourced<\/strong> sub-tab is powered by <strong>Open Prices<\/strong>, a project from OpenFoodFacts. The page describes it as \"Search for prices reported by the community from stores worldwide\".<\/p>\n<p>What that means in practice matters more than the name:<\/p>\n<ul>\n<li>The prices were <strong>reported by other people<\/strong>, not collected from stores by Pantry Tab.<\/li>\n<li>They are <strong>not verified by Pantry Tab<\/strong>. Nobody at Pantry Tab has checked that any of them is right.<\/li>\n<li>They come from <strong>stores worldwide<\/strong>, so a result is <strong>not necessarily anywhere near you<\/strong>.<\/li>\n<li>A report was accurate on the day someone submitted it. It <strong>may not be current<\/strong>.<\/li>\n<\/ul>\n<p>Nothing here is a live shelf price, and nothing here is specific to your household.<\/p>\n<h2 id=\"searching\">Searching<\/h2>\n<ol>\n<li>Open the <strong>Prices<\/strong> tab.<\/li>\n<li>Switch to the <strong>Crowdsourced<\/strong> sub-tab.<\/li>\n<li>Search for the product you are interested in.<\/li>\n<\/ol>\n<p>Search by the product name as it is printed on the packaging. Community reports are attached to specific products, so a precise name gets you further than a general one — a named brand and size will find more than \"cereal\".<\/p>\n<h2 id=\"reading-the-results\">Reading the results<\/h2>\n<p>Each result is a price somebody reported for that product at a store. Read the set rather than any single line: a cluster of reports around a similar figure tells you roughly what the product tends to cost, while one lone report tells you what one person paid, once, somewhere.<\/p>\n<p>Treat every number as a data point from someone else's shop, not as a price you can expect to be offered.<\/p>\n<h2 id=\"the-two-empty-states\">The two empty states<\/h2>\n<p><strong>Before you search<\/strong>, the tab shows its prompt: \"Search for prices reported by the community from stores worldwide\". There are no results to show because you have not asked for any yet.<\/p>\n<p><strong>After a search that finds nothing<\/strong>, you get:<\/p>\n<p><strong>No crowdsourced prices found<\/strong> — \"This product hasn't been reported to Open Prices yet\"<\/p>\n<p>That second one is common, and it is not an error. It means the community has not submitted a price for that product. It says nothing at all about the product being unusual, expensive or unavailable.<\/p>\n<h2 id=\"when-this-is-useful-and-when-it-is-not\">When this is useful, and when it is not<\/h2>\n<p>Use it for:<\/p>\n<ul>\n<li>A <strong>sanity check on whether a price is reasonable<\/strong>. You are looking at something on a shelf, or at a price in your own history, and you want a rough sense of whether it is in the normal range.<\/li>\n<li>Getting a feel for what a product costs generally, when you have never bought it before.<\/li>\n<\/ul>\n<p>Do not use it for:<\/p>\n<ul>\n<li><strong>Deciding where to shop today.<\/strong> The reports are not tied to your area or to this week.<\/li>\n<li>Planning a budget. Use your own logged prices for that.<\/li>\n<li>Settling an argument about what a store charges. Only your own receipts and the store itself can do that.<\/li>\n<\/ul>\n<p>For anything about your actual shopping, <strong>Your Prices<\/strong> is the sub-tab you want. See <a href=\"#price-tracking\">Tracking and comparing prices<\/a>.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>No crowdsourced prices found<\/strong> — \"This product hasn't been reported to Open Prices yet\". Nobody has submitted a price for that product. Try the brand name and size exactly as printed, or a more common variant of the product, and expect plenty of products to return nothing at all.<\/li>\n<li><strong>A result looks wildly wrong.<\/strong> It probably is. These are unverified community reports and can be mistaken, out of date, or from a country with very different prices. Ignore outliers.<\/li>\n<li><strong>You cannot find anything for a store-own brand.<\/strong> Own brands and regional products get reported far less often than national brands.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li><strong>Coverage is patchy, and that is expected.<\/strong> Open Prices only holds what the community has taken the time to report, so some products have many reports and many have none.<\/li>\n<li>Crowdsourced results are read-only inside Pantry Tab. They do not go into your own price history, they do not affect <strong>Best Value Store<\/strong> or <strong>Potential Savings<\/strong>, and they are not used by any other part of the app.<\/li>\n<li>Nothing you do on this tab changes your inventory, your grocery list or your household's records.<\/li>\n<li>Pantry Tab also uses OpenFoodFacts data for barcode and nutrition lookups. Same caveat: it is community data, and it can be incomplete or wrong for the exact product in your hand.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#price-tracking\">Tracking and comparing prices<\/a><\/li>\n<li><a href=\"#shopping-calculator\">The shopping calculator and budgets<\/a><\/li>\n<li><a href=\"#barcode-scanning\">Scanning barcodes<\/a><\/li>\n<li><a href=\"#limits-and-known-issues\">Limits and known issues<\/a><\/li>\n<\/ul>", "text": "The Prices tab has two sub tabs. Your Prices is your household's own record of what you paid. Crowdsourced is the other thing entirely: prices that other people have reported, from stores around the world. Where the data comes from The Crowdsourced sub tab is powered by Open Prices , a project from OpenFoodFacts. The page describes it as \"Search for prices reported by the community from stores worldwide\". What that means in practice matters more than the name: The prices were reported by other people , not collected from stores by Pantry Tab. They are not verified by Pantry Tab . Nobody at Pantry Tab has checked that any of them is right. They come from stores worldwide , so a result is not necessarily anywhere near you . A report was accurate on the day someone submitted it. It may not be current . Nothing here is a live shelf price, and nothing here is specific to your household. Searching 1. Open the Prices tab. 2. Switch to the Crowdsourced sub tab. 3. Search for the product you are interested in. Search by the product name as it is printed on the packaging. Community reports are attached to specific products, so a precise name gets you further than a general one — a named brand and size will find more than \"cereal\". Reading the results Each result is a price somebody reported for that product at a store. Read the set rather than any single line: a cluster of reports around a similar figure tells you roughly what the product tends to cost, while one lone report tells you what one person paid, once, somewhere. Treat every number as a data point from someone else's shop, not as a price you can expect to be offered. The two empty states Before you search , the tab shows its prompt: \"Search for prices reported by the community from stores worldwide\". There are no results to show because you have not asked for any yet. After a search that finds nothing , you get: No crowdsourced prices found — \"This product hasn't been reported to Open Prices yet\" That second one is common, and it is not an error. It means the community has not submitted a price for that product. It says nothing at all about the product being unusual, expensive or unavailable. When this is useful, and when it is not Use it for: A sanity check on whether a price is reasonable . You are looking at something on a shelf, or at a price in your own history, and you want a rough sense of whether it is in the normal range. Getting a feel for what a product costs generally, when you have never bought it before. Do not use it for: Deciding where to shop today. The reports are not tied to your area or to this week. Planning a budget. Use your own logged prices for that. Settling an argument about what a store charges. Only your own receipts and the store itself can do that. For anything about your actual shopping, Your Prices is the sub tab you want. See Tracking and comparing prices price tracking . If something goes wrong No crowdsourced prices found — \"This product hasn't been reported to Open Prices yet\". Nobody has submitted a price for that product. Try the brand name and size exactly as printed, or a more common variant of the product, and expect plenty of products to return nothing at all. A result looks wildly wrong. It probably is. These are unverified community reports and can be mistaken, out of date, or from a country with very different prices. Ignore outliers. You cannot find anything for a store own brand. Own brands and regional products get reported far less often than national brands. Good to know Coverage is patchy, and that is expected. Open Prices only holds what the community has taken the time to report, so some products have many reports and many have none. Crowdsourced results are read only inside Pantry Tab. They do not go into your own price history, they do not affect Best Value Store or Potential Savings , and they are not used by any other part of the app. Nothing you do on this tab changes your inventory, your grocery list or your household's records. Pantry Tab also uses OpenFoodFacts data for barcode and nutrition lookups. Same caveat: it is community data, and it can be incomplete or wrong for the exact product in your hand. Related Tracking and comparing prices price tracking The shopping calculator and budgets shopping calculator Scanning barcodes barcode scanning Limits and known issues limits and known issues "}, {"id": "browse-marketplace", "title": "Browsing and saving community recipes", "category": "Community", "summary": "How to find recipes in the Pantry Tab marketplace, check them against your pantry, save them to your library, and add what you are missing.", "keywords": ["marketplace", "community", "browse recipes", "save to library", "pantry check", "filters", "load more", "add missing", "recipe search"], "html": "<p>The marketplace is a public collection of recipes shared by other Pantry Tab cooks. You can filter it, check any recipe against what is already in your kitchen, and pull the ones you like into your own library.<\/p>\n<h2 id=\"getting-to-community\">Getting to Community<\/h2>\n<p>From the main tab bar, tap the <strong>Community<\/strong> link. It opens the marketplace, which has its own sidebar instead of the usual tabs:<\/p>\n<ul>\n<li><strong>Community<\/strong> — back to the marketplace home.<\/li>\n<li><strong>Browse Recipes<\/strong> — the recipe listing described below.<\/li>\n<li><strong>My Recipes<\/strong> — your own recipes, including any you have published.<\/li>\n<li><strong>My Inventory<\/strong> — your pantry.<\/li>\n<li><strong>Meal Planner<\/strong> — your meal plan.<\/li>\n<li><strong>Shopping List<\/strong> — your grocery list, with a count badge.<\/li>\n<li><strong>Kitchen Talk<\/strong> — the community forum.<\/li>\n<li><strong>Menu<\/strong> and <strong>Sign Out<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"browse-recipes\">Browse Recipes<\/h2>\n<p>Tap <strong>Browse Recipes<\/strong> to open <strong>Recipe Marketplace<\/strong> — \"Discover, filter, and sync recipes to your kitchen.\" The marketplace also carries the heading \"Discover recipes from a world of food.\" If you land on the marketplace home first, <strong>Start exploring<\/strong> takes you into the same listing.<\/p>\n<p>Narrow the list with any combination of:<\/p>\n<ul>\n<li><strong>Cuisine<\/strong><\/li>\n<li><strong>Protein / Type<\/strong><\/li>\n<li><strong>Dietary<\/strong><\/li>\n<li><strong>Diet<\/strong><\/li>\n<li><strong>Max Time (min)<\/strong><\/li>\n<\/ul>\n<p>There is also a free-text search box for when you know roughly what you want — a dish name, an ingredient, a technique. Search and the filters work together, so a search term plus two filters returns only recipes matching all of them.<\/p>\n<p>Results load a page at a time. Tap <strong>Load More<\/strong> at the bottom to bring in the next set. Keep tapping to go deeper; there is no page-number control.<\/p>\n<p>If the combination is too narrow you will see <strong>No recipes match your filters.<\/strong> Tap <strong>Clear Filters<\/strong> to start again, or loosen one filter at a time — <strong>Max Time (min)<\/strong> and <strong>Diet<\/strong> are usually the ones cutting the list down.<\/p>\n<h2 id=\"the-recipe-detail-dialog\">The recipe detail dialog<\/h2>\n<p>Tap any recipe card to open its detail dialog. It shows:<\/p>\n<ul>\n<li><strong>Pantry Check<\/strong>, with a count in the form \"N of M owned\" — how many of the recipe's ingredients you already have.<\/li>\n<li>The full ingredient list, colour-coded: <strong>green<\/strong> means the ingredient is in your pantry, <strong>orange<\/strong> means it is missing.<\/li>\n<li>The instructions.<\/li>\n<li>A source link to where the recipe came from.<\/li>\n<\/ul>\n<p>Pantry Check reads your current inventory, so the same recipe can show a different count next week.<\/p>\n<h2 id=\"saving-a-recipe-and-filling-the-gaps\">Saving a recipe and filling the gaps<\/h2>\n<p>From the detail dialog:<\/p>\n<ol>\n<li>Tap <strong>Save to Library<\/strong> to copy the recipe into your recipes. You will see the toast <strong>Recipe saved to your collection!<\/strong><\/li>\n<li>To shop for what you do not have, tap <strong>Add N Missing<\/strong> — where N is the number of orange ingredients. They go onto your grocery list.<\/li>\n<li>If you already own everything, that button reads <strong>All in Pantry<\/strong> instead, and there is nothing to add.<\/li>\n<\/ol>\n<p>You can save a recipe without adding anything to your list, and you can add missing ingredients without saving the recipe.<\/p>\n<h2 id=\"who-can-see-what-you-save\">Who can see what you save<\/h2>\n<p>This is the one part of Pantry Tab that does not follow the usual household sharing rule.<\/p>\n<ul>\n<li><strong>Recipes you save from the marketplace are private to you.<\/strong> Other people in your household do not see them.<\/li>\n<li><strong>Recipes in your own library are shared with your household.<\/strong> Anyone in the household can view, edit or delete them.<\/li>\n<\/ul>\n<p>So if you save a marketplace recipe and a housemate says they cannot find it, that is expected behaviour rather than a fault.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>No recipes match your filters.<\/strong> Tap <strong>Clear Filters<\/strong>, then reapply filters one at a time to find the one that is emptying the list.<\/li>\n<li><strong>Load More does not bring in anything new.<\/strong> You have reached the end of the results for those filters. Broaden the search or clear a filter.<\/li>\n<li><strong>Pantry Check says you are missing something you own.<\/strong> The ingredient name and your inventory item name have to be recognisable as the same thing. Renaming your inventory item to a plainer name usually fixes it.<\/li>\n<li><strong>A saved recipe is not visible to your household.<\/strong> Saved marketplace recipes are private to you by design. Add the recipe to your own library by hand if the whole household needs it.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>The marketplace has its own sidebar. Use <strong>My Inventory<\/strong>, <strong>Meal Planner<\/strong> and <strong>Shopping List<\/strong> in that sidebar to jump back to your own kitchen without leaving Community.<\/li>\n<li><strong>Add N Missing<\/strong> adds to your grocery list, which <em>is<\/em> shared with your household, even though the saved recipe is not.<\/li>\n<li>The source link points at wherever the recipe originated. Pantry Tab does not check that those links stay alive.<\/li>\n<li>Published marketplace recipes are visible to anyone, including people who are not signed in. Keep that in mind before you publish your own — see <a href=\"#publishing-recipes\">Publishing, rating, and reviewing recipes<\/a>.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#publishing-recipes\">Publishing, rating, and reviewing recipes<\/a><\/li>\n<li><a href=\"#managing-recipes\">Managing your recipe library<\/a><\/li>\n<li><a href=\"#what-can-i-make\">What Can I Make? Recipe ideas from your pantry<\/a><\/li>\n<li><a href=\"#kitchen-talk\">Kitchen Talk: the community forum<\/a><\/li>\n<\/ul>", "text": "The marketplace is a public collection of recipes shared by other Pantry Tab cooks. You can filter it, check any recipe against what is already in your kitchen, and pull the ones you like into your own library. Getting to Community From the main tab bar, tap the Community link. It opens the marketplace, which has its own sidebar instead of the usual tabs: Community — back to the marketplace home. Browse Recipes — the recipe listing described below. My Recipes — your own recipes, including any you have published. My Inventory — your pantry. Meal Planner — your meal plan. Shopping List — your grocery list, with a count badge. Kitchen Talk — the community forum. Menu and Sign Out . Browse Recipes Tap Browse Recipes to open Recipe Marketplace — \"Discover, filter, and sync recipes to your kitchen.\" The marketplace also carries the heading \"Discover recipes from a world of food.\" If you land on the marketplace home first, Start exploring takes you into the same listing. Narrow the list with any combination of: Cuisine Protein / Type Dietary Diet Max Time min There is also a free text search box for when you know roughly what you want — a dish name, an ingredient, a technique. Search and the filters work together, so a search term plus two filters returns only recipes matching all of them. Results load a page at a time. Tap Load More at the bottom to bring in the next set. Keep tapping to go deeper; there is no page number control. If the combination is too narrow you will see No recipes match your filters. Tap Clear Filters to start again, or loosen one filter at a time — Max Time min and Diet are usually the ones cutting the list down. The recipe detail dialog Tap any recipe card to open its detail dialog. It shows: Pantry Check , with a count in the form \"N of M owned\" — how many of the recipe's ingredients you already have. The full ingredient list, colour coded: green means the ingredient is in your pantry, orange means it is missing. The instructions. A source link to where the recipe came from. Pantry Check reads your current inventory, so the same recipe can show a different count next week. Saving a recipe and filling the gaps From the detail dialog: 1. Tap Save to Library to copy the recipe into your recipes. You will see the toast Recipe saved to your collection! 2. To shop for what you do not have, tap Add N Missing — where N is the number of orange ingredients. They go onto your grocery list. 3. If you already own everything, that button reads All in Pantry instead, and there is nothing to add. You can save a recipe without adding anything to your list, and you can add missing ingredients without saving the recipe. Who can see what you save This is the one part of Pantry Tab that does not follow the usual household sharing rule. Recipes you save from the marketplace are private to you. Other people in your household do not see them. Recipes in your own library are shared with your household. Anyone in the household can view, edit or delete them. So if you save a marketplace recipe and a housemate says they cannot find it, that is expected behaviour rather than a fault. If something goes wrong No recipes match your filters. Tap Clear Filters , then reapply filters one at a time to find the one that is emptying the list. Load More does not bring in anything new. You have reached the end of the results for those filters. Broaden the search or clear a filter. Pantry Check says you are missing something you own. The ingredient name and your inventory item name have to be recognisable as the same thing. Renaming your inventory item to a plainer name usually fixes it. A saved recipe is not visible to your household. Saved marketplace recipes are private to you by design. Add the recipe to your own library by hand if the whole household needs it. Good to know The marketplace has its own sidebar. Use My Inventory , Meal Planner and Shopping List in that sidebar to jump back to your own kitchen without leaving Community. Add N Missing adds to your grocery list, which is shared with your household, even though the saved recipe is not. The source link points at wherever the recipe originated. Pantry Tab does not check that those links stay alive. Published marketplace recipes are visible to anyone, including people who are not signed in. Keep that in mind before you publish your own — see Publishing, rating, and reviewing recipes publishing recipes . Related Publishing, rating, and reviewing recipes publishing recipes Managing your recipe library managing recipes What Can I Make? Recipe ideas from your pantry what can i make Kitchen Talk: the community forum kitchen talk "}, {"id": "publishing-recipes", "title": "Publishing, rating, and reviewing recipes", "category": "Community", "summary": "How to publish one of your recipes to the marketplace, tag it well, manage it afterwards, and how ratings and comments work.", "keywords": ["publish recipe", "post to marketplace", "share recipe", "tags", "cuisine", "dietary", "manage recipe", "rating", "stars", "comments", "reviews"], "html": "<p>You can share any of your own recipes with the wider Pantry Tab community, and rate or comment on recipes other people have published. Read the section on public copies below before you publish — it is the thing people most often get caught out by.<\/p>\n<h2 id=\"publishing-a-recipe\">Publishing a recipe<\/h2>\n<ol>\n<li>Open the recipe you want to share.<\/li>\n<li>Choose <strong>Post to Marketplace?<\/strong><\/li>\n<li>Add the tags described below.<\/li>\n<li>Confirm. You will see the toast <strong>Recipe shared with the community!<\/strong><\/li>\n<\/ol>\n<h3 id=\"the-tags\">The tags<\/h3>\n<p>Publishing asks for three tags:<\/p>\n<ul>\n<li><strong>Cuisine<\/strong><\/li>\n<li><strong>Protein / Type<\/strong><\/li>\n<li><strong>Dietary<\/strong><\/li>\n<\/ul>\n<p>These are the same fields people filter by in <strong>Browse Recipes<\/strong>. A recipe with vague or missing tags is very hard to find — someone filtering for a weeknight chicken dinner will never see your chicken recipe if its <strong>Protein / Type<\/strong> is blank. Tag honestly rather than broadly: tagging a dish as something it is not gets it in front of the wrong cooks, who will rate it accordingly.<\/p>\n<h2 id=\"a-published-recipe-is-a-separate-public-copy\">A published recipe is a separate public copy<\/h2>\n<p>This matters more than anything else on this page.<\/p>\n<p><strong>When you publish, Pantry Tab makes a separate public copy of the recipe. Your private recipe and the published recipe are two different things from that moment on.<\/strong><\/p>\n<p>The consequence:<\/p>\n<ul>\n<li><strong>Deleting your private recipe does not remove the published one.<\/strong> The public copy stays in the marketplace.<\/li>\n<li>To change or take down a published recipe, use <strong>Manage Recipe<\/strong> on that recipe in the marketplace. That is the only route.<\/li>\n<\/ul>\n<p>If you have already deleted the private copy and want the public one gone, go to your published recipes and use <strong>Manage Recipe<\/strong> there.<\/p>\n<h2 id=\"everything-you-publish-is-public\">Everything you publish is public<\/h2>\n<p>Published recipes, their ratings and their comments are visible to <strong>anyone, including people who are not signed in<\/strong>. There is no members-only view and no way to publish to a limited audience.<\/p>\n<p>Before you publish, take out anything you would not put on a public web page:<\/p>\n<ul>\n<li>Family names, addresses, phone numbers or email addresses.<\/li>\n<li>Photos or notes that identify your home.<\/li>\n<li>Anything you were told in confidence, including someone else's unpublished recipe.<\/li>\n<\/ul>\n<p>The same applies to comments you leave on other people's recipes.<\/p>\n<h2 id=\"ratings\">Ratings<\/h2>\n<p>Ratings appear under <strong>Reviews &amp; Comments<\/strong>, with <strong>Your Rating:<\/strong> for your own.<\/p>\n<ul>\n<li>Ratings run from <strong>1 to 5 stars<\/strong>.<\/li>\n<li>There are no half stars.<\/li>\n<li>One rating per person per recipe. Rating a recipe again replaces your previous rating rather than adding a second one.<\/li>\n<li>Saving shows the toast <strong>Rating saved!<\/strong><\/li>\n<\/ul>\n<h2 id=\"comments\">Comments<\/h2>\n<p>Also under <strong>Reviews &amp; Comments<\/strong>. Post a comment and you will see <strong>Comment posted!<\/strong><\/p>\n<ul>\n<li>You can edit or delete <strong>only your own<\/strong> comments.<\/li>\n<li>Comments you leave are public, under the same rules as above.<\/li>\n<\/ul>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>You deleted a recipe but it is still in the marketplace.<\/strong> Expected. The published version is a separate public copy. Open it and use <strong>Manage Recipe<\/strong>.<\/li>\n<li><strong>Your published recipe is not showing up in searches.<\/strong> A recipe with no <strong>Cuisine<\/strong>, <strong>Protein / Type<\/strong> or <strong>Dietary<\/strong> tag will not appear when someone filters on those, so tag it before you publish. Use <strong>Manage Recipe<\/strong> to review them.<\/li>\n<li><strong>You rated a recipe twice and only one rating shows.<\/strong> That is how it works — one rating per person per recipe, and the newer one replaces the older one.<\/li>\n<li><strong>You cannot edit someone else's comment.<\/strong> Editing and deleting are limited to your own comments.<\/li>\n<li><strong>You published something you should not have.<\/strong> Use <strong>Manage Recipe<\/strong> on the published copy straight away. Assume anyone could have seen it in the meantime.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Your own recipes are shared with your household, and anyone in the household can edit or delete them. That means a housemate can change a recipe you then publish, or delete the private copy while the public one lives on.<\/li>\n<li>Publishing does not remove the recipe from your library. You keep cooking from your private copy as usual.<\/li>\n<li>Ratings and comments from others are attached to the public copy, not to your private recipe.<\/li>\n<li>Recipes you save from other people's marketplace posts are private to you and are not shared with your household. See <a href=\"#browse-marketplace\">Browsing and saving community recipes<\/a>.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#browse-marketplace\">Browsing and saving community recipes<\/a><\/li>\n<li><a href=\"#kitchen-talk\">Kitchen Talk: the community forum<\/a><\/li>\n<li><a href=\"#managing-recipes\">Managing your recipe library<\/a><\/li>\n<li><a href=\"#privacy-and-your-data\">Your data and privacy<\/a><\/li>\n<\/ul>", "text": "You can share any of your own recipes with the wider Pantry Tab community, and rate or comment on recipes other people have published. Read the section on public copies below before you publish — it is the thing people most often get caught out by. Publishing a recipe 1. Open the recipe you want to share. 2. Choose Post to Marketplace? 3. Add the tags described below. 4. Confirm. You will see the toast Recipe shared with the community! The tags Publishing asks for three tags: Cuisine Protein / Type Dietary These are the same fields people filter by in Browse Recipes . A recipe with vague or missing tags is very hard to find — someone filtering for a weeknight chicken dinner will never see your chicken recipe if its Protein / Type is blank. Tag honestly rather than broadly: tagging a dish as something it is not gets it in front of the wrong cooks, who will rate it accordingly. A published recipe is a separate public copy This matters more than anything else on this page. When you publish, Pantry Tab makes a separate public copy of the recipe. Your private recipe and the published recipe are two different things from that moment on. The consequence: Deleting your private recipe does not remove the published one. The public copy stays in the marketplace. To change or take down a published recipe, use Manage Recipe on that recipe in the marketplace. That is the only route. If you have already deleted the private copy and want the public one gone, go to your published recipes and use Manage Recipe there. Everything you publish is public Published recipes, their ratings and their comments are visible to anyone, including people who are not signed in . There is no members only view and no way to publish to a limited audience. Before you publish, take out anything you would not put on a public web page: Family names, addresses, phone numbers or email addresses. Photos or notes that identify your home. Anything you were told in confidence, including someone else's unpublished recipe. The same applies to comments you leave on other people's recipes. Ratings Ratings appear under Reviews & Comments , with Your Rating: for your own. Ratings run from 1 to 5 stars . There are no half stars. One rating per person per recipe. Rating a recipe again replaces your previous rating rather than adding a second one. Saving shows the toast Rating saved! Comments Also under Reviews & Comments . Post a comment and you will see Comment posted! You can edit or delete only your own comments. Comments you leave are public, under the same rules as above. If something goes wrong You deleted a recipe but it is still in the marketplace. Expected. The published version is a separate public copy. Open it and use Manage Recipe . Your published recipe is not showing up in searches. A recipe with no Cuisine , Protein / Type or Dietary tag will not appear when someone filters on those, so tag it before you publish. Use Manage Recipe to review them. You rated a recipe twice and only one rating shows. That is how it works — one rating per person per recipe, and the newer one replaces the older one. You cannot edit someone else's comment. Editing and deleting are limited to your own comments. You published something you should not have. Use Manage Recipe on the published copy straight away. Assume anyone could have seen it in the meantime. Good to know Your own recipes are shared with your household, and anyone in the household can edit or delete them. That means a housemate can change a recipe you then publish, or delete the private copy while the public one lives on. Publishing does not remove the recipe from your library. You keep cooking from your private copy as usual. Ratings and comments from others are attached to the public copy, not to your private recipe. Recipes you save from other people's marketplace posts are private to you and are not shared with your household. See Browsing and saving community recipes browse marketplace . Related Browsing and saving community recipes browse marketplace Kitchen Talk: the community forum kitchen talk Managing your recipe library managing recipes Your data and privacy privacy and your data "}, {"id": "kitchen-talk", "title": "Kitchen Talk: the community forum", "category": "Community", "summary": "How to start topics and comment in Kitchen Talk, the four categories, the 5 MB photo limit, and the community rules.", "keywords": ["kitchen talk", "forum", "community", "start a new topic", "appliances", "cookware", "discussion", "comments", "photo upload", "community rules"], "html": "<p>Kitchen Talk is the Pantry Tab discussion forum — <strong>The Kitchen Community<\/strong>, \"Discuss appliances, techniques, and swap tips.\" It is where you ask which pan to buy, why your bread will not rise, or what to do with a glut of tomatoes.<\/p>\n<h2 id=\"getting-there\">Getting there<\/h2>\n<p>Open <strong>Community<\/strong> from the main tab bar, then tap <strong>Kitchen Talk<\/strong> in the marketplace sidebar.<\/p>\n<h2 id=\"the-four-categories\">The four categories<\/h2>\n<p>Every topic sits in one of four categories:<\/p>\n<ul>\n<li><strong>Appliances<\/strong><\/li>\n<li><strong>Cookware<\/strong><\/li>\n<li><strong>Recipes<\/strong><\/li>\n<li><strong>General<\/strong><\/li>\n<\/ul>\n<p>Pick the closest fit. <strong>General<\/strong> is for anything that does not belong in the other three, not a default.<\/p>\n<h2 id=\"starting-a-topic\">Starting a topic<\/h2>\n<ol>\n<li>Tap <strong>Start a New Topic<\/strong>.<\/li>\n<li>Fill in <strong>Title<\/strong> — a specific question gets more answers than \"help\".<\/li>\n<li>Fill in <strong>Content<\/strong> — the detail: what you tried, what happened, what you have to work with.<\/li>\n<li>Choose a category.<\/li>\n<li>Add a <strong>Photo (optional)<\/strong> if it helps. The limit is <strong>Max 5MB<\/strong>.<\/li>\n<li>Post. You will see the toast <strong>Topic posted successfully!<\/strong><\/li>\n<\/ol>\n<h2 id=\"reading-and-replying\">Reading and replying<\/h2>\n<p>Open any topic to read it and add a comment.<\/p>\n<ul>\n<li>You can edit or delete <strong>only your own<\/strong> topics and comments. There is no way to change or remove someone else's.<\/li>\n<li><strong>Comments are one level deep.<\/strong> You cannot reply to a specific comment — every comment attaches to the topic itself. If you are answering one person in a busy thread, name them in your comment so it is clear who you mean.<\/li>\n<\/ul>\n<h2 id=\"community-rules\">Community Rules<\/h2>\n<p>These are the rules shown in Kitchen Talk, in full:<\/p>\n<ul>\n<li>\"Be respectful and kind to fellow chefs.\"<\/li>\n<li>\"No spam, self-promotion, or ads.\"<\/li>\n<li>\"Keep discussions relevant to cooking/kitchen.\"<\/li>\n<li>\"Verify health claims before posting.\"<\/li>\n<\/ul>\n<p>That last one carries weight. Kitchen Talk is full of confident advice about allergies, food safety and storage times. Check anything that affects someone's health against a reliable source before you post it, and treat what you read there the same way.<\/p>\n<h2 id=\"etiquette-and-what-not-to-post\">Etiquette, and what not to post<\/h2>\n<ul>\n<li>Kitchen Talk is public. Do not post your address, phone number, email address, or photos that show where you live.<\/li>\n<li>Do not post other people's personal information either — including a household member's allergies or health details.<\/li>\n<li>Give the detail people need to help you: the appliance model, the quantities, what went wrong. \"It burned\" is hard to answer.<\/li>\n<li>Say thank you when someone solves your problem, and post what worked. The next person searching will find it.<\/li>\n<li>Disagree with the cooking, not the cook.<\/li>\n<\/ul>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"Photo upload is not configured. Please use an image URL instead.\"<\/strong> Some setups cannot accept a photo file. Upload your picture somewhere you can get a public link to it, and put that link in the <strong>Content<\/strong> of your post instead.<\/li>\n<li><strong>A photo will not attach.<\/strong> Check it is under the <strong>Max 5MB<\/strong> limit. A photo straight off a modern phone camera can exceed that — shrink it or take a lower-resolution shot.<\/li>\n<li><strong>You cannot edit or delete a post.<\/strong> Check it is actually yours. Editing and deleting are limited to your own topics and comments.<\/li>\n<li><strong>Your reply is not under the comment you meant it for.<\/strong> Comments are one level deep, so every comment lands at the bottom of the topic. Quote or name the person you are answering.<\/li>\n<li><strong>You posted something you regret.<\/strong> Delete your own topic or comment. Assume any other Pantry Tab user could have read it in the meantime.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Kitchen Talk is a discussion forum, not support. It does not reach the Pantry Tab team.<\/li>\n<li>Topics and comments are visible to everyone signed in to Pantry Tab, not just your household.<\/li>\n<li>A recipe shared in Kitchen Talk is only text in a post. To share a recipe properly so people can filter for it and save it, publish it to the marketplace instead — see <a href=\"#publishing-recipes\">Publishing, rating, and reviewing recipes<\/a>.<\/li>\n<li>Nothing you post in Kitchen Talk touches your pantry, your allergies or your household. It is a separate place.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#publishing-recipes\">Publishing, rating, and reviewing recipes<\/a><\/li>\n<li><a href=\"#browse-marketplace\">Browsing and saving community recipes<\/a><\/li>\n<li><a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a><\/li>\n<li><a href=\"#privacy-and-your-data\">Your data and privacy<\/a><\/li>\n<\/ul>", "text": "Kitchen Talk is the Pantry Tab discussion forum — The Kitchen Community , \"Discuss appliances, techniques, and swap tips.\" It is where you ask which pan to buy, why your bread will not rise, or what to do with a glut of tomatoes. Getting there Open Community from the main tab bar, then tap Kitchen Talk in the marketplace sidebar. The four categories Every topic sits in one of four categories: Appliances Cookware Recipes General Pick the closest fit. General is for anything that does not belong in the other three, not a default. Starting a topic 1. Tap Start a New Topic . 2. Fill in Title — a specific question gets more answers than \"help\". 3. Fill in Content — the detail: what you tried, what happened, what you have to work with. 4. Choose a category. 5. Add a Photo optional if it helps. The limit is Max 5MB . 6. Post. You will see the toast Topic posted successfully! Reading and replying Open any topic to read it and add a comment. You can edit or delete only your own topics and comments. Th
