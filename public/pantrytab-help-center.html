, and you start seeing the new household's food instead.<\/p>\n<p>If you are the only Owner of your current household, Pantry Tab will not let you accept: <strong>\"You are the only owner of your current household.\"<\/strong> Someone else in that household has to be able to run it before you can leave.<\/p>\n<h2 id=\"deleting-a-household\">Deleting a household<\/h2>\n<p>Deleting a household deletes everything in it — inventory, grocery list, recipes, meal plan, people, allergies, stores and locations, for every member. This cannot be undone and there is no export of the whole household. If you want to keep your recipes, export them from the <strong>Recipes<\/strong> tab first.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"You are the only owner of your current household.\"<\/strong> You are trying to accept an invitation while being the sole Owner where you are now. You cannot leave a household with no Owner behind.<\/li>\n<li><strong>\"Only the household owner can update the name\"<\/strong> You are a Member. Ask the Owner to rename it.<\/li>\n<li><strong>A member changed something and you cannot see it.<\/strong> There is no live sync between devices. Refresh the page.<\/li>\n<li><strong>Someone deleted a recipe you were using.<\/strong> Anyone in the household can delete any recipe, and deleting a recipe also deletes every meal-plan entry that used it.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Everybody in the household is looking at one shared view. Two people editing the same item at the same time will overwrite each other.<\/li>\n<li>A household can have a maximum of 2 locations, including the auto-created primary one. See <a href=\"#multiple-locations\">Tracking a second location<\/a>.<\/li>\n<li>Adding a person is not the same as inviting a member. A person is an eater with a name and allergies; a member is someone with their own login. See <a href=\"#people-profiles\">People profiles and the active person<\/a>.<\/li>\n<li>Allergy warnings are shown for the person selected in the header <strong>Active Person<\/strong> selector, but the underlying allergy list is visible to everyone.<\/li>\n<li>Your plan and billing are yours. Other members' access does not depend on your subscription being visible to them.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#inviting-and-managing-members\">Inviting and managing household members<\/a><\/li>\n<li><a href=\"#people-profiles\">People profiles and the active person<\/a><\/li>\n<li><a href=\"#multiple-locations\">Tracking a second location<\/a><\/li>\n<li><a href=\"#privacy-and-your-data\">Your data and privacy<\/a><\/li>\n<\/ul>", "text": "A household is the shared kitchen behind everything in Pantry Tab. One household holds one set of food, one grocery list and one plan, and everybody in it works from the same copy. Pantry Tab creates a household for you the first time you sign up. It is named {Your Name}'s Household , you are its Owner , and it starts with one person profile called Self and one location called Home , marked Primary. What everyone in the household shares Every member sees and can edit all of this: Inventory — what food you have, in every storage area The grocery list Recipes in your library The meal plan People profiles Allergies Stores Locations There is no per member privacy inside a household. If you share a household, you share the allergy list too. Any member can see who has which allergen and how severe it is, and any member can edit or delete a recipe, a person, or an inventory item that someone else added. What stays private to you Four things belong to your login, not to the household: Your profile Your saved marketplace recipes Your Kroger connection Your billing So if two people in the same household each save recipes from the Community marketplace, those saved recipes stay in each person's own collection. The same goes for Kroger: each person connects their own Kroger account and picks their own store. Owner and Member There are two roles: Owner and Member . Your role badge appears in the avatar menu in the top right. Only the Owner can: Invite, edit, or remove members Update the household name Add, rename or delete locations Members can do everything else — add food, edit recipes, plan meals, manage people and allergies. An Owner cannot remove themselves from the household. Renaming the household 1. Open the avatar menu in the top right and choose Household . 2. On Household Settings , edit the household name and save it. If you are a Member, the name is not editable. Pantry Tab says \"Only the household owner can update the name\" . Belonging to one household at a time You belong to exactly one household at a time. There is no way to sit in two kitchens at once and no way to switch back and forth. Accepting an invitation to another household moves you out of your current one. You lose access to the household you were in — its inventory, recipes and plan stay with the people still in it, and you start seeing the new household's food instead. If you are the only Owner of your current household, Pantry Tab will not let you accept: \"You are the only owner of your current household.\" Someone else in that household has to be able to run it before you can leave. Deleting a household Deleting a household deletes everything in it — inventory, grocery list, recipes, meal plan, people, allergies, stores and locations, for every member. This cannot be undone and there is no export of the whole household. If you want to keep your recipes, export them from the Recipes tab first. If something goes wrong \"You are the only owner of your current household.\" You are trying to accept an invitation while being the sole Owner where you are now. You cannot leave a household with no Owner behind. \"Only the household owner can update the name\" You are a Member. Ask the Owner to rename it. A member changed something and you cannot see it. There is no live sync between devices. Refresh the page. Someone deleted a recipe you were using. Anyone in the household can delete any recipe, and deleting a recipe also deletes every meal plan entry that used it. Good to know Everybody in the household is looking at one shared view. Two people editing the same item at the same time will overwrite each other. A household can have a maximum of 2 locations, including the auto created primary one. See Tracking a second location multiple locations . Adding a person is not the same as inviting a member. A person is an eater with a name and allergies; a member is someone with their own login. See People profiles and the active person people profiles . Allergy warnings are shown for the person selected in the header Active Person selector, but the underlying allergy list is visible to everyone. Your plan and billing are yours. Other members' access does not depend on your subscription being visible to them. Related Inviting and managing household members inviting and managing members People profiles and the active person people profiles Tracking a second location multiple locations Your data and privacy privacy and your data "}, {"id": "inviting-and-managing-members", "title": "Inviting and managing household members", "category": "Your Household", "summary": "How the Owner invites someone to the household, what the invited person does, invite statuses, removing a member, and the errors you may hit.", "keywords": ["invite", "invitation", "add member", "household members", "accept invite", "remove member", "owner", "invited", "active", "join household"], "html": "<p>Inviting a member gives another person their own login into your household, so they see the same pantry, list, recipes and plan that you do. Only the Owner can invite, edit, or remove members.<\/p>\n<h2 id=\"where-household-settings-live\">Where household settings live<\/h2>\n<p>Open the avatar menu in the top right and choose <strong>Household<\/strong>. That is <strong>Household Settings<\/strong>, and it holds the household name, the <strong>Members<\/strong> list, <strong>Invite Member<\/strong>, and <strong>Locations<\/strong>.<\/p>\n<h2 id=\"invite-someone\">Invite someone<\/h2>\n<ol>\n<li>Open <strong>Household Settings<\/strong>.<\/li>\n<li>Under <strong>Members<\/strong>, choose <strong>Invite Member<\/strong>.<\/li>\n<li>Enter the person's email address and invite them.<\/li>\n<li>The new row appears in <strong>Members<\/strong> with the status Invited.<\/li>\n<\/ol>\n<p>Use the email address they will sign in with. Email matching is case-insensitive, so capital letters do not matter.<\/p>\n<h2 id=\"what-the-invited-person-does\">What the invited person does<\/h2>\n<ol>\n<li>They open the invitation link, which takes them to the <strong>Join Household<\/strong> page at pantrytab.com/accept-invite.<\/li>\n<li>They sign in, or create an account first if they do not have one. The email on their account has to match the address you invited.<\/li>\n<li>They accept. They join your household, and their status changes from Invited to Active.<\/li>\n<\/ol>\n<p>Once they accept, they see everything the household shares and can edit all of it.<\/p>\n<h2 id=\"invited-versus-active\">Invited versus Active<\/h2>\n<ul>\n<li><strong>Invited<\/strong> — the invitation has been sent but not accepted. That person cannot see anything yet.<\/li>\n<li><strong>Active<\/strong> — they have accepted and are in the household.<\/li>\n<\/ul>\n<h2 id=\"removing-a-member\">Removing a member<\/h2>\n<ol>\n<li>Open <strong>Household Settings<\/strong> → <strong>Members<\/strong>.<\/li>\n<li>Choose the remove action on that person's row.<\/li>\n<li>Confirm at the <strong>Remove member?<\/strong> prompt.<\/li>\n<\/ol>\n<p>An Owner cannot remove themselves. If you want to leave a household you own, someone else has to be able to own it.<\/p>\n<p>Removing a member does not delete anything they added. Inventory, recipes, meal plans and people stay with the household.<\/p>\n<h2 id=\"members-versus-people\">Members versus people<\/h2>\n<p>These are two different things, and mixing them up is the most common confusion:<\/p>\n<ul>\n<li>A <strong>member<\/strong> is a login. Inviting a member is done in <strong>Household Settings<\/strong> and gives that person access to the app.<\/li>\n<li>A <strong>person<\/strong> is an eater — a name, a relationship, and allergies. People live at <strong>Household Members<\/strong> and adding one does not create an account or send anything.<\/li>\n<\/ul>\n<p>Add a person for a child, or for anyone whose allergies you want warnings about. Invite a member for anyone who needs to use the app themselves. Someone can be both. See <a href=\"#people-profiles\">People profiles and the active person<\/a>.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"You are the only owner of your current household.\"<\/strong> The invited person is the sole Owner of the household they are in now. You belong to exactly one household at a time, and accepting would leave their household without an Owner. They need someone else to be able to run it first.<\/li>\n<li><strong>\"Invalid or expired invitation\"<\/strong> The link is no longer good. Invite links expire and are single-use, so a link that has already been accepted will not work again. Send a fresh invitation.<\/li>\n<li><strong>\"No pending invitation found\"<\/strong> Nothing is waiting for the email address they are signed in with. Check the address you invited, and check they signed in with that same address, not a different one.<\/li>\n<li><strong>You cannot send a second invitation.<\/strong> You cannot have two pending invites to the same email for the same household. Wait for the first to be accepted, or work with the invitation already outstanding.<\/li>\n<li><strong>The person you invited has not received anything.<\/strong> Open <strong>Household Settings<\/strong> → <strong>Members<\/strong> and check the email address on the Invited row is exactly the one they use. If it is right and they still have nothing, contact support.<\/li>\n<li><strong>They accepted but cannot see your food.<\/strong> There is no live sync between devices. Have them refresh the page.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Accepting your invitation moves that person out of whatever household they were in before. They lose access to that household's inventory, recipes and plan.<\/li>\n<li>There is no per-member privacy. Every member can see and edit everything the household shares, including the allergy list.<\/li>\n<li>Unlimited household members are included on both plans.<\/li>\n<li>Members' saved marketplace recipes, Kroger connections, profiles and billing stay private to each of them.<\/li>\n<li>Only the Owner can rename the household or manage locations. Members will see <strong>\"Only the household owner can update the name\"<\/strong> if they try to rename it.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#households-and-sharing\">Households: sharing your kitchen<\/a><\/li>\n<li><a href=\"#people-profiles\">People profiles and the active person<\/a><\/li>\n<li><a href=\"#allergies-setup\">Setting up allergies for your household<\/a><\/li>\n<li><a href=\"#multiple-locations\">Tracking a second location<\/a><\/li>\n<\/ul>", "text": "Inviting a member gives another person their own login into your household, so they see the same pantry, list, recipes and plan that you do. Only the Owner can invite, edit, or remove members. Where household settings live Open the avatar menu in the top right and choose Household . That is Household Settings , and it holds the household name, the Members list, Invite Member , and Locations . Invite someone 1. Open Household Settings . 2. Under Members , choose Invite Member . 3. Enter the person's email address and invite them. 4. The new row appears in Members with the status Invited. Use the email address they will sign in with. Email matching is case insensitive, so capital letters do not matter. What the invited person does 1. They open the invitation link, which takes them to the Join Household page at pantrytab.com/accept invite. 2. They sign in, or create an account first if they do not have one. The email on their account has to match the address you invited. 3. They accept. They join your household, and their status changes from Invited to Active. Once they accept, they see everything the household shares and can edit all of it. Invited versus Active Invited — the invitation has been sent but not accepted. That person cannot see anything yet. Active — they have accepted and are in the household. Removing a member 1. Open Household Settings → Members . 2. Choose the remove action on that person's row. 3. Confirm at the Remove member? prompt. An Owner cannot remove themselves. If you want to leave a household you own, someone else has to be able to own it. Removing a member does not delete anything they added. Inventory, recipes, meal plans and people stay with the household. Members versus people These are two different things, and mixing them up is the most common confusion: A member is a login. Inviting a member is done in Household Settings and gives that person access to the app. A person is an eater — a name, a relationship, and allergies. People live at Household Members and adding one does not create an account or send anything. Add a person for a child, or for anyone whose allergies you want warnings about. Invite a member for anyone who needs to use the app themselves. Someone can be both. See People profiles and the active person people profiles . If something goes wrong \"You are the only owner of your current household.\" The invited person is the sole Owner of the household they are in now. You belong to exactly one household at a time, and accepting would leave their household without an Owner. They need someone else to be able to run it first. \"Invalid or expired invitation\" The link is no longer good. Invite links expire and are single use, so a link that has already been accepted will not work again. Send a fresh invitation. \"No pending invitation found\" Nothing is waiting for the email address they are signed in with. Check the address you invited, and check they signed in with that same address, not a different one. You cannot send a second invitation. You cannot have two pending invites to the same email for the same household. Wait for the first to be accepted, or work with the invitation already outstanding. The person you invited has not received anything. Open Household Settings → Members and check the email address on the Invited row is exactly the one they use. If it is right and they still have nothing, contact support. They accepted but cannot see your food. There is no live sync between devices. Have them refresh the page. Good to know Accepting your invitation moves that person out of whatever household they were in before. They lose access to that household's inventory, recipes and plan. There is no per member privacy. Every member can see and edit everything the household shares, including the allergy list. Unlimited household members are included on both plans. Members' saved marketplace recipes, Kroger connections, profiles and billing stay private to each of them. Only the Owner can rename the household or manage locations. Members will see \"Only the household owner can update the name\" if they try to rename it. Related Households: sharing your kitchen households and sharing People profiles and the active person people profiles Setting up allergies for your household allergies setup Tracking a second location multiple locations "}, {"id": "people-profiles", "title": "People profiles and the active person", "category": "Your Household", "summary": "How to add the people who eat in your household, what the Active Person selector changes, and what happens when you delete a person.", "keywords": ["people", "person", "household members", "active person", "eater", "relationship", "allergy alerts", "set active", "delete person", "household size"], "html": "<p>A person in Pantry Tab is an eater, not a login. People are how the app knows who it is protecting from which allergen, and how many mouths it is cooking for. Adding a person does not create an account and does not send anyone an email — that is a separate flow. See <a href=\"#inviting-and-managing-members\">Inviting and managing household members<\/a>.<\/p>\n<p>Your household starts with one person called <strong>Self<\/strong>. Add one for everyone who eats at your table, including children and anyone visiting long enough to matter.<\/p>\n<h2 id=\"add-a-person\">Add a person<\/h2>\n<ol>\n<li>Open the avatar menu in the top right and choose <strong>People<\/strong>. The page is headed <strong>Household Members<\/strong>.<\/li>\n<li>Add a person. If nobody has been added yet you will see <strong>No people added yet<\/strong>.<\/li>\n<li>Fill in the fields:\n   - <strong>First Name *<\/strong> — required\n   - <strong>Last Name<\/strong>\n   - <strong>Relationship<\/strong> — Self, Spouse, Child, Parent, Sibling, or Other\n   - Optional body details: birthdate, sex, height, weight, activity level<\/li>\n<li>Set the <strong>Allergy Alerts<\/strong> toggle as you want it. It is described as \"Show warnings for this person's allergies\".<\/li>\n<li>Save. You will see the toast <strong>Person added<\/strong>.<\/li>\n<\/ol>\n<p>The optional body details are yours to fill in or ignore. Nothing else in the app requires them.<\/p>\n<h2 id=\"allergy-alerts\">Allergy Alerts<\/h2>\n<p>The <strong>Allergy Alerts<\/strong> toggle controls whether this person's allergies produce warnings. Turn it off for someone whose allergies you have recorded but do not want flagged right now; turn it on to get warnings again. You still record the allergies themselves on the <strong>Allergies<\/strong> tab.<\/p>\n<h2 id=\"set-active-and-the-active-person-selector\">Set Active and the Active Person selector<\/h2>\n<p>Choose <strong>Set Active<\/strong> on a person to make them the active person. You will see the toast <strong>Active person changed<\/strong>.<\/p>\n<p>The header <strong>Active Person<\/strong> selector controls whose allergy warnings you see. Switching it changes which person the app is watching out for as you browse inventory, the grocery list, recipes and the meal planner. It does not change any of your food, your list, your plan, or anything else — the household's data is the same for everyone.<\/p>\n<p>Switch the active person when you are cooking for someone in particular, or when you are shopping and want to check a trip against one person's allergens.<\/p>\n<h2 id=\"household-size-and-prep-sheets\">Household size and prep sheets<\/h2>\n<p>The number of people in your household is what the meal prep cook sheet uses to work out portions. Portions are calculated as the number of tagged meals multiplied by the number of people in your household. If the portions on your prep sheet look wrong, count the people on <strong>Household Members<\/strong> first — a stale <strong>Self<\/strong>-only list, or a person added twice, is usually the reason. See <a href=\"#prep-sheets\">Meal prep cook sheets<\/a>.<\/p>\n<h2 id=\"delete-a-person\">Delete a person<\/h2>\n<p>Open <strong>Household Members<\/strong>, find the person, and delete them. You will see the toast <strong>Person deleted<\/strong>.<\/p>\n<p>Two things to know before you do:<\/p>\n<ul>\n<li><strong>\"Cannot delete the active person. Please switch to a different person first.\"<\/strong> If the person you are deleting is the one selected in the header <strong>Active Person<\/strong> selector, choose <strong>Set Active<\/strong> on somebody else first, then delete.<\/li>\n<li>Deleting a person deletes their allergies. Every allergy recorded against them goes with them, and the warnings tied to those allergens stop appearing. There is no undo.<\/li>\n<\/ul>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"Cannot delete the active person. Please switch to a different person first.\"<\/strong> Make another person active, then try again.<\/li>\n<li><strong>You are not seeing an allergy warning you expected.<\/strong> Check three things: that the allergy is recorded against the right person, that this person's <strong>Allergy Alerts<\/strong> toggle is on, and which person is selected in the header <strong>Active Person<\/strong> selector.<\/li>\n<li><strong>A change another member made is missing.<\/strong> There is no live sync between devices. Refresh the page.<\/li>\n<li><strong>Prep sheet portions look off.<\/strong> Portions follow the number of people in the household. Add or remove people, then rebuild the sheet.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>People are shared with everyone in your household. Any member can add, edit or delete any person, and any member can see every person's allergies. There is no per-member privacy inside a household.<\/li>\n<li>People are shared across both locations. Adding a second location does not give you a second set of people.<\/li>\n<li>Relationship is a fixed list: Self, Spouse, Child, Parent, Sibling, Other.<\/li>\n<li>Duplicate first names are allowed, so add last names when two people share one.<\/li>\n<li>Toasts you may see while editing: <strong>Person added<\/strong>, <strong>Person updated<\/strong>, <strong>Person deleted<\/strong>, and <strong>Active person changed<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#allergies-setup\">Setting up allergies for your household<\/a><\/li>\n<li><a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a><\/li>\n<li><a href=\"#inviting-and-managing-members\">Inviting and managing household members<\/a><\/li>\n<li><a href=\"#prep-sheets\">Meal prep cook sheets<\/a><\/li>\n<\/ul>", "text": "A person in Pantry Tab is an eater, not a login. People are how the app knows who it is protecting from which allergen, and how many mouths it is cooking for. Adding a person does not create an account and does not send anyone an email — that is a separate flow. See Inviting and managing household members inviting and managing members . Your household starts with one person called Self . Add one for everyone who eats at your table, including children and anyone visiting long enough to matter. Add a person 1. Open the avatar menu in the top right and choose People . The page is headed Household Members . 2. Add a person. If nobody has been added yet you will see No people added yet . 3. Fill in the fields: First Name \\ — required Last Name Relationship — Self, Spouse, Child, Parent, Sibling, or Other Optional body details: birthdate, sex, height, weight, activity level 4. Set the Allergy Alerts toggle as you want it. It is described as \"Show warnings for this person's allergies\". 5. Save. You will see the toast Person added . The optional body details are yours to fill in or ignore. Nothing else in the app requires them. Allergy Alerts The Allergy Alerts toggle controls whether this person's allergies produce warnings. Turn it off for someone whose allergies you have recorded but do not want flagged right now; turn it on to get warnings again. You still record the allergies themselves on the Allergies tab. Set Active and the Active Person selector Choose Set Active on a person to make them the active person. You will see the toast Active person changed . The header Active Person selector controls whose allergy warnings you see. Switching it changes which person the app is watching out for as you browse inventory, the grocery list, recipes and the meal planner. It does not change any of your food, your list, your plan, or anything else — the household's data is the same for everyone. Switch the active person when you are cooking for someone in particular, or when you are shopping and want to check a trip against one person's allergens. Household size and prep sheets The number of people in your household is what the meal prep cook sheet uses to work out portions. Portions are calculated as the number of tagged meals multiplied by the number of people in your household. If the portions on your prep sheet look wrong, count the people on Household Members first — a stale Self only list, or a person added twice, is usually the reason. See Meal prep cook sheets prep sheets . Delete a person Open Household Members , find the person, and delete them. You will see the toast Person deleted . Two things to know before you do: \"Cannot delete the active person. Please switch to a different person first.\" If the person you are deleting is the one selected in the header Active Person selector, choose Set Active on somebody else first, then delete. Deleting a person deletes their allergies. Every allergy recorded against them goes with them, and the warnings tied to those allergens stop appearing. There is no undo. If something goes wrong \"Cannot delete the active person. Please switch to a different person first.\" Make another person active, then try again. You are not seeing an allergy warning you expected. Check three things: that the allergy is recorded against the right person, that this person's Allergy Alerts toggle is on, and which person is selected in the header Active Person selector. A change another member made is missing. There is no live sync between devices. Refresh the page. Prep sheet portions look off. Portions follow the number of people in the household. Add or remove people, then rebuild the sheet. Good to know People are shared with everyone in your household. Any member can add, edit or delete any person, and any member can see every person's allergies. There is no per member privacy inside a household. People are shared across both locations. Adding a second location does not give you a second set of people. Relationship is a fixed list: Self, Spouse, Child, Parent, Sibling, Other. Duplicate first names are allowed, so add last names when two people share one. Toasts you may see while editing: Person added , Person updated , Person deleted , and Active person changed . Related Setting up allergies for your household allergies setup How allergy warnings work, and their limits how allergy warnings work Inviting and managing household members inviting and managing members Meal prep cook sheets prep sheets "}, {"id": "multiple-locations", "title": "Tracking a second location", "category": "Your Household", "summary": "How to add one extra location for a vacation home or Airbnb, what is tracked separately, and what stays shared across both.", "keywords": ["locations", "second home", "vacation home", "airbnb", "primary location", "add location", "location selector", "all locations", "separate inventory"], "html": "<p>Locations let you track a second kitchen — a vacation home, an Airbnb you manage, or another property — without mixing its food into your main pantry. Each location keeps its own inventory. Everything else stays shared.<\/p>\n<p>Your household starts with one location called <strong>Home<\/strong>, marked Primary. You can add one more.<\/p>\n<h2 id=\"the-limit-2-locations\">The limit: 2 locations<\/h2>\n<p>A household can have a <strong>maximum of 2 locations<\/strong>, and that count includes the primary location created for you. So you can add exactly one extra. Trying to add a third gives <strong>\"Maximum of 2 locations allowed\"<\/strong>.<\/p>\n<p>Only the Owner can add, rename or delete locations.<\/p>\n<h2 id=\"add-a-location\">Add a location<\/h2>\n<ol>\n<li>Open the avatar menu in the top right and choose <strong>Household<\/strong>.<\/li>\n<li>On <strong>Household Settings<\/strong>, go to <strong>Locations<\/strong>. It is described as \"Manage inventory locations (Primary + 1 additional)\".<\/li>\n<li>Choose <strong>Add Location<\/strong> — \"Add a vacation home, Airbnb, or other location to track separate inventory.\"<\/li>\n<li>Name it and save. It appears in the <strong>Locations<\/strong> list, and the location selector appears in the header.<\/li>\n<\/ol>\n<h2 id=\"switching-between-locations\">Switching between locations<\/h2>\n<p>Once you have two locations, a location selector appears in the header, next to the <strong>Active Person<\/strong> selector. One entry is marked <strong>(Primary)<\/strong>. Pick a location to work in it.<\/p>\n<p>The selector does not appear at all while you have only one location. If you cannot find it, you have not added a second location yet, or you are looking at a household where someone else added it and your page needs a refresh.<\/p>\n<h2 id=\"what-is-per-location-and-what-is-shared\">What is per-location and what is shared<\/h2>\n<p>Per location:<\/p>\n<ul>\n<li><strong>Inventory<\/strong> — each location has its own food. Items you add while one location is selected belong to that location only.<\/li>\n<\/ul>\n<p>Shared across both locations:<\/p>\n<ul>\n<li>Recipes<\/li>\n<li>Meal plans<\/li>\n<li>The grocery list<\/li>\n<li>People<\/li>\n<li>Allergies<\/li>\n<\/ul>\n<p>So a recipe you save at the beach house is in your library at home, and an allergy you record applies everywhere. Only the food itself is kept apart.<\/p>\n<h2 id=\"locations-on-the-grocery-list\">Locations on the grocery list<\/h2>\n<p>With two locations, the grocery list gains location handling:<\/p>\n<ul>\n<li>The <strong>Add Grocery Item<\/strong> dialog gets a <strong>Location<\/strong> field, so you can mark what a given item is for.<\/li>\n<li>The toolbar gains a location filter with <strong>All Locations<\/strong> plus each location. Both the field and the filter only appear when you have more than one location.<\/li>\n<li>Items sort by location name, and items with no location sort last.<\/li>\n<\/ul>\n<p>Use <strong>All Locations<\/strong> when you are doing one shop for both places, and filter to a single location when you are packing for a trip.<\/p>\n<h2 id=\"renaming-and-deleting-a-location\">Renaming and deleting a location<\/h2>\n<p>Rename from <strong>Household Settings<\/strong> → <strong>Locations<\/strong>. You will see <strong>Location updated<\/strong>.<\/p>\n<p>Deleting is the one to be careful with. <strong>Deleting a location deletes that location's inventory items.<\/strong> Every item recorded at that location goes with it, and there is no undo. Grocery items survive the deletion but lose their location tag. When the delete finishes you will see <strong>Location deleted<\/strong>.<\/p>\n<p>The primary location cannot be deleted.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"Maximum of 2 locations allowed\"<\/strong> You already have two, including the primary one. Delete the extra location before adding a different one — and remember that deleting it deletes its inventory.<\/li>\n<li><strong>\"Only the household owner can add/update/delete locations\"<\/strong> You are a Member. Ask the household Owner to make the change.<\/li>\n<li><strong>\"Cannot delete the primary location\"<\/strong> The primary location is permanent. If you want a different name for it, rename it instead.<\/li>\n<li><strong>The location selector is not in the header.<\/strong> It only appears when you have more than one location. If someone else has added one, refresh the page — there is no live sync between devices.<\/li>\n<li><strong>Food you added is at the wrong location.<\/strong> Items belong to whichever location was selected when you added them. Check the header selector before a big add or a shelf scan.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Two locations is a hard maximum. There is no way to track a third property, and no way to raise the limit.<\/li>\n<li>There is one grocery list for the whole household, not one per location. The location field is a tag on the item, not a separate list.<\/li>\n<li>The meal plan is shared too, so a dinner planned for the beach house shows on the same week as everything else.<\/li>\n<li>Recipes and allergies being shared means you do not have to set anything up twice at the second location.<\/li>\n<li>Everyone in the household can see and edit both locations' inventories. Only the Owner can manage the locations themselves.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#households-and-sharing\">Households: sharing your kitchen<\/a><\/li>\n<li><a href=\"#managing-your-inventory\">Managing your inventory: editing, using up, and batches<\/a><\/li>\n<li><a href=\"#using-the-grocery-list\">Building and using your grocery list<\/a><\/li>\n<li><a href=\"#inviting-and-managing-members\">Inviting and managing household members<\/a><\/li>\n<\/ul>", "text": "Locations let you track a second kitchen — a vacation home, an Airbnb you manage, or another property — without mixing its food into your main pantry. Each location keeps its own inventory. Everything else stays shared. Your household starts with one location called Home , marked Primary. You can add one more. The limit: 2 locations A household can have a maximum of 2 locations , and that count includes the primary location created for you. So you can add exactly one extra. Trying to add a third gives \"Maximum of 2 locations allowed\" . Only the Owner can add, rename or delete locations. Add a location 1. Open the avatar menu in the top right and choose Household . 2. On Household Settings , go to Locations . It is described as \"Manage inventory locations Primary + 1 additional \". 3. Choose Add Location — \"Add a vacation home, Airbnb, or other location to track separate inventory.\" 4. Name it and save. It appears in the Locations list, and the location selector appears in the header. Switching between locations Once you have two locations, a location selector appears in the header, next to the Active Person selector. One entry is marked Primary . Pick a location to work in it. The selector does not appear at all while you have only one location. If you cannot find it, you have not added a second location yet, or you are looking at a household where someone else added it and your page needs a refresh. What is per location and what is shared Per location: Inventory — each location has its own food. Items you add while one location is selected belong to that location only. Shared across both locations: Recipes Meal plans The grocery list People Allergies So a recipe you save at the beach house is in your library at home, and an allergy you record applies everywhere. Only the food itself is kept apart. Locations on the grocery list With two locations, the grocery list gains location handling: The Add Grocery Item dialog gets a Location field, so you can mark what a given item is for. The toolbar gains a location filter with All Locations plus each location. Both the field and the filter only appear when you have more than one location. Items sort by location name, and items with no location sort last. Use All Locations when you are doing one shop for both places, and filter to a single location when you are packing for a trip. Renaming and deleting a location Rename from Household Settings → Locations . You will see Location updated . Deleting is the one to be careful with. Deleting a location deletes that location's inventory items. Every item recorded at that location goes with it, and there is no undo. Grocery items survive the deletion but lose their location tag. When the delete finishes you will see Location deleted . The primary location cannot be deleted. If something goes wrong \"Maximum of 2 locations allowed\" You already have two, including the primary one. Delete the extra location before adding a different one — and remember that deleting it deletes its inventory. \"Only the household owner can add/update/delete locations\" You are a Member. Ask the household Owner to make the change. \"Cannot delete the primary location\" The primary location is permanent. If you want a different name for it, rename it instead. The location selector is not in the header. It only appears when you have more than one location. If someone else has added one, refresh the page — there is no live sync between devices. Food you added is at the wrong location. Items belong to whichever location was selected when you added them. Check the header selector before a big add or a shelf scan. Good to know Two locations is a hard maximum. There is no way to track a third property, and no way to raise the limit. There is one grocery list for the whole household, not one per location. The location field is a tag on the item, not a separate list. The meal plan is shared too, so a dinner planned for the beach house shows on the same week as everything else. Recipes and allergies being shared means you do not have to set anything up twice at the second location. Everyone in the household can see and edit both locations' inventories. Only the Owner can manage the locations themselves. Related Households: sharing your kitchen households and sharing Managing your inventory: editing, using up, and batches managing your inventory Building and using your grocery list using the grocery list Inviting and managing household members inviting and managing members "}, {"id": "adding-items-manually", "title": "Adding items to your pantry", "category": "Pantry Inventory", "summary": "How to add an item by hand on the Inventory tab, what every field does, and which optional fields unlock alerts, price tracking and AI planning.", "keywords": ["add item", "add new item", "inventory", "pantry", "quantity", "unit", "storage location", "expiry date", "price", "store", "low stock alert", "edit item"], "html": "<p>Everything else in Pantry Tab is built on your inventory — expiry alerts, meal plans, grocery lists and allergy warnings all read from it. You can add an item by hand from the <strong>Inventory<\/strong> tab, or from the <strong>Add item<\/strong> card on the Home dashboard.<\/p>\n<h2 id=\"adding-an-item\">Adding an item<\/h2>\n<p>Open the <strong>Add New Item<\/strong> dialog and work down the fields in order.<\/p>\n<ol>\n<li><strong>Item Name<\/strong> — what the item is. Plain names work best, for example \"Eggs\" rather than the wording on the box.<\/li>\n<li><strong>Quantity<\/strong> — how many you have. This starts at 1.<\/li>\n<li><strong>Unit<\/strong> — pick from pcs, lbs, oz, kg, gallon, liter, count, bags, bottle, box or can. The default is count.<\/li>\n<li><strong>Storage Location<\/strong> — one of <strong>🧊 Freezer<\/strong>, <strong>🥶 Fridge<\/strong> or <strong>📦 Pantry<\/strong>. These three are the only storage areas.<\/li>\n<li><strong>Expiry Date (optional)<\/strong> — when it goes off.<\/li>\n<li><strong>Price (optional)<\/strong> — what you paid.<\/li>\n<li><strong>Store (optional)<\/strong> — where you bought it.<\/li>\n<li><strong>Low Stock Alert (optional)<\/strong> — the quantity at which you want to be warned.<\/li>\n<\/ol>\n<p>Tap <strong>Add Item<\/strong> to save it, or <strong>Cancel<\/strong> to close without adding anything.<\/p>\n<h2 id=\"what-the-optional-fields-unlock\">What the optional fields unlock<\/h2>\n<p>The four optional fields are what turn a list of food into something the app can act on. It is worth filling them in.<\/p>\n<ul>\n<li><strong>Expiry Date (optional)<\/strong> feeds the <strong>Needs your attention<\/strong> card on the Home dashboard, which groups what has expired and what is going off in the next seven days. It also feeds the AI week planner, which prioritises ingredients that are about to expire.<\/li>\n<li><strong>Price (optional)<\/strong> and <strong>Store (optional)<\/strong> are logged to the <strong>Prices<\/strong> tab automatically, so your price comparisons build up as you add stock. You do not have to log the price separately.<\/li>\n<li><strong>Low Stock Alert (optional)<\/strong> flags the item once its quantity drops to or below the number you set. Low-stock items appear in <strong>Needs your attention<\/strong> and can be added to your grocery list in one tap.<\/li>\n<\/ul>\n<h2 id=\"editing-an-item\">Editing an item<\/h2>\n<p>Open an item and choose to edit it. The dialog is the same one, headed <strong>Edit Item<\/strong>, with your existing values filled in. Change what you need and tap <strong>Save Changes<\/strong>.<\/p>\n<p>Use editing to correct a quantity, add an expiry date you did not know at the time, or set a low stock alert later.<\/p>\n<h2 id=\"when-your-pantry-is-empty\">When your pantry is empty<\/h2>\n<p>A brand new pantry shows <strong>Add your first item<\/strong>. Tap it to open the same <strong>Add New Item<\/strong> dialog.<\/p>\n<h2 id=\"a-faster-way-to-fill-your-pantry\">A faster way to fill your pantry<\/h2>\n<p>Typing every item is slow. For anything more than a few items, scan instead:<\/p>\n<ul>\n<li>Point your camera at a shelf or an open fridge and let the AI list what it sees. See <a href=\"#scanning-a-shelf\">Scanning a shelf or fridge with your camera<\/a>.<\/li>\n<li>Photograph a grocery receipt and add the whole shop at once, with prices. See <a href=\"#scanning-a-receipt\">Scanning a grocery receipt<\/a>.<\/li>\n<li>Scan a single product's barcode to pull in its details and nutrition. See <a href=\"#barcode-scanning\">Scanning barcodes<\/a>.<\/li>\n<\/ul>\n<p>Typing by hand is still the right choice for loose items with no barcode and no receipt, and for correcting anything a scan got wrong.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>The unit you want is not in the list.<\/strong> The unit options are fixed: pcs, lbs, oz, kg, gallon, liter, count, bags, bottle, box, can. Pick the closest one and put any detail in the item name.<\/li>\n<li><strong>You cannot find a fourth storage area.<\/strong> There are only three — <strong>🧊 Freezer<\/strong>, <strong>🥶 Fridge<\/strong> and <strong>📦 Pantry<\/strong>.<\/li>\n<li><strong>An item you added is not showing on someone else's phone.<\/strong> There is no live sync between devices. Ask them to refresh the app.<\/li>\n<li><strong>You have two locations and the item went to the wrong one.<\/strong> Each location keeps its own inventory. Check the location selector in the header before you add.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Your inventory is shared with everyone in your household. Anyone can edit or delete any item.<\/li>\n<li>The <strong>Nutrition Facts<\/strong> panel stays empty on an item you type in by hand. Its own hint reads \"Scan the product barcode or search by name to add nutritional data.\"<\/li>\n<li>Adding an item to your pantry does not remove it from your grocery list, and checking something off your grocery list does not add it to your pantry. They are separate steps.<\/li>\n<li>If an item matches an allergen you track, an <strong>Allergy Warning<\/strong> badge appears on its card.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#barcode-scanning\">Scanning barcodes<\/a><\/li>\n<li><a href=\"#scanning-a-shelf\">Scanning a shelf or fridge with your camera<\/a><\/li>\n<li><a href=\"#managing-your-inventory\">Managing your inventory: editing, using up, and batches<\/a><\/li>\n<li><a href=\"#expiry-and-low-stock\">Expiry alerts and low-stock reminders<\/a><\/li>\n<\/ul>", "text": "Everything else in Pantry Tab is built on your inventory — expiry alerts, meal plans, grocery lists and allergy warnings all read from it. You can add an item by hand from the Inventory tab, or from the Add item card on the Home dashboard. Adding an item Open the Add New Item dialog and work down the fields in order. 1. Item Name — what the item is. Plain names work best, for example \"Eggs\" rather than the wording on the box. 2. Quantity — how many you have. This starts at 1. 3. Unit — pick from pcs, lbs, oz, kg, gallon, liter, count, bags, bottle, box or can. The default is count. 4. Storage Location — one of 🧊 Freezer , 🥶 Fridge or 📦 Pantry . These three are the only storage areas. 5. Expiry Date optional — when it goes off. 6. Price optional — what you paid. 7. Store optional — where you bought it. 8. Low Stock Alert optional — the quantity at which you want to be warned. Tap Add Item to save it, or Cancel to close without adding anything. What the optional fields unlock The four optional fields are what turn a list of food into something the app can act on. It is worth filling them in. Expiry Date optional feeds the Needs your attention card on the Home dashboard, which groups what has expired and what is going off in the next seven days. It also feeds the AI week planner, which prioritises ingredients that are about to expire. Price optional and Store optional are logged to the Prices tab automatically, so your price comparisons build up as you add stock. You do not have to log the price separately. Low Stock Alert optional flags the item once its quantity drops to or below the number you set. Low stock items appear in Needs your attention and can be added to your grocery list in one tap. Editing an item Open an item and choose to edit it. The dialog is the same one, headed Edit Item , with your existing values filled in. Change what you need and tap Save Changes . Use editing to correct a quantity, add an expiry date you did not know at the time, or set a low stock alert later. When your pantry is empty A brand new pantry shows Add your first item . Tap it to open the same Add New Item dialog. A faster way to fill your pantry Typing every item is slow. For anything more than a few items, scan instead: Point your camera at a shelf or an open fridge and let the AI list what it sees. See Scanning a shelf or fridge with your camera scanning a shelf . Photograph a grocery receipt and add the whole shop at once, with prices. See Scanning a grocery receipt scanning a receipt . Scan a single product's barcode to pull in its details and nutrition. See Scanning barcodes barcode scanning . Typing by hand is still the right choice for loose items with no barcode and no receipt, and for correcting anything a scan got wrong. If something goes wrong The unit you want is not in the list. The unit options are fixed: pcs, lbs, oz, kg, gallon, liter, count, bags, bottle, box, can. Pick the closest one and put any detail in the item name. You cannot find a fourth storage area. There are only three — 🧊 Freezer , 🥶 Fridge and 📦 Pantry . An item you added is not showing on someone else's phone. There is no live sync between devices. Ask them to refresh the app. You have two locations and the item went to the wrong one. Each location keeps its own inventory. Check the location selector in the header before you add. Good to know Your inventory is shared with everyone in your household. Anyone can edit or delete any item. The Nutrition Facts panel stays empty on an item you type in by hand. Its own hint reads \"Scan the product barcode or search by name to add nutritional data.\" Adding an item to your pantry does not remove it from your grocery list, and checking something off your grocery list does not add it to your pantry. They are separate steps. If an item matches an allergen you track, an Allergy Warning badge appears on its card. Related Scanning barcodes barcode scanning Scanning a shelf or fridge with your camera scanning a shelf Managing your inventory: editing, using up, and batches managing your inventory Expiry alerts and low stock reminders expiry and low stock "}, {"id": "barcode-scanning", "title": "Scanning barcodes", "category": "Pantry Inventory", "summary": "Use the Scan button to look up a packaged product by its barcode, or type the number in by hand, and see what happens when a product is not found.", "keywords": ["barcode", "scan", "camera", "enter barcode", "look up product", "nutrition", "product not found", "upc"], "html": "<p>Most packaged food carries a barcode. Scanning it saves typing and pulls in nutrition information you would otherwise have to look up yourself.<\/p>\n<h2 id=\"scanning-with-the-camera\">Scanning with the camera<\/h2>\n<ol>\n<li>Tap <strong>Scan<\/strong>.<\/li>\n<li>Your device asks for camera permission the first time. Allow it.<\/li>\n<li>You will see <strong>Starting camera...<\/strong> while the camera wakes up, then <strong>Reading barcode...<\/strong> once it is looking.<\/li>\n<li>Hold the barcode flat and steady in the frame, in good light, until it reads.<\/li>\n<li><strong>Looking up product...<\/strong> appears while Pantry Tab searches for the product.<\/li>\n<\/ol>\n<p>When the product is recognised you get <strong>Product found!<\/strong> and its details are filled in for you. If nutrition information exists for it you also get <strong>Nutrition info found!<\/strong>, and it appears in the item's <strong>Nutrition Facts<\/strong> panel.<\/p>\n<p>You can scan barcodes on the <strong>Grocery<\/strong> tab too — the toolbar there has its own <strong>Scan<\/strong> button for adding something to your shopping list.<\/p>\n<h2 id=\"typing-the-barcode-in-by-hand\">Typing the barcode in by hand<\/h2>\n<p>Cameras struggle with crumpled packets, frozen bags with frost on them, and very small or curved barcodes. When that happens, use <strong>Enter Barcode<\/strong>.<\/p>\n<ol>\n<li>Tap <strong>Enter Barcode<\/strong>.<\/li>\n<li>Type the number printed under the barcode. The hint on screen says \"Find the number below the barcode lines\".<\/li>\n<li>Tap <strong>Look Up Product<\/strong>.<\/li>\n<\/ol>\n<p>The lookup is exactly the same as a camera scan — only the way the number gets in is different.<\/p>\n<h2 id=\"when-a-product-is-not-found\">When a product is not found<\/h2>\n<p>Not every product is in the databases Pantry Tab searches. Store-brand goods, local products and anything very new are the usual misses.<\/p>\n<p>You will see <strong>Product not found<\/strong> with \"Please enter the details manually\". The barcode you scanned is kept, so you only need to fill in the name, quantity, unit and storage location yourself. Nothing is lost, and the item still saves normally.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>The camera does not start.<\/strong> Check that you gave the app camera permission in your browser or phone settings, then tap <strong>Scan<\/strong> again.<\/li>\n<li><strong>It sits on Reading barcode... and never reads.<\/strong> Move to better light, hold the pack still, and flatten any curve in the label. If it still will not read, use <strong>Enter Barcode<\/strong>.<\/li>\n<li><strong>Product not found<\/strong> with \"Please enter the details manually\" — the barcode is not in the databases. Type the details in; the barcode stays attached to the item.<\/li>\n<li><strong>Nutrition is missing after a successful scan.<\/strong> Not every product in the databases has nutrition data. The item's panel will show <strong>No nutrition info<\/strong> with \"Scan the product barcode or search by name to add nutritional data.\"<\/li>\n<li><strong>\"Rate limit reached. Please try again in a moment.\"<\/strong> — you have used a feature too quickly. Wait a moment and scan again.<\/li>\n<li><strong>\"Session expired. Please log in again.\"<\/strong> — sign back in and try the scan again.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Barcode and nutrition information comes from public product databases that anyone can contribute to — OpenFoodFacts, OpenBeautyFacts and UPCItemDB. That means an entry can be missing, incomplete, or slightly off. Treat the numbers as a good guide, not as a lab result, and read the label if it matters to you.<\/li>\n<li>Nutrition figures may not match the pack if the manufacturer has changed the recipe or the serving size since the database entry was written.<\/li>\n<li>A barcode lookup never sets an expiry date. Expiry dates are printed on the pack, not encoded in the barcode, so add yours by hand if you want expiry alerts. See <a href=\"#expiry-and-low-stock\">Expiry alerts and low-stock reminders<\/a>.<\/li>\n<li>A barcode scan adds one product at a time. To add a whole shelf or a whole shop in one go, see <a href=\"#scanning-a-shelf\">Scanning a shelf or fridge with your camera<\/a> and <a href=\"#scanning-a-receipt\">Scanning a grocery receipt<\/a>.<\/li>\n<li>An <strong>Allergy Warning<\/strong> badge can appear on the item card afterwards if the product matches an allergen your household tracks. It is based on keyword matching, so it can miss things — always read the actual label.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#adding-items-manually\">Adding items to your pantry<\/a><\/li>\n<li><a href=\"#scanning-a-shelf\">Scanning a shelf or fridge with your camera<\/a><\/li>\n<li><a href=\"#scanning-a-receipt\">Scanning a grocery receipt<\/a><\/li>\n<li><a href=\"#managing-your-inventory\">Managing your inventory: editing, using up, and batches<\/a><\/li>\n<\/ul>", "text": "Most packaged food carries a barcode. Scanning it saves typing and pulls in nutrition information you would otherwise have to look up yourself. Scanning with the camera 1. Tap Scan . 2. Your device asks for camera permission the first time. Allow it. 3. You will see Starting camera... while the camera wakes up, then Reading barcode... once it is looking. 4. Hold the barcode flat and steady in the frame, in good light, until it reads. 5. Looking up product... appears while Pantry Tab searches for the product. When the product is recognised you get Product found! and its details are filled in for you. If nutrition information exists for it you also get Nutrition info found! , and it appears in the item's Nutrition Facts panel. You can scan barcodes on the Grocery tab too — the toolbar there has its own Scan button for adding something to your shopping list. Typing the barcode in by hand Cameras struggle with crumpled packets, frozen bags with frost on them, and very small or curved barcodes. When that happens, use Enter Barcode . 1. Tap Enter Barcode . 2. Type the number printed under the barcode. The hint on screen says \"Find the number below the barcode lines\". 3. Tap Look Up Product . The lookup is exactly the same as a camera scan — only the way the number gets in is different. When a product is not found Not every product is in the databases Pantry Tab searches. Store brand goods, local products and anything very new are the usual misses. You will see Product not found with \"Please enter the details manually\". The barcode you scanned is kept, so you only need to fill in the name, quantity, unit and storage location yourself. Nothing is lost, and the item still saves normally. If something goes wrong The camera does not start. Check that you gave the app camera permission in your browser or phone settings, then tap Scan again. It sits on Reading barcode... and never reads. Move to better light, hold the pack still, and flatten any curve in the label. If it still will not read, use Enter Barcode . Product not found with \"Please enter the details manually\" — the barcode is not in the databases. Type the details in; the barcode stays attached to the item. Nutrition is missing after a successful scan. Not every product in the databases has nutrition data. The item's panel will show No nutrition info with \"Scan the product barcode or search by name to add nutritional data.\" \"Rate limit reached. Please try again in a moment.\" — you have used a feature too quickly. Wait a moment and scan again. \"Session expired. Please log in again.\" — sign back in and try the scan again. Good to know Barcode and nutrition information comes from public product databases that anyone can contribute to — OpenFoodFacts, OpenBeautyFacts and UPCItemDB. That means an entry can be missing, incomplete, or slightly off. Treat the numbers as a good guide, not as a lab result, and read the label if it matters to you. Nutrition figures may not match the pack if the manufacturer has changed the recipe or the serving size since the database entry was written. A barcode lookup never sets an expiry date. Expiry dates are printed on the pack, not encoded in the barcode, so add yours by hand if you want expiry alerts. See Expiry alerts and low stock reminders expiry and low stock . A barcode scan adds one product at a time. To add a whole shelf or a whole shop in one go, see Scanning a shelf or fridge with your camera scanning a shelf and Scanning a grocery receipt scanning a receipt . An Allergy Warning badge can appear on the item card afterwards if the product matches an allergen your household tracks. It is based on keyword matching, so it can miss things — always read the actual label. Related Adding items to your pantry adding items manually Scanning a shelf or fridge with your camera scanning a shelf Scanning a grocery receipt scanning a receipt Managing your inventory: editing, using up, and batches managing your inventory "}, {"id": "scanning-a-shelf", "title": "Scanning a shelf or fridge with your camera", "category": "Pantry Inventory", "summary": "Photograph a shelf, fridge or freezer and let Pantry Tab AI list what it sees, then check the results before anything is added to your inventory.", "keywords": ["scan shelf", "scan fridge", "photo", "camera", "confidence", "low confidence", "review", "add to inventory", "no food items detected"], "html": "<p>Shelf scanning is the fastest way to fill an empty pantry. You take one wide photo, the AI reads the labels it can see, and you get a checklist to correct before anything is saved. You can start it from <strong>Scan a shelf or receipt<\/strong> in the <strong>Pantry Tab AI<\/strong> panel on the Home dashboard.<\/p>\n<h2 id=\"the-four-steps\">The four steps<\/h2>\n<ol>\n<li><strong>Say where you are scanning.<\/strong> You are asked \"Where are you scanning? (optional, improves accuracy)\" with options including fridge top, fridge middle, fridge bottom, freezer, pantry, or none. It is optional, but worth answering: it tells the AI what kind of food to expect and which storage area to file things under, so the results come back more accurate and need less correcting.<\/li>\n<li><strong>Take the photo.<\/strong> On screen you will see the tip \"Tip: take a wide shot showing labels clearly. The AI works best with good lighting.\"<\/li>\n<li><strong>Send it to be read.<\/strong> Check the photo, then tap <strong>Re-take<\/strong> if it is blurry or <strong>Scan items →<\/strong> to go on. You will see \"Claude is reading your shelf — usually 5–10 seconds.\"<\/li>\n<li><strong>Review, then add.<\/strong> The review screen says \"Uncheck anything wrong, edit details inline, then add to your inventory. Low-confidence items are unchecked by default — please verify.\" Work through the list and add what is right.<\/li>\n<\/ol>\n<h2 id=\"taking-a-photo-that-reads-well\">Taking a photo that reads well<\/h2>\n<ul>\n<li>Take a wide shot of the whole shelf rather than a close-up of one item.<\/li>\n<li>Turn the light on. Open the fridge door fully so the interior light is not fighting a shadow.<\/li>\n<li>Turn labels to face out where you can. The AI reads packaging text.<\/li>\n<li>Do one shelf at a time. A single photo of five crammed shelves reads worse than five clear photos.<\/li>\n<\/ul>\n<h2 id=\"confidence-badges-read-these-before-you-add\">Confidence badges — read these before you add<\/h2>\n<p>Every detected item gets a confidence badge:<\/p>\n<ul>\n<li><strong>high<\/strong> (green) — the AI is confident it read the item correctly.<\/li>\n<li><strong>medium<\/strong> (amber) — probably right, worth a glance.<\/li>\n<li><strong>low<\/strong> (rose) — an uncertain read.<\/li>\n<\/ul>\n<p><strong>Low-confidence items are unchecked by default, and you must verify them yourself.<\/strong> That is deliberate: the app would rather leave something out than put a wrong item in your pantry. If a low-confidence row is correct, tick it. If it is wrong, fix it or leave it unticked.<\/p>\n<p>Nothing is added to your inventory until you confirm on this review screen. Closing the review without adding leaves your pantry untouched.<\/p>\n<h2 id=\"editing-in-the-review-list\">Editing in the review list<\/h2>\n<p>You can correct a row before adding it. Name, quantity, unit and storage location are all editable inline, so a can read as the wrong size or filed under the wrong storage area takes a second to fix — no need to re-take the photo.<\/p>\n<h2 id=\"what-the-scan-does-on-its-own\">What the scan does on its own<\/h2>\n<ul>\n<li>It collapses duplicates. Three apples on the shelf come back as one row with a quantity of 3.<\/li>\n<li>It skips empty containers, so an empty jar waiting to go out is not added.<\/li>\n<li>It does not invent items. If it cannot see something, it does not guess it into the list.<\/li>\n<li>It estimates expiry dates from typical shelf life. <strong>Those dates are estimates, not readings of the printed date on the pack.<\/strong> Check anything you plan to rely on for expiry alerts and correct it after adding.<\/li>\n<\/ul>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"No food items detected. Try a clearer shot or different angle.\"<\/strong> — the photo was too dark, too blurry, too far away or too close. Re-take it with more light and the labels facing the camera.<\/li>\n<li><strong>\"Image size exceeds 10MB limit\"<\/strong> — the photo must be under 10 MB. Take a new photo at a lower resolution, or pick a smaller image.<\/li>\n<li><strong>\"No image provided\"<\/strong> — no photo made it through. Take or choose the photo again.<\/li>\n<li><strong>\"Rate limited. Please try again.\"<\/strong> — you have run scans in quick succession. Wait a moment and try again.<\/li>\n<li><strong>\"Failed to analyze photo\"<\/strong> — the read did not complete. Try again; if it keeps failing, re-take the photo.<\/li>\n<li><strong>Half the shelf is missing from the results.<\/strong> Items hidden behind other items, turned label-in, or out of focus cannot be read. Scan again from a different angle, or add the stragglers by hand.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>The scan adds items to the location you are currently viewing. If your household has a second location, check the location selector in the header first.<\/li>\n<li>Every item it adds is a normal inventory item afterwards. You can edit it, set a real expiry date, or add a price at any time.<\/li>\n<li>Shelf scanning does not read barcodes or fill in nutrition information. For that, scan the product's barcode. See <a href=\"#barcode-scanning\">Scanning barcodes<\/a>.<\/li>\n<li>It reads what is visible in one photo. Anything at the back of a deep shelf will need a second photo or a manual entry.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#scanning-a-receipt\">Scanning a grocery receipt<\/a><\/li>\n<li><a href=\"#barcode-scanning\">Scanning barcodes<\/a><\/li>\n<li><a href=\"#adding-items-manually\">Adding items to your pantry<\/a><\/li>\n<li><a href=\"#managing-your-inventory\">Managing your inventory: editing, using up, and batches<\/a><\/li>\n<\/ul>", "text": "Shelf scanning is the fastest way to fill an empty pantry. You take one wide photo, the AI reads the labels it can see, and you get a checklist to correct before anything is saved. You can start it from Scan a shelf or receipt in the Pantry Tab AI panel on the Home dashboard. The four steps 1. Say where you are scanning. You are asked \"Where are you scanning? optional, improves accuracy \" with options including fridge top, fridge middle, fridge bottom, freezer, pantry, or none. It is optional, but worth answering: it tells the AI what kind of food to expect and which storage area to file things under, so the results come back more accurate and need less correcting. 2. Take the photo. On screen you will see the tip \"Tip: take a wide shot showing labels clearly. The AI works best with good lighting.\" 3. Send it to be read. Check the photo, then tap Re take if it is blurry or Scan items → to go on. You will see \"Claude is reading your shelf — usually 5–10 seconds.\" 4. Review, then add. The review screen says \"Uncheck anything wrong, edit details inline, then add to your inventory. Low confidence items are unchecked by default — please verify.\" Work through the list and add what is right. Taking a photo that reads well Take a wide shot of the whole shelf rather than a close up of one item. Turn the light on. Open the fridge door fully so the interior light is not fighting a shadow. Turn labels to face out where you can. The AI reads packaging text. Do one shelf at a time. A single photo of five crammed shelves reads worse than five clear photos. Confidence badges — read these before you add Every detected item gets a confidence badge: high green — the AI is confident it read the item correctly. medium amber — probably right, worth a glance. low rose — an uncertain read. Low confidence items are unchecked by default, and you must verify them yourself. That is deliberate: the app would rather leave something out than put a wrong item in your pantry. If a low confidence row is correct, tick it. If it is wrong, fix it or leave it unticked. Nothing is added to your inventory until you confirm on this review screen. Closing the review without adding leaves your pantry untouched. Editing in the review list You can correct a row before adding it. Name, quantity, unit and storage location are all editable inline, so a can read as the wrong size or filed under the wrong storage area takes a second to fix — no need to re take the photo. What the scan does on its own It collapses duplicates. Three apples on the shelf come back as one row with a quantity of 3. It skips empty containers, so an empty jar waiting to go out is not added. It does not invent items. If it cannot see something, it does not guess it into the list. It estimates expiry dates from typical shelf life. Those dates are estimates, not readings of the printed date on the pack. Check anything you plan to rely on for expiry alerts and correct it after adding. If something goes wrong \"No food items detected. Try a clearer shot or different angle.\" — the photo was too dark, too blurry, too far away or too close. Re take it with more light and the labels facing the camera. \"Image size exceeds 10MB limit\" — the photo must be under 10 MB. Take a new photo at a lower resolution, or pick a smaller image. \"No image provided\" — no photo made it through. Take or choose the photo again. \"Rate limited. Please try again.\" — you have run scans in quick succession. Wait a moment and try again. \"Failed to analyze photo\" — the read did not complete. Try again; if it keeps failing, re take the photo. Half the shelf is missing from the results. Items hidden behind other items, turned label in, or out of focus cannot be read. Scan again from a different angle, or add the stragglers by hand. Good to know The scan adds items to the location you are currently viewing. If your household has a second location, check the location selector in the header first. Every item it adds is a normal inventory item afterwards. You can edit it, set a real expiry date, or add a price at any time. Shelf scanning does not read barcodes or fill in nutrition information. For that, scan the product's barcode. See Scanning barcodes barcode scanning . It reads what is visible in one photo. Anything at the back of a deep shelf will need a second photo or a manual entry. Related Scanning a grocery receipt scanning a receipt Scanning barcodes barcode scanning Adding items to your pantry adding items manually Managing your inventory: editing, using up, and batches managing your inventory "}, {"id": "scanning-a-receipt", "title": "Scanning a grocery receipt", "category": "Pantry Inventory", "summary": "Photograph a grocery receipt to add the whole shop to your inventory with prices, review every line first, and feed your price history at the same time.", "keywords": ["receipt", "scan receipt", "take photo", "upload image", "add to inventory", "prices", "long receipt", "analyzing receipt", "10mb"], "html": "<p>Scanning a receipt is the quickest way to log a whole shop. The on-screen description says it best: \"Take a photo or upload an image of your receipt to automatically add items to your inventory with prices.\"<\/p>\n<h2 id=\"scanning-a-receipt\">Scanning a receipt<\/h2>\n<ol>\n<li>Tap <strong>Take Photo<\/strong> to use your camera, or <strong>Upload Image<\/strong> to pick a photo you already have.<\/li>\n<li>Wait while <strong>Analyzing receipt...<\/strong> is showing.<\/li>\n<li>Check the review screen that comes back.<\/li>\n<li>Tap <strong>Add to Inventory<\/strong> to save the items, or <strong>Scan Another<\/strong> to scan a second receipt or a second half of a long one.<\/li>\n<\/ol>\n<p>Nothing is saved until you confirm on the review step. If you close the review without adding, your inventory is unchanged.<\/p>\n<h2 id=\"what-it-reads\">What it reads<\/h2>\n<p>From the receipt as a whole it picks up the store name, the total, and the receipt date.<\/p>\n<p>For each line item it picks up:<\/p>\n<ul>\n<li>the item name<\/li>\n<li>the quantity and unit<\/li>\n<li>the price<\/li>\n<li>the barcode, if the receipt prints one<\/li>\n<li>a guess at which storage area it belongs in<\/li>\n<li>an estimated shelf life<\/li>\n<\/ul>\n<p>It also tidies up as it goes. Abbreviated till names are normalised into something readable — \"EGGS 12CT LRG\" becomes \"Eggs\" — and non-food lines such as bags and tax are skipped, so you do not have to unpick them yourself.<\/p>\n<h2 id=\"review-before-you-add\">Review before you add<\/h2>\n<p>The review step is the point of the feature. Read it properly:<\/p>\n<ul>\n<li>Check quantities on multi-buys and weighed goods, which receipts print inconsistently.<\/li>\n<li>Check the guessed storage area. A receipt does not say whether the chicken went in the fridge or the freezer.<\/li>\n<li>Treat estimated shelf life as an estimate. It is worked out from typical shelf life, not from the date printed on the pack.<\/li>\n<\/ul>\n<h2 id=\"photographing-a-long-receipt\">Photographing a long receipt<\/h2>\n<p>Long receipts are the most common cause of a failed scan. If the receipt is longer than about a forearm:<\/p>\n<ul>\n<li>Lay it flat on a plain surface rather than holding it up. Curl and shadow both hurt.<\/li>\n<li>Photograph it in two halves with a few overlapping lines, then use <strong>Scan Another<\/strong> for the second half.<\/li>\n<li>Fill the frame with the receipt and keep the camera square to it, not at an angle.<\/li>\n<li>Flatten the fold marks with your hand before you shoot.<\/li>\n<\/ul>\n<p>If you scan it in one go and it is too long, you will see <strong>\"This receipt is too long to read in one pass. Try photographing it in two halves.\"<\/strong><\/p>\n<h2 id=\"how-this-feeds-price-tracking\">How this feeds price tracking<\/h2>\n<p>Prices captured from a receipt are logged automatically, alongside prices you type into inventory items and prices you log by hand. That builds up your price history on the <strong>Prices<\/strong> tab without any extra work — the more receipts you scan, the more useful your store comparisons get. See <a href=\"#price-tracking\">Tracking and comparing prices<\/a>.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"This receipt is too long to read in one pass. Try photographing it in two halves.\"<\/strong> — split it. Photograph the top half, add it, then tap <strong>Scan Another<\/strong> and photograph the bottom half.<\/li>\n<li><strong>\"Image size exceeds 10MB limit\"<\/strong> — the image must be under 10 MB. Re-take it at a lower resolution.<\/li>\n<li><strong>\"Image too large (max 8MB).\"<\/strong> — some upload paths cap at 8 MB rather than 10 MB. Use a smaller image.<\/li>\n<li><strong>\"No image provided\"<\/strong> — no photo reached the scanner. Take or choose the photo again.<\/li>\n<li><strong>\"Rate limited. Please try again in a moment.\"<\/strong> — wait a moment, then scan again.<\/li>\n<li><strong>\"Failed to analyze receipt\"<\/strong> — the read did not complete. Try again, and if it keeps failing re-take the photo flat and in better light.<\/li>\n<li><strong>Items are missing from the results.<\/strong> Non-food lines are skipped on purpose. If real food is missing, the print was probably too faint or too blurred on that line — add those items by hand.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Faded thermal receipts are hard to read. If the print has gone grey, expect gaps, and check the review list closely.<\/li>\n<li>The scan does not know your storage habits. Its storage guesses are worth a look every time.<\/li>\n<li>Items are added to the location you are currently viewing, so check the location selector in the header first if your household has two locations.<\/li>\n<li>A receipt scan does not fill in nutrition information, even when the receipt prints a barcode. Scan the product barcode for that. See <a href=\"#barcode-scanning\">Scanning barcodes<\/a>.<\/li>\n<li>To stock up from what is already on your shelves rather than from a shop, use a shelf scan instead. See <a href=\"#scanning-a-shelf\">Scanning a shelf or fridge with your camera<\/a>.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#scanning-a-shelf\">Scanning a shelf or fridge with your camera<\/a><\/li>\n<li><a href=\"#barcode-scanning\">Scanning barcodes<\/a><\/li>\n<li><a href=\"#price-tracking\">Tracking and comparing prices<\/a><\/li>\n<li><a href=\"#managing-your-inventory\">Managing your inventory: editing, using up, and batches<\/a><\/li>\n<\/ul>", "text": "Scanning a receipt is the quickest way to log a whole shop. The on screen description says it best: \"Take a photo or upload an image of your receipt to automatically add items to your inventory with prices.\" Scanning a receipt 1. Tap Take Photo to use your camera, or Upload Image to pick a photo you already have. 2. Wait while Analyzing receipt... is showing. 3. Check the review screen that comes back. 4. Tap Add to Inventory to save the items, or Scan Another to scan a second receipt or a second half of a long one. Nothing is saved until you confirm on the review step. If you close the review without adding, your inventory is unchanged. What it reads From the receipt as a whole it picks up the store name, the total, and the receipt date. For each line item it picks up: the item name the quantity and unit the price the barcode, if the receipt prints one a guess at which storage area it belongs in an estimated shelf life It also tidies up as it goes. Abbreviated till names are normalised into something readable — \"EGGS 12CT LRG\" becomes \"Eggs\" — and non food lines such as bags and tax are skipped, so you do not have to unpick them yourself. Review before you add The review step is the point of the feature. Read it properly: Check quantities on multi buys and weighed goods, which receipts print inconsistently. Check the guessed storage area. A receipt does not say whether the chicken went in the fridge or the freezer. Treat estimated shelf life as an estimate. It is worked out from typical shelf life, not from the date printed on the pack. Photographing a long receipt Long receipts are the most common cause of a failed scan. If the receipt is longer than about a forearm: Lay it flat on a plain surface rather than holding it up. Curl and shadow both hurt. Photograph it in two halves with a few overlapping lines, then use Scan Another for the second half. Fill the frame with the receipt and keep the camera square to it, not at an angle. Flatten the fold marks with your hand before you shoot. If you scan it in one go and it is too long, you will see \"This receipt is too long to read in one pass. Try photographing it in two halves.\" How this feeds price tracking Prices captured from a receipt are logged automatically, alongside prices you type into inventory items and prices you log by hand. That builds up your price history on the Prices tab without any extra work — the more receipts you scan, the more useful your store comparisons get. See Tracking and comparing prices price tracking . If something goes wrong \"This receipt is too long to read in one pass. Try photographing it in two halves.\" — split it. Photograph the top half, add it, then tap Scan Another and photograph the bottom half. \"Image size exceeds 10MB limit\" — the image must be under 10 MB. Re take it at a lower resolution. \"Image too large max 8MB .\" — some upload paths cap at 8 MB rather than 10 MB. Use a smaller image. \"No image provided\" — no photo reached the scanner. Take or choose the photo again. \"Rate limited. Please try again in a moment.\" — wait a moment, then scan again. \"Failed to analyze receipt\" — the read did not complete. Try again, and if it keeps failing re take the photo flat and in better light. Items are missing from the results. Non food lines are skipped on purpose. If real food is missing, the print was probably too faint or too blurred on that line — add those items by hand. Good to know Faded thermal receipts are hard to read. If the print has gone grey, expect gaps, and check the review list closely. The scan does not know your storage habits. Its storage guesses are worth a look every time. Items are added to the location you are currently viewing, so check the location selector in the header first if your household has two locations. A receipt scan does not fill in nutrition information, even when the receipt prints a barcode. Scan the product barcode for that. See Scanning barcode
