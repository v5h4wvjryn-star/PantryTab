<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantry Tab Help Center</title>
<meta name="description" content="Guides and answers for every part of Pantry Tab — inventory, scanning, grocery lists, recipes, meal planning, allergies, prices and billing.">
<meta name="theme-color" content="#2f6d4f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6d4f'/%3E%3Cpath d='M9 8h14v4H9zM9 13v11h14V13' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M13 17h6' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbfaf7; --surface:#ffffff; --surface-2:#f4f2ed; --border:#e4e0d7;
  --text:#1e2321; --text-2:#5c635e; --text-3:#868d87;
  --brand:#2f6d4f; --brand-ink:#235240; --brand-soft:#e8f2ea; --brand-line:#bcd9c6;
  --accent:#a8571b; --accent-soft:#fbeee1;
  --warn-bg:#fdf4e7; --warn-line:#e8c68f; --warn-ink:#7a4c11;
  --shadow:0 1px 2px rgba(30,35,33,.05),0 6px 20px -12px rgba(30,35,33,.22);
  --radius:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#14171a; --surface:#1b1f22; --surface-2:#22272b; --border:#31383d;
  --text:#e8ebe9; --text-2:#a3aca7; --text-3:#7d857f;
  --brand:#6fbf90; --brand-ink:#9fd8b4; --brand-soft:#1d2f26; --brand-line:#2f4c3b;
  --accent:#e0a06a; --accent-soft:#2e241b;
  --warn-bg:#2b2318; --warn-line:#5c4526; --warn-ink:#e3bd82;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;width:100%}
a{color:var(--brand-ink);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:var(--surface);
  border-bottom:1px solid var(--border)}
.hbar{display:flex;align-items:center;gap:16px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.015em;
  font-size:16.5px;color:var(--text);flex:none}
.logo:hover{text-decoration:none}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--brand);
  display:grid;place-items:center;flex:none}
.logo .mark svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.logo .sub{color:var(--text-3);font-weight:450}
.grow{flex:1}
.iconbtn{background:none;border:1px solid var(--border);border-radius:9px;
  width:36px;height:36px;display:grid;place-items:center;color:var(--text-2);flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
#menuBtn{display:none}

/* ---------- search ---------- */
.searchwrap{position:relative;flex:1 1 0;min-width:0;max-width:460px}
.searchbox{display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px;padding:0 11px;height:38px;
  transition:border-color .12s,box-shadow .12s}
.searchbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.searchbox svg{width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:2;flex:none}
.searchbox input{flex:1;background:none;border:0;outline:0;font:inherit;font-size:14.5px;
  color:var(--text);min-width:0}
.searchbox input::placeholder{color:var(--text-3)}
kbd{font:inherit;font-size:11px;background:var(--surface);border:1px solid var(--border);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--text-3);flex:none}
.results{position:absolute;top:calc(100% + 7px);left:0;right:0;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
  max-height:min(66vh,520px);overflow-y:auto;padding:5px;display:none}
.results.on{display:block}
.res{display:block;padding:9px 11px;border-radius:8px;color:var(--text)}
.res:hover,.res.sel{background:var(--brand-soft);text-decoration:none}
.res .rt{font-weight:600;font-size:14.5px;line-height:1.35}
.res .rc{font-size:11.5px;color:var(--brand-ink);font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:2px}
.res .rs{font-size:13px;color:var(--text-2);line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 1px}
.nores{padding:22px 14px;text-align:center;color:var(--text-2);font-size:14px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:262px minmax(0,1fr);gap:44px;
  align-items:start;padding:34px 0 90px}
.home .layout{grid-template-columns:minmax(0,1fr)}
nav.side{position:sticky;top:86px;max-height:calc(100vh - 110px);overflow-y:auto;
  padding-right:6px;font-size:14.5px}
.home nav.side{display:none}
.side h4{margin:20px 0 7px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3);font-weight:700;display:flex;align-items:center;gap:7px}
.side h4:first-child{margin-top:0}
.side h4 svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.side a{display:block;padding:5px 11px;margin-left:-11px;border-radius:8px;
  color:var(--text-2);line-height:1.4}
.side a:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.side a.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}

/* ---------- home ---------- */
.hero{padding:46px 0 34px;text-align:center;max-width:660px;margin:0 auto}
.hero h1{font-size:clamp(28px,4.6vw,40px);line-height:1.15;letter-spacing:-.028em;
  margin:0 0 12px;font-weight:700}
.hero p{font-size:17px;color:var(--text-2);margin:0 0 24px;line-height:1.6}
.hero .searchwrap{max-width:520px;margin:0 auto}
.hero .searchbox{height:48px;font-size:16px;background:var(--surface)}
.hero .searchbox input{font-size:16px}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.pill{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--surface);
  border:1px solid var(--border);color:var(--text-2)}
.pill:hover{border-color:var(--brand-line);color:var(--brand-ink);text-decoration:none;
  background:var(--brand-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:19px 20px 15px}
.card h3{margin:0 0 3px;font-size:16px;letter-spacing:-.012em;display:flex;
  align-items:center;gap:9px;font-weight:650}
.card h3 svg{width:17px;height:17px;stroke:var(--brand);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.card .cnt{font-size:12.5px;color:var(--text-3);margin:0 0 11px;padding-left:26px}
.card ul{list-style:none;margin:0;padding:0}
.card li a{display:block;padding:4px 0;font-size:14.5px;color:var(--text-2);line-height:1.45}
.card li a:hover{color:var(--brand-ink)}
.card li a::before{content:"›";color:var(--text-3);margin-right:8px;font-weight:600}

/* ---------- article ---------- */
article{max-width:760px;min-width:0}
.crumb{font-size:13px;color:var(--text-3);margin-bottom:9px;display:flex;
  align-items:center;gap:7px;flex-wrap:wrap}
.crumb a{color:var(--text-3)}
.crumb a:hover{color:var(--brand-ink)}
article h1{font-size:clamp(25px,3.6vw,33px);line-height:1.2;letter-spacing:-.025em;
  margin:0 0 10px;font-weight:700}
.lede{font-size:17px;color:var(--text-2);line-height:1.6;margin:0 0 26px;
  padding-bottom:22px;border-bottom:1px solid var(--border)}
.body h2{font-size:20px;letter-spacing:-.015em;margin:36px 0 10px;font-weight:650;
  scroll-margin-top:86px}
.body h3{font-size:16.5px;margin:26px 0 7px;font-weight:650;scroll-margin-top:86px}
.body p{margin:0 0 14px}
.body ul,.body ol{margin:0 0 16px;padding-left:23px}
.body li{margin:5px 0}
.body li>ul,.body li>ol{margin:5px 0}
.body strong{font-weight:640;color:var(--text)}
.body code{background:var(--surface-2);border:1px solid var(--border);border-radius:5px;
  padding:1px 5px;font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.body blockquote{margin:0 0 16px;padding:13px 17px;background:var(--warn-bg);
  border-left:3px solid var(--warn-line);border-radius:0 10px 10px 0;color:var(--warn-ink)}
.body blockquote p:last-child{margin:0}
.body table{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:14.5px;display:block;
  overflow-x:auto}
.body th,.body td{border:1px solid var(--border);padding:8px 11px;text-align:left;
  vertical-align:top}
.body th{background:var(--surface-2);font-weight:640}
.body hr{border:0;border-top:1px solid var(--border);margin:30px 0}
.body h2#related,.body h2#if-something-goes-wrong,.body h2#good-to-know{}
.body h2 + ul{margin-top:6px}

.foot{margin-top:44px;padding-top:22px;border-top:1px solid var(--border)}
.nextprev{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.np{display:block;padding:13px 15px;border:1px solid var(--border);border-radius:11px;
  background:var(--surface);color:var(--text)}
.np:hover{border-color:var(--brand-line);background:var(--brand-soft);text-decoration:none}
.np span{display:block;font-size:11.5px;color:var(--text-3);text-transform:uppercase;
  letter-spacing:.06em;font-weight:650;margin-bottom:2px}
.np.n{text-align:right}
.np em{font-style:normal;font-weight:600;font-size:14.5px;line-height:1.35;display:block}

footer{border-top:1px solid var(--border);background:var(--surface);
  padding:26px 0 40px;font-size:13.5px;color:var(--text-3)}
footer .wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:0;padding-top:24px}
  #menuBtn{display:grid}
  nav.side{position:fixed;top:62px;bottom:0;right:0;width:min(320px,86vw);
    background:var(--surface);border-left:1px solid var(--border);
    padding:20px 20px 60px;max-height:none;transform:translateX(101%);
    visibility:hidden;transition:transform .2s ease,visibility .2s;
    z-index:45;overflow-y:auto;overscroll-behavior:contain}
  nav.side.open{transform:none;visibility:visible;box-shadow:var(--shadow)}
  .home nav.side{display:block}
  .logo .sub{display:none}
  .hbar{gap:10px}
  .hbar .grow{display:none}
  .hbar .searchwrap{max-width:none}
  kbd{display:none}
  .nextprev{grid-template-columns:1fr}
  .np.n{text-align:left}
}
@media (max-width:560px){
  .wrap{padding:0 15px}
  .logo span:last-child{position:absolute;left:-9999px}
  .searchbox{padding:0 9px}
  .hero{padding:30px 0 24px}
  .grid{grid-template-columns:1fr}
}
@media print{
  header,nav.side,.foot,footer,.crumb{display:none}
  .layout{display:block;padding:0}
  body{background:#fff}
}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:9px;background:var(--surface);padding:8px 14px;
  border-radius:8px;z-index:99;border:1px solid var(--brand)}
</style>
</head>

<header>

<script>
const DATA = {"articles": [{"id": "welcome-to-pantry-tab", "title": "Welcome to Pantry Tab", "category": "Getting Started", "summary": "What Pantry Tab is, what it does for your kitchen, and where to find each feature in the help center.", "keywords": ["pantry tab", "what is pantry tab", "overview", "getting started", "features", "household", "pantrytab.com", "free trial"], "html": "<p>Pantry Tab keeps track of the food in your kitchen and uses it to plan what you cook and what you buy. It is a web app at pantrytab.com, and it installs to your phone's home screen so you can use it while you are standing in front of the fridge.<\/p>\n<h2 id=\"what-pantry-tab-does\">What Pantry Tab does<\/h2>\n<p><strong>Knows what food you have.<\/strong> Your pantry, fridge and freezer live in one place, split across <strong>🧊 Freezer<\/strong>, <strong>🥶 Fridge<\/strong> and <strong>📦 Pantry<\/strong>. Add items by hand, or let the camera do it — see <a href=\"#adding-items-manually\">Adding items to your pantry<\/a>, <a href=\"#barcode-scanning\">Scanning barcodes<\/a>, <a href=\"#scanning-a-shelf\">Scanning a shelf or fridge with your camera<\/a> and <a href=\"#scanning-a-receipt\">Scanning a grocery receipt<\/a>.<\/p>\n<p><strong>Warns you before food goes off.<\/strong> The <strong>Needs your attention<\/strong> card on your <strong>Home<\/strong> dashboard gathers what has expired, what is close, and anything that has dropped to your low-stock level. See <a href=\"#expiry-and-low-stock\">Expiry alerts and low-stock reminders<\/a>.<\/p>\n<p><strong>Builds your grocery list.<\/strong> Add items yourself, or have the AI look at your pantry gaps and your meal plan and propose a list. See <a href=\"#using-the-grocery-list\">Building and using your grocery list<\/a> and <a href=\"#ai-grocery-list\">Building your grocery list with AI<\/a>.<\/p>\n<p><strong>Holds your recipes.<\/strong> Type a recipe in, or import one from a cookbook photo, a document, or a link. Then ask <strong>What Can I Make?<\/strong> to rank your own recipes against what is in the pantry right now. See <a href=\"#importing-recipes\">Importing recipes from a photo, file, or link<\/a> and <a href=\"#what-can-i-make\">What Can I Make? Recipe ideas from your pantry<\/a>.<\/p>\n<p><strong>Plans your week.<\/strong> Put recipes on a calendar by day and meal type, or let the AI plan five to seven dinners around what is about to expire. Tag the meals you want to cook ahead and Pantry Tab builds a prep sheet with a task list, a cook timeline and reheating notes. See <a href=\"#meal-planner-basics\">Using the meal planner<\/a>, <a href=\"#ai-week-planner\">Planning a week of dinners with AI<\/a> and <a href=\"#prep-sheets\">Meal prep cook sheets<\/a>.<\/p>\n<p><strong>Watches for allergens.<\/strong> Record each person's allergies and Pantry Tab flags matching ingredients on inventory cards, grocery rows, meal cards and recipes. See <a href=\"#allergies-setup\">Setting up allergies for your household<\/a> and, importantly, <a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a>.<\/p>\n<p><strong>Tracks what things cost.<\/strong> Log prices per store and compare them, or look up what other people have reported paying. See <a href=\"#price-tracking\">Tracking and comparing prices<\/a> and <a href=\"#crowdsourced-prices\">Crowdsourced prices<\/a>.<\/p>\n<p><strong>Sends your list to Kroger.<\/strong> Connect a Kroger account and push your unchecked grocery items into a Kroger pickup cart. See <a href=\"#kroger-connect\">Connecting your Kroger account<\/a> and <a href=\"#kroger-send-to-cart\">Sending your list to a Kroger pickup cart<\/a>.<\/p>\n<p><strong>Has a community.<\/strong> Browse and save recipes other people have published, publish your own, rate and review, and talk shop in the forum. See <a href=\"#browse-marketplace\">Browsing and saving community recipes<\/a> and <a href=\"#kitchen-talk\">Kitchen Talk: the community forum<\/a>.<\/p>\n<p>The AI features are powered by Claude. Recipe discovery also draws on Spoonacular, and barcode lookups use public product databases.<\/p>\n<h2 id=\"everything-is-shared-with-your-household\">Everything is shared with your household<\/h2>\n<p>Pantry Tab is built around a household, not a single person. When you sign up, a household is created for you and you are its <strong>Owner<\/strong>. Everyone you invite sees and can edit the same inventory, grocery list, recipes, meal plan, people profiles, allergies, stores and locations. There is no per-member privacy inside a household.<\/p>\n<p>A few things stay private to you: your own profile, the marketplace recipes you save, your Kroger connection, and your billing.<\/p>\n<p>See <a href=\"#households-and-sharing\">Households: sharing your kitchen<\/a>.<\/p>\n<h2 id=\"getting-started\">Getting started<\/h2>\n<ol>\n<li>Create an account with email and a password, or with Google, Apple or Facebook. Your 14-day free trial starts then, and no credit card is required to start.<\/li>\n<li>Install Pantry Tab to your phone's home screen so the camera scanning tools are one tap away.<\/li>\n<li>Add the people who eat in your home and record their allergies.<\/li>\n<li>Fill your pantry from the <strong>Scan a shelf or receipt<\/strong> card in the <strong>Pantry Tab AI<\/strong> panel on <strong>Home<\/strong> — photographing a shelf or a receipt is much faster than typing.<\/li>\n<\/ol>\n<p><a href=\"#your-first-week\">Your first week: a setup checklist<\/a> walks through this in order.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>The app looks out of date, or a feature you read about is missing.<\/strong> The installed app can keep showing an older cached version. See <a href=\"#app-not-updating\">The app looks out of date<\/a>.<\/li>\n<li><strong>A household member's change isn't showing.<\/strong> There is no live sync between devices. Refresh the page.<\/li>\n<li><strong>\"Session expired. Please log in again.\"<\/strong> Sign in again.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Alerts are in-app only. Pantry Tab does not send push notifications or emails.<\/li>\n<li>The Kroger integration is pickup only, and Kroger is the only store Pantry Tab connects to.<\/li>\n<li>After the 14-day trial, Pantry Tab is <strong>$4.99 /month<\/strong> or <strong>$52.99 /year<\/strong>. See <a href=\"#plans-and-pricing\">Plans, the free trial, and pricing<\/a>.<\/li>\n<li>The app's own <strong>Help &amp; How To<\/strong> page is older than the app and describes a few things that have since changed. This help center is the current one.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#create-your-account\">Creating your account and signing in<\/a><\/li>\n<li><a href=\"#tour-of-the-app\">A tour of the app<\/a><\/li>\n<li><a href=\"#your-first-week\">Your first week: a setup checklist<\/a><\/li>\n<li><a href=\"#install-on-your-phone\">Installing Pantry Tab on your phone<\/a><\/li>\n<\/ul>", "text": "Pantry Tab keeps track of the food in your kitchen and uses it to plan what you cook and what you buy. It is a web app at pantrytab.com, and it installs to your phone's home screen so you can use it while you are standing in front of the fridge. What Pantry Tab does Knows what food you have. Your pantry, fridge and freezer live in one place, split across 🧊 Freezer , 🥶 Fridge and 📦 Pantry . Add items by hand, or let the camera do it — see Adding items to your pantry adding items manually , Scanning barcodes barcode scanning , Scanning a shelf or fridge with your camera scanning a shelf and Scanning a grocery receipt scanning a receipt . Warns you before food goes off. The Needs your attention card on your Home dashboard gathers what has expired, what is close, and anything that has dropped to your low stock level. See Expiry alerts and low stock reminders expiry and low stock . Builds your grocery list. Add items yourself, or have the AI look at your pantry gaps and your meal plan and propose a list. See Building and using your grocery list using the grocery list and Building your grocery list with AI ai grocery list . Holds your recipes. Type a recipe in, or import one from a cookbook photo, a document, or a link. Then ask What Can I Make? to rank your own recipes against what is in the pantry right now. See Importing recipes from a photo, file, or link importing recipes and What Can I Make? Recipe ideas from your pantry what can i make . Plans your week. Put recipes on a calendar by day and meal type, or let the AI plan five to seven dinners around what is about to expire. Tag the meals you want to cook ahead and Pantry Tab builds a prep sheet with a task list, a cook timeline and reheating notes. See Using the meal planner meal planner basics , Planning a week of dinners with AI ai week planner and Meal prep cook sheets prep sheets . Watches for allergens. Record each person's allergies and Pantry Tab flags matching ingredients on inventory cards, grocery rows, meal cards and recipes. See Setting up allergies for your household allergies setup and, importantly, How allergy warnings work, and their limits how allergy warnings work . Tracks what things cost. Log prices per store and compare them, or look up what other people have reported paying. See Tracking and comparing prices price tracking and Crowdsourced prices crowdsourced prices . Sends your list to Kroger. Connect a Kroger account and push your unchecked grocery items into a Kroger pickup cart. See Connecting your Kroger account kroger connect and Sending your list to a Kroger pickup cart kroger send to cart . Has a community. Browse and save recipes other people have published, publish your own, rate and review, and talk shop in the forum. See Browsing and saving community recipes browse marketplace and Kitchen Talk: the community forum kitchen talk . The AI features are powered by Claude. Recipe discovery also draws on Spoonacular, and barcode lookups use public product databases. Everything is shared with your household Pantry Tab is built around a household, not a single person. When you sign up, a household is created for you and you are its Owner . Everyone you invite sees and can edit the same inventory, grocery list, recipes, meal plan, people profiles, allergies, stores and locations. There is no per member privacy inside a household. A few things stay private to you: your own profile, the marketplace recipes you save, your Kroger connection, and your billing. See Households: sharing your kitchen households and sharing . Getting started 1. Create an account with email and a password, or with Google, Apple or Facebook. Your 14 day free trial starts then, and no credit card is required to start. 2. Install Pantry Tab to your phone's home screen so the camera scanning tools are one tap away. 3. Add the people who eat in your home and record their allergies. 4. Fill your pantry from the Scan a shelf or receipt card in the Pantry Tab AI panel on Home — photographing a shelf or a receipt is much faster than typing. Your first week: a setup checklist your first week walks through this in order. If something goes wrong The app looks out of date, or a feature you read about is missing. The installed app can keep showing an older cached version. See The app looks out of date app not updating . A household member's change isn't showing. There is no live sync between devices. Refresh the page. \"Session expired. Please log in again.\" Sign in again. Good to know Alerts are in app only. Pantry Tab does not send push notifications or emails. The Kroger integration is pickup only, and Kroger is the only store Pantry Tab connects to. After the 14 day trial, Pantry Tab is $4.99 /month or $52.99 /year . See Plans, the free trial, and pricing plans and pricing . The app's own Help & How To page is older than the app and describes a few things that have since changed. This help center is the current one. Related Creating your account and signing in create your account A tour of the app tour of the app Your first week: a setup checklist your first week Installing Pantry Tab on your phone install on your phone "}, {"id": "create-your-account", "title": "Creating your account and signing in", "category": "Getting Started", "summary": "How to sign up with email or Google, Apple or Facebook, verify your email, reset a password, and sign out.", "keywords": ["sign up", "sign in", "log in", "create account", "password reset", "forgot password", "verify email", "sign out", "free trial"], "html": "<p>You need an account to use Pantry Tab. Signing up takes a minute and starts your 14-day free trial. No credit card is required to start.<\/p>\n<h2 id=\"create-an-account\">Create an account<\/h2>\n<ol>\n<li>Go to pantrytab.com and open the <strong>Create an account<\/strong> page.<\/li>\n<li>Enter your name, your email address and a password. Or choose Google, Apple or Facebook and sign in with that account instead.<\/li>\n<li>If you signed up with email, Pantry Tab sends you a verification message and shows the <strong>Check your email<\/strong> page. Open the email and follow the link.<\/li>\n<li>You land in the app on the <strong>Home<\/strong> tab.<\/li>\n<\/ol>\n<p>If you sign up with Google, Apple or Facebook, use that same button every time you come back. Pantry Tab treats each sign-in method as its own route into your account.<\/p>\n<h2 id=\"what-gets-created-for-you\">What gets created for you<\/h2>\n<p>You do not have to set up a household from scratch. On your first sign-up, Pantry Tab creates:<\/p>\n<ul>\n<li>A household named <strong>{Your Name}'s Household<\/strong><\/li>\n<li>You, as its <strong>Owner<\/strong>, with status Active<\/li>\n<li>One person profile called <strong>Self<\/strong><\/li>\n<li>One location called <strong>Home<\/strong>, marked Primary<\/li>\n<\/ul>\n<p>You can rename the household, add more people, and add one more location later. Only the Owner can do those things — see <a href=\"#households-and-sharing\">Households: sharing your kitchen<\/a> and <a href=\"#multiple-locations\">Tracking a second location<\/a>.<\/p>\n<p>If you were invited to somebody else's household, create your account first, then open the invitation link. See <a href=\"#inviting-and-managing-members\">Inviting and managing household members<\/a>.<\/p>\n<h2 id=\"signing-in\">Signing in<\/h2>\n<ol>\n<li>Go to pantrytab.com. The sign-in page is headed <strong>Welcome back<\/strong>.<\/li>\n<li>Enter your email and password, or use the Google, Apple or Facebook button you signed up with.<\/li>\n<\/ol>\n<p>Staying signed in is normal. You should only need to do this again if you sign out, clear your browser data, or your session expires.<\/p>\n<h2 id=\"if-you-forget-your-password\">If you forget your password<\/h2>\n<ol>\n<li>On the sign-in page, choose <strong>Forgot password<\/strong>.<\/li>\n<li>Enter the email address on your account on the <strong>Reset your password<\/strong> page.<\/li>\n<li>Open the email Pantry Tab sends you and follow the link.<\/li>\n<li>On the <strong>Set new password<\/strong> page, type your new password and save it. Then sign in with it.<\/li>\n<\/ol>\n<p>If you originally signed up with Google, Apple or Facebook, you do not have a Pantry Tab password to reset — sign in with that button instead.<\/p>\n<h2 id=\"signing-out\">Signing out<\/h2>\n<p>Open the avatar menu in the top right. It shows your name, your email, your plan badge (<strong>Premium<\/strong> or <strong>Free<\/strong>) and your role badge (<strong>Owner<\/strong>), then <strong>Profile<\/strong>, <strong>Household<\/strong>, <strong>People<\/strong>, <strong>Billing<\/strong> and <strong>Sign out<\/strong>. Choose <strong>Sign out<\/strong>.<\/p>\n<p>On a shared computer, sign out when you are done. Anyone signed in to your account can see and edit your whole household's kitchen.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"Session expired. Please log in again.\"<\/strong> Your sign-in has timed out. Sign in again and carry on.<\/li>\n<li><strong>The verification email hasn't arrived.<\/strong> Check your spam folder, and check the address you typed. You can start the sign-up again with the correct address.<\/li>\n<li><strong>The reset link doesn't work.<\/strong> Request a new one from <strong>Forgot password<\/strong>. Reset links are meant to be used once, soon after you ask for them.<\/li>\n<li><strong>You signed in but the app looks stale or half-loaded.<\/strong> Refresh the page. If it persists, see <a href=\"#app-not-updating\">The app looks out of date<\/a>.<\/li>\n<li><strong>You paid but Pantry Tab still shows Free.<\/strong> Your subscription is matched by email address. If you paid with a different email than the one you sign in with, it will not match. Use the same email, or contact support. See <a href=\"#managing-your-subscription\">Managing your subscription and billing<\/a>.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Your 14-day free trial starts when you create your account, not when you first use a feature. The banner shows <strong>You have N days left in your free trial.<\/strong><\/li>\n<li>You belong to exactly one household at a time. Accepting an invitation to another household moves you out of your current one.<\/li>\n<li>An Owner cannot remove themselves from a household.<\/li>\n<li>Your profile, your saved marketplace recipes, your Kroger connection and your billing are private to you. Everything else in the household is shared.<\/li>\n<li>The terms, privacy and disclaimer pages are currently placeholders, and the consent links on the sign-up page may not open.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#welcome-to-pantry-tab\">Welcome to Pantry Tab<\/a><\/li>\n<li><a href=\"#your-first-week\">Your first week: a setup checklist<\/a><\/li>\n<li><a href=\"#households-and-sharing\">Households: sharing your kitchen<\/a><\/li>\n<li><a href=\"#plans-and-pricing\">Plans, the free trial, and pricing<\/a><\/li>\n<\/ul>", "text": "You need an account to use Pantry Tab. Signing up takes a minute and starts your 14 day free trial. No credit card is required to start. Create an account 1. Go to pantrytab.com and open the Create an account page. 2. Enter your name, your email address and a password. Or choose Google, Apple or Facebook and sign in with that account instead. 3. If you signed up with email, Pantry Tab sends you a verification message and shows the Check your email page. Open the email and follow the link. 4. You land in the app on the Home tab. If you sign up with Google, Apple or Facebook, use that same button every time you come back. Pantry Tab treats each sign in method as its own route into your account. What gets created for you You do not have to set up a household from scratch. On your first sign up, Pantry Tab creates: A household named {Your Name}'s Household You, as its Owner , with status Active One person profile called Self One location called Home , marked Primary You can rename the household, add more people, and add one more location later. Only the Owner can do those things — see Households: sharing your kitchen households and sharing and Tracking a second location multiple locations . If you were invited to somebody else's household, create your account first, then open the invitation link. See Inviting and managing household members inviting and managing members . Signing in 1. Go to pantrytab.com. The sign in page is headed Welcome back . 2. Enter your email and password, or use the Google, Apple or Facebook button you signed up with. Staying signed in is normal. You should only need to do this again if you sign out, clear your browser data, or your session expires. If you forget your password 1. On the sign in page, choose Forgot password . 2. Enter the email address on your account on the Reset your password page. 3. Open the email Pantry Tab sends you and follow the link. 4. On the Set new password page, type your new password and save it. Then sign in with it. If you originally signed up with Google, Apple or Facebook, you do not have a Pantry Tab password to reset — sign in with that button instead. Signing out Open the avatar menu in the top right. It shows your name, your email, your plan badge Premium or Free and your role badge Owner , then Profile , Household , People , Billing and Sign out . Choose Sign out . On a shared computer, sign out when you are done. Anyone signed in to your account can see and edit your whole household's kitchen. If something goes wrong \"Session expired. Please log in again.\" Your sign in has timed out. Sign in again and carry on. The verification email hasn't arrived. Check your spam folder, and check the address you typed. You can start the sign up again with the correct address. The reset link doesn't work. Request a new one from Forgot password . Reset links are meant to be used once, soon after you ask for them. You signed in but the app looks stale or half loaded. Refresh the page. If it persists, see The app looks out of date app not updating . You paid but Pantry Tab still shows Free. Your subscription is matched by email address. If you paid with a different email than the one you sign in with, it will not match. Use the same email, or contact support. See Managing your subscription and billing managing your subscription . Good to know Your 14 day free trial starts when you create your account, not when you first use a feature. The banner shows You have N days left in your free trial. You belong to exactly one household at a time. Accepting an invitation to another household moves you out of your current one. An Owner cannot remove themselves from a household. Your profile, your saved marketplace recipes, your Kroger connection and your billing are private to you. Everything else in the household is shared. The terms, privacy and disclaimer pages are currently placeholders, and the consent links on the sign up page may not open. Related Welcome to Pantry Tab welcome to pantry tab Your first week: a setup checklist your first week Households: sharing your kitchen households and sharing Plans, the free trial, and pricing plans and pricing "}, {"id": "install-on-your-phone", "title": "Installing Pantry Tab on your phone", "category": "Getting Started", "summary": "How to add Pantry Tab to your home screen on iPhone and Android, why it helps, and how to force the installed app to update.", "keywords": ["install", "add to home screen", "iphone", "safari", "android", "chrome", "app icon", "pwa", "update", "cache", "camera"], "html": "<p>Pantry Tab is a web app, so there is nothing to download from an app store. You add pantrytab.com to your phone's home screen and it opens like any other app, with its own icon and no browser bars.<\/p>\n<h2 id=\"why-install-it\">Why install it<\/h2>\n<ul>\n<li><strong>Scanning happens in the kitchen.<\/strong> Barcode scanning, shelf scanning and receipt scanning all use your phone camera. Having an icon on the home screen means you can scan a shelf while you are standing in front of it, instead of hunting for a browser tab.<\/li>\n<li><strong>Faster access.<\/strong> One tap, already signed in, straight to the <strong>Home<\/strong> tab.<\/li>\n<li><strong>Fewer mistaps.<\/strong> The installed app runs full screen, so you are not fighting the address bar while checking off a grocery list in a store.<\/li>\n<\/ul>\n<p>Nothing is lost by not installing — the app works the same in a normal browser tab.<\/p>\n<h2 id=\"the-install-banner\">The install banner<\/h2>\n<p>When Pantry Tab can install itself, it shows a banner: <strong>Install Pantry Tab<\/strong> — \"Get faster access from your home screen!\" with an <strong>Add to Home Screen<\/strong> button. Tap <strong>Add to Home Screen<\/strong> and follow your phone's prompt.<\/p>\n<p>If you do not see the banner, or you dismissed it, use the manual steps below.<\/p>\n<h2 id=\"on-an-iphone-or-ipad\">On an iPhone or iPad<\/h2>\n<ol>\n<li>Open pantrytab.com in <strong>Safari<\/strong>. Use Safari on iPhone — that is the route Pantry Tab documents, and the one that works reliably.<\/li>\n<li>Tap the Share button in the browser toolbar.<\/li>\n<li>Scroll down the share sheet and tap <strong>Add to Home Screen<\/strong>.<\/li>\n<li>Adjust the name if you want, then confirm.<\/li>\n<li>Close Safari and open Pantry Tab from the new home screen icon. Sign in once inside the installed app.<\/li>\n<\/ol>\n<h2 id=\"on-android\">On Android<\/h2>\n<ol>\n<li>Open pantrytab.com in <strong>Chrome<\/strong>.<\/li>\n<li>Tap the browser menu.<\/li>\n<li>Tap <strong>Install app<\/strong>, or <strong>Add to Home screen<\/strong> if that is what your version shows.<\/li>\n<li>Confirm, then open Pantry Tab from the new icon.<\/li>\n<\/ol>\n<p>The in-app <strong>Help &amp; How To<\/strong> page also carries step-by-step instructions for both phones.<\/p>\n<h2 id=\"when-the-installed-app-looks-out-of-date\">When the installed app looks out of date<\/h2>\n<p>The installed app keeps a copy of Pantry Tab on your phone so it opens quickly. That copy can be an older version, which is why a feature you have read about sometimes seems to be missing.<\/p>\n<p>To force it to pick up the current version:<\/p>\n<ol>\n<li>Do a hard refresh of the page.<\/li>\n<li>If that does not work, open pantrytab.com in a private or incognito browser window and check whether the feature is there. If it is, your installed copy is the stale one.<\/li>\n<li>Clear the site's data for pantrytab.com in your browser settings, then open the app again and sign in.<\/li>\n<\/ol>\n<p>Full instructions are in <a href=\"#app-not-updating\">The app looks out of date<\/a>. This is the most common cause of \"the new feature isn't showing up for me\".<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>There is no Add to Home Screen option on your iPhone.<\/strong> You are almost certainly not in Safari. Copy the address, open Safari, and try again.<\/li>\n<li><strong>The banner never appears.<\/strong> Use the manual steps above. The banner only shows in certain conditions and does not affect whether installing works.<\/li>\n<li><strong>The camera does nothing after installing.<\/strong> Your phone asks for camera permission the first time you scan. If you declined it, grant camera access to pantrytab.com in your phone's settings, then reopen the app.<\/li>\n<li><strong>You are asked to sign in again in the installed app.<\/strong> That is expected. The installed app has its own session. Sign in once and it will stay signed in.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Installing does not give you a separate account or separate data. It is the same household, the same inventory, the same everything.<\/li>\n<li>Pantry Tab does not send push notifications. Expiry alerts appear inside the app on the <strong>Home<\/strong> tab, not on your lock screen.<\/li>\n<li>There is no live sync between devices. If somebody else in your household changes something, refresh to see it.<\/li>\n<li>You can install Pantry Tab on more than one phone, and keep using it in a desktop browser at the same time.<\/li>\n<li>Removing the icon from your home screen does not delete anything. Your household's data stays where it is.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#welcome-to-pantry-tab\">Welcome to Pantry Tab<\/a><\/li>\n<li><a href=\"#app-not-updating\">The app looks out of date<\/a><\/li>\n<li><a href=\"#scanning-a-shelf\">Scanning a shelf or fridge with your camera<\/a><\/li>\n<li><a href=\"#tour-of-the-app\">A tour of the app<\/a><\/li>\n<\/ul>", "text": "Pantry Tab is a web app, so there is nothing to download from an app store. You add pantrytab.com to your phone's home screen and it opens like any other app, with its own icon and no browser bars. Why install it Scanning happens in the kitchen. Barcode scanning, shelf scanning and receipt scanning all use your phone camera. Having an icon on the home screen means you can scan a shelf while you are standing in front of it, instead of hunting for a browser tab. Faster access. One tap, already signed in, straight to the Home tab. Fewer mistaps. The installed app runs full screen, so you are not fighting the address bar while checking off a grocery list in a store. Nothing is lost by not installing — the app works the same in a normal browser tab. The install banner When Pantry Tab can install itself, it shows a banner: Install Pantry Tab — \"Get faster access from your home screen!\" with an Add to Home Screen button. Tap Add to Home Screen and follow your phone's prompt. If you do not see the banner, or you dismissed it, use the manual steps below. On an iPhone or iPad 1. Open pantrytab.com in Safari . Use Safari on iPhone — that is the route Pantry Tab documents, and the one that works reliably. 2. Tap the Share button in the browser toolbar. 3. Scroll down the share sheet and tap Add to Home Screen . 4. Adjust the name if you want, then confirm. 5. Close Safari and open Pantry Tab from the new home screen icon. Sign in once inside the installed app. On Android 1. Open pantrytab.com in Chrome . 2. Tap the browser menu. 3. Tap Install app , or Add to Home screen if that is what your version shows. 4. Confirm, then open Pantry Tab from the new icon. The in app Help & How To page also carries step by step instructions for both phones. When the installed app looks out of date The installed app keeps a copy of Pantry Tab on your phone so it opens quickly. That copy can be an older version, which is why a feature you have read about sometimes seems to be missing. To force it to pick up the current version: 1. Do a hard refresh of the page. 2. If that does not work, open pantrytab.com in a private or incognito browser window and check whether the feature is there. If it is, your installed copy is the stale one. 3. Clear the site's data for pantrytab.com in your browser settings, then open the app again and sign in. Full instructions are in The app looks out of date app not updating . This is the most common cause of \"the new feature isn't showing up for me\". If something goes wrong There is no Add to Home Screen option on your iPhone. You are almost certainly not in Safari. Copy the address, open Safari, and try again. The banner never appears. Use the manual steps above. The banner only shows in certain conditions and does not affect whether installing works. The camera does nothing after installing. Your phone asks for camera permission the first time you scan. If you declined it, grant camera access to pantrytab.com in your phone's settings, then reopen the app. You are asked to sign in again in the installed app. That is expected. The installed app has its own session. Sign in once and it will stay signed in. Good to know Installing does not give you a separate account or separate data. It is the same household, the same inventory, the same everything. Pantry Tab does not send push notifications. Expiry alerts appear inside the app on the Home tab, not on your lock screen. There is no live sync between devices. If somebody else in your household changes something, refresh to see it. You can install Pantry Tab on more than one phone, and keep using it in a desktop browser at the same time. Removing the icon from your home screen does not delete anything. Your household's data stays where it is. Related Welcome to Pantry Tab welcome to pantry tab The app looks out of date app not updating Scanning a shelf or fridge with your camera scanning a shelf A tour of the app tour of the app "}, {"id": "tour-of-the-app", "title": "A tour of the app", "category": "Getting Started", "summary": "What each of the seven tabs does, what the header controls and avatar menu are for, and what you see on the Home dashboard.", "keywords": ["navigation", "tabs", "home", "inventory", "grocery", "recipes", "plan", "prices", "allergies", "community", "dashboard", "avatar menu", "active person"], "html": "<p>Pantry Tab is one page with seven tabs across it. This article says what each one is for so you know where to go, and then looks more closely at the <strong>Home<\/strong> tab.<\/p>\n<h2 id=\"the-tabs\">The tabs<\/h2>\n<p><strong>Home<\/strong> — your dashboard. What is expiring, what state your pantry is in, and the AI actions that use it. Covered further down this page.<\/p>\n<p><strong>Inventory<\/strong> — everything you have, split across three storage areas: <strong>🧊 Freezer<\/strong>, <strong>🥶 Fridge<\/strong> and <strong>📦 Pantry<\/strong>. Add items by hand, by barcode, by shelf photo or from a receipt, edit them, use them up, and track several expiry dates for the same item. See <a href=\"#adding-items-manually\">Adding items to your pantry<\/a> and <a href=\"#managing-your-inventory\">Managing your inventory: editing, using up, and batches<\/a>.<\/p>\n<p><strong>Grocery<\/strong> — your shopping list, shared with the whole household. Add items, generate a list with AI, check things off as you shop, run the shopping calculator against a budget, see Kroger coupon matches, and send the list to a Kroger pickup cart. See <a href=\"#using-the-grocery-list\">Building and using your grocery list<\/a>.<\/p>\n<p><strong>Recipes<\/strong> — your recipe library. Add recipes by hand, or import them from a photo, a document or a link. Each recipe shows a <strong>Pantry Check<\/strong> against what you own and an <strong>Allergy Check<\/strong> against your household. See <a href=\"#managing-recipes\">Managing your recipe library<\/a> and <a href=\"#importing-recipes\">Importing recipes from a photo, file, or link<\/a>.<\/p>\n<p><strong>Plan<\/strong> — the meal planner, in <strong>Week<\/strong>, <strong>Month<\/strong> or <strong>Day<\/strong> views. Put recipes on dates and meal types, tag meals to cook ahead and build a prep sheet, and open <strong>What Can I Make?<\/strong> to see what your pantry can cover right now. See <a href=\"#meal-planner-basics\">Using the meal planner<\/a> and <a href=\"#what-can-i-make\">What Can I Make? Recipe ideas from your pantry<\/a>.<\/p>\n<p><strong>Prices<\/strong> — what groceries cost. Two sub-tabs: <strong>Your Prices<\/strong>, where you log and compare prices across your own stores, and <strong>Crowdsourced<\/strong>, where you look up prices other people have reported. See <a href=\"#price-tracking\">Tracking and comparing prices<\/a>.<\/p>\n<p><strong>Allergies<\/strong> — every allergy in your household, with two sub-tabs: <strong>By Allergen<\/strong> and <strong>By Person<\/strong>. This is where warnings elsewhere in the app come from. See <a href=\"#allergies-setup\">Setting up allergies for your household<\/a>.<\/p>\n<p>Next to the tabs is a <strong>Community<\/strong> link. It opens the recipe marketplace and forum in their own area, with a sidebar of its own: <strong>Community<\/strong>, <strong>Browse Recipes<\/strong>, <strong>My Recipes<\/strong>, <strong>My Inventory<\/strong>, <strong>Meal Planner<\/strong>, <strong>Shopping List<\/strong>, <strong>Kitchen Talk<\/strong>, <strong>Menu<\/strong> and <strong>Sign Out<\/strong>. See <a href=\"#browse-marketplace\">Browsing and saving community recipes<\/a>.<\/p>\n<h2 id=\"the-header-controls\">The header controls<\/h2>\n<p><strong>Active Person<\/strong> selector. Pick whose allergy warnings you want to see as you move around the app. Changing it shows the toast <strong>Active person changed<\/strong>. It does not change anything about your data — it changes which person's allergies are being checked in front of you. See <a href=\"#people-profiles\">People profiles and the active person<\/a>.<\/p>\n<p><strong>Location selector.<\/strong> Only appears if your household has a second location. It switches which location's inventory you are looking at; one location is marked <strong>(Primary)<\/strong>. Recipes, meal plans, grocery list, people and allergies stay shared across both. See <a href=\"#multiple-locations\">Tracking a second location<\/a>.<\/p>\n<h2 id=\"the-avatar-menu\">The avatar menu<\/h2>\n<p>Open it from your avatar in the top right. It shows your name, your email, your plan badge (<strong>Premium<\/strong> or <strong>Free<\/strong>) and your role badge (<strong>Owner<\/strong>), then:<\/p>\n<ul>\n<li><strong>Profile<\/strong> — your personal information, subscription status, connected accounts including Kroger, and a link to the in-app help. See <a href=\"#profile-and-settings\">Your profile and connected accounts<\/a>.<\/li>\n<li><strong>Household<\/strong> — household settings, members, invitations and locations. Owner-only for most changes. See <a href=\"#households-and-sharing\">Households: sharing your kitchen<\/a>.<\/li>\n<li><strong>People<\/strong> — the people who eat in your home, their details and their <strong>Allergy Alerts<\/strong> toggle. See <a href=\"#people-profiles\">People profiles and the active person<\/a>.<\/li>\n<li><strong>Billing<\/strong> — your trial or subscription, <strong>Manage subscription<\/strong> and <strong>View plans<\/strong>. See <a href=\"#managing-your-subscription\">Managing your subscription and billing<\/a>.<\/li>\n<li><strong>Sign out<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"the-home-dashboard\">The Home dashboard<\/h2>\n<p><strong>Home<\/strong> is the tab you land on, and it is built around two questions: what needs using, and what should you do next.<\/p>\n<h3 id=\"the-stat-tiles\">The stat tiles<\/h3>\n<p>Four tiles run across the top:<\/p>\n<ul>\n<li><strong>Pantry value<\/strong> — what your stock is worth.<\/li>\n<li><strong>Use soon<\/strong> — how much is close to its expiry date.<\/li>\n<li><strong>Inventory<\/strong> — how much you are holding.<\/li>\n<li><strong>Needs your attention<\/strong> — the count behind the alert card below.<\/li>\n<\/ul>\n<p>Under them are storage chips for <strong>Freezer<\/strong>, <strong>Fridge<\/strong> and <strong>Pantry<\/strong> with a count on each. Tap one to open the <strong>Inventory<\/strong> tab.<\/p>\n<h3 id=\"needs-your-attention\">Needs your attention<\/h3>\n<p>This is the consolidated alert card, and it covers both expiry and low stock. Items are grouped so you can triage them: expired, expiring today, expiring in 1–3 days, and a heads-up group for 4–7 days out. Low-stock items appear here too, and you can add one to your grocery list in a single tap.<\/p>\n<p>These alerts are in-app only. Pantry Tab does not send push notifications or emails. A dismissed alert can come back if the item is still inside the expiry window the next time the check runs. See <a href=\"#expiry-and-low-stock\">Expiry alerts and low-stock reminders<\/a>.<\/p>\n<h3 id=\"pantry-tab-ai\">Pantry Tab AI<\/h3>\n<p>A panel labelled \"Powered by Claude\", with three cards. Each has a <strong>Try it →<\/strong>:<\/p>\n<ul>\n<li><strong>Plan this week's meals<\/strong> — \"Uses what's expiring soon\". Proposes five to seven dinners for the seven days starting tomorrow, built around ingredients that are about to go off, and shows you every suggestion before anything is added. See <a href=\"#ai-week-planner\">Planning a week of dinners with AI<\/a>.<\/li>\n<li><strong>Build my grocery list<\/strong> — \"Fills pantry gaps automatically\". A three-step flow that shows you what it is about to use — your pantry inventory, your household allergies (\"will be avoided\"), the items already on your list, and your meal plan — then lets you pick what to add. See <a href=\"#ai-grocery-list\">Building your grocery list with AI<\/a>.<\/li>\n<li><strong>Scan a shelf or receipt<\/strong> — \"One tap, full inventory\". The fastest way to fill your pantry: photograph a shelf, or photograph a grocery receipt. See <a href=\"#scanning-a-shelf\">Scanning a shelf or fridge with your camera<\/a> and <a href=\"#scanning-a-receipt\">Scanning a grocery receipt<\/a>.<\/li>\n<\/ul>\n<h3 id=\"the-quick-cards\">The quick cards<\/h3>\n<ul>\n<li><strong>Add item<\/strong> — add one thing to your inventory by hand. See <a href=\"#adding-items-manually\">Adding items to your pantry<\/a>.<\/li>\n<li><strong>My recipes<\/strong> — with <strong>Recently added<\/strong> and a <strong>View all<\/strong> into your library.<\/li>\n<li><strong>Tonight's meal plan<\/strong> — with <strong>View<\/strong>, <strong>Up next<\/strong>, and \"Tap View to see what's cooking\". If the day is empty it shows <strong>Nothing planned for tonight<\/strong> and <strong>Plan a meal →<\/strong>.<\/li>\n<\/ul>\n<p>The two controls on <strong>Tonight's meal plan<\/strong> do different things. <strong>View<\/strong> opens the meal planner's week view — the calendar itself. <strong>Plan a meal →<\/strong> opens the AI week planner, which is why it feels wrong for a single night: it plans a whole week of dinners. The panel also shows how many meals are planned rather than naming the dish. See <a href=\"#meal-planner-basics\">Using the meal planner<\/a>.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>A tab looks empty when you know there is data in it.<\/strong> Check the location selector in the header. Each location has its own inventory.<\/li>\n<li><strong>You are seeing the wrong person's allergy warnings.<\/strong> Change the <strong>Active Person<\/strong> selector in the header.<\/li>\n<li><strong>Something a household member added is missing.<\/strong> There is no live sync between devices. Refresh the page.<\/li>\n<li><strong>The layout or a feature does not match this article.<\/strong> Your installed copy may be cached and out of date. See <a href=\"#app-not-updating\">The app looks out of date<\/a>.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Everything on the Inventory, Grocery, Recipes, Plan, Prices and Allergies tabs belongs to the household, not to you. Any member can edit any of it.<\/li>\n<li>The in-app <strong>Help &amp; How To<\/strong> page is older than the app. It describes dashboard tiles that have since changed, and a Snack meal type that does not exist.<\/li>\n<li>The recipes you save from the Community area are private to you and are not shared with your household.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#welcome-to-pantry-tab\">Welcome to Pantry Tab<\/a><\/li>\n<li><a href=\"#your-first-week\">Your first week: a setup checklist<\/a><\/li>\n<li><a href=\"#people-profiles\">People profiles and the active person<\/a><\/li>\n<li><a href=\"#expiry-and-low-stock\">Expiry alerts and low-stock reminders<\/a><\/li>\n<\/ul>", "text": "Pantry Tab is one page with seven tabs across it. This article says what each one is for so you know where to go, and then looks more closely at the Home tab. The tabs Home — your dashboard. What is expiring, what state your pantry is in, and the AI actions that use it. Covered further down this page. Inventory — everything you have, split across three storage areas: 🧊 Freezer , 🥶 Fridge and 📦 Pantry . Add items by hand, by barcode, by shelf photo or from a receipt, edit them, use them up, and track several expiry dates for the same item. See Adding items to your pantry adding items manually and Managing your inventory: editing, using up, and batches managing your inventory . Grocery — your shopping list, shared with the whole household. Add items, generate a list with AI, check things off as you shop, run the shopping calculator against a budget, see Kroger coupon matches, and send the list to a Kroger pickup cart. See Building and using your grocery list using the grocery list . Recipes — your recipe library. Add recipes by hand, or import them from a photo, a document or a link. Each recipe shows a Pantry Check against what you own and an Allergy Check against your household. See Managing your recipe library managing recipes and Importing recipes from a photo, file, or link importing recipes . Plan — the meal planner, in Week , Month or Day views. Put recipes on dates and meal types, tag meals to cook ahead and build a prep sheet, and open What Can I Make? to see what your pantry can cover right now. See Using the meal planner meal planner basics and What Can I Make? Recipe ideas from your pantry what can i make . Prices — what groceries cost. Two sub tabs: Your Prices , where you log and compare prices across your own stores, and Crowdsourced , where you look up prices other people have reported. See Tracking and comparing prices price tracking . Allergies — every allergy in your household, with two sub tabs: By Allergen and By Person . This is where warnings elsewhere in the app come from. See Setting up allergies for your household allergies setup . Next to the tabs is a Community link. It opens the recipe marketplace and forum in their own area, with a sidebar of its own: Community , Browse Recipes , My Recipes , My Inventory , Meal Planner , Shopping List , Kitchen Talk , Menu and Sign Out . See Browsing and saving community recipes browse marketplace . The header controls Active Person selector. Pick whose allergy warnings you want to see as you move around the app. Changing it shows the toast Active person changed . It does not change anything about your data — it changes which person's allergies are being checked in front of you. See People profiles and the active person people profiles . Location selector. Only appears if your household has a second location. It switches which location's inventory you are looking at; one location is marked Primary . Recipes, meal plans, grocery list, people and allergies stay shared across both. See Tracking a second location multiple locations . The avatar menu Open it from your avatar in the top right. It shows your name, your email, your plan badge Premium or Free and your role badge Owner , then: Profile — your personal information, subscription status, connected accounts including Kroger, and a link to the in app help. See Your profile and connected accounts profile and settings . Household — household settings, members, invitations and locations. Owner only for most changes. See Households: sharing your kitchen households and sharing . People — the people who eat in your home, their details and their Allergy Alerts toggle. See People profiles and the active person people profiles . Billing — your trial or subscription, Manage subscription and View plans . See Managing your subscription and billing managing your subscription . Sign out . The Home dashboard Home is the tab you land on, and it is built around two questions: what needs using, and what should you do next. The stat tiles Four tiles run across the top: Pantry value — what your stock is worth. Use soon — how much is close to its expiry date. Inventory — how much you are holding. Needs your attention — the count behind the alert card below. Under them are storage chips for Freezer , Fridge and Pantry with a count on each. Tap one to open the Inventory tab. Needs your attention This is the consolidated alert card, and it covers both expiry and low stock. Items are grouped so you can triage them: expired, expiring today, expiring in 1–3 days, and a heads up group for 4–7 days out. Low stock items appear here too, and you can add one to your grocery list in a single tap. These alerts are in app only. Pantry Tab does not send push notifications or emails. A dismissed alert can come back if the item is still inside the expiry window the next time the check runs. See Expiry alerts and low stock reminders expiry and low stock . Pantry Tab AI A panel labelled \"Powered by Claude\", with three cards. Each has a Try it → : Plan this week's meals — \"Uses what's expiring soon\". Proposes five to seven dinners for the seven days starting tomorrow, built around ingredients that are about to go off, and shows you every suggestion before anything is added. See Planning a week of dinners with AI ai week planner . Build my grocery list — \"Fills pantry gaps automatically\". A three step flow that shows you what it is about to use — your pantry inventory, your household allergies \"will be avoided\" , the items already on your list, and your meal plan — then lets you pick what to add. See Building your grocery list with AI ai grocery list . Scan a shelf or receipt — \"One tap, full inventory\". The fastest way to fill your pantry: photograph a shelf, or photograph a grocery receipt. See Scanning a shelf or fridge with your camera scanning a shelf and Scanning a grocery receipt scanning a receipt . The quick cards Add item — add one thing to your inventory by hand. See Adding items to your pantry adding ite"}, {"id": "your-first-week", "title": "Your first week: a setup checklist", "category": "Getting Started", "summary": "An ordered checklist for setting up Pantry Tab, from household and allergies through to a planned week and a grocery list.", "keywords": ["setup", "checklist", "first week", "getting started", "new user", "onboarding", "scan pantry", "add recipes", "plan meals"], "html": "<p>Pantry Tab gets more useful the more it knows about your kitchen. This is the order that gets you there with the least typing. You do not have to do it all in one sitting — work down the list over your first week and each step makes the next one better.<\/p>\n<h2 id=\"1-name-your-household-and-add-the-people-who-eat-there\">1. Name your household and add the people who eat there<\/h2>\n<p>Open <strong>Household<\/strong> from the avatar menu and rename the household if you want. Only the household Owner can change the name.<\/p>\n<p>Then open <strong>People<\/strong>. You already have one person called <strong>Self<\/strong>. Add everyone else who eats in your home: <strong>First Name<\/strong> is the only required field, and <strong>Relationship<\/strong> offers Self, Spouse, Child, Parent, Sibling and Other. One person at a time, a few seconds each.<\/p>\n<p>This matters because allergy warnings are per person, and prep-sheet portions are calculated as tagged meals times the number of people in your household — a household missing two people will under-portion.<\/p>\n<p>If other adults want their own sign-in, invite them separately from Household Settings. Adding a person does not create an account. See <a href=\"#people-profiles\">People profiles and the active person<\/a> and <a href=\"#inviting-and-managing-members\">Inviting and managing household members<\/a>.<\/p>\n<h2 id=\"2-record-allergies-before-you-do-anything-else\">2. Record allergies before you do anything else<\/h2>\n<p>Do this before adding food, recipes or meal plans, so that warnings are in place the first time you look at any of it.<\/p>\n<p>On the <strong>Allergies<\/strong> tab, choose <strong>Add Allergy<\/strong> for each person: pick the <strong>Person<\/strong>, pick the <strong>Allergen<\/strong> (Dairy, Eggs, Peanuts, Tree Nuts, Wheat/Gluten, Soy, Fish, Shellfish and Sesame are ready to go, or use <strong>+ Custom allergen...<\/strong>), and set <strong>Severity<\/strong> to <strong>Mild<\/strong>, <strong>Medium<\/strong> or <strong>Severe<\/strong>.<\/p>\n<p>Spend the extra minute on the keywords field. Matching is keyword-based — it compares ingredient text against the allergen name and the keywords you add — so good keywords are the difference between a warning and a miss. Read <a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a> before you rely on it. Always read the actual product label.<\/p>\n<h2 id=\"3-get-your-pantry-in-with-the-camera-not-the-keyboard\">3. Get your pantry in with the camera, not the keyboard<\/h2>\n<p>Typing your whole kitchen in is the slowest possible route. Start from the <strong>Scan a shelf or receipt<\/strong> card (\"One tap, full inventory\") in the <strong>Pantry Tab AI<\/strong> panel on <strong>Home<\/strong>, and use one of these:<\/p>\n<ul>\n<li><strong>Scan a shelf.<\/strong> Photograph a shelf, a fridge shelf or the freezer. Claude reads the photo in 5–10 seconds and gives you a review list you can correct before anything is saved, with low-confidence items unchecked by default. One photo per shelf gets a normal kitchen in during a single pass. See <a href=\"#scanning-a-shelf\">Scanning a shelf or fridge with your camera<\/a>.<\/li>\n<li><strong>Scan your next receipt.<\/strong> Photograph a grocery receipt and Pantry Tab reads the store, the date and every food line with quantities and prices, skipping bags and tax. Keep doing this every shop — it holds inventory current and feeds your price history at the same time. See <a href=\"#scanning-a-receipt\">Scanning a grocery receipt<\/a>.<\/li>\n<li><strong>Scan barcodes<\/strong> for packaged items you want nutrition information on. See <a href=\"#barcode-scanning\">Scanning barcodes<\/a>.<\/li>\n<\/ul>\n<p>Check the expiry dates the scans guess for you — they are estimated from typical shelf life and can be wrong. While you are here, set a <strong>Low Stock Alert<\/strong> on the staples you never want to run out of. Both expiry and low stock then surface in the <strong>Needs your attention<\/strong> card on <strong>Home<\/strong>.<\/p>\n<h2 id=\"4-add-a-handful-of-recipes\">4. Add a handful of recipes<\/h2>\n<p>Aim for the ten or so meals you actually cook. Importing beats typing every time:<\/p>\n<ul>\n<li><strong>Photo<\/strong> — a cookbook page, a recipe card, handwritten notes or a screenshot.<\/li>\n<li><strong>File<\/strong> — .pdf, .docx, .txt, .md, .html or .json.<\/li>\n<li><strong>URL<\/strong> — paste a link to a recipe page.<\/li>\n<\/ul>\n<p>If servings or times are not printed on the source, the AI estimates them, so glance at those before saving. See <a href=\"#importing-recipes\">Importing recipes from a photo, file, or link<\/a>.<\/p>\n<h2 id=\"5-try-what-can-i-make\">5. Try What Can I Make?<\/h2>\n<p>Open <strong>What Can I Make?<\/strong> from the <strong>Plan<\/strong> tab. It ranks your own saved recipes against your pantry with a <strong>{n}% match<\/strong> badge, showing what it matched, what is missing, and which recipes use something expiring. A second section suggests new recipes to discover. The dialog stays open after each add, so you can take several in one go and close with <strong>Done<\/strong>.<\/p>\n<p>This is the step that pays back steps 3 and 4, and where you will first notice that the AI is only as good as what you have given it.<\/p>\n<h2 id=\"6-plan-a-week-of-dinners\">6. Plan a week of dinners<\/h2>\n<p>In the <strong>Pantry Tab AI<\/strong> panel on <strong>Home<\/strong>, choose <strong>Plan this week's meals<\/strong> (\"Uses what's expiring soon\"). It proposes five to seven dinners for the seven days starting tomorrow, built around what is expiring, avoids household allergens, and shows you every suggestion before anything is added. Uncheck what you do not want.<\/p>\n<p>Each suggestion you accept is saved as a real recipe in your library, so your library grows every time you use it. The page reloads after you save a plan — that is intentional. See <a href=\"#ai-week-planner\">Planning a week of dinners with AI<\/a>.<\/p>\n<h2 id=\"7-build-your-grocery-list-from-the-plan\">7. Build your grocery list from the plan<\/h2>\n<p>Back in the same panel, choose <strong>Build my grocery list<\/strong> (\"Fills pantry gaps automatically\"). It looks at your inventory, your meal plan, your household allergies and what is already on your list, then lets you pick what to add. Anything containing a household allergen is left out.<\/p>\n<p>Prices on the list are AI estimates in US dollars, not real store prices. Use the <strong>Calculator<\/strong> on the <strong>Grocery<\/strong> tab if you want to shop against a budget. See <a href=\"#ai-grocery-list\">Building your grocery list with AI<\/a>.<\/p>\n<h2 id=\"8-optional-connect-kroger\">8. Optional: connect Kroger<\/h2>\n<p>If you shop at Kroger, open <strong>Profile<\/strong> → <strong>Connected Accounts<\/strong> and <strong>Connect<\/strong> your Kroger account, then set your store by ZIP code. After that, a <strong>Send to Kroger Pickup<\/strong> card appears on your grocery list, and Kroger coupon matches show on your items.<\/p>\n<p>It is pickup only, and matching takes the first Kroger search result, so always check the cart in the Kroger app before ordering. See <a href=\"#kroger-connect\">Connecting your Kroger account<\/a>.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"No saved recipes match your pantry yet. Add more recipes via the Marketplace.\"<\/strong> You have too few recipes for the library ranking to work. Go back to step 4, or save some from the Community area.<\/li>\n<li><strong>\"Add items to your pantry to discover new recipes.\"<\/strong> Your inventory is empty. Do step 3 first.<\/li>\n<li><strong>\"All ingredients are already in your pantry!\"<\/strong> There is nothing to add to the grocery list.<\/li>\n<li><strong>\"No food items detected. Try a clearer shot or different angle.\"<\/strong> Retake the shelf photo with better light and the labels facing out.<\/li>\n<li><strong>A step you completed seems to have vanished.<\/strong> Refresh. There is no live sync between devices.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>The AI features get noticeably better once there is real inventory and a few recipes in your library. On day one, with an empty pantry, expect thin results — that is missing input, not a fault.<\/li>\n<li>Low match scores in <strong>What Can I Make?<\/strong> are normal. It returns a ranked list even when nothing is a great fit.<\/li>\n<li>One meal per meal type per day, per household. Adding a second dinner to a day replaces the first, with no warning.<\/li>\n<li>Your free trial runs 14 days from when you created your account.<\/li>\n<li>Everything except your profile, your saved marketplace recipes, your Kroger connection and your billing is shared with the whole household.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#create-your-account\">Creating your account and signing in<\/a><\/li>\n<li><a href=\"#tour-of-the-app\">A tour of the app<\/a><\/li>\n<li><a href=\"#allergies-setup\">Setting up allergies for your household<\/a><\/li>\n<li><a href=\"#scanning-a-shelf\">Scanning a shelf or fridge with your camera<\/a><\/li>\n<\/ul>", "text": "Pantry Tab gets more useful the more it knows about your kitchen. This is the order that gets you there with the least typing. You do not have to do it all in one sitting — work down the list over your first week and each step makes the next one better. 1. Name your household and add the people who eat there Open Household from the avatar menu and rename the household if you want. Only the household Owner can change the name. Then open People . You already have one person called Self . Add everyone else who eats in your home: First Name is the only required field, and Relationship offers Self, Spouse, Child, Parent, Sibling and Other. One person at a time, a few seconds each. This matters because allergy warnings are per person, and prep sheet portions are calculated as tagged meals times the number of people in your household — a household missing two people will under portion. If other adults want their own sign in, invite them separately from Household Settings. Adding a person does not create an account. See People profiles and the active person people profiles and Inviting and managing household members inviting and managing members . 2. Record allergies before you do anything else Do this before adding food, recipes or meal plans, so that warnings are in place the first time you look at any of it. On the Allergies tab, choose Add Allergy for each person: pick the Person , pick the Allergen Dairy, Eggs, Peanuts, Tree Nuts, Wheat/Gluten, Soy, Fish, Shellfish and Sesame are ready to go, or use + Custom allergen... , and set Severity to Mild , Medium or Severe . Spend the extra minute on the keywords field. Matching is keyword based — it compares ingredient text against the allergen name and the keywords you add — so good keywords are the difference between a warning and a miss. Read How allergy warnings work, and their limits how allergy warnings work before you rely on it. Always read the actual product label. 3. Get your pantry in with the camera, not the keyboard Typing your whole kitchen in is the slowest possible route. Start from the Scan a shelf or receipt card \"One tap, full inventory\" in the Pantry Tab AI panel on Home , and use one of these: Scan a shelf. Photograph a shelf, a fridge shelf or the freezer. Claude reads the photo in 5–10 seconds and gives you a review list you can correct before anything is saved, with low confidence items unchecked by default. One photo per shelf gets a normal kitchen in during a single pass. See Scanning a shelf or fridge with your camera scanning a shelf . Scan your next receipt. Photograph a grocery receipt and Pantry Tab reads the store, the date and every food line with quantities and prices, skipping bags and tax. Keep doing this every shop — it holds inventory current and feeds your price history at the same time. See Scanning a grocery receipt scanning a receipt . Scan barcodes for packaged items you want nutrition information on. See Scanning barcodes barcode scanning . Check the expiry dates the scans guess for you — they are estimated from typical shelf life and can be wrong. While you are here, set a Low Stock Alert on the staples you never want to run out of. Both expiry and low stock then surface in the Needs your attention card on Home . 4. Add a handful of recipes Aim for the ten or so meals you actually cook. Importing beats typing every time: Photo — a cookbook page, a recipe card, handwritten notes or a screenshot. File — .pdf, .docx, .txt, .md, .html or .json. URL — paste a link to a recipe page. If servings or times are not printed on the source, the AI estimates them, so glance at those before saving. See Importing recipes from a photo, file, or link importing recipes . 5. Try What Can I Make? Open What Can I Make? from the Plan tab. It ranks your own saved recipes against your pantry with a {n}% match badge, showing what it matched, what is missing, and which recipes use something expiring. A second section suggests new recipes to discover. The dialog stays open after each add, so you can take several in one go and close with Done . This is the step that pays back steps 3 and 4, and where you will first notice that the AI is only as good as what you have given it. 6. Plan a week of dinners In the Pantry Tab AI panel on Home , choose Plan this week's meals \"Uses what's expiring soon\" . It proposes five to seven dinners for the seven days starting tomorrow, built around what is expiring, avoids household allergens, and shows you every suggestion before anything is added. Uncheck what you do not want. Each suggestion you accept is saved as a real recipe in your library, so your library grows every time you use it. The page reloads after you save a plan — that is intentional. See Planning a week of dinners with AI ai week planner . 7. Build your grocery list from the plan Back in the same panel, choose Build my grocery list \"Fills pantry gaps automatically\" . It looks at your inventory, your meal plan, your household allergies and what is already on your list, then lets you pick what to add. Anything containing a household allergen is left out. Prices on the list are AI estimates in US dollars, not real store prices. Use the Calculator on the Grocery tab if you want to shop against a budget. See Building your grocery list with AI ai grocery list . 8. Optional: connect Kroger If you shop at Kroger, open Profile → Connected Accounts and Connect your Kroger account, then set your store by ZIP code. After that, a Send to Kroger Pickup card appears on your grocery list, and Kroger coupon matches show on your items. It is pickup only, and matching takes the first Kroger search result, so always check the cart in the Kroger app before ordering. See Connecting your Kroger account kroger connect . If something goes wrong \"No saved recipes match your pantry yet. Add more recipes via the Marketplace.\" You have too few recipes for the library ranking to work. Go back to step 4, or save some from the Community area. \"Add items to your p"}, {"id": "households-and-sharing", "title": "Households: sharing your kitchen", "category": "Your Household", "summary": "What a household shares with every member, what stays private to you, Owner versus Member, and what happens when you join another household.", "keywords": ["household", "sharing", "shared pantry", "owner", "member", "rename household", "join household", "delete household", "privacy", "family"], "html": "<p>A household is the shared kitchen behind everything in Pantry Tab. One household holds one set of food, one grocery list and one plan, and everybody in it works from the same copy.<\/p>\n<p>Pantry Tab creates a household for you the first time you sign up. It is named <strong>{Your Name}'s Household<\/strong>, you are its <strong>Owner<\/strong>, and it starts with one person profile called <strong>Self<\/strong> and one location called <strong>Home<\/strong>, marked Primary.<\/p>\n<h2 id=\"what-everyone-in-the-household-shares\">What everyone in the household shares<\/h2>\n<p>Every member sees and can edit all of this:<\/p>\n<ul>\n<li>Inventory — what food you have, in every storage area<\/li>\n<li>The grocery list<\/li>\n<li>Recipes in your library<\/li>\n<li>The meal plan<\/li>\n<li>People profiles<\/li>\n<li>Allergies<\/li>\n<li>Stores<\/li>\n<li>Locations<\/li>\n<\/ul>\n<p>There is no per-member privacy inside a household. If you share a household, you share the allergy list too. Any member can see who has which allergen and how severe it is, and any member can edit or delete a recipe, a person, or an inventory item that someone else added.<\/p>\n<h2 id=\"what-stays-private-to-you\">What stays private to you<\/h2>\n<p>Four things belong to your login, not to the household:<\/p>\n<ul>\n<li>Your profile<\/li>\n<li>Your saved marketplace recipes<\/li>\n<li>Your Kroger connection<\/li>\n<li>Your billing<\/li>\n<\/ul>\n<p>So if two people in the same household each save recipes from the Community marketplace, those saved recipes stay in each person's own collection. The same goes for Kroger: each person connects their own Kroger account and picks their own store.<\/p>\n<h2 id=\"owner-and-member\">Owner and Member<\/h2>\n<p>There are two roles: <strong>Owner<\/strong> and <strong>Member<\/strong>. Your role badge appears in the avatar menu in the top right.<\/p>\n<p>Only the Owner can:<\/p>\n<ul>\n<li>Invite, edit, or remove members<\/li>\n<li>Update the household name<\/li>\n<li>Add, rename or delete locations<\/li>\n<\/ul>\n<p>Members can do everything else — add food, edit recipes, plan meals, manage people and allergies.<\/p>\n<p>An Owner cannot remove themselves from the household.<\/p>\n<h2 id=\"renaming-the-household\">Renaming the household<\/h2>\n<ol>\n<li>Open the avatar menu in the top right and choose <strong>Household<\/strong>.<\/li>\n<li>On <strong>Household Settings<\/strong>, edit the household name and save it.<\/li>\n<\/ol>\n<p>If you are a Member, the name is not editable. Pantry Tab says <strong>\"Only the household owner can update the name\"<\/strong>.<\/p>\n<h2 id=\"belonging-to-one-household-at-a-time\">Belonging to one household at a time<\/h2>\n<p>You belong to exactly one household at a time. There is no way to sit in two kitchens at once and no way to switch back and forth.<\/p>\n<p>Accepting an invitation to another household moves you out of your current one. You lose access to the household you were in — its inventory, recipes and plan stay with the people still in it
