s barcode scanning . To stock up from what is already on your shelves rather than from a shop, use a shelf scan instead. See Scanning a shelf or fridge with your camera scanning a shelf . Related Scanning a shelf or fridge with your camera scanning a shelf Scanning barcodes barcode scanning Tracking and comparing prices price tracking Managing your inventory: editing, using up, and batches managing your inventory "}, {"id": "managing-your-inventory", "title": "Managing your inventory: editing, using up, and batches", "category": "Pantry Inventory", "summary": "How the three storage areas work, how to edit an item, mark some of it used, keep several expiry batches, and read nutrition and allergy details.", "keywords": ["inventory", "edit item", "save changes", "use", "available", "how many to use", "expiry batches", "nutrition facts", "allergy warning", "storage", "freezer", "fridge", "pantry"], "html": "<p>The <strong>Inventory<\/strong> tab is the running picture of what is in your kitchen. Keeping it current is what makes expiry alerts, meal plans and grocery suggestions worth anything.<\/p>\n<h2 id=\"the-three-storage-areas\">The three storage areas<\/h2>\n<p>Every item lives in one of three areas: <strong>🧊 Freezer<\/strong>, <strong>🥶 Fridge<\/strong> or <strong>📦 Pantry<\/strong>. These are the only three, and each item sits in exactly one of them.<\/p>\n<p>The Home dashboard shows a chip for <strong>Freezer<\/strong>, <strong>Fridge<\/strong> and <strong>Pantry<\/strong> with a count on each. Tapping one opens the <strong>Inventory<\/strong> tab.<\/p>\n<h2 id=\"editing-an-item\">Editing an item<\/h2>\n<p>Open an item and choose to edit it. The <strong>Edit Item<\/strong> dialog holds the same fields you filled in when you added it — name, quantity, unit, storage location, expiry date, price, store and low stock alert. Change what you need and tap <strong>Save Changes<\/strong>.<\/p>\n<p>Editing is the right tool for correcting a scan, moving something from the fridge to the freezer, or adding an expiry date you did not have at the time.<\/p>\n<h2 id=\"using-items-up\">Using items up<\/h2>\n<p>When you cook with something, mark it used instead of deleting the whole item. On the item you get:<\/p>\n<ul>\n<li><strong>Available<\/strong> — how much you currently have.<\/li>\n<li><strong>How many to use?<\/strong> — type the amount you are taking.<\/li>\n<li><strong>All<\/strong> — fills in everything that is available, for when you finish something off.<\/li>\n<li><strong>Use<\/strong> — subtracts it.<\/li>\n<\/ul>\n<p>Using items up keeps your quantities honest, which is what drives low-stock flags and what the AI reads when it plans meals or builds a grocery list.<\/p>\n<h2 id=\"expiry-batches\">Expiry Batches<\/h2>\n<p>One item can hold several batches with different expiry dates, shown as <strong>Expiry Batches<\/strong>.<\/p>\n<p>Use a batch when you buy more of something you already have and the new pack has a different date — a second gallon of milk, another dozen eggs, a second bag of spinach. Instead of a duplicate entry, or losing the earlier date by overwriting it, the item keeps both dates and one combined quantity.<\/p>\n<p>That matters because your expiry alerts stay accurate. The older batch can warn you while the newer one sits quietly.<\/p>\n<h2 id=\"nutrition-facts\">Nutrition Facts<\/h2>\n<p>Items that came from a barcode lookup carry a <strong>Nutrition Facts<\/strong> panel, with Cal, Protein, Carbs and Fat tiles at the top and these sections below:<\/p>\n<ul>\n<li><strong>Serving Information<\/strong><\/li>\n<li><strong>Macronutrients<\/strong><\/li>\n<li><strong>Detailed Breakdown<\/strong><\/li>\n<li><strong>Minerals &amp; Other<\/strong><\/li>\n<li><strong>Vitamins &amp; Minerals<\/strong><\/li>\n<li><strong>Ingredients<\/strong><\/li>\n<\/ul>\n<p>If the item was typed in by hand, or the product has no data on file, you see <strong>No nutrition info<\/strong> with \"Scan the product barcode or search by name to add nutritional data.\" Scanning the barcode is what fills it in. See <a href=\"#barcode-scanning\">Scanning barcodes<\/a>.<\/p>\n<h2 id=\"the-allergy-warning-badge\">The Allergy Warning badge<\/h2>\n<p>An <strong>Allergy Warning<\/strong> badge appears on an item card when the item matches an allergen tracked in your household. It is there to catch things at a glance while you are looking in the cupboard.<\/p>\n<p>Matching is keyword-based, so it can miss an allergen that is named differently or hidden in a brand name. Always read the actual product label. See <a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a>.<\/p>\n<h2 id=\"who-sees-your-inventory-and-where-it-lives\">Who sees your inventory, and where it lives<\/h2>\n<ul>\n<li>Inventory is <strong>shared with your whole household<\/strong>. Everyone sees the same items and anyone can edit or delete any of them. There is no per-member privacy inside a household.<\/li>\n<li>Inventory is <strong>per location<\/strong>. If your household tracks a second location, each one keeps its own separate inventory. Recipes, meal plans, the grocery list, people and allergies are shared across both.<\/li>\n<li>The location selector in the header only appears once you have more than one location. Check which location you are viewing before you add or edit.<\/li>\n<\/ul>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>A change is not showing on someone else's device.<\/strong> There is no live sync. Ask them to refresh the app.<\/li>\n<li><strong>An item disappeared.<\/strong> Anyone in your household can delete any item. Check with them before re-adding it.<\/li>\n<li><strong>Your quantity is wrong after cooking.<\/strong> Open the item, use <strong>How many to use?<\/strong> and <strong>Use<\/strong> to correct it, or edit the quantity directly with <strong>Save Changes<\/strong>.<\/li>\n<li><strong>You are in the wrong location's inventory.<\/strong> Switch with the location selector in the header. Items do not move between locations on their own.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li><strong>Deleting a location deletes that location's inventory items.<\/strong> Grocery items survive a location being deleted, but they lose their location tag. Only the household Owner can delete a location.<\/li>\n<li>Expiry dates that arrived from a shelf scan or a receipt scan are estimates worked out from typical shelf life. Correct them if you rely on the alerts.<\/li>\n<li>Marking an item used does not add it to your grocery list. Adding it back is a separate step, though low-stock items can be added to the list in one tap.<\/li>\n<li>An empty pantry shows <strong>Add your first item<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#adding-items-manually\">Adding items to your pantry<\/a><\/li>\n<li><a href=\"#expiry-and-low-stock\">Expiry alerts and low-stock reminders<\/a><\/li>\n<li><a href=\"#barcode-scanning\">Scanning barcodes<\/a><\/li>\n<li><a href=\"#multiple-locations\">Tracking a second location<\/a><\/li>\n<\/ul>", "text": "The Inventory tab is the running picture of what is in your kitchen. Keeping it current is what makes expiry alerts, meal plans and grocery suggestions worth anything. The three storage areas Every item lives in one of three areas: 🧊 Freezer , 🥶 Fridge or 📦 Pantry . These are the only three, and each item sits in exactly one of them. The Home dashboard shows a chip for Freezer , Fridge and Pantry with a count on each. Tapping one opens the Inventory tab. Editing an item Open an item and choose to edit it. The Edit Item dialog holds the same fields you filled in when you added it — name, quantity, unit, storage location, expiry date, price, store and low stock alert. Change what you need and tap Save Changes . Editing is the right tool for correcting a scan, moving something from the fridge to the freezer, or adding an expiry date you did not have at the time. Using items up When you cook with something, mark it used instead of deleting the whole item. On the item you get: Available — how much you currently have. How many to use? — type the amount you are taking. All — fills in everything that is available, for when you finish something off. Use — subtracts it. Using items up keeps your quantities honest, which is what drives low stock flags and what the AI reads when it plans meals or builds a grocery list. Expiry Batches One item can hold several batches with different expiry dates, shown as Expiry Batches . Use a batch when you buy more of something you already have and the new pack has a different date — a second gallon of milk, another dozen eggs, a second bag of spinach. Instead of a duplicate entry, or losing the earlier date by overwriting it, the item keeps both dates and one combined quantity. That matters because your expiry alerts stay accurate. The older batch can warn you while the newer one sits quietly. Nutrition Facts Items that came from a barcode lookup carry a Nutrition Facts panel, with Cal, Protein, Carbs and Fat tiles at the top and these sections below: Serving Information Macronutrients Detailed Breakdown Minerals & Other Vitamins & Minerals Ingredients If the item was typed in by hand, or the product has no data on file, you see No nutrition info with \"Scan the product barcode or search by name to add nutritional data.\" Scanning the barcode is what fills it in. See Scanning barcodes barcode scanning . The Allergy Warning badge An Allergy Warning badge appears on an item card when the item matches an allergen tracked in your household. It is there to catch things at a glance while you are looking in the cupboard. Matching is keyword based, so it can miss an allergen that is named differently or hidden in a brand name. Always read the actual product label. See How allergy warnings work, and their limits how allergy warnings work . Who sees your inventory, and where it lives Inventory is shared with your whole household . Everyone sees the same items and anyone can edit or delete any of them. There is no per member privacy inside a household. Inventory is per location . If your household tracks a second location, each one keeps its own separate inventory. Recipes, meal plans, the grocery list, people and allergies are shared across both. The location selector in the header only appears once you have more than one location. Check which location you are viewing before you add or edit. If something goes wrong A change is not showing on someone else's device. There is no live sync. Ask them to refresh the app. An item disappeared. Anyone in your household can delete any item. Check with them before re adding it. Your quantity is wrong after cooking. Open the item, use How many to use? and Use to correct it, or edit the quantity directly with Save Changes . You are in the wrong location's inventory. Switch with the location selector in the header. Items do not move between locations on their own. Good to know Deleting a location deletes that location's inventory items. Grocery items survive a location being deleted, but they lose their location tag. Only the household Owner can delete a location. Expiry dates that arrived from a shelf scan or a receipt scan are estimates worked out from typical shelf life. Correct them if you rely on the alerts. Marking an item used does not add it to your grocery list. Adding it back is a separate step, though low stock items can be added to the list in one tap. An empty pantry shows Add your first item . Related Adding items to your pantry adding items manually Expiry alerts and low stock reminders expiry and low stock Scanning barcodes barcode scanning Tracking a second location multiple locations "}, {"id": "expiry-and-low-stock", "title": "Expiry alerts and low-stock reminders", "category": "Pantry Inventory", "summary": "How expiry dates drive the Needs your attention card and the AI planner, why alerts are in-app only, and how low stock alerts feed your grocery list.", "keywords": ["expiry", "expiration", "expiry date", "needs your attention", "use soon", "expired", "expiring soon", "low stock alert", "reorder", "notifications", "reminders"], "html": "<p>Pantry Tab watches two things for you: food that is about to go off, and food you are running out of. Both are switched on per item, and both surface in the same place on the Home dashboard.<\/p>\n<h2 id=\"how-expiry-tracking-works\">How expiry tracking works<\/h2>\n<p>Set <strong>Expiry Date (optional)<\/strong> on an item — when you add it, or later with <strong>Edit Item<\/strong> and <strong>Save Changes<\/strong>. Items with no expiry date are never flagged.<\/p>\n<p>The <strong>Needs your attention<\/strong> card on the Home dashboard then covers anything from yesterday through seven days out, grouped as:<\/p>\n<ul>\n<li><strong>Expired<\/strong> — already past its date.<\/li>\n<li><strong>Today<\/strong> — goes off today.<\/li>\n<li><strong>Expiring soon (1–3 days)<\/strong> — use these next.<\/li>\n<li><strong>Heads up (4–7 days)<\/strong> — plan around these.<\/li>\n<\/ul>\n<p>The <strong>Use soon<\/strong> tile at the top of the dashboard gives you the same warning at a glance.<\/p>\n<h2 id=\"where-expiry-shows-up-elsewhere\">Where expiry shows up elsewhere<\/h2>\n<p>Expiry dates do more than raise a flag. They steer the AI features:<\/p>\n<ul>\n<li><strong>Plan this week's meals<\/strong> on the Home dashboard is labelled \"Uses what's expiring soon\", and it prioritises ingredients that are expiring or already expired when it plans your dinners. See <a href=\"#ai-week-planner\">Planning a week of dinners with AI<\/a>.<\/li>\n<li><strong>What Can I Make?<\/strong> adds an \"Uses expiring\" note to suggestions that would use up something on its way out. See <a href=\"#what-can-i-make\">What Can I Make? Recipe ideas from your pantry<\/a>.<\/li>\n<\/ul>\n<p>So the more expiry dates you fill in, the better your meal suggestions get at clearing the fridge.<\/p>\n<h2 id=\"alerts-are-in-app-only\">Alerts are in-app only<\/h2>\n<p>This is the part worth being clear about up front.<\/p>\n<p><strong>Expiry and low-stock alerts appear inside the app only. There are no push notifications and there are no emails.<\/strong> Nothing will buzz your phone or land in your inbox. You have to open Pantry Tab to see what needs attention.<\/p>\n<p>The app's own help page mentions that push notifications \"may be added in a future update\", but they do not exist today. Plan around that: open the app before you shop and before you cook, and it will tell you what to use. Adding Pantry Tab to your home screen makes that a one-tap habit. See <a href=\"#install-on-your-phone\">Installing Pantry Tab on your phone<\/a>.<\/p>\n<h2 id=\"dismissed-alerts-can-come-back\">Dismissed alerts can come back<\/h2>\n<p>Dismissing an alert clears it from view now, but it is not permanent. If the item is still inside the expiry window the next time the check runs, the alert reappears.<\/p>\n<p>To stop an alert for good, deal with the item: use it up, throw it out and delete it, or edit the expiry date if it was wrong.<\/p>\n<h2 id=\"low-stock-reminders\">Low stock reminders<\/h2>\n<p>Low stock works the same way, from a different field.<\/p>\n<ol>\n<li>Open the item and set <strong>Low Stock Alert (optional)<\/strong> to the quantity you want to be warned at — for example 1 for coffee, or 2 for tinned tomatoes.<\/li>\n<li>Tap <strong>Add Item<\/strong> or <strong>Save Changes<\/strong>.<\/li>\n<li>When the quantity drops to or below that number, the item is flagged.<\/li>\n<\/ol>\n<p>Low-stock items appear in the same <strong>Needs your attention<\/strong> card as expiry, and <strong>you can add them to your grocery list in one tap<\/strong> from there. That is the fastest route from \"we're nearly out of rice\" to \"rice is on the list\".<\/p>\n<p>Keeping quantities current is what makes this work. When you cook, mark what you used with <strong>How many to use?<\/strong> and <strong>Use<\/strong> rather than leaving the quantity where it was. See <a href=\"#managing-your-inventory\">Managing your inventory: editing, using up, and batches<\/a>.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>An item is not appearing in Needs your attention.<\/strong> It probably has no expiry date. Open it, edit it, set <strong>Expiry Date (optional)<\/strong> and tap <strong>Save Changes<\/strong>.<\/li>\n<li><strong>You expected a notification and got nothing.<\/strong> There are none. Alerts are in-app only — open the app to see them.<\/li>\n<li><strong>An alert you dismissed is back.<\/strong> Expected, while the item is still inside the expiry window. Use, delete or re-date the item.<\/li>\n<li><strong>An expiry date looks wrong on a scanned item.<\/strong> Dates from a shelf scan or a receipt scan are estimates based on typical shelf life, not readings of the printed date. Edit the item and set the real date.<\/li>\n<li><strong>A low stock item is not flagged.<\/strong> Check that <strong>Low Stock Alert (optional)<\/strong> is set on it, and that the quantity is actually at or below the number you set.<\/li>\n<li><strong>Something you already used is still showing.<\/strong> Mark it used with <strong>Use<\/strong>, or delete the item.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>The dashboard looks seven days ahead and one day back. Something expiring in three weeks will not appear yet.<\/li>\n<li>An item with several <strong>Expiry Batches<\/strong> can be flagged for its oldest batch while the newer one is fine.<\/li>\n<li>Alerts are per household, not per person. Everyone sees the same card, and there is no live sync between devices, so refresh if a housemate has already dealt with something.<\/li>\n<li>Adding a low-stock item to your grocery list does not change your inventory. It only puts the item on the list to buy.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#adding-items-manually\">Adding items to your pantry<\/a><\/li>\n<li><a href=\"#managing-your-inventory\">Managing your inventory: editing, using up, and batches<\/a><\/li>\n<li><a href=\"#ai-week-planner\">Planning a week of dinners with AI<\/a><\/li>\n<li><a href=\"#using-the-grocery-list\">Building and using your grocery list<\/a><\/li>\n<\/ul>", "text": "Pantry Tab watches two things for you: food that is about to go off, and food you are running out of. Both are switched on per item, and both surface in the same place on the Home dashboard. How expiry tracking works Set Expiry Date optional on an item — when you add it, or later with Edit Item and Save Changes . Items with no expiry date are never flagged. The Needs your attention card on the Home dashboard then covers anything from yesterday through seven days out, grouped as: Expired — already past its date. Today — goes off today. Expiring soon 1–3 days — use these next. Heads up 4–7 days — plan around these. The Use soon tile at the top of the dashboard gives you the same warning at a glance. Where expiry shows up elsewhere Expiry dates do more than raise a flag. They steer the AI features: Plan this week's meals on the Home dashboard is labelled \"Uses what's expiring soon\", and it prioritises ingredients that are expiring or already expired when it plans your dinners. See Planning a week of dinners with AI ai week planner . What Can I Make? adds an \"Uses expiring\" note to suggestions that would use up something on its way out. See What Can I Make? Recipe ideas from your pantry what can i make . So the more expiry dates you fill in, the better your meal suggestions get at clearing the fridge. Alerts are in app only This is the part worth being clear about up front. Expiry and low stock alerts appear inside the app only. There are no push notifications and there are no emails. Nothing will buzz your phone or land in your inbox. You have to open Pantry Tab to see what needs attention. The app's own help page mentions that push notifications \"may be added in a future update\", but they do not exist today. Plan around that: open the app before you shop and before you cook, and it will tell you what to use. Adding Pantry Tab to your home screen makes that a one tap habit. See Installing Pantry Tab on your phone install on your phone . Dismissed alerts can come back Dismissing an alert clears it from view now, but it is not permanent. If the item is still inside the expiry window the next time the check runs, the alert reappears. To stop an alert for good, deal with the item: use it up, throw it out and delete it, or edit the expiry date if it was wrong. Low stock reminders Low stock works the same way, from a different field. 1. Open the item and set Low Stock Alert optional to the quantity you want to be warned at — for example 1 for coffee, or 2 for tinned tomatoes. 2. Tap Add Item or Save Changes . 3. When the quantity drops to or below that number, the item is flagged. Low stock items appear in the same Needs your attention card as expiry, and you can add them to your grocery list in one tap from there. That is the fastest route from \"we're nearly out of rice\" to \"rice is on the list\". Keeping quantities current is what makes this work. When you cook, mark what you used with How many to use? and Use rather than leaving the quantity where it was. See Managing your inventory: editing, using up, and batches managing your inventory . If something goes wrong An item is not appearing in Needs your attention. It probably has no expiry date. Open it, edit it, set Expiry Date optional and tap Save Changes . You expected a notification and got nothing. There are none. Alerts are in app only — open the app to see them. An alert you dismissed is back. Expected, while the item is still inside the expiry window. Use, delete or re date the item. An expiry date looks wrong on a scanned item. Dates from a shelf scan or a receipt scan are estimates based on typical shelf life, not readings of the printed date. Edit the item and set the real date. A low stock item is not flagged. Check that Low Stock Alert optional is set on it, and that the quantity is actually at or below the number you set. Something you already used is still showing. Mark it used with Use , or delete the item. Good to know The dashboard looks seven days ahead and one day back. Something expiring in three weeks will not appear yet. An item with several Expiry Batches can be flagged for its oldest batch while the newer one is fine. Alerts are per household, not per person. Everyone sees the same card, and there is no live sync between devices, so refresh if a housemate has already dealt with something. Adding a low stock item to your grocery list does not change your inventory. It only puts the item on the list to buy. Related Adding items to your pantry adding items manually Managing your inventory: editing, using up, and batches managing your inventory Planning a week of dinners with AI ai week planner Building and using your grocery list using the grocery list "}, {"id": "using-the-grocery-list", "title": "Building and using your grocery list", "category": "Grocery List", "summary": "How to add, edit, sort and check off items on the Grocery tab, and how the To Buy and In Cart lists work while you shop.", "keywords": ["grocery list", "shopping list", "add item", "to buy", "in cart", "clear all", "category", "unit", "est price", "location filter", "check off"], "html": "<p>The <strong>Grocery<\/strong> tab is the shared shopping list for your whole household. Anyone in the household sees the same list and can change it, so one person can add milk at home while another is standing in the store.<\/p>\n<h2 id=\"the-header-and-toolbar\">The header and toolbar<\/h2>\n<p>At the top you get <strong>Grocery List<\/strong> and a count of how many items are still to buy, shown as \"{n} items to buy\".<\/p>\n<p>The toolbar holds:<\/p>\n<ul>\n<li>A location filter — <strong>All Locations<\/strong> plus each of your locations. This only appears if your household has more than one location.<\/li>\n<li><strong>Calculator<\/strong> — turns the shopping calculator and budget on. See <a href=\"#shopping-calculator\">The shopping calculator and budgets<\/a>.<\/li>\n<li><strong>Scan<\/strong> — adds an item by scanning its barcode.<\/li>\n<li><strong>Generate with AI<\/strong> — builds suggestions from your pantry gaps. It reads <strong>Generating...<\/strong> while it works. See <a href=\"#ai-grocery-list\">Building your grocery list with AI<\/a>.<\/li>\n<li><strong>Add Item<\/strong> — opens the dialog below.<\/li>\n<\/ul>\n<h2 id=\"adding-an-item-by-hand\">Adding an item by hand<\/h2>\n<p>Tap <strong>Add Item<\/strong> and fill in the <strong>Add Grocery Item<\/strong> dialog:<\/p>\n<ol>\n<li><strong>Item Name<\/strong> — what you are buying.<\/li>\n<li><strong>Quantity<\/strong> — how many.<\/li>\n<li><strong>Unit<\/strong> — count, lbs, oz, kg, g, gallon, liter, loaf, pack, bunch.<\/li>\n<li><strong>Category<\/strong> — <strong>🥬 Produce<\/strong>, <strong>🥛 Dairy<\/strong>, <strong>🥩 Meat<\/strong>, <strong>🍞 Bakery<\/strong>, <strong>🧊 Frozen<\/strong>, <strong>🥤 Beverages<\/strong>, <strong>🍪 Snacks<\/strong>, or <strong>📦 Other<\/strong>.<\/li>\n<li><strong>Est. Price ($)<\/strong> — roughly what you expect it to cost.<\/li>\n<li><strong>Location<\/strong> — which location the item is for. This field only appears if you have more than one location.<\/li>\n<li>Tap <strong>Add to List<\/strong>.<\/li>\n<\/ol>\n<h2 id=\"to-buy-and-in-cart\">To Buy and In Cart<\/h2>\n<p>The list is split in two.<\/p>\n<p><strong>To Buy<\/strong> is everything still to get. Each row shows a checkbox, the item name, a coupon badge if a Kroger coupon matched it, an allergy badge if it matches a household allergy, and a detail line reading \"{qty} {unit} • {Category} • ~$X.XX\". If the item is tagged to a location, that appears on its own line. Each row also has a pencil for editing and a delete control.<\/p>\n<p><strong>In Cart (N)<\/strong> collects everything you have checked off. Those items show struck through.<\/p>\n<ul>\n<li>Tap an item's checkbox in <strong>To Buy<\/strong> to move it to <strong>In Cart<\/strong> as you pick it up in the store.<\/li>\n<li>Tap an item in <strong>In Cart<\/strong> to move it back to <strong>To Buy<\/strong> if you change your mind or put it back on the shelf.<\/li>\n<li><strong>Clear all<\/strong> in the <strong>In Cart<\/strong> header empties that section. Use it when you get home and the shop is done.<\/li>\n<\/ul>\n<h2 id=\"editing-and-deleting\">Editing and deleting<\/h2>\n<p>Tap the pencil on a row to open <strong>Edit Grocery Item<\/strong>. The same fields are there, so you can correct a quantity, change the category, or update the estimated price.<\/p>\n<p>Delete removes the row from the list entirely. Deleting a grocery item does not touch your pantry inventory.<\/p>\n<h2 id=\"how-the-list-is-sorted\">How the list is sorted<\/h2>\n<p>Items sort by location name, and items with no location sort last. That is the only sort — there is no way to sort or group by category, and no way to sort by price. The category is still shown on each row, so you can scan for it as you walk the aisles.<\/p>\n<h2 id=\"the-empty-state\">The empty state<\/h2>\n<p>With nothing on the list you see <strong>Your grocery list is empty<\/strong> and an <strong>Add your first item<\/strong> prompt.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>The location filter is missing.<\/strong> It only appears when your household has more than one location. With a single location there is nothing to filter, so the control is hidden.<\/li>\n<li><strong>The Location field is missing from the Add Grocery Item dialog.<\/strong> Same reason — it appears only for households with more than one location.<\/li>\n<li><strong>An item you added is not showing for someone else in your household.<\/strong> There is no live sync between devices. Ask them to refresh the app.<\/li>\n<li><strong>An item vanished from the list.<\/strong> Anyone in your household can edit or delete anything on the shared list. Check with them before re-adding.<\/li>\n<li><strong>A location was deleted and items lost their tag.<\/strong> Deleting a location deletes that location's inventory items, but grocery items survive — they lose their location tag and sort to the bottom.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>The grocery list is shared with everyone in your household. There is no private grocery list and no per-member privacy inside a household.<\/li>\n<li>The grocery list is shared across locations too, even though each location keeps its own inventory.<\/li>\n<li>Estimated prices are only estimates. Anything the AI filled in is a guess in US dollars, not a real store price.<\/li>\n<li>Checking an item off does not add it to your pantry inventory. Adding what you bought to the pantry is a separate step on the <strong>Inventory<\/strong> tab.<\/li>\n<li>An allergy badge on a row is based on keyword matching, so it can miss things. Read the product label. See <a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a>.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#ai-grocery-list\">Building your grocery list with AI<\/a><\/li>\n<li><a href=\"#shopping-calculator\">The shopping calculator and budgets<\/a><\/li>\n<li><a href=\"#coupons\">Coupons<\/a><\/li>\n<li><a href=\"#kroger-send-to-cart\">Sending your list to a Kroger pickup cart<\/a><\/li>\n<\/ul>", "text": "The Grocery tab is the shared shopping list for your whole household. Anyone in the household sees the same list and can change it, so one person can add milk at home while another is standing in the store. The header and toolbar At the top you get Grocery List and a count of how many items are still to buy, shown as \"{n} items to buy\". The toolbar holds: A location filter — All Locations plus each of your locations. This only appears if your household has more than one location. Calculator — turns the shopping calculator and budget on. See The shopping calculator and budgets shopping calculator . Scan — adds an item by scanning its barcode. Generate with AI — builds suggestions from your pantry gaps. It reads Generating... while it works. See Building your grocery list with AI ai grocery list . Add Item — opens the dialog below. Adding an item by hand Tap Add Item and fill in the Add Grocery Item dialog: 1. Item Name — what you are buying. 2. Quantity — how many. 3. Unit — count, lbs, oz, kg, g, gallon, liter, loaf, pack, bunch. 4. Category — 🥬 Produce , 🥛 Dairy , 🥩 Meat , 🍞 Bakery , 🧊 Frozen , 🥤 Beverages , 🍪 Snacks , or 📦 Other . 5. Est. Price $ — roughly what you expect it to cost. 6. Location — which location the item is for. This field only appears if you have more than one location. 7. Tap Add to List . To Buy and In Cart The list is split in two. To Buy is everything still to get. Each row shows a checkbox, the item name, a coupon badge if a Kroger coupon matched it, an allergy badge if it matches a household allergy, and a detail line reading \"{qty} {unit} • {Category} • ~$X.XX\". If the item is tagged to a location, that appears on its own line. Each row also has a pencil for editing and a delete control. In Cart N collects everything you have checked off. Those items show struck through. Tap an item's checkbox in To Buy to move it to In Cart as you pick it up in the store. Tap an item in In Cart to move it back to To Buy if you change your mind or put it back on the shelf. Clear all in the In Cart header empties that section. Use it when you get home and the shop is done. Editing and deleting Tap the pencil on a row to open Edit Grocery Item . The same fields are there, so you can correct a quantity, change the category, or update the estimated price. Delete removes the row from the list entirely. Deleting a grocery item does not touch your pantry inventory. How the list is sorted Items sort by location name, and items with no location sort last. That is the only sort — there is no way to sort or group by category, and no way to sort by price. The category is still shown on each row, so you can scan for it as you walk the aisles. The empty state With nothing on the list you see Your grocery list is empty and an Add your first item prompt. If something goes wrong The location filter is missing. It only appears when your household has more than one location. With a single location there is nothing to filter, so the control is hidden. The Location field is missing from the Add Grocery Item dialog. Same reason — it appears only for households with more than one location. An item you added is not showing for someone else in your household. There is no live sync between devices. Ask them to refresh the app. An item vanished from the list. Anyone in your household can edit or delete anything on the shared list. Check with them before re adding. A location was deleted and items lost their tag. Deleting a location deletes that location's inventory items, but grocery items survive — they lose their location tag and sort to the bottom. Good to know The grocery list is shared with everyone in your household. There is no private grocery list and no per member privacy inside a household. The grocery list is shared across locations too, even though each location keeps its own inventory. Estimated prices are only estimates. Anything the AI filled in is a guess in US dollars, not a real store price. Checking an item off does not add it to your pantry inventory. Adding what you bought to the pantry is a separate step on the Inventory tab. An allergy badge on a row is based on keyword matching, so it can miss things. Read the product label. See How allergy warnings work, and their limits how allergy warnings work . Related Building your grocery list with AI ai grocery list The shopping calculator and budgets shopping calculator Coupons coupons Sending your list to a Kroger pickup cart kroger send to cart "}, {"id": "ai-grocery-list", "title": "Building your grocery list with AI", "category": "Grocery List", "summary": "The two AI ways to fill your grocery list, the difference between them, Smart Add from a recipe, and why prices are estimates.", "keywords": ["generate with ai", "build my grocery list", "smart add", "missing ingredients", "pantry gaps", "estimated price", "ai grocery", "select missing only"], "html": "<p>Pantry Tab AI can fill your grocery list from what you already own, what is running low, and what your meal plan needs. There are two ways in, and they behave differently — the difference matters.<\/p>\n<h2 id=\"the-two-entry-points\">The two entry points<\/h2>\n<p><strong>Generate with AI<\/strong> on the <strong>Grocery<\/strong> tab looks at pantry gaps and low-stock items and <strong>adds the results straight to your list<\/strong>. There is no preview and no review step. The button reads <strong>Generating...<\/strong> while it works, and the items appear on your list when it finishes.<\/p>\n<p><strong>Build my grocery list<\/strong> on the <strong>Home<\/strong> dashboard, in the <strong>Pantry Tab AI<\/strong> panel (\"Fills pantry gaps automatically\"), gives you a preview and a review step first. Nothing is added until you approve it. If you like to check before things land on the list, start here.<\/p>\n<h2 id=\"the-dashboard-flow-step-by-step\">The dashboard flow, step by step<\/h2>\n<ol>\n<li>On the <strong>Home<\/strong> tab, find <strong>Build my grocery list<\/strong> in the <strong>Pantry Tab AI<\/strong> panel and tap <strong>Try it →<\/strong>.<\/li>\n<li>You see a preview of what the AI will use: your <strong>Pantry inventory<\/strong>, <strong>Household allergies<\/strong> (shown as \"will be avoided\"), <strong>Items already on list<\/strong>, and your meal plan. Allergies are described generically rather than itemised, so nobody's allergies are spelled out on screen.<\/li>\n<li>The AI produces suggestions and you get \"Pick what to add. Uncheck anything you don't need.\" Go through the list and uncheck anything you already have or do not want this week.<\/li>\n<li>Confirm to add the checked items to your grocery list.<\/li>\n<\/ol>\n<h2 id=\"what-the-ai-skips\">What the AI skips<\/h2>\n<ul>\n<li>Anything already sitting unchecked on your grocery list — it will not add a duplicate.<\/li>\n<li>Anything containing a household allergen.<\/li>\n<\/ul>\n<h2 id=\"smart-add-from-a-recipe\">Smart Add from a recipe<\/h2>\n<p>You can also fill your list from a single recipe. <strong>Smart Add to Grocery List<\/strong> shows the recipe's ingredients with a <strong>Not in inventory<\/strong> view, plus <strong>Select All<\/strong> and <strong>Select Missing Only<\/strong>.<\/p>\n<ul>\n<li><strong>Select Missing Only<\/strong> is the usual choice — it ticks only the ingredients you do not already have.<\/li>\n<li><strong>Select All<\/strong> ticks everything in the recipe, useful when you want fresh stock of things you are low on.<\/li>\n<\/ul>\n<p>If you already own everything, you see <strong>\"All ingredients are already in your pantry!\"<\/strong> and there is nothing to add.<\/p>\n<h2 id=\"prices-are-estimates\">Prices are estimates<\/h2>\n<p>Every price the AI puts on an item is an <strong>estimate in US dollars, not a real store price<\/strong>. It has not looked up your store, your region, or today's shelf tag. Treat the numbers as a rough total for budgeting, and enter what you actually paid as you shop — see <a href=\"#shopping-calculator\">The shopping calculator and budgets<\/a>.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"All ingredients are already in your pantry!\"<\/strong> — nothing was missing, so nothing was added. This is a normal result, not an error.<\/li>\n<li><strong>Failed to generate shopping list<\/strong> — the AI could not finish. Wait a moment and try again.<\/li>\n<li><strong>Rate limit reached. Please try again in a moment.<\/strong> — you used an AI feature too quickly. Wait and retry.<\/li>\n<li><strong>AI credits exhausted. Please add credits to continue.<\/strong> — a service-side limit has been hit. Contact support.<\/li>\n<li><strong>Items appeared on your list without you approving them.<\/strong> You used <strong>Generate with AI<\/strong> on the <strong>Grocery<\/strong> tab, which adds directly. Delete anything you do not want, and use <strong>Build my grocery list<\/strong> on the dashboard next time.<\/li>\n<li><strong>A suggestion contains something a household member is allergic to.<\/strong> The AI is instructed to avoid household allergens, but matching is keyword-based and can miss things. Always read the product label. See <a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a>.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>The confirmation toast reads <strong>Added {count} items to your grocery list!<\/strong> so you can check the number against what you expected.<\/li>\n<li>Suggestions are only as good as your inventory. If your pantry is out of date, the AI will suggest things you already own — keep the <strong>Inventory<\/strong> tab current for better results.<\/li>\n<li>The generated items land on the shared household list, so everyone sees them straight away.<\/li>\n<li>Categories and estimated prices come from the AI too. You can correct any of them with the pencil on the row.<\/li>\n<li>Nothing the AI adds is locked. Edit, delete or re-check anything.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#using-the-grocery-list\">Building and using your grocery list<\/a><\/li>\n<li><a href=\"#shopping-calculator\">The shopping calculator and budgets<\/a><\/li>\n<li><a href=\"#what-can-i-make\">What Can I Make? Recipe ideas from your pantry<\/a><\/li>\n<li><a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a><\/li>\n<\/ul>", "text": "Pantry Tab AI can fill your grocery list from what you already own, what is running low, and what your meal plan needs. There are two ways in, and they behave differently — the difference matters. The two entry points Generate with AI on the Grocery tab looks at pantry gaps and low stock items and adds the results straight to your list . There is no preview and no review step. The button reads Generating... while it works, and the items appear on your list when it finishes. Build my grocery list on the Home dashboard, in the Pantry Tab AI panel \"Fills pantry gaps automatically\" , gives you a preview and a review step first. Nothing is added until you approve it. If you like to check before things land on the list, start here. The dashboard flow, step by step 1. On the Home tab, find Build my grocery list in the Pantry Tab AI panel and tap Try it → . 2. You see a preview of what the AI will use: your Pantry inventory , Household allergies shown as \"will be avoided\" , Items already on list , and your meal plan. Allergies are described generically rather than itemised, so nobody's allergies are spelled out on screen. 3. The AI produces suggestions and you get \"Pick what to add. Uncheck anything you don't need.\" Go through the list and uncheck anything you already have or do not want this week. 4. Confirm to add the checked items to your grocery list. What the AI skips Anything already sitting unchecked on your grocery list — it will not add a duplicate. Anything containing a household allergen. Smart Add from a recipe You can also fill your list from a single recipe. Smart Add to Grocery List shows the recipe's ingredients with a Not in inventory view, plus Select All and Select Missing Only . Select Missing Only is the usual choice — it ticks only the ingredients you do not already have. Select All ticks everything in the recipe, useful when you want fresh stock of things you are low on. If you already own everything, you see \"All ingredients are already in your pantry!\" and there is nothing to add. Prices are estimates Every price the AI puts on an item is an estimate in US dollars, not a real store price . It has not looked up your store, your region, or today's shelf tag. Treat the numbers as a rough total for budgeting, and enter what you actually paid as you shop — see The shopping calculator and budgets shopping calculator . If something goes wrong \"All ingredients are already in your pantry!\" — nothing was missing, so nothing was added. This is a normal result, not an error. Failed to generate shopping list — the AI could not finish. Wait a moment and try again. Rate limit reached. Please try again in a moment. — you used an AI feature too quickly. Wait and retry. AI credits exhausted. Please add credits to continue. — a service side limit has been hit. Contact support. Items appeared on your list without you approving them. You used Generate with AI on the Grocery tab, which adds directly. Delete anything you do not want, and use Build my grocery list on the dashboard next time. A suggestion contains something a household member is allergic to. The AI is instructed to avoid household allergens, but matching is keyword based and can miss things. Always read the product label. See How allergy warnings work, and their limits how allergy warnings work . Good to know The confirmation toast reads Added {count} items to your grocery list! so you can check the number against what you expected. Suggestions are only as good as your inventory. If your pantry is out of date, the AI will suggest things you already own — keep the Inventory tab current for better results. The generated items land on the shared household list, so everyone sees them straight away. Categories and estimated prices come from the AI too. You can correct any of them with the pencil on the row. Nothing the AI adds is locked. Edit, delete or re check anything. Related Building and using your grocery list using the grocery list The shopping calculator and budgets shopping calculator What Can I Make? Recipe ideas from your pantry what can i make How allergy warnings work, and their limits how allergy warnings work "}, {"id": "shopping-calculator", "title": "The shopping calculator and budgets", "category": "Grocery List", "summary": "Turn on the shopping calculator to set a budget, watch your running total, and record what you actually paid for each item as you shop.", "keywords": ["calculator", "budget", "estimated total", "spent so far", "remaining", "over budget", "actual price", "running total", "shopping"], "html": "<p>The shopping calculator turns your grocery list into a running total for one shopping trip. You set a budget, and as you check items off you type in what you actually paid.<\/p>\n<h2 id=\"turning-it-on\">Turning it on<\/h2>\n<p>Tap <strong>Calculator<\/strong> in the toolbar on the <strong>Grocery<\/strong> tab. A card titled <strong>Shopping Calculator<\/strong> appears above your list.<\/p>\n<h2 id=\"the-four-figures\">The four figures<\/h2>\n<ul>\n<li><strong>Budget<\/strong> — what you plan to spend. It defaults to 100 and you can type over it.<\/li>\n<li><strong>Estimated Total<\/strong> — the sum of the estimated prices on your list.<\/li>\n<li><strong>Spent So Far<\/strong> — the total of the actual prices you have entered on checked items.<\/li>\n<li><strong>Remaining<\/strong> — what is left of your budget.<\/li>\n<\/ul>\n<p>If you go past your budget the card shows <strong>⚠️ You're over budget!<\/strong>.<\/p>\n<h2 id=\"entering-what-you-actually-paid\">Entering what you actually paid<\/h2>\n<p>With the calculator on, each checked item gets a small price box. As you pick something up:<\/p>\n<ol>\n<li>Check the item off so it moves to <strong>In Cart<\/strong>.<\/li>\n<li>Type the price on the shelf tag or till display into that item's price box.<\/li>\n<li>Watch <strong>Spent So Far<\/strong> and <strong>Remaining<\/strong> update.<\/li>\n<\/ol>\n<p>The estimated price stays where it is. The number you type is separate, and it is the one that counts towards <strong>Spent So Far<\/strong>.<\/p>\n<h2 id=\"estimated-prices-versus-actual-prices\">Estimated prices versus actual prices<\/h2>\n<ul>\n<li><strong>Estimated prices<\/strong> are guesses. Anything the AI added is an estimate in US dollars, not a real store price, and anything you typed into <strong>Est. Price ($)<\/strong> yourself is your own guess.<\/li>\n<li><strong>Actual prices<\/strong> are what you type into the calculator's price box while you shop. They are the only figures in the calculator that reflect a real receipt.<\/li>\n<\/ul>\n<p>Expect <strong>Estimated Total<\/strong> and <strong>Spent So Far<\/strong> to disagree. That gap is the point of the exercise.<\/p>\n<h2 id=\"getting-prices-into-price-tracking\">Getting prices into price tracking<\/h2>\n<p>The <strong>Prices<\/strong> tab compares what you pay across stores over time. It is fed from the price you record against a real item, not from a running total:<\/p>\n<ul>\n<li>When you add what you bought to your pantry, fill in <strong>Price (optional)<\/strong> and <strong>Store (optional)<\/strong> on the item. That price is captured automatically.<\/li>\n<li>Or scan the receipt on the way home — receipt scanning reads the store name, the date, and the price of each line item.<\/li>\n<li>You can also record one directly with <strong>Log New Price<\/strong> on the <strong>Prices<\/strong> tab.<\/li>\n<\/ul>\n<p>So the prices you note in the calculator are worth carrying over when you unpack. See <a href=\"#price-tracking\">Tracking and comparing prices<\/a>.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>Your budget went back to 100.<\/strong> The budget is not saved. It resets to 100 every time the page reloads. Write the figure down if you need it to survive a refresh.<\/li>\n<li><strong>The prices you typed disappeared after a refresh.<\/strong> Re-check the items and re-enter them, or scan the receipt instead when you get home.<\/li>\n<li><strong>There is no price box on an item.<\/strong> The box only appears on checked items while the calculator is on. Check the item off first.<\/li>\n<li><strong>Remaining looks wrong.<\/strong> It works from <strong>Budget<\/strong> minus <strong>Spent So Far<\/strong>, so any checked item without an actual price will not be counted yet.<\/li>\n<li><strong>Estimated Total is far off the real bill.<\/strong> Estimated prices are guesses and do not know your store, your region, or today's shelf tag.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>The budget is per session, not per household. It is not shared with anyone else and it is not stored.<\/li>\n<li>The calculator counts what is on your list. Anything you pick up in the store without adding to the list will not appear in <strong>Spent So Far<\/strong>.<\/li>\n<li>The calculator adds up item prices as you enter them.<\/li>\n<li>Coupon savings shown on the <strong>Grocery<\/strong> tab are estimates and are not deducted from <strong>Spent So Far<\/strong>. See <a href=\"#coupons\">Coupons<\/a>.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#using-the-grocery-list\">Building and using your grocery list<\/a><\/li>\n<li><a href=\"#price-tracking\">Tracking and comparing prices<\/a><\/li>\n<li><a href=\"#ai-grocery-list\">Building your grocery list with AI<\/a><\/li>\n<li><a href=\"#scanning-a-receipt\">Scanning a grocery receipt<\/a><\/li>\n<\/ul>", "text": "The shopping calculator turns your grocery list into a running total for one shopping trip. You set a budget, and as you check items off you type in what you actually paid. Turning it on Tap Calculator in the toolbar on the Grocery tab. A card titled Shopping Calculator appears above your list. The four figures Budget — what you plan to spend. It defaults to 100 and you can type over it. Estimated Total — the sum of the estimated prices on your list. Spent So Far — the total of the actual prices you have entered on checked items. Remaining — what is left of your budget. If you go past your budget the card shows ⚠️ You're over budget! . Entering what you actually paid With the calculator on, each checked item gets a small price box. As you pick something up: 1. Check the item off so it moves to In Cart . 2. Type the price on the shelf tag or till display into that item's price box. 3. Watch Spent So Far and Remaining update. The estimated price stays where it is. The number you type is separate, and it is the one that counts towards Spent So Far . Estimated prices versus actual prices Estimated prices are guesses. Anything the AI added is an estimate in US dollars, not a real store price, and anything you typed into Est. Price $ yourself is your own guess. Actual prices are what you type into the calculator's price box while you shop. They are the only figures in the calculator that reflect a real receipt. Expect Estimated Total and Spent So Far to disagree. That gap is the point of the exercise. Getting prices into price tracking The Prices tab compares what you pay across stores over time. It is fed from the price you record against a real item, not from a running total: When you add what you bought to your pantry, fill in Price optional and Store optional on the item. That price is captured automatically. Or scan the receipt on the way home — receipt scanning reads the store name, the date, and the price of each line item. You can also record one directly with Log New Price on the Prices tab. So the prices you note in the calculator are worth carrying over when you unpack. See Tracking and comparing prices price tracking . If something goes wrong Your budget went back to 100. The budget is not saved. It resets to 100 every time the page reloads. Write the figure down if you need it to survive a refresh. The prices you typed disappeared after a refresh. Re check the items and re enter them, or scan the receipt instead when you get home. There is no price box on an item. The box only appears on checked items while the calculator is on. Check the item off first. Remaining looks wrong. It works from Budget minus Spent So Far , so any checked item without an actual price will not be counted yet. Estimated Total is far off the real bill. Estimated prices are guesses and do not know your store, your region, or today's shelf tag. Good to know The budget is per session, not per household. It is not shared with anyone else and it is not stored. The calculator counts what is on your list. Anything you pick up in the store without adding to the list will not appear in Spent So Far . The calculator adds up item prices as you enter them. Coupon savings shown on the Grocery tab are estimates and are not deducted from Spent So Far . See Coupons coupons . Related Building and using your grocery list using the grocery list Tracking and comparing prices price tracking Building your grocery list with AI ai grocery list Scanning a grocery receipt scanning a receipt "}, {"id": "coupons", "title": "Coupons", "category": "Grocery List", "summary": "How Kroger coupons are matched to your grocery list, what the badges mean, and why you still have to clip them in the Kroger app.", "keywords": ["coupons", "kroger coupons", "clip", "savings", "digital coupons", "coupon badge", "discounts", "grocery savings"], "html": "<p>Pantry Tab checks your grocery list against Kroger's current digital coupons and flags the matches, so you know what is worth clipping before you shop.<\/p>\n<h2 id=\"how-coupons-load\">How coupons load<\/h2>\n<p>Coupons are <strong>Kroger only<\/strong>. No other store's coupons are supported.<\/p>\n<p>They load automatically when you open the <strong>Grocery<\/strong> tab. There is no button to press and nothing to set up.<\/p>\n<h2 id=\"what-you-see\">What you see<\/h2>\n<ul>\n<li>A <strong>summary card<\/strong> near the top of the list showing how many of your items matched a coupon and the estimated savings.<\/li>\n<li>A <strong>coupon badge<\/strong> on each matching row in <strong>To Buy<\/strong>.<\/li>\n<\/ul>\n<p>Matching works by comparing the items on your grocery list against the current Kroger coupon offers. Something generic like \"milk\" will match more often than a very specific item name. If nothing on your list lines up with a current offer, no badges appear.<\/p>\n<h2 id=\"clipping-the-coupons\">Clipping the coupons<\/h2>\n<p>Pantry Tab shows you the coupons. It <strong>cannot clip them for you and cannot apply them<\/strong>. The on-screen copy says it plainly:<\/p>\n<ul>\n<li>\"Open your store app to clip these coupons\"<\/li>\n<li>\"Coupons refresh daily. Check your store app to clip.\"<\/li>\n<\/ul>\n<p>So the routine is:<\/p>\n<ol>\n<li>Look at the badged items on your list in Pantry Tab.<\/li>\n<li>Open the Kroger app.<\/li>\n<li>Find and clip those coupons there.<\/li>\n<li>Shop, using your Kroger account at the till or at pickup so the clipped coupons apply.<\/li>\n<\/ol>\n<p>A coupon you never clipped in the Kroger app will not come off your bill, no matter what Pantry Tab showed.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>No coupons appear at all.<\/strong> Coupons may be unavailable, in which case the list comes back empty. Nothing is broken on your side, and there is nothing to retry.<\/li>\n<li><strong>A badge disappeared.<\/strong> Coupons refresh daily. An offer that existed yesterday may be gone today.<\/li>\n<li><strong>The saving you got was less than the figure shown.<\/strong> Savings figures are estimates. The real discount depends on the coupon's terms, the size or brand you bought, and whether you clipped it in the Kroger app.<\/li>\n<li><strong>You clipped a coupon but the badge is still showing.<\/strong> Pantry Tab cannot see what you have clipped in the Kroger app. The badge only tells you a coupon exists, not whether you have taken it.<\/li>\n<li><strong>A coupon matched the wrong product.<\/strong> Matching is by item name, so a generic name can pick up an offer for a brand you were not going to buy. Check the coupon's details in the Kroger app.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Coupons are Kroger only. Pantry Tab does not show offers from any other store.<\/li>\n<li>You do not need a connected Kroger account to see coupons on your list — they load with the tab. You do need the Kroger app to clip them.<\/li>\n<li>Coupon savings are not deducted from <strong>Spent So Far<\/strong> in the shopping calculator. Enter what you actually paid at the till. See <a href=\"#shopping-calculator\">The shopping calculator and budgets<\/a>.<\/li>\n<li>Coupon badges appear on the <strong>To Buy<\/strong> list. Once an item is in <strong>In Cart<\/strong> you are done with it.<\/li>\n<li>Clipping is entirely on Kroger's side. Pantry Tab never touches your coupon wallet.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#using-the-grocery-list\">Building and using your grocery list<\/a><\/li>\n<li><a href=\"#kroger-connect\">Connecting your Kroger account<\/a><\/li>\n<li><a href=\"#kroger-send-to-cart\">Sending your list to a Kroger pickup cart<\/a><\/li>\n<li><a href=\"#price-tracking\">Tracking and comparing prices<\/a><\/li>\n<\/ul>", "text": "Pantry Tab checks your grocery list against Kroger's current digital coupons and flags the matches, so you know what is worth clipping before you shop. How coupons load Coupons are Kroger only . No other store's coupons are supported. They load automatically when you open the Grocery tab. There is no button to press and nothing to set up. What you see A summary card near the top of the list showing how many of your items matched a coupon and the estimated savings. A coupon badge on each matching row in To Buy . Matching works by comparing the items on your grocery list against the current Kroger coupon offers. Something generic like \"milk\" will match more often than a very specific item name. If nothing on your list lines up with a current offer, no badges appear. Clipping the coupons Pantry Tab shows you the coupons. It cannot clip them for you and cannot apply them . The on screen copy says it plainly: \"Open your store app to clip these coupons\" \"Coupons refresh daily. Check your store app to clip.\" So the routine is: 1. Look at the badged items on your list in Pantry Tab. 2. Open the Kroger app. 3. Find and clip those coupons there. 4. Shop, using your Kroger account at the till or at pickup so the clipped coupons apply. A coupon you never clipped in the Kroger app will not come off your bill, no matter what Pantry Tab showed. If something goes wrong No coupons appear at all. Coupons may be unavailable, in which case the list comes back empty. Nothing is broken on your side, and there is nothing to retry. A badge disappeared. Coupons refresh daily. An offer that existed yesterday may be gone today. The saving you got was less than the figure shown. Savings figures are estimates. The real discount depends on the coupon's terms, the size or brand you bought, and whether you clipped it in the Kroger app. You clipped a coupon but the badge is still showing. Pantry Tab cannot see what you have clipped in the Kroger app. The badge only tells you a coupon exists, not whether you have taken it. A coupon matched the wrong product. Matching is by item name, so a generic name can pick up an offer for a brand you were not going to buy. Check the coupon's details in the Kroger app. Good to know Coupons are Kroger only. Pantry Tab does not show offers from any other store. You do not need a connected Kroger account to see coupons on your list — they load with the tab. You do need the Kroger app to clip them. Coupon savings are not deducted from Spent So Far in the shopping calculator. Enter what you actually paid at the till. See The shopping calculator and budgets shopping calculator . Coupon badges appear on the To Buy list. Once an item is in In Cart you are done with it. Clipping is entirely on Kroger's side. Pantry Tab never touches your coupon wallet. Related Building and using your grocery list using the grocery list Connecting your Kroger account kroger connect Sending your list to a Kroger pickup cart kroger send to cart Tracking and comparing prices price tracking "}, {"id": "kroger-connect", "title": "Connecting your Kroger account", "category": "Grocery List", "summary": "Link your Kroger account in Profile, pick a nearby store by ZIP, and disconnect again — plus what to do when the connection times out.", "keywords": ["kroger", "connect", "connected accounts", "link account", "store", "zip", "select store", "disconnect", "pickup", "profile"], "html": "<p>Connecting your Kroger account lets Pantry Tab push your grocery list into a Kroger pickup cart. It is the only store integration in Pantry Tab, and it is optional — the rest of the app works without it.<\/p>\n<h2 id=\"where-it-lives\">Where it lives<\/h2>\n<p>Go to <strong>Profile<\/strong> → <strong>Connected Accounts<\/strong> (\"Link external services to power features in PantryTab\"). The <strong>Kroger<\/strong> row shows \"One-tap pickup ordering\", a status badge (<strong>Not connected<\/strong>, Connected, or Loading), and a <strong>Connect<\/strong> or <strong>Disconnect<\/strong> button.<\/p>\n<h2 id=\"connecting\">Connecting<\/h2>\n<ol>\n<li>Tap <strong>Connect<\/strong> on the <strong>Kroger<\/strong> row.<\/li>\n<li>You are sent to Kroger to sign in. This happens on <strong>Kroger's own site<\/strong> — you type your Kroger email and password there, not in Pantry Tab.<\/li>\n<li>Approve the connection.<\/li>\n<li>You come back to Pantry Tab and see <strong>Kroger account connected!<\/strong><\/li>\n<\/ol>\n<p>The link Pantry Tab sends you out on is valid for <strong>15 minutes<\/strong>. If you take longer than that — hunting for a password, getting interrupted — you will come back to a state-expired error. Nothing is broken: press <strong>Connect<\/strong> again and go through it more quickly.<\/p>\n<h2 id=\"choosing-your-store\">Choosing your store<\/h2>\n<p>Connecting alone is not enough. Pantry Tab also needs to know which Kroger store you use.<\/p>\n<ol>\n<li>In the <strong>Kroger<\/strong> row, tap <strong>Choose your store<\/strong> (it shows <strong>No store selected<\/strong> until you do).<\/li>\n<li>Enter a ZIP code. Both a 5-digit ZIP and ZIP+4 work.<\/li>\n<li>Tap <strong>Search<\/strong>. You get up to <strong>5 nearby stores<\/strong>.<\/li>\n<li>Tap <strong>Select<\/strong> on the one you want.<\/li>\n<li>You see <strong>Store set to {Name}<\/strong>, and the row now reads <strong>Store:<\/strong> {name}.<\/li>\n<\/ol>\n<p>The store you are using shows <strong>Selected<\/strong> and its button is disabled, so you cannot pick the same store twice.<\/p>\n<p>To switch later, tap the <strong>Change<\/strong> link next to <strong>Store:<\/strong> and search again.<\/p>\n<h2 id=\"disconnecting\">Disconnecting<\/h2>\n<p>Tap <strong>Disconnect<\/strong> on the <strong>Kroger<\/strong> row. Your browser asks you to confirm with a plain prompt. Confirm and you see <strong>Kroger account disconnected<\/strong>.<\/p>\n<p>Disconnecting removes the link between Pantry Tab and Kroger. Your grocery list, inventory and everything else stay exactly as they are.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>You took too long signing in and hit a state-expired error.<\/strong> The connection link is only valid for 15 minutes. Tap <strong>Connect<\/strong> again and complete the sign-in promptly.<\/li>\n<li><strong>\"No Kroger stores found near that ZIP\"<\/strong> — no store came back for that ZIP code. Check the digits and try a nearby ZIP.<\/li>\n<li><strong>\"Kroger account not connected. Please connect Kroger first.\"<\/strong> — you tried to send your list to a cart without a connected account. Connect first.<\/li>\n<li><strong>\"No Kroger store selected. Set one in Profile.\"<\/strong> — you are connected but have not chosen a store. Use <strong>Choose your store<\/strong>.<\/li>\n<li><strong>\"No store location selected. Provide locationId or set a preferred store.\"<\/strong> — same fix: pick a store in <strong>Profile<\/strong> → <strong>Connected Accounts<\/strong>.<\/li>\n<li><strong>The status badge is stuck on Loading.<\/strong> Refresh the page. Pantry Tab does not sync live between devices, so a stale screen is common after changing something elsewhere.<\/li>\n<li><strong>The search returned a store you do not use.<\/strong> Only up to 5 nearby stores come back per search. Try the ZIP of the area your store is actually in.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li><strong>Pantry Tab never sees your Kroger password.<\/strong> You sign in on Kroger's own site and Kroger tells Pantry Tab the connection is approved.<\/li>\n<li>A connected Kroger account is <strong>required<\/strong> for sending your list to a cart. See <a href=\"#kroger-send-to-cart\">Sending your list to a Kroger pickup cart<\/a>.<\/li>\n<li>Your Kroger connection is <strong>private to you<\/strong>, not shared with your household. Other members of your household connect their own accounts if they want to send lists.<\/li>\n<li>The connection is <strong>pickup only<\/strong>. There is no delivery option anywhere in Pantry Tab.<\/li>\n<li>You do not need to connect Kroger to see coupons on your grocery list — those load on their own. See <a href=\"#coupons\">Coupons<\/a>.<\/li>\n<li>Pantry Tab can push items to your Kroger cart but cannot read the cart back, so it never learns what you actually bought.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#kroger-send-to-cart\">Sending your list to a Kroger pickup cart<\/a><\/li>\n<li><a href=\"#coupons\">Coupons<\/a><\/li>\n<li><a href=\"#profile-and-settings\">Your profile and connected accounts<\/a><\/li>\n<li><a href=\"#using-the-grocery-list\">Building and using your grocery list<\/a><\/li>\n<\/ul>", "text": "Connecting your Kroger account lets Pantry Tab push your grocery list into a Kroger pickup cart. It is the only store integration in Pantry Tab, and it is optional — the rest of the app works without it. Where it lives Go to Profile → Connected Accounts \"Link external services to power features in PantryTab\" . The Kroger row shows \"One tap pickup ordering\", a status badge Not connected , Connected, or Loading , and a Connect or Disconnect button. Connecting 1. Tap Connect on the Kroger row. 2. You are sent to Kroger to sign in. This happens on Kroger's own site — you type your Kroger email and password there, not in Pantry Tab. 3. Approve the connection. 4. You come back to Pantry Tab and see Kroger account connected! The link Pantry Tab sends you out on is valid for 15 minutes . If you take longer than that — hunting for a password, getting interrupted — you will come back to a state expired error. Nothing is broken: press Connect again and go through it more quickly. Choosing your store Connecting alone is not enough. Pantry Tab also needs to know which Kroger store you use. 1. In the Kroger row, tap Choose your store it shows No store selected until you do . 2. Enter a ZIP code. Both a 5 digit ZIP and ZIP+4 work. 3. Tap Search . You get up to 5 nearby stores . 4. Tap Select on the one you want. 5. You see Store set to {Name} , and the row now reads Store: {name}. The store you are using shows Selected and its button is disabled, so you cannot pick the same store twice. To switch later, tap the Change link next to Store: and search again. Disconnecting Tap Disconnect on the Kroger row. Your browser asks you to confirm with a plain prompt. Confirm and you see Kroger account disconnected . Disconnecting removes the link between Pantry Tab and Kroger. Your grocery list, inventory and everything else stay exactly as they are. If something goes wrong You took too long signing in and hit a state expired error. The connection link is only valid for 15 minutes. Tap Connect again and complete the sign in promptly. \"No Kroger stores found near that ZIP\" — no store came back for that ZIP code. Check the digits and try a nearby ZIP. \"Kroger account not connected. Please connect Kroger first.\" — you tried to send your list to a cart without a connected account. Connect first. \"No Kroger store selected. Set one in Profile.\" — you are connected but have not chosen a store. Use Choose your store . \"No store location selected. Provide locationId or set a preferred store.\" — same fix: pick a store in Profile → Connected Accounts . The status badge is stuck on Loading. Refresh the page. Pantry Tab does not sync live between devices, so a stale screen is common after changing something elsewhere. The search returned a store you do not use. Only up to 5 nearby stores come back per search. Try the ZIP of the area your store is actually in. Good to know Pantry Tab never sees your Kroger password. You sign in on Kroger's own site and Kroger tells Pantry Tab the connection is approved. A connected Kroger account is required for sending your list to a cart. See Sending your list to a Kroger pickup cart kroger send to cart . Your Kroger connection is private to you , not shared with your household. Other members of your household connect their own accounts if they want to send lists. The connection is pickup only . There is no delivery option anywhere in Pantry Tab. You do not need to connect Kroger to see coupons on your grocery list — those load on their own. See Coupons coupons . Pantry Tab can push items to your Kroger cart but cannot read the cart back, so it never learns what you actually bought. Related Sending your list to a Kroger pickup cart kroger send to cart Coupons coupons Your profile and connected accounts profile and settings Building and using your grocery list using the grocery list "}, {"id": "kroger-send-to-cart", "title": "Sending your list to a Kroger pickup cart", "category": "Grocery List", "summary": "Push the unchecked items on your grocery list into a Kroger pickup cart, and what to check afterwards before you place the order.", "keywords": ["send to kroger pickup", "kroger cart", "pickup", "view cart at kroger", "couldn't match", "add to cart", "order groceries"], "html": "<p>Pantry Tab can push your grocery list into a Kroger pickup cart, so you do not have to retype it in the Kroger app. It is <strong>pickup only<\/strong> — there is no delivery option.<\/p>\n<h2 id=\"before-you-start\">Before you start<\/h2>\n<p>You need all three of these:<\/p>\n<ul>\n<li>A connected Kroger account. See <a href=\"#kroger-connect\">Connecting your Kroger account<\/a>.<\/li>\n<li>A chosen Kroger store, set in <strong>Profile<\/strong> → <strong>Connected Accounts<\/strong>.<\/li>\n<li>At least one unchecked item on your grocery list. Items already in <strong>In Cart<\/strong> are not sent.<\/li>\n<\/ul>\n<p>The <strong>Send to Kroger Pickup<\/strong> card only appears on the <strong>Grocery<\/strong> tab when a Kroger account is connected and there are unchecked items to send.<\/p>\n<h2 id=\"sending-the-list\">Sending the list<\/h2>\n<ol>\n<li>Open the <strong>Grocery<\/strong> tab.<\/li>\n<li>Find the <strong>Send to Kroger Pickup<\/strong> card and tap <strong>Send to Kroger Pickup<\/strong>.<\/li>\n<li>Wait while Pantry Tab matches each item to a Kroger product. Items are matched <strong>one at a time<\/strong>, so a long list takes a while. Leave the page open.<\/li>\n<li>The result dialog appears, headed <strong>Sent to Kroger Cart<\/strong>.<\/li>\n<\/ol>\n<h2 id=\"reading-the-result\">Reading the result<\/h2>\n<p>The dialog tells you:<\/p>\n<ul>\n<li>\"X of Y items added to your Kroger cart.\" — how many of your items made it.<\/li>\n<li>\"Couldn't match these items:\" followed by the items that did not, each with a short reason.<\/li>\n<li>\"These items need to be added manually in the Kroger app.\"<\/li>\n<li><strong>View Cart at Kroger<\/strong> — opens your cart on Kroger's side.<\/li>\n<\/ul>\n<p>The per-item reasons you may see are:<\/p>\n<ul>\n<li>\"no Kroger products found\" — nothing came back for that item name. Try a plainer name, like \"cheddar\" instead of a brand and size.<\/li>\n<li>\"search failed\" — the lookup did not complete for that item. Add it by hand.<\/li>\n<li>\"no UPC on product\" — a product came back but had no barcode to add to the cart.<\/li>\n<\/ul>\n<h2 id=\"after-you-send-check-the-cart\">After you send: check the cart<\/h2>\n<p><strong>Always review the cart in the Kroger app before you place the order.<\/strong> Matching takes the <strong>first Kroger search result<\/strong> for each item name, so wrong products happen — the wrong brand, the wrong size, the wrong variety. Nothing about the match is checked against what you meant.<\/p>\n<p>Add anything from the \"Couldn't match these items:\" list by hand in the Kroger app, fix any wrong products, then place your pickup order there.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>The Send to Kroger Pickup card is not there.<\/strong> Either no Kroger account is connected, or every item on your list is already checked off into <strong>In Cart<\/strong>. Uncheck what you still need.<\/li>\n<li><strong>\"Kroger account not connected. Please connect Kroger first.\"<\/strong> — connect in <strong>Profile<\/strong> → <strong>Connected Accounts<\/strong>.<\/li>\n<li><strong>\"No Kroger store selected. Set one in Profile.\"<\/strong> — you are connected but have not picked a store yet.<\/li>\n<li><strong>\"No store location selected. Provide locationId or set a preferred store.\"<\/strong> — same fix: choose your store in <strong>Profile<\/strong> → <strong>Connected Accounts<\/strong>.<\/li>\n<li><strong>\"No items could be matched to Kroger products\"<\/strong> — nothing on your list matched anything at that store. Rename items to plainer, more common product names and try again, or add them by hand in the Kroger app.<\/li>\n<li><strong>It is taking a long time.<\/strong> Items are matched one at a time, so a very long list is slow. Splitting a big shop into two sends does not speed it up — it is the item count that matters.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li><strong>Pickup only.<\/strong> There is no delivery option anywhere in Pantry Tab.<\/li>\n<li><strong>Kroger only.<\/strong> No other store can receive your list.<\/li>\n<li><strong>Wrong products happen.<\/strong> The first search result is taken every time, so treat the cart as a draft that needs your eyes on it.<\/li>\n<li><strong>Pantry Tab cannot read your cart back.<\/strong> It knows what it sent, not what is in the cart now, and not what you finally bought. Editing or emptying the cart in the Kroger app changes nothing in Pantry Tab.<\/li>\n<li>Sending does not check items off your grocery list and does not add anything to your pantry inventory. Both are still yours to do.<\/li>\n<li>Sending the same list twice will push the items again. Check the Kroger cart before re-sending so you do not end up with doubles.<\/li>\n<li>Your Kroger connection is private to you. If another household member wants to send the shared list, they connect their own Kroger account.<\/li>\n<li>Coupons still have to be clipped in the Kroger app — sending a list to the cart does not clip anything. See <a href=\"#coupons\">Coupons<\/a>.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#kroger-connect\">Connecting your Kroger account<\/a><\/li>\n<li><a href=\"#using-the-grocery-list\">Building and using your grocery list<\/a><\/li>\n<li><a href=\"#coupons\">Coupons<\/a><\/li>\n<li><a href=\"#limits-and-known-issues\">Limits and known issues<\/a><\/li>\n<\/ul>", "text": "Pantry Tab can push your grocery list into a Kroger pickup cart, so you do not have to retype it in the Kroger app. It is pickup only — there is no delivery option. Before you start You need all three of these: A connected Kroger account. See Connecting your Kroger account kroger connect . A chosen Kroger store, set in Profile → Connected Accounts . At least one unchecked item on your grocery list. Items already in In Cart are not sent. The Send to Kroger Pickup card only appears on the Grocery tab when a Kroger account is connected and there are unchecked items to send. Sending the list 1. Open the Grocery tab. 2. Find the Send to Kroger Pickup card and tap Send to Kroger Pickup . 3. Wait while Pantry Tab matches each item to a Kroger product. Items are matched one at a time , so a long list takes a while. Leave the page open. 4. The result dialog appears, headed Sent to Kroger Cart . Reading the result The dialog tells you: \"X of Y items added to your Kroger cart.\" — how many of your items made it. \"Couldn't match these items:\" followed by the items that did not, each with a short reason. \"These items need to be added manually in the Kroger app.\" View Cart at Kroger — opens your cart on Kroger's side. The per item reasons you may see are: \"no Kroger products found\" — nothing came back for that item name. Try a plainer name, like \"cheddar\" instead of a brand and size. \"search failed\" — the lookup did not complete for that item. Add it by hand. \"no UPC on product\" — a product came back but had no barcode to add to the cart. After you send: check the cart Always review the cart in the Kroger app before you place the order. Matching takes the first Kroger search result for each item name, so wrong products happen — the wrong brand, the wrong size, the wrong variety. Nothing about the match is checked against what you meant. Add anything from the \"Couldn't match these items:\" list by hand in the Kroger app, fix any wrong products, then place your pickup order there. If something goes wrong The Send to Kroger Pickup card is not there. Either no Kroger account is connected, or every item on your list is already checked off into In Cart . Uncheck what you still need. \"Kroger account not connected. Please connect Kroger first.\" — connect in Profile → Connected Accounts . \"No Kroger store selected. Set one in Profile.\" — you are connected but have not picked a store yet. \"No store location selected. Provide locationId or set a preferred store.\" — same fix: choose your store in Profile → Connected Accounts . \"No items could be matched to Kroger products\" — nothing on your list matched anything at that store. Rename items to plainer, more common product names and try again, or add them by hand in the Kroger app. It is taking a long time. Items are matched one at a time, so a very long list is slow. Splitting a big shop into two sends does not speed it up — it is the item count that matters. Good to know Pickup only. There is no delivery option anywhere in Pantry Tab. Kroger only. No other store can receive your list. Wrong products happen. The first search result is taken every time, so treat the cart as a draft that needs your eyes on it. Pantry Tab cannot read your cart back. It knows what it sent, not what is in the cart now, and not what you finally bought. Editing or emptying the cart in the Kroger app changes nothing in Pantry Tab. Sending does not check items off your grocery list and does not add anything to your pantry inventory. Both are still yours to do. Sending the same list twice will push the items again. Check the Kroger cart before re sending so you do not end up with doubles. Your Kroger connection is private to you. If another household member wants to send the shared list, they connect their own Kroger account. Coupons still have to be clipped in the Kroger app — sending a l
