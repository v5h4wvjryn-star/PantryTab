ist to the cart does not clip anything. See Coupons coupons . Related Connecting your Kroger account kroger connect Building and using your grocery list using the grocery list Coupons coupons Limits and known issues limits and known issues "}, {"id": "adding-recipes", "title": "Adding a recipe by hand", "category": "Recipes", "summary": "How to type a recipe into Pantry Tab field by field, and why complete ingredients and instructions matter later.", "keywords": ["add recipe", "new recipe", "recipe fields", "servings", "prep time", "cook time", "ingredients", "instructions", "save recipe", "nutrition"], "html": "<p>Typing a recipe in yourself is the most reliable way to get it into Pantry Tab exactly as you cook it. It is also worth doing carefully, because several other features read what you put here.<\/p>\n<h2 id=\"add-a-recipe\">Add a recipe<\/h2>\n<ol>\n<li>Open the <strong>Recipes<\/strong> tab.<\/li>\n<li>Tap <strong>Add New Recipe<\/strong>.<\/li>\n<li>Fill in the fields below.<\/li>\n<li>Tap <strong>Save Recipe<\/strong>.<\/li>\n<\/ol>\n<p>If you have no recipes yet, the tab shows <strong>Add your first recipe<\/strong>. Tapping that starts the same form.<\/p>\n<h2 id=\"the-fields-in-order\">The fields, in order<\/h2>\n<ul>\n<li><strong>Recipe Name *<\/strong> — the only required field. Give it a name you would search for.<\/li>\n<li><strong>Description<\/strong> — a line or two about the dish. Optional.<\/li>\n<li><strong>Servings<\/strong> — how many the recipe feeds. Defaults to 4.<\/li>\n<li><strong>Prep (min)<\/strong> — hands-on time in minutes. Defaults to 0.<\/li>\n<li><strong>Cook (min)<\/strong> — cooking time in minutes. Defaults to 0.<\/li>\n<li><strong>Ingredients<\/strong> — one ingredient per line, with the quantity.<\/li>\n<li><strong>Instructions<\/strong> — the steps, in order.<\/li>\n<\/ul>\n<p>Prep and cook minutes are added together to show a total time on meal plan cards, so leaving both at 0 makes the recipe look instant.<\/p>\n<h3 id=\"optional-details\">Optional Details<\/h3>\n<p>Below the main fields is an <strong>Optional Details<\/strong> group:<\/p>\n<ul>\n<li><strong>Served With<\/strong> — sides and accompaniments.<\/li>\n<li><strong>Variations<\/strong> — swaps and alternative versions.<\/li>\n<li><strong>Tips &amp; Notes<\/strong> — anything you want to remember next time. This appears in the recipe as <strong>Notes &amp; Tips<\/strong>.<\/li>\n<li><strong>Nutrition<\/strong> — figures <strong>per serving<\/strong>. These appear in the recipe as <strong>Nutrition Per Serving<\/strong>.<\/li>\n<\/ul>\n<p>Nothing in this group is required, and you can add it later by editing the recipe.<\/p>\n<h2 id=\"why-ingredients-and-instructions-matter\">Why ingredients and instructions matter<\/h2>\n<p>The two big text fields are not only for reading. Pantry Tab uses them:<\/p>\n<ul>\n<li><strong>Pantry Check<\/strong> compares your ingredient lines against your inventory and shows green for what you have and red or orange for what is missing, with a one-tap way to add the missing things to your grocery list. Vague lines match poorly.<\/li>\n<li><strong>Allergy Check<\/strong> and the red <strong>Allergy Alert<\/strong> card look for household allergens in your ingredient text. Matching is keyword-based, so an ingredient written plainly (\"peanut butter\") is far more likely to be caught than one written obliquely.<\/li>\n<li><strong>What Can I Make?<\/strong> scores your saved recipes against your pantry. Recipes with clear, ordinary ingredient names score more accurately.<\/li>\n<li><strong>The meal prep cook sheet skips any recipe with no ingredients or no instructions.<\/strong> Those recipes appear under <strong>Skipped<\/strong> on the sheet instead of being planned. If a prep sheet is missing a meal, this is almost always why.<\/li>\n<\/ul>\n<p>Write ingredient names the way you would write them on a shopping list — \"chicken thighs\", not \"the good thighs from the freezer\".<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>Save Recipe does nothing.<\/strong> Check that <strong>Recipe Name *<\/strong> has something in it. It is the one field that must be filled.<\/li>\n<li><strong>A recipe shows a total time of 0 minutes.<\/strong> <strong>Prep (min)<\/strong> and <strong>Cook (min)<\/strong> both default to 0. Edit the recipe and put the real minutes in.<\/li>\n<li><strong>Pantry Check says you are missing something you own.<\/strong> The ingredient name and the inventory item name have to be recognisable as the same thing. Rename one of them so they match.<\/li>\n<li><strong>A meal you tagged for prep is listed under Skipped.<\/strong> That recipe has no ingredients or no instructions. Open it, fill them in, and rebuild the sheet.<\/li>\n<li><strong>No allergy warning appeared on a recipe you expected one for.<\/strong> Allergy matching reads ingredient text against the allergen name and the keywords you set. Add keywords to the allergy, and read the actual product label regardless. See <a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a>.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Recipes are shared with everyone in your household. Anyone in the household can edit or delete any recipe.<\/li>\n<li>Duplicate recipe names are allowed, so you can end up with two \"Chicken Curry\" entries without being warned.<\/li>\n<li>Deleting a recipe also deletes every meal-plan entry that used it.<\/li>\n<li>If you would rather not type, you can import from a photo, a document, or a link instead — see <a href=\"#importing-recipes\">Importing recipes from a photo, file, or link<\/a>.<\/li>\n<li>Nutrition figures you enter are your own. Pantry Tab does not calculate them from the ingredients.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#importing-recipes\">Importing recipes from a photo, file, or link<\/a><\/li>\n<li><a href=\"#managing-recipes\">Managing your recipe library<\/a><\/li>\n<li><a href=\"#what-can-i-make\">What Can I Make? Recipe ideas from your pantry<\/a><\/li>\n<li><a href=\"#prep-sheets\">Meal prep cook sheets<\/a><\/li>\n<\/ul>", "text": "Typing a recipe in yourself is the most reliable way to get it into Pantry Tab exactly as you cook it. It is also worth doing carefully, because several other features read what you put here. Add a recipe 1. Open the Recipes tab. 2. Tap Add New Recipe . 3. Fill in the fields below. 4. Tap Save Recipe . If you have no recipes yet, the tab shows Add your first recipe . Tapping that starts the same form. The fields, in order Recipe Name \\ — the only required field. Give it a name you would search for. Description — a line or two about the dish. Optional. Servings — how many the recipe feeds. Defaults to 4. Prep min — hands on time in minutes. Defaults to 0. Cook min — cooking time in minutes. Defaults to 0. Ingredients — one ingredient per line, with the quantity. Instructions — the steps, in order. Prep and cook minutes are added together to show a total time on meal plan cards, so leaving both at 0 makes the recipe look instant. Optional Details Below the main fields is an Optional Details group: Served With — sides and accompaniments. Variations — swaps and alternative versions. Tips & Notes — anything you want to remember next time. This appears in the recipe as Notes & Tips . Nutrition — figures per serving . These appear in the recipe as Nutrition Per Serving . Nothing in this group is required, and you can add it later by editing the recipe. Why ingredients and instructions matter The two big text fields are not only for reading. Pantry Tab uses them: Pantry Check compares your ingredient lines against your inventory and shows green for what you have and red or orange for what is missing, with a one tap way to add the missing things to your grocery list. Vague lines match poorly. Allergy Check and the red Allergy Alert card look for household allergens in your ingredient text. Matching is keyword based, so an ingredient written plainly \"peanut butter\" is far more likely to be caught than one written obliquely. What Can I Make? scores your saved recipes against your pantry. Recipes with clear, ordinary ingredient names score more accurately. The meal prep cook sheet skips any recipe with no ingredients or no instructions. Those recipes appear under Skipped on the sheet instead of being planned. If a prep sheet is missing a meal, this is almost always why. Write ingredient names the way you would write them on a shopping list — \"chicken thighs\", not \"the good thighs from the freezer\". If something goes wrong Save Recipe does nothing. Check that Recipe Name \\ has something in it. It is the one field that must be filled. A recipe shows a total time of 0 minutes. Prep min and Cook min both default to 0. Edit the recipe and put the real minutes in. Pantry Check says you are missing something you own. The ingredient name and the inventory item name have to be recognisable as the same thing. Rename one of them so they match. A meal you tagged for prep is listed under Skipped. That recipe has no ingredients or no instructions. Open it, fill them in, and rebuild the sheet. No allergy warning appeared on a recipe you expected one for. Allergy matching reads ingredient text against the allergen name and the keywords you set. Add keywords to the allergy, and read the actual product label regardless. See How allergy warnings work, and their limits how allergy warnings work . Good to know Recipes are shared with everyone in your household. Anyone in the household can edit or delete any recipe. Duplicate recipe names are allowed, so you can end up with two \"Chicken Curry\" entries without being warned. Deleting a recipe also deletes every meal plan entry that used it. If you would rather not type, you can import from a photo, a document, or a link instead — see Importing recipes from a photo, file, or link importing recipes . Nutrition figures you enter are your own. Pantry Tab does not calculate them from the ingredients. Related Importing recipes from a photo, file, or link importing recipes Managing your recipe library managing recipes What Can I Make? Recipe ideas from your pantry what can i make Meal prep cook sheets prep sheets "}, {"id": "importing-recipes", "title": "Importing recipes from a photo, file, or link", "category": "Recipes", "summary": "How to import a recipe from a cookbook photo, a document, or a web link, and what to do when a site blocks the import.", "keywords": ["import recipe", "recipe photo", "cookbook", "scan recipe", "recipe url", "recipe link", "pdf recipe", "docx", "bot blocked", "import failed"], "html": "<p>The <strong>Recipes<\/strong> tab has three import buttons next to <strong>Add New Recipe<\/strong>: <strong>Photo<\/strong>, <strong>File<\/strong> and <strong>URL<\/strong>. All three read the recipe with Pantry Tab AI and fill in the recipe form for you, so you can check it before saving.<\/p>\n<h2 id=\"import-from-a-photo\">Import from a photo<\/h2>\n<p>The dialog is <strong>Import Recipe from Photo<\/strong> — \"Works with cookbook pages, recipe cards, handwritten recipes, or screenshots\".<\/p>\n<ol>\n<li>Open the <strong>Recipes<\/strong> tab and tap <strong>Photo<\/strong>.<\/li>\n<li>Take a photo or choose an image.<\/li>\n<li>Wait for the AI to read it.<\/li>\n<li>Check every field, then save.<\/li>\n<\/ol>\n<p>Things to know:<\/p>\n<ul>\n<li>The image must be under <strong>10 MB<\/strong>.<\/li>\n<li>Fractions are converted to decimals, so \"1½ cups\" arrives as 1.5 cups.<\/li>\n<li><strong>If servings or times are not printed on the page, the AI estimates them.<\/strong> Always check <strong>Servings<\/strong>, <strong>Prep (min)<\/strong> and <strong>Cook (min)<\/strong> before saving — an estimate that is wrong will follow the recipe into your meal plan and prep sheet.<\/li>\n<li>Very long multi-page recipes may not import cleanly. Photograph and import one page at a time.<\/li>\n<li>If the photo is not a recipe at all, you will still get a recipe back — usually one whose description explains that the image was not a recipe. Delete it and try again with a clearer shot.<\/li>\n<\/ul>\n<h2 id=\"import-from-a-document\">Import from a document<\/h2>\n<p>The dialog is <strong>Import Recipe from Document<\/strong> — \"Supported formats: .pdf, .docx, .txt, .md, .html, .json\".<\/p>\n<ol>\n<li>Open the <strong>Recipes<\/strong> tab and tap <strong>File<\/strong>.<\/li>\n<li>Choose a file in one of those formats.<\/li>\n<li>Check the fields, then save.<\/li>\n<\/ol>\n<p>This reads the same fields as the photo import, and estimates missing servings and times the same way, so check them. It is also the surest route for a recipe you have already saved from a website.<\/p>\n<h2 id=\"import-from-a-link\">Import from a link<\/h2>\n<p>The field is <strong>Recipe URL<\/strong> — \"Paste a link to any recipe page. Works best with AllRecipes, Kroger, Food Network, and most recipe sites.\"<\/p>\n<ol>\n<li>Open the <strong>Recipes<\/strong> tab and tap <strong>URL<\/strong>.<\/li>\n<li>Paste the full link to the recipe page.<\/li>\n<li>Wait while Pantry Tab loads the page.<\/li>\n<li>Check the fields, then save.<\/li>\n<\/ol>\n<p>Pantry Tab reads the structured recipe data that most recipe sites publish. If the page does not have any, the AI reads the page text instead. You will see <strong>Recipe extracted successfully!<\/strong> and then <strong>Recipe imported successfully!<\/strong> when it works.<\/p>\n<ul>\n<li>Page loading times out after <strong>15 seconds<\/strong>.<\/li>\n<li>Only public http and https links work. A page behind a login will not import.<\/li>\n<\/ul>\n<h3 id=\"when-a-site-blocks-the-import\">When a site blocks the import<\/h3>\n<p>This is the most common way a link import fails. Some sites block automated requests, and there is nothing you can change in Pantry Tab to get past it. You will see:<\/p>\n<p><strong>\"<site> blocks automated requests. Open the recipe in your browser, screenshot or print-to-PDF, then use the Photo or Document import.\"<\/strong><\/p>\n<p>You may also see <strong>\"<site> served a bot-protection page...\"<\/strong>, which means the same thing.<\/p>\n<p>The workaround in that message works:<\/p>\n<ol>\n<li>Open the recipe in your own browser, where the site loads normally.<\/li>\n<li>Either screenshot the recipe, or print the page to PDF.<\/li>\n<li>Come back to the <strong>Recipes<\/strong> tab and use <strong>Photo<\/strong> for a screenshot, or <strong>File<\/strong> for a PDF.<\/li>\n<\/ol>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<p>Photo and document imports:<\/p>\n<ul>\n<li><strong>\"Rate limit exceeded. Please try again in a moment.\"<\/strong> You used an AI feature too quickly. Wait a moment and retry.<\/li>\n<li><strong>\"AI credits exhausted. Please add credits to continue.\"<\/strong> A service-side limit has been reached. Contact support.<\/li>\n<li><strong>\"Failed to analyze image\"<\/strong> The photo could not be read. Retake it with better light, closer in, and square to the page.<\/li>\n<li><strong>\"No recipe data extracted\"<\/strong> Nothing recipe-shaped was found. Check you photographed the ingredients and method, not only the finished-dish picture.<\/li>\n<li><strong>\"No document text provided\"<\/strong> The file had no readable text. A PDF that is really a scanned image may import better through <strong>Photo<\/strong>.<\/li>\n<\/ul>\n<p>Link imports:<\/p>\n<ul>\n<li><strong>\"Invalid URL\"<\/strong> and <strong>\"Only http(s) URLs are supported\"<\/strong> Paste the full address starting with <code>https://<\/code>.<\/li>\n<li><strong>\"URL is too long\"<\/strong> Trim tracking junk from the end of the link, or use the short link the site gives you.<\/li>\n<li><strong>\"Could not fetch page (HTTP <status>)\"<\/strong> The site did not serve the page. Try again later, or screenshot it.<\/li>\n<li><strong>\"Could not extract enough content from this page. The site may be blocking scrapers or require login.\"<\/strong> Use the screenshot or print-to-PDF workaround.<\/li>\n<li><strong>\"Could not find a recipe on this page. Try a different URL.\"<\/strong> You may have linked a category or search page rather than the recipe itself.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Nothing is saved until you save the recipe, so a bad import costs you nothing but time.<\/li>\n<li>Imported recipes are shared with your whole household, and anyone in it can edit or delete them.<\/li>\n<li>An import with empty ingredients or empty instructions will be skipped by the meal prep cook sheet. Fill the gaps in before you plan around it.<\/li>\n<\/ul>\n<h3 id=\"which-import-should-i-use\">Which import should I use<\/h3>\n<ul>\n<li>A cookbook, a recipe card, handwriting, or a screenshot — <strong>Photo<\/strong>.<\/li>\n<li>A PDF, Word file, text file or web page you have already saved — <strong>File<\/strong>.<\/li>\n<li>A recipe site that loads normally — <strong>URL<\/strong>.<\/li>\n<li>A site that blocks the URL import — screenshot or print to PDF, then <strong>Photo<\/strong> or <strong>File<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#adding-recipes\">Adding a recipe by hand<\/a><\/li>\n<li><a href=\"#managing-recipes\">Managing your recipe library<\/a><\/li>\n<li><a href=\"#what-can-i-make\">What Can I Make? Recipe ideas from your pantry<\/a><\/li>\n<li><a href=\"#troubleshooting\">Troubleshooting common problems<\/a><\/li>\n<\/ul>", "text": "The Recipes tab has three import buttons next to Add New Recipe : Photo , File and URL . All three read the recipe with Pantry Tab AI and fill in the recipe form for you, so you can check it before saving. Import from a photo The dialog is Import Recipe from Photo — \"Works with cookbook pages, recipe cards, handwritten recipes, or screenshots\". 1. Open the Recipes tab and tap Photo . 2. Take a photo or choose an image. 3. Wait for the AI to read it. 4. Check every field, then save. Things to know: The image must be under 10 MB . Fractions are converted to decimals, so \"1½ cups\" arrives as 1.5 cups. If servings or times are not printed on the page, the AI estimates them. Always check Servings , Prep min and Cook min before saving — an estimate that is wrong will follow the recipe into your meal plan and prep sheet. Very long multi page recipes may not import cleanly. Photograph and import one page at a time. If the photo is not a recipe at all, you will still get a recipe back — usually one whose description explains that the image was not a recipe. Delete it and try again with a clearer shot. Import from a document The dialog is Import Recipe from Document — \"Supported formats: .pdf, .docx, .txt, .md, .html, .json\". 1. Open the Recipes tab and tap File . 2. Choose a file in one of those formats. 3. Check the fields, then save. This reads the same fields as the photo import, and estimates missing servings and times the same way, so check them. It is also the surest route for a recipe you have already saved from a website. Import from a link The field is Recipe URL — \"Paste a link to any recipe page. Works best with AllRecipes, Kroger, Food Network, and most recipe sites.\" 1. Open the Recipes tab and tap URL . 2. Paste the full link to the recipe page. 3. Wait while Pantry Tab loads the page. 4. Check the fields, then save. Pantry Tab reads the structured recipe data that most recipe sites publish. If the page does not have any, the AI reads the page text instead. You will see Recipe extracted successfully! and then Recipe imported successfully! when it works. Page loading times out after 15 seconds . Only public http and https links work. A page behind a login will not import. When a site blocks the import This is the most common way a link import fails. Some sites block automated requests, and there is nothing you can change in Pantry Tab to get past it. You will see: \"<site blocks automated requests. Open the recipe in your browser, screenshot or print to PDF, then use the Photo or Document import.\" You may also see \"<site served a bot protection page...\" , which means the same thing. The workaround in that message works: 1. Open the recipe in your own browser, where the site loads normally. 2. Either screenshot the recipe, or print the page to PDF. 3. Come back to the Recipes tab and use Photo for a screenshot, or File for a PDF. If something goes wrong Photo and document imports: \"Rate limit exceeded. Please try again in a moment.\" You used an AI feature too quickly. Wait a moment and retry. \"AI credits exhausted. Please add credits to continue.\" A service side limit has been reached. Contact support. \"Failed to analyze image\" The photo could not be read. Retake it with better light, closer in, and square to the page. \"No recipe data extracted\" Nothing recipe shaped was found. Check you photographed the ingredients and method, not only the finished dish picture. \"No document text provided\" The file had no readable text. A PDF that is really a scanned image may import better through Photo . Link imports: \"Invalid URL\" and \"Only http s URLs are supported\" Paste the full address starting with https:// . \"URL is too long\" Trim tracking junk from the end of the link, or use the short link the site gives you. \"Could not fetch page HTTP <status \" The site did not serve the page. Try again later, or screenshot it. \"Could not extract enough content from this page. The site may be blocking scrapers or require login.\" Use the screenshot or print to PDF workaround. \"Could not find a recipe on this page. Try a different URL.\" You may have linked a category or search page rather than the recipe itself. Good to know Nothing is saved until you save the recipe, so a bad import costs you nothing but time. Imported recipes are shared with your whole household, and anyone in it can edit or delete them. An import with empty ingredients or empty instructions will be skipped by the meal prep cook sheet. Fill the gaps in before you plan around it. Which import should I use A cookbook, a recipe card, handwriting, or a screenshot — Photo . A PDF, Word file, text file or web page you have already saved — File . A recipe site that loads normally — URL . A site that blocks the URL import — screenshot or print to PDF, then Photo or File . Related Adding a recipe by hand adding recipes Managing your recipe library managing recipes What Can I Make? Recipe ideas from your pantry what can i make Troubleshooting common problems troubleshooting "}, {"id": "managing-recipes", "title": "Managing your recipe library", "category": "Recipes", "summary": "Browsing, editing and deleting recipes, what each part of the recipe detail view does, exporting, and the housekeeping rules to know.", "keywords": ["recipe library", "edit recipe", "delete recipe", "pantry check", "allergy alert", "add to meal plan", "export recipes", "recipe book", "duplicate recipes"], "html": "<p>Everything you add, import or accept from an AI suggestion lands in the <strong>Recipes<\/strong> tab. This is how to work through that library and keep it tidy.<\/p>\n<h2 id=\"browsing-editing-and-deleting\">Browsing, editing and deleting<\/h2>\n<p>Open the <strong>Recipes<\/strong> tab to see everything your household has saved. Tap a recipe to open its detail view. From there you can edit it — the form is the same one you get from <strong>Add New Recipe<\/strong>, with the same fields and <strong>Save Recipe<\/strong> — or delete it.<\/p>\n<p>Before you delete anything, read the warning further down this article about meal plans.<\/p>\n<p>If the tab is empty it shows <strong>Add your first recipe<\/strong>.<\/p>\n<h2 id=\"inside-a-recipe\">Inside a recipe<\/h2>\n<p>The detail view is laid out in sections, top to bottom:<\/p>\n<ul>\n<li><strong>Pantry Check<\/strong> — compares the recipe's ingredients with your inventory. Green means you have it; red or orange means it is missing.<\/li>\n<li><strong>Allergy Check<\/strong> — flags ingredients that match a household allergy.<\/li>\n<li>Ingredients and instructions.<\/li>\n<li><strong>Other Details<\/strong> — the optional extras you filled in, such as <strong>Served With<\/strong> and <strong>Variations<\/strong>.<\/li>\n<li><strong>Actions<\/strong>.<\/li>\n<li><strong>Add to Meal Plan<\/strong> — pick <strong>Select Date<\/strong> and <strong>Meal Type<\/strong>, then add it to the plan.<\/li>\n<li><strong>Nutrition Per Serving<\/strong> — whatever you entered in the recipe's <strong>Nutrition<\/strong> field.<\/li>\n<li><strong>Notes &amp; Tips<\/strong> — your <strong>Tips &amp; Notes<\/strong> text.<\/li>\n<li>A red <strong>Allergy Alert<\/strong> card, when one applies. It names the person, the allergen and the severity.<\/li>\n<\/ul>\n<p><strong>Meal Type<\/strong> offers <strong>Breakfast<\/strong>, <strong>Lunch<\/strong> and <strong>Dinner<\/strong>. There is only one meal per meal type per day for the whole household, so adding a second dinner to a date replaces the first one without asking.<\/p>\n<h2 id=\"pantry-check-and-the-grocery-list\">Pantry Check and the grocery list<\/h2>\n<p><strong>Pantry Check<\/strong> is the fastest way to shop for one dish. It shows what you already own and what you are missing, and lets you add everything missing to your grocery list in one tap.<\/p>\n<p>There is also <strong>Smart Add to Grocery List<\/strong>, which lists ingredients under <strong>Not in inventory<\/strong> and gives you <strong>Select All<\/strong> and <strong>Select Missing Only<\/strong> so you can choose what goes on the list.<\/p>\n<p>Pantry Check compares text, so an ingredient called \"chicken thighs\" and an inventory item called \"thighs\" may not be recognised as the same thing. Naming them consistently makes the check much more accurate.<\/p>\n<h2 id=\"exporting\">Exporting<\/h2>\n<ul>\n<li><strong>Export<\/strong> on the <strong>Recipes<\/strong> tab exports your recipes.<\/li>\n<li><strong>Export Recipe Book<\/strong> in the recipe detail view produces a recipe book from your library.<\/li>\n<\/ul>\n<p>Export before a big tidy-up if you want a copy of what you are about to delete.<\/p>\n<h2 id=\"housekeeping-truths\">Housekeeping truths<\/h2>\n<p>These are the things that surprise people, so they are worth reading once.<\/p>\n<p><strong>Deleting a recipe also deletes every meal-plan entry that used it.<\/strong> If a recipe is on three nights of next week's plan and you delete it, those three meals disappear from the plan too. There is no way to keep the plan entries and lose only the recipe. If you want the meal off the plan but the recipe kept, remove it from the plan in the <strong>Plan<\/strong> tab instead.<\/p>\n<p>Also:<\/p>\n<ul>\n<li>Recipes are shared with your whole household. Every member sees all of them, and <strong>anyone can edit or delete any recipe<\/strong>, including ones you added.<\/li>\n<li>Duplicate names are allowed. Nothing warns you that \"Chicken Curry\" already exists, so you can quietly end up with several.<\/li>\n<li>Your library grows on its own. Every suggestion you accept from AI meal planning is saved as a real recipe, so the more you use the week planner, the more entries pile up. Plan on tidying periodically.<\/li>\n<li>Recipes saved from the Community marketplace are private to you and are not shared with your household.<\/li>\n<\/ul>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>Meals vanished from the plan.<\/strong> Somebody deleted the recipe behind them. Deleting a recipe removes its meal-plan entries as well.<\/li>\n<li><strong>A recipe you did not delete is gone.<\/strong> Any household member can delete any recipe. Check with the rest of your household.<\/li>\n<li><strong>You cannot see a change a household member has made.<\/strong> There is no live sync between devices. Refresh the page.<\/li>\n<li><strong>A recipe appears twice.<\/strong> Duplicate names are allowed, and imports and AI suggestions both create new recipes. Delete the one you do not want, remembering it takes its meal-plan entries with it.<\/li>\n<li><strong>A recipe was skipped when you built a prep sheet.<\/strong> It has no ingredients or no instructions. Edit it, fill those in, and rebuild.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>There is no folder, tag or favourite system for recipes. Clear names are your only organisation, so name things the way you would search for them.<\/li>\n<li>Editing a recipe does not change meal-plan entries that already use it beyond the recipe content itself — the plan keeps pointing at the same recipe.<\/li>\n<li>Publishing a recipe to the Community marketplace creates a separate public copy. Deleting your private recipe does not remove the published one.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#adding-recipes\">Adding a recipe by hand<\/a><\/li>\n<li><a href=\"#importing-recipes\">Importing recipes from a photo, file, or link<\/a><\/li>\n<li><a href=\"#meal-planner-basics\">Using the meal planner<\/a><\/li>\n<li><a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a><\/li>\n<\/ul>", "text": "Everything you add, import or accept from an AI suggestion lands in the Recipes tab. This is how to work through that library and keep it tidy. Browsing, editing and deleting Open the Recipes tab to see everything your household has saved. Tap a recipe to open its detail view. From there you can edit it — the form is the same one you get from Add New Recipe , with the same fields and Save Recipe — or delete it. Before you delete anything, read the warning further down this article about meal plans. If the tab is empty it shows Add your first recipe . Inside a recipe The detail view is laid out in sections, top to bottom: Pantry Check — compares the recipe's ingredients with your inventory. Green means you have it; red or orange means it is missing. Allergy Check — flags ingredients that match a household allergy. Ingredients and instructions. Other Details — the optional extras you filled in, such as Served With and Variations . Actions . Add to Meal Plan — pick Select Date and Meal Type , then add it to the plan. Nutrition Per Serving — whatever you entered in the recipe's Nutrition field. Notes & Tips — your Tips & Notes text. A red Allergy Alert card, when one applies. It names the person, the allergen and the severity. Meal Type offers Breakfast , Lunch and Dinner . There is only one meal per meal type per day for the whole household, so adding a second dinner to a date replaces the first one without asking. Pantry Check and the grocery list Pantry Check is the fastest way to shop for one dish. It shows what you already own and what you are missing, and lets you add everything missing to your grocery list in one tap. There is also Smart Add to Grocery List , which lists ingredients under Not in inventory and gives you Select All and Select Missing Only so you can choose what goes on the list. Pantry Check compares text, so an ingredient called \"chicken thighs\" and an inventory item called \"thighs\" may not be recognised as the same thing. Naming them consistently makes the check much more accurate. Exporting Export on the Recipes tab exports your recipes. Export Recipe Book in the recipe detail view produces a recipe book from your library. Export before a big tidy up if you want a copy of what you are about to delete. Housekeeping truths These are the things that surprise people, so they are worth reading once. Deleting a recipe also deletes every meal plan entry that used it. If a recipe is on three nights of next week's plan and you delete it, those three meals disappear from the plan too. There is no way to keep the plan entries and lose only the recipe. If you want the meal off the plan but the recipe kept, remove it from the plan in the Plan tab instead. Also: Recipes are shared with your whole household. Every member sees all of them, and anyone can edit or delete any recipe , including ones you added. Duplicate names are allowed. Nothing warns you that \"Chicken Curry\" already exists, so you can quietly end up with several. Your library grows on its own. Every suggestion you accept from AI meal planning is saved as a real recipe, so the more you use the week planner, the more entries pile up. Plan on tidying periodically. Recipes saved from the Community marketplace are private to you and are not shared with your household. If something goes wrong Meals vanished from the plan. Somebody deleted the recipe behind them. Deleting a recipe removes its meal plan entries as well. A recipe you did not delete is gone. Any household member can delete any recipe. Check with the rest of your household. You cannot see a change a household member has made. There is no live sync between devices. Refresh the page. A recipe appears twice. Duplicate names are allowed, and imports and AI suggestions both create new recipes. Delete the one you do not want, remembering it takes its meal plan entries with it. A recipe was skipped when you built a prep sheet. It has no ingredients or no instructions. Edit it, fill those in, and rebuild. Good to know There is no folder, tag or favourite system for recipes. Clear names are your only organisation, so name things the way you would search for them. Editing a recipe does not change meal plan entries that already use it beyond the recipe content itself — the plan keeps pointing at the same recipe. Publishing a recipe to the Community marketplace creates a separate public copy. Deleting your private recipe does not remove the published one. Related Adding a recipe by hand adding recipes Importing recipes from a photo, file, or link importing recipes Using the meal planner meal planner basics How allergy warnings work, and their limits how allergy warnings work "}, {"id": "what-can-i-make", "title": "What Can I Make? Recipe ideas from your pantry", "category": "Recipes", "summary": "Use What Can I Make? to score your saved recipes against your pantry and discover new ones, and how to read the match percentages.", "keywords": ["what can i make", "recipe ideas", "cook from pantry", "percent match", "uses expiring", "discover recipes", "spoonacular", "recipe suggestions"], "html": "<p><strong>What Can I Make?<\/strong> looks at what is actually in your pantry and suggests things to cook with it. You will find the button on the <strong>Plan<\/strong> tab, and it is also reachable from recipe discovery.<\/p>\n<h2 id=\"what-the-dialog-shows\">What the dialog shows<\/h2>\n<p>Tapping the button opens a dialog with two sections that load independently.<\/p>\n<h3 id=\"from-your-library\">From your library<\/h3>\n<p>Pantry Tab AI scores your own saved recipes against your inventory and returns them ranked. Each result shows:<\/p>\n<ul>\n<li>A <strong>{n}% match<\/strong> badge.<\/li>\n<li>Which ingredients it matched from your pantry.<\/li>\n<li>Which ingredients are missing.<\/li>\n<li>An \"Uses expiring\" note when the recipe would use something that is running out of time.<\/li>\n<\/ul>\n<p>This section loads first, usually within a couple of seconds.<\/p>\n<h3 id=\"discover-something-new\">Discover something new<\/h3>\n<p>Below your own recipes is a set of new recipes you could make from your pantry, from an outside recipe service. This section follows a moment after the library results.<\/p>\n<h2 id=\"using-the-results\">Using the results<\/h2>\n<ol>\n<li>Open the <strong>Plan<\/strong> tab and tap <strong>What Can I Make?<\/strong>.<\/li>\n<li>Wait for <strong>From your library<\/strong> to fill in, then for <strong>Discover something new<\/strong>.<\/li>\n<li>Read the matched and missing ingredients on anything that looks good.<\/li>\n<li>Add a result to your recipe library, or add it straight to your meal plan.<\/li>\n<li>Repeat for anything else you want — the dialog stays open after each add.<\/li>\n<li>Tap <strong>Done<\/strong> to close it.<\/li>\n<\/ol>\n<p>Because the dialog stays open, this is a good way to fill several nights at once rather than one dish at a time.<\/p>\n<h2 id=\"reading-the-match-scores\">Reading the match scores<\/h2>\n<p><strong>Low match scores are normal.<\/strong> The library section always returns a ranked list, even when nothing in your library is a good fit for what you have. A list topped by a 40% match does not mean something is broken — it means those are your best options right now.<\/p>\n<p>Treat the percentage as an ordering, not a verdict. A recipe missing only salt scores differently from one missing the main protein, so read the missing-ingredients list before you decide.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"No saved recipes match your pantry yet. Add more recipes via the Marketplace.\"<\/strong> Your library does not have anything that lines up with your inventory. Save more recipes, or use the <strong>Discover something new<\/strong> section instead.<\/li>\n<li><strong>\"Add items to your pantry to discover new recipes.\"<\/strong> Your pantry is empty, so there is nothing to suggest from. Add some inventory first.<\/li>\n<li><strong>\"Recipe service daily quota exceeded. Try again tomorrow.\"<\/strong> The outside recipe service has a daily quota and it has been used up. Your own library results still work; discovery comes back the next day.<\/li>\n<li><strong>Discovery is still blank.<\/strong> The two sections load separately, and discovery arrives after the library results. Give it a moment before assuming it failed.<\/li>\n<li><strong>A discovered recipe imported with a prep time of 0.<\/strong> The source only reports a total time, so prep time comes in as 0. Edit the recipe and split the time yourself if you want it accurate.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Suggestions are only as good as your inventory. If your pantry list is out of date, so are the results.<\/li>\n<li>Ingredient names matter. Matching compares text, so \"chicken thighs\" in a recipe and \"thighs\" in your pantry may not be recognised as the same thing.<\/li>\n<li>The more recipes you have saved, the more useful the library section gets. It can only rank what you already have.<\/li>\n<li>AI features are instructed to avoid your household's allergens, but matching is keyword-based and can miss things. Always read the actual product label. See <a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a>.<\/li>\n<li>Every recipe you add from here becomes part of your household library, which everyone can see, edit and delete.<\/li>\n<\/ul>\n<h3 id=\"getting-better-results\">Getting better results<\/h3>\n<ul>\n<li>Keep your inventory current, especially after a shop.<\/li>\n<li>Save more recipes, by hand, by import, or from the Community marketplace.<\/li>\n<li>Use plain, ordinary ingredient names in both your recipes and your inventory.<\/li>\n<li>Add expiry dates to inventory items so the \"Uses expiring\" note can do its job.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#managing-recipes\">Managing your recipe library<\/a><\/li>\n<li><a href=\"#adding-recipes\">Adding a recipe by hand<\/a><\/li>\n<li><a href=\"#meal-planner-basics\">Using the meal planner<\/a><\/li>\n<li><a href=\"#managing-your-inventory\">Managing your inventory: editing, using up, and batches<\/a><\/li>\n<\/ul>", "text": " What Can I Make? looks at what is actually in your pantry and suggests things to cook with it. You will find the button on the Plan tab, and it is also reachable from recipe discovery. What the dialog shows Tapping the button opens a dialog with two sections that load independently. From your library Pantry Tab AI scores your own saved recipes against your inventory and returns them ranked. Each result shows: A {n}% match badge. Which ingredients it matched from your pantry. Which ingredients are missing. An \"Uses expiring\" note when the recipe would use something that is running out of time. This section loads first, usually within a couple of seconds. Discover something new Below your own recipes is a set of new recipes you could make from your pantry, from an outside recipe service. This section follows a moment after the library results. Using the results 1. Open the Plan tab and tap What Can I Make? . 2. Wait for From your library to fill in, then for Discover something new . 3. Read the matched and missing ingredients on anything that looks good. 4. Add a result to your recipe library, or add it straight to your meal plan. 5. Repeat for anything else you want — the dialog stays open after each add. 6. Tap Done to close it. Because the dialog stays open, this is a good way to fill several nights at once rather than one dish at a time. Reading the match scores Low match scores are normal. The library section always returns a ranked list, even when nothing in your library is a good fit for what you have. A list topped by a 40% match does not mean something is broken — it means those are your best options right now. Treat the percentage as an ordering, not a verdict. A recipe missing only salt scores differently from one missing the main protein, so read the missing ingredients list before you decide. If something goes wrong \"No saved recipes match your pantry yet. Add more recipes via the Marketplace.\" Your library does not have anything that lines up with your inventory. Save more recipes, or use the Discover something new section instead. \"Add items to your pantry to discover new recipes.\" Your pantry is empty, so there is nothing to suggest from. Add some inventory first. \"Recipe service daily quota exceeded. Try again tomorrow.\" The outside recipe service has a daily quota and it has been used up. Your own library results still work; discovery comes back the next day. Discovery is still blank. The two sections load separately, and discovery arrives after the library results. Give it a moment before assuming it failed. A discovered recipe imported with a prep time of 0. The source only reports a total time, so prep time comes in as 0. Edit the recipe and split the time yourself if you want it accurate. Good to know Suggestions are only as good as your inventory. If your pantry list is out of date, so are the results. Ingredient names matter. Matching compares text, so \"chicken thighs\" in a recipe and \"thighs\" in your pantry may not be recognised as the same thing. The more recipes you have saved, the more useful the library section gets. It can only rank what you already have. AI features are instructed to avoid your household's allergens, but matching is keyword based and can miss things. Always read the actual product label. See How allergy warnings work, and their limits how allergy warnings work . Every recipe you add from here becomes part of your household library, which everyone can see, edit and delete. Getting better results Keep your inventory current, especially after a shop. Save more recipes, by hand, by import, or from the Community marketplace. Use plain, ordinary ingredient names in both your recipes and your inventory. Add expiry dates to inventory items so the \"Uses expiring\" note can do its job. Related Managing your recipe library managing recipes Adding a recipe by hand adding recipes Using the meal planner meal planner basics Managing your inventory: editing, using up, and batches managing your inventory "}, {"id": "meal-planner-basics", "title": "Using the meal planner", "category": "Meal Planning", "summary": "How the Plan tab's week, month and day views work, how to add, move and delete meals, and the one-meal-per-meal-type rule.", "keywords": ["meal planner", "plan tab", "week view", "month view", "day view", "add a meal", "move to", "clear", "meal type", "breakfast", "lunch", "dinner", "no snack"], "html": "<p>The <strong>Plan<\/strong> tab is a calendar of what you are cooking. You put recipes from your library onto a date and a meal type, and everyone in your household sees the same plan.<\/p>\n<h2 id=\"the-three-views\">The three views<\/h2>\n<p>Across the top of the <strong>Plan<\/strong> tab you have <strong>Week<\/strong>, <strong>Month<\/strong> and <strong>Day<\/strong>, a <strong>Today<\/strong> button, and previous/next arrows to step backwards and forwards.<\/p>\n<ul>\n<li><strong>Week<\/strong> is the working view — it is where you add, move, clear and tag meals.<\/li>\n<li><strong>Month<\/strong> is the overview.<\/li>\n<li><strong>Day<\/strong> is one date in full, and it is where you open a recipe to cook from.<\/li>\n<\/ul>\n<p>Two calendars, two starting days: <strong>week view starts on Monday<\/strong>, while the <strong>month grid starts on Sunday<\/strong>. That is worth knowing if you are counting across a row and the days do not line up with what you expected.<\/p>\n<p><strong>Today<\/strong> jumps any view back to the current date.<\/p>\n<h2 id=\"week-view\">Week view<\/h2>\n<p>Week view shows seven day cards. Each meal on a card shows a thumbnail, the recipe name and the total minutes (prep plus cook), with an allergy badge where an ingredient matches a household allergy.<\/p>\n<p>On each meal you have:<\/p>\n<ul>\n<li>A <strong>Move to:<\/strong> dropdown — pick another day and the meal moves there.<\/li>\n<li>A delete icon, which removes that meal from the plan. The recipe itself stays in your library.<\/li>\n<\/ul>\n<p>On each day card you have:<\/p>\n<ul>\n<li><strong>Clear<\/strong>, which removes every meal from that day.<\/li>\n<li><strong>Add meal<\/strong>, which opens the <strong>Add a Meal<\/strong> dialog for that date.<\/li>\n<\/ul>\n<p>A day with nothing on it shows <strong>No meals<\/strong>.<\/p>\n<p><strong>Move to: only lists days in the week you are looking at.<\/strong> To push a meal into next week, delete it and add it again on the new date.<\/p>\n<h2 id=\"month-view\">Month view<\/h2>\n<p>Each date cell shows up to <strong>2<\/strong> meal pills. If a day has more than that, you get a <strong>+N more<\/strong> marker instead of the rest — switch to <strong>Day<\/strong> or <strong>Week<\/strong> to see them all.<\/p>\n<ul>\n<li>Tap a cell to add a meal for that date.<\/li>\n<li>Tap a pill to open the recipe.<\/li>\n<\/ul>\n<h2 id=\"day-view\">Day view<\/h2>\n<p>The header shows the full date. Each meal has <strong>View Recipe &amp; Cook<\/strong>, which opens the recipe so you can cook from it. At the bottom there is <strong>Add another meal<\/strong>.<\/p>\n<p>An empty day shows <strong>No meals planned for this day<\/strong> with an <strong>Add a meal<\/strong> button.<\/p>\n<h2 id=\"adding-a-meal\">Adding a meal<\/h2>\n<ol>\n<li>Tap <strong>Add meal<\/strong> in week view, <strong>Add a meal<\/strong> or <strong>Add another meal<\/strong> in day view, or a date cell in month view.<\/li>\n<li>In the <strong>Add a Meal<\/strong> dialog, choose a <strong>Meal Type<\/strong>: <strong>Breakfast<\/strong>, <strong>Lunch<\/strong> or <strong>Dinner<\/strong>.<\/li>\n<li>Pick a recipe from the list.<\/li>\n<\/ol>\n<p>If your library is empty you will see <strong>No recipes available. Add some recipes first!<\/strong> Add or import a recipe first — see <a href=\"#adding-recipes\">Adding a recipe by hand<\/a>.<\/p>\n<p>You can also plan from the other direction: open a recipe and use <strong>Add to Meal Plan<\/strong>, choosing <strong>Select Date<\/strong> and <strong>Meal Type<\/strong>.<\/p>\n<h2 id=\"one-meal-per-meal-type-per-day\">One meal per meal type per day<\/h2>\n<p>This is the rule that surprises people most, so read it twice.<\/p>\n<p><strong>Your household can have one breakfast, one lunch and one dinner per day. Adding a second dinner to a day replaces the dinner already there, and you get no warning before it happens.<\/strong><\/p>\n<p>What that means in practice:<\/p>\n<ul>\n<li>Planning a second dinner for Friday silently removes Friday's existing dinner.<\/li>\n<li>The AI week planner follows the same rule — a suggestion landing on a day that already has a dinner replaces it. See <a href=\"#ai-week-planner\">Planning a week of dinners with AI<\/a>.<\/li>\n<li>The limit is per household, not per person. There is one shared plan.<\/li>\n<\/ul>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>No recipes available. Add some recipes first!<\/strong> — the <strong>Add a Meal<\/strong> dialog has nothing to offer because your recipe library is empty. Add one by hand or import one, then try again.<\/li>\n<li><strong>A meal you planned has vanished.<\/strong> Either someone in your household added another meal of the same type to that day, which replaced it, or the recipe behind it was deleted. Deleting a recipe also deletes every meal-plan entry that used it.<\/li>\n<li><strong>Move to: does not show the day you want.<\/strong> It only offers days in the week currently on screen. Delete the meal and add it on the target date instead.<\/li>\n<li><strong>A household member's change is missing.<\/strong> There is no live sync between devices. Refresh the page.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li><strong>There is no Snack meal type.<\/strong> The app's own <strong>Help &amp; How To<\/strong> page is older than the app and still mentions one. Only <strong>Breakfast<\/strong>, <strong>Lunch<\/strong> and <strong>Dinner<\/strong> exist.<\/li>\n<li><strong>Deleting a recipe deletes its meal-plan entries.<\/strong> If you clear out your library, the plan loses those meals too.<\/li>\n<li>Everyone in your household shares one meal plan, and anyone can edit it.<\/li>\n<li>Meal cards show total minutes, which is the recipe's prep time plus cook time. If a recipe was imported and those were not printed, the AI estimated them — check the recipe.<\/li>\n<li>The allergy badge on a meal card is keyword matching, not a guarantee. See <a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a>.<\/li>\n<li>One plan covers your whole household, including a second location. Inventory is the thing that is kept separate per location.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#ai-week-planner\">Planning a week of dinners with AI<\/a><\/li>\n<li><a href=\"#prep-sheets\">Meal prep cook sheets<\/a><\/li>\n<li><a href=\"#managing-recipes\">Managing your recipe library<\/a><\/li>\n<li><a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a><\/li>\n<\/ul>", "text": "The Plan tab is a calendar of what you are cooking. You put recipes from your library onto a date and a meal type, and everyone in your household sees the same plan. The three views Across the top of the Plan tab you have Week , Month and Day , a Today button, and previous/next arrows to step backwards and forwards. Week is the working view — it is where you add, move, clear and tag meals. Month is the overview. Day is one date in full, and it is where you open a recipe to cook from. Two calendars, two starting days: week view starts on Monday , while the month grid starts on Sunday . That is worth knowing if you are counting across a row and the days do not line up with what you expected. Today jumps any view back to the current date. Week view Week view shows seven day cards. Each meal on a card shows a thumbnail, the recipe name and the total minutes prep plus cook , with an allergy badge where an ingredient matches a household allergy. On each meal you have: A Move to: dropdown — pick another day and the meal moves there. A delete icon, which removes that meal from the plan. The recipe itself stays in your library. On each day card you have: Clear , which removes every meal from that day. Add meal , which opens the Add a Meal dialog for that date. A day with nothing on it shows No meals . Move to: only lists days in the week you are looking at. To push a meal into next week, delete it and add it again on the new date. Month view Each date cell shows up to 2 meal pills. If a day has more than that, you get a +N more marker instead of the rest — switch to Day or Week to see them all. Tap a cell to add a meal for that date. Tap a pill to open the recipe. Day view The header shows the full date. Each meal has View Recipe & Cook , which opens the recipe so you can cook from it. At the bottom there is Add another meal . An empty day shows No meals planned for this day with an Add a meal button. Adding a meal 1. Tap Add meal in week view, Add a meal or Add another meal in day view, or a date cell in month view. 2. In the Add a Meal dialog, choose a Meal Type : Breakfast , Lunch or Dinner . 3. Pick a recipe from the list. If your library is empty you will see No recipes available. Add some recipes first! Add or import a recipe first — see Adding a recipe by hand adding recipes . You can also plan from the other direction: open a recipe and use Add to Meal Plan , choosing Select Date and Meal Type . One meal per meal type per day This is the rule that surprises people most, so read it twice. Your household can have one breakfast, one lunch and one dinner per day. Adding a second dinner to a day replaces the dinner already there, and you get no warning before it happens. What that means in practice: Planning a second dinner for Friday silently removes Friday's existing dinner. The AI week planner follows the same rule — a suggestion landing on a day that already has a dinner replaces it. See Planning a week of dinners with AI ai week planner . The limit is per household, not per person. There is one shared plan. If something goes wrong No recipes available. Add some recipes first! — the Add a Meal dialog has nothing to offer because your recipe library is empty. Add one by hand or import one, then try again. A meal you planned has vanished. Either someone in your household added another meal of the same type to that day, which replaced it, or the recipe behind it was deleted. Deleting a recipe also deletes every meal plan entry that used it. Move to: does not show the day you want. It only offers days in the week currently on screen. Delete the meal and add it on the target date instead. A household member's change is missing. There is no live sync between devices. Refresh the page. Good to know There is no Snack meal type. The app's own Help & How To page is older than the app and still mentions one. Only Breakfast , Lunch and Dinner exist. Deleting a recipe deletes its meal plan entries. If you clear out your library, the plan loses those meals too. Everyone in your household shares one meal plan, and anyone can edit it. Meal cards show total minutes, which is the recipe's prep time plus cook time. If a recipe was imported and those were not printed, the AI estimated them — check the recipe. The allergy badge on a meal card is keyword matching, not a guarantee. See How allergy warnings work, and their limits how allergy warnings work . One plan covers your whole household, including a second location. Inventory is the thing that is kept separate per location. Related Planning a week of dinners with AI ai week planner Meal prep cook sheets prep sheets Managing your recipe library managing recipes How allergy warnings work, and their limits how allergy warnings work "}, {"id": "ai-week-planner", "title": "Planning a week of dinners with AI", "category": "Meal Planning", "summary": "How Plan this week's meals suggests five to seven dinners around food that is about to expire, and what it does and does not do.", "keywords": ["ai meal plan", "plan this week's meals", "plan a meal", "weekly dinners", "expiring food", "meal suggestions", "dinners only", "powered by claude"], "html": "<p>Pantry Tab AI can propose a week of dinners built around the food you already have, leaning on whatever is closest to expiring. You review every suggestion before anything reaches your plan.<\/p>\n<h2 id=\"where-to-start-it\">Where to start it<\/h2>\n<p>There are two ways in, and both open the same week planner:<\/p>\n<ul>\n<li><strong>Plan this week's meals<\/strong> — \"Uses what's expiring soon\" — in the <strong>Pantry Tab AI<\/strong> panel on your <strong>Home<\/strong> dashboard.<\/li>\n<li><strong>Plan a meal →<\/strong> on the <strong>Tonight's meal plan<\/strong> panel on <strong>Home<\/strong> opens this same week planner, not a single-night flow.<\/li>\n<\/ul>\n<h2 id=\"walking-through-it\">Walking through it<\/h2>\n<ol>\n<li>Open either entry point. The first screen previews what the AI will work from: <strong>\"I'll plan 5–7 dinners for the next week, prioritising ingredients about to expire. Here's what I'll use:\"<\/strong> followed by <strong>Expiring soon<\/strong> and <strong>Days to plan<\/strong> (\"next 7 nights\").<\/li>\n<li>Read the promise underneath: <strong>\"You'll see every suggestion before anything is added to your plan.\"<\/strong> Nothing is saved at this stage.<\/li>\n<li>Start the plan and wait while the AI works.<\/li>\n<li>You then get the review step: <strong>\"Pick the meals you want. Uncheck any you'd rather skip.\"<\/strong> Each suggestion is a card showing the weekday and the calendar date it is destined for, such as \"MONDAY · MAY 18\".<\/li>\n<li>Uncheck anything you do not want. Unchecked meals are not saved.<\/li>\n<li>Confirm to save the rest. The page reloads and the meals appear on your <strong>Plan<\/strong> tab.<\/li>\n<\/ol>\n<h2 id=\"what-it-does-precisely\">What it does, precisely<\/h2>\n<ul>\n<li><strong>Dinners only.<\/strong> It never plans breakfast or lunch.<\/li>\n<li><strong>Five to seven dinners<\/strong>, not always seven.<\/li>\n<li><strong>For the seven days starting tomorrow<\/strong>, not starting today.<\/li>\n<li><strong>It prioritises items that are expiring or already expired<\/strong>, so the plan changes as your pantry does.<\/li>\n<li><strong>It always avoids your household's allergies.<\/strong> For privacy it says only that allergies <strong>\"will be avoided\"<\/strong> rather than listing who is allergic to what.<\/li>\n<\/ul>\n<h2 id=\"what-happens-after-you-save\">What happens after you save<\/h2>\n<p>Four consequences are worth knowing before you use it regularly.<\/p>\n<p><strong>Every accepted suggestion is saved as a new recipe.<\/strong> The suggestions are not picked from your library — they are written for you, and each one you keep becomes a real recipe you can open, edit and cook from. Your library grows every time you run the planner. Tidy it up occasionally from the <strong>Recipes<\/strong> tab.<\/p>\n<p><strong>The page reloads after you save.<\/strong> That is intentional, not a crash. Let it finish.<\/p>\n<p><strong>It does not remember what you ate recently.<\/strong> Run it two weeks running and you may get the same dish twice. Uncheck repeats at the review step.<\/p>\n<p><strong>A suggestion landing on a day that already has a dinner replaces it.<\/strong> Your household can only hold one dinner per day, and there is no warning. If you have already planned Thursday by hand, uncheck the AI's Thursday suggestion before you save.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"No meals selected\"<\/strong> — you unchecked everything, or nothing was ticked when you confirmed. Tick at least one suggestion.<\/li>\n<li><strong>\"Failed to save meals\"<\/strong> — the plan did not save. Try again; if it keeps failing, refresh the page and rerun the planner.<\/li>\n<li><strong>\"Rate limit reached. Please try again in a moment.\"<\/strong> — an AI feature was used too quickly. Wait a moment and retry.<\/li>\n<li><strong>\"AI credits exhausted. Please add credits to continue.\"<\/strong> — a service-side limit rather than anything on your account. Contact support.<\/li>\n<li><strong>\"Session expired. Please log in again.\"<\/strong> — sign in again and rerun the planner.<\/li>\n<li><strong>Your dinners did not appear.<\/strong> Check the right week: the plan covers the seven days starting tomorrow, so nothing lands on today. Week view starts Monday, so a plan made mid-week runs into next week's card.<\/li>\n<\/ul>\n<h2 id=\"tips-for-better-plans\">Tips for better plans<\/h2>\n<ul>\n<li>Fill in expiry dates as you add items. The planner is built around what is expiring, so an inventory with no dates gives it little to work with. Scanning a shelf or a receipt sets estimated dates for you.<\/li>\n<li>Run it before you shop, not after. It plans from what you own.<\/li>\n<li>Record everyone's allergies first, including keywords — the AI is told to avoid household allergens, and better keywords make that matching better.<\/li>\n<li>Plan the nights you already know about by hand first, then uncheck the AI's suggestions for those days so nothing is overwritten.<\/li>\n<li>If a suggestion is close but not right, keep it and edit the saved recipe afterwards.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>The suggestions are AI-written recipes. Read the ingredients and steps before you shop or cook.<\/li>\n<li>Allergy avoidance is instructed, not guaranteed. Matching is keyword-based and can miss allergens that are named differently or hidden in a product. Always read the actual product label — see <a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a>.<\/li>\n<li>The planner does not add anything to your grocery list. To fill the gaps, use the <strong>Pantry Check<\/strong> on each recipe or <a href=\"#ai-grocery-list\">Building your grocery list with AI<\/a>.<\/li>\n<li>Once dinners are on the plan, you can tag them with the chef-hat in week view to build a <a href=\"#prep-sheets\">meal prep cook sheet<\/a>.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#meal-planner-basics\">Using the meal planner<\/a><\/li>\n<li><a href=\"#prep-sheets\">Meal prep cook sheets<\/a><\/li>\n<li><a href=\"#ai-grocery-list\">Building your grocery list with AI<\/a><\/li>\n<li><a href=\"#expiry-and-low-stock\">Expiry alerts and low-stock reminders<\/a><\/li>\n<\/ul>", "text": "Pantry Tab AI can propose a week of dinners built around the food you already have, leaning on whatever is closest to expiring. You review every suggestion before anything reaches your plan. Where to start it There are two ways in, and both open the same week planner: Plan this week's meals — \"Uses what's expiring soon\" — in the Pantry Tab AI panel on your Home dashboard. Plan a meal → on the Tonight's meal plan panel on Home opens this same week planner, not a single night flow. Walking through it 1. Open either entry point. The first screen previews what the AI will work from: \"I'll plan 5–7 dinners for the next week, prioritising ingredients about to expire. Here's what I'll use:\" followed by Expiring soon and Days to plan \"next 7 nights\" . 2. Read the promise underneath: \"You'll see every suggestion before anything is added to your plan.\" Nothing is saved at this stage. 3. Start the plan and wait while the AI works. 4. You then get the review step: \"Pick the meals you want. Uncheck any you'd rather skip.\" Each suggestion is a card showing the weekday and the calendar date it is destined for, such as \"MONDAY · MAY 18\". 5. Uncheck anything you do not want. Unchecked meals are not saved. 6. Confirm to save the rest. The page reloads and the meals appear on your Plan tab. What it does, precisely Dinners only. It never plans breakfast or lunch. Five to seven dinners , not always seven. For the seven days starting tomorrow , not starting today. It prioritises items that are expiring or already expired , so the plan changes as your pantry does. It always avoids your household's allergies. For privacy it says only that allergies \"will be avoided\" rather than listing who is allergic to what. What happens after you save Four consequences are worth knowing before you use it regularly. Every accepted suggestion is saved as a new recipe. The suggestions are not picked from your library — they are written for you, and each one you keep becomes a real recipe you can open, edit and cook from. Your library grows every time you run the planner. Tidy it up occasionally from the Recipes tab. The page reloads after you save. That is intentional, not a crash. Let it finish. It does not remember what you ate recently. Run it two weeks running and you may get the same dish twice. Uncheck repeats at the review step. A suggestion landing on a day that already has a dinner replaces it. Your household can only hold one dinner per day, and there is no warning. If you have already planned Thursday by hand, uncheck the AI's Thursday suggestion before you save. If something goes wrong \"No meals selected\" — you unchecked everything, or nothing was ticked when you confirmed. Tick at least one suggestion. \"Failed to save meals\" — the plan did not save. Try again; if it keeps failing, refresh the page and rerun the planner. \"Rate limit reached. Please try again in a moment.\" — an AI feature was used too quickly. Wait a moment and retry. \"AI credits exhausted. Please add credits to continue.\" — a service side limit rather than anything on your account. Contact support. \"Session expired. Please log in again.\" — sign in again and rerun the planner. Your dinners did not appear. Check the right week: the plan covers the seven days starting tomorrow, so nothing lands on today. Week view starts Monday, so a plan made mid week runs into next week's card. Tips for better plans Fill in expiry dates as you add items. The planner is built around what is expiring, so an inventory with no dates gives it little to work with. Scanning a shelf or a receipt sets estimated dates for you. Run it before you shop, not after. It plans from what you own. Record everyone's allergies first, including keywords — the AI is told to avoid household allergens, and better keywords make that matching better. Plan the nights you already know about by hand first, then uncheck the AI's suggestions for those days so nothing is overwritten. If a suggestion is close but not right, keep it and edit the saved recipe afterwards. Good to know The suggestions are AI written recipes. Read the ingredients and steps before you shop or cook. Allergy avoidance is instructed, not guaranteed. Matching is keyword based and can miss allergens that are named differently or hidden in a product. Always read the actual product label — see How allergy warnings work, and their limits how allergy warnings work . The planner does not add anything to your grocery list. To fill the gaps, use the Pantry Check on each recipe or Building your grocery list with AI ai grocery list . Once dinners are on the plan, you can tag them with the chef hat in week view to build a meal prep cook sheet prep sheets . Related Using the meal planner meal planner basics Meal prep cook sheets prep sheets Building your grocery list with AI ai grocery list Expiry alerts and low stock reminders expiry and low stock "}, {"id": "prep-sheets", "title": "Meal prep cook sheets", "category": "Meal Planning", "summary": "Tag meals with the chef-hat and Pantry Tab builds a batch-cooking sheet with a prep list, a cook timeline, and storage and reheating notes.", "keywords": ["meal prep", "prep sheet", "cook sheet", "chef hat", "batch cooking", "build prep sheet", "cook timeline", "store and reheat", "download", "print", "portions"], "html": "<p>A prep sheet turns several planned meals into one cooking session. It tells you what to chop first, what order to cook in, how many portions you will end up with, and how to store and reheat each one. It is for anyone who cooks a batch on Sunday and eats from it during the week.<\/p>\n<h2 id=\"tagging-the-meals\">Tagging the meals<\/h2>\n<p>Prep sheets are built from the meals you tag in <strong>week<\/strong> view on the <strong>Plan<\/strong> tab.<\/p>\n<ol>\n<li>Go to the <strong>Plan<\/strong> tab and switch to <strong>Week<\/strong>.<\/li>\n<li>Tap the <strong>chef-hat<\/strong> icon on each meal you want to batch-cook. That marks it <strong>Prep ahead<\/strong>.<\/li>\n<li>Tap the chef-hat again to untag a meal.<\/li>\n<\/ol>\n<p>Tag the meals from the same week — a sheet covers the week you are looking at.<\/p>\n<h2 id=\"building-the-sheet\">Building the sheet<\/h2>\n<p>The header button reads <strong>Build prep sheet · N tagged<\/strong>, where N is how many meals you have tagged.<\/p>\n<ul>\n<li>With nothing tagged the button is disabled, with the tooltip <strong>\"Tag meals with the chef-hat to build a prep sheet\"<\/strong>.<\/li>\n<li>Tap it once you have tagged at least one meal and the sheet is generated.<\/li>\n<li>After it is built, the button becomes <strong>View prep sheet<\/strong> and reopens the sheet instantly.<\/li>\n<\/ul>\n<h2 id=\"what-is-on-the-sheet\">What is on the sheet<\/h2>\n<p><strong>Summary tiles<\/strong> across the top: <strong>meals<\/strong>, <strong>active time<\/strong> and <strong>containers<\/strong> — how many dishes the session covers, roughly how long you will be working, and how many storage containers to have ready.<\/p>\n<p><strong>Prep ahead<\/strong> — a task list of the chopping, marinating and measuring to do before you start cooking.<\/p>\n<p><strong>Cook timeline<\/strong> — numbered steps in the order to work through, so things that share an oven or need resting time line up.<\/p>\n<p><strong>Store &amp; reheat<\/strong> — one card per meal, showing:<\/p>\n<ul>\n<li>The number of portions.<\/li>\n<li>A storage badge: <strong>Fridge<\/strong>, <strong>Freeze<\/strong>, or <strong>Fridge + Freeze<\/strong>.<\/li>\n<li><strong>Reheat:<\/strong> with the reheating instructions.<\/li>\n<li><strong>Reheats:<\/strong> with how well that dish holds up to reheating.<\/li>\n<\/ul>\n<p><strong>Heads-up notes<\/strong> — a list of things worth knowing before you start.<\/p>\n<p><strong>Skipped<\/strong> — a line naming any tagged meal that was left out of the sheet. See the limits below.<\/p>\n<h2 id=\"portions\">Portions<\/h2>\n<p>Portions are calculated as <strong>the number of tagged meals × the number of people in your household<\/strong>. Tag four meals in a house of three and the sheet plans for twelve portions.<\/p>\n<p>To change the number, change who is on your household's people list at <strong>Household Members<\/strong> — add the eaters who are missing, or remove ones who no longer eat with you. There is no separate portions setting on the sheet itself. After changing the list, use <strong>Rebuild<\/strong> to recalculate.<\/p>\n<h2 id=\"the-footer-buttons\">The footer buttons<\/h2>\n<ul>\n<li><strong>Rebuild<\/strong> — regenerates the sheet. Use it after changing the tagged meals, filling in a skipped recipe, or updating your people list.<\/li>\n<li><strong>Download<\/strong> — saves an .html file named <code>pantrytab-prep-sheet-&lt;weekStart&gt;.html<\/code>.<\/li>\n<li><strong>Print<\/strong> — opens the sheet in a new window and sends it to your printer.<\/li>\n<li><strong>Done<\/strong> — closes the dialog.<\/li>\n<\/ul>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>\"No meals are tagged for prep in this week. Tap the chef-hat on a meal to tag it.\"<\/strong> — nothing in the week you are viewing is tagged. Switch to week view, tap the chef-hat on the meals you want, and build again.<\/li>\n<li><strong>\"The tagged meals have no ingredients or steps yet. Add them to the recipes first.\"<\/strong> — every meal you tagged is missing its ingredients or its instructions, so there was nothing to build from. Open those recipes, fill them in, and rebuild.<\/li>\n<li><strong>You tagged four meals and got a one-meal sheet.<\/strong> The other three were skipped because their recipes have no ingredients or no instructions. Check the <strong>Skipped<\/strong> line at the bottom of the sheet for the names, complete those recipes, then <strong>Rebuild<\/strong>.<\/li>\n<li><strong>Nothing happened when you tapped Print.<\/strong> Print opens a new window, so a pop-up blocker will stop it. Allow pop-ups for pantrytab.com, or use <strong>Download<\/strong> and print from the downloaded file.<\/li>\n<li><strong>Your sheet is gone.<\/strong> The sheet is not saved. Refreshing the page loses it. Build it again, and use <strong>Download<\/strong> this time.<\/li>\n<li><strong>\"Rate limit reached. Please try again in a moment.\"<\/strong> — wait a moment and build again.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li><strong>Recipes with no ingredients or no instructions are silently skipped.<\/strong> They do not stop the build; they are simply listed under <strong>Skipped<\/strong>. This is the usual reason a sheet is smaller than you expected.<\/li>\n<li><strong>The sheet is not saved.<\/strong> It survives closing the dialog — <strong>View prep sheet<\/strong> brings it straight back — but it is lost on a page refresh and it does not sync to your other devices or to other people in your household. Use <strong>Download<\/strong> if you want to keep it.<\/li>\n<li><strong>Download gives you an .html file.<\/strong> Open it in your browser and use your browser's print dialog to save it as PDF if that is what you need.<\/li>\n<li>Times and container counts are estimates. Read the whole sheet before you start so you know what equipment you need.<\/li>\n<li>Ingredients come from the recipes, not from your pantry — check you actually have everything, or run the recipe's <strong>Pantry Check<\/strong> first.<\/li>\n<li>Allergy warnings are not repeated on the prep sheet. Check the meals on the <strong>Plan<\/strong> tab before you tag them, and see <a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a>.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#meal-planner-basics\">Using the meal planner<\/a><\/li>\n<li><a href=\"#ai-week-planner\">Planning a week of dinners with AI<\/a><\/li>\n<li><a href=\"#managing-recipes\">Managing your recipe library<\/a><\/li>\n<li><a href=\"#people-profiles\">People profiles and the active person<\/a><\/li>\n<\/ul>", "text": "A prep sheet turns several planned meals into one cooking session. It tells you what to chop first, what order to cook in, how many portions you will end up with, and how to store and reheat each one. It is for anyone who cooks a batch on Sunday and eats from it during the week. Tagging the meals Prep sheets are built from the meals you tag in week view on the Plan tab. 1. Go to the Plan tab and switch to Week . 2. Tap the chef hat icon on each meal you want to batch cook. That marks it Prep ahead . 3. Tap the chef hat again to untag a meal. Tag the meals from the same week — a sheet covers the week you are looking at. Building the sheet The header button reads Build prep sheet · N tagged , where N is how many meals you have tagged. With nothing tagged the button is disabled, with the tooltip \"Tag meals with the chef hat to build a prep sheet\" . Tap it once you have tagged at least one meal and the sheet is generated. After it is built, the button becomes View prep sheet and reopens the sheet instantly. What is on the sheet Summary tiles across the top: meals , active time and containers — how many dishes the session covers, roughly how long you will be working, and how many storage containers to have ready. Prep ahead — a task list of the chopping, marinating and measuring to do before you start cooking. Cook timeline — numbered steps in the order to work through, so things that share an oven or need resting time line up. Store & reheat — one card per meal, showing: The number of portions. A storage badge: Fridge , Freeze , or Fridge + Freeze . Reheat: with the reheating instructions. Reheats: with how well that dish holds up to reheating. Heads up notes — a list of things worth knowing before you start. Skipped — a line naming any tagged meal that was left out of the sheet. See the limits below. Portions Portions are calculated as the number of tagged meals × the number of people in your household . Tag four meals in a house of three and the sheet plans for twelve portions. To change the number, change who is on your household's people list at Household Members — add the eaters who are missing, or remove ones who no longer eat with you. There is no separate portions setting on the sheet itself. After changing the list, use Rebuild to recalculate. The footer buttons Rebuild — regenerates the sheet. Use it after changing the tagged meals, filling in a skipped recipe, or updating your people list. Download — saves an .html file named pantrytab prep sheet <weekStart .html . Print — opens the sheet in a new window and sends it to your printer. Done — closes the dialog. If something goes wrong \"No meals are tagged for prep in this week. Tap the chef hat on a meal to tag it.\" — nothing in the week you are viewing is tagged. Switch to week view, tap the chef hat on the meals you want, and build again. \"The tagged meals have no ingredients or steps yet. Add them to the recipes first.\" — every meal you tagged is missing its ingredients or its instructions, so there was nothing to build from. Open those recipes, fill them in, and rebuild. You tagged four meals and got a one meal sheet. The other three were skipped because their recipes have no ingredients or no instructions. Check the Skipped line at the bottom of the sheet for the names, complete those recipes, then Rebuild . Nothing happened when you tapped Print. Print opens a new window, so a pop up blocker will stop it. Allow pop ups for pantrytab.com, or use Download and print from the downloaded file. Your sheet is gone. The sheet is not saved. Refreshing the page loses it. Build it again, and use Download this time. \"Rate limit reached. Please try again in a moment.\" — wait a moment and build again. Good to know Recipes with no ingredients or no instructions are silently skipped. They do not stop the build; they are simply listed under Skipped . This is the usual reason a sheet is smaller than you expected. The sheet is not saved. It survives closing the dialog — View prep sheet brings it straight back — but it is lost on a page refresh and it does not sync to your other devices or to other people in your household. Use Download if you want to keep it. Download gives you an .html file. Open it in your browser and use your browser's print dialog to save it as PDF if that is what you need. Times and container counts are estimates. Read the whole sheet before you start so you know what equipment you need. Ingredients come from the recipes, not from your pantry — check you actually have everything, or run the recipe's Pantry Check first. Allergy warnings are not repeated on the prep sheet. Check the meals on the Plan tab before you tag them, and see How allergy warnings work, and their limits how allergy warnings work . Related Using the meal planner meal planner basics Planning a week of dinners with AI ai week planner Managing your recipe library managing recipes People profiles and the active person people profiles "}, {"id": "allergies-setup", "title": "Setting up allergies for your household", "category": "Allergies & Safety", "summary": "How to record each person's allergies, why the keywords field matters so much, and how to edit, pause or remove an allergy entry.", "keywords": ["allergies", "allergy", "allergen", "add allergy", "keywords", "severity", "mild", "medium", "severe", "by allergen", "by person", "alerts off", "allergy alerts", "peanut"], "html": "<p>The <strong>Allergies<\/strong> tab is where you tell Pantry Tab who in your household reacts to what. Every allergy badge and warning in the app, and every ingredient the AI steers aroun
