 your device will bring it back. If a feature you expected is absent but other"}, {"id": "privacy-and-your-data", "title": "Your data and privacy", "category": "Troubleshooting", "summary": "What your household can see, what is public, what happens to photos you scan, how the Kroger and payment connections work, and what deleting removes.", "keywords": ["privacy", "data", "sharing", "public", "visible", "delete my data", "photos", "receipts", "kroger", "payment", "security", "legal"], "html": "<p>This article describes what Pantry Tab actually does with your information, based on how the app behaves. It is not a legal policy — see the last section for where policy questions go.<\/p>\n<h2 id=\"what-your-household-sees\">What your household sees<\/h2>\n<p>A household is one shared kitchen. Everyone in it sees, and can edit, all of this:<\/p>\n<ul>\n<li>Inventory at every location<\/li>\n<li>The grocery list<\/li>\n<li>Recipes in the household library<\/li>\n<li>The meal plan<\/li>\n<li>People profiles, including the details you record on them<\/li>\n<li><strong>Allergies, including who has them and how severe they are<\/strong><\/li>\n<li>Stores and locations<\/li>\n<\/ul>\n<p>There is <strong>no per-member privacy inside a household<\/strong>. If you would not want another member to read something, do not record it against a person profile. This matters most for allergies: allergy entries name the person, the allergen and the severity, and those warnings appear on inventory cards, grocery rows, meal cards and recipe detail for everyone in the household.<\/p>\n<p>One place the app does hold back: when the AI plans a week of dinners, it shows household allergies generically as \"will be avoided\" rather than listing them, so an allergy is not spelled out on a shared screen.<\/p>\n<h2 id=\"what-stays-yours-alone\">What stays yours alone<\/h2>\n<p>These are tied to your account, not the household:<\/p>\n<ul>\n<li>Your profile<\/li>\n<li>Recipes you save from the marketplace<\/li>\n<li>Your Kroger connection<\/li>\n<li>Your billing and subscription<\/li>\n<\/ul>\n<p>Household members cannot see any of these, and they do not move with you if you join a different household.<\/p>\n<h2 id=\"what-is-public\">What is public<\/h2>\n<ul>\n<li><strong>Publishing a recipe makes a separate public copy.<\/strong> Anyone can see it, including people who are not signed in to Pantry Tab.<\/li>\n<li><strong>Ratings and comments on marketplace recipes are public<\/strong> in the same way.<\/li>\n<li><strong>Kitchen Talk topics and comments are visible to every signed-in Pantry Tab user.<\/strong> Treat the forum as a public place: no personal addresses, and no photos of anything you would not show a stranger.<\/li>\n<li>You can edit or delete only your own topics and comments.<\/li>\n<\/ul>\n<p>Publishing is a deliberate act. Nothing in your household library is public until you use <strong>Post to Marketplace?<\/strong>.<\/p>\n<h2 id=\"photos-you-scan\">Photos you scan<\/h2>\n<p>When you scan a shelf, a receipt, or a recipe photo, that image is sent for AI analysis so the app can read it and give you a result back. The app then shows you a review step, and nothing is added to your inventory or library until you confirm.<\/p>\n<p>Receipts deserve a moment's thought. A receipt photo can carry more than the shopping — store and date, and sometimes card or loyalty details printed at the bottom. Pantry Tab reads the store name, the total, the date and the line items, and skips non-food lines, but the photo you upload is the whole picture. Crop or cover anything you would rather not send.<\/p>\n<p>Some features also look things up outside the app: barcode scanning checks public product databases, recipe discovery uses a recipe service, and the <strong>Crowdsourced<\/strong> prices tab searches prices reported by the community from stores worldwide. Those lookups are searches for product information, not uploads of your pantry.<\/p>\n<h2 id=\"connecting-kroger\">Connecting Kroger<\/h2>\n<ul>\n<li>Connecting sends you to <strong>Kroger<\/strong> to sign in. You enter your Kroger details on Kroger's own page. <strong>Pantry Tab never sees your Kroger password.<\/strong><\/li>\n<li>The connection link is valid for <strong>15 minutes<\/strong>. If you take longer, press <strong>Connect<\/strong> again.<\/li>\n<li>The connection lets Pantry Tab push items into your Kroger pickup cart. It <strong>cannot read your cart back<\/strong>, so it never learns what you actually bought at Kroger.<\/li>\n<li><strong>Disconnect<\/strong> ends the connection and the <strong>Send to Kroger Pickup<\/strong> card stops appearing.<\/li>\n<li>Disconnecting does not empty or change your Kroger cart, and it does not touch your Kroger account or anything held at Kroger's end. Manage that in the Kroger app. It also does not change your Pantry Tab grocery list.<\/li>\n<\/ul>\n<h2 id=\"payment-details\">Payment details<\/h2>\n<p><strong>Manage subscription<\/strong> on the Billing page opens the payment provider's billing portal, and that is where card details are entered, updated and stored. Pantry Tab does not store your card. Cancelling is done there too.<\/p>\n<p>Your subscription is matched by <strong>email address<\/strong>. If you pay with a different email than the one you sign in with, the app will keep showing you as Free — contact support rather than paying twice.<\/p>\n<h2 id=\"what-deleting-removes\">What deleting removes<\/h2>\n<p>Deleting cascades, and there is no undo:<\/p>\n<ul>\n<li><strong>Deleting a household deletes all of its data<\/strong> — inventory, grocery list, recipes, meal plan, people and allergies.<\/li>\n<li><strong>Deleting a location deletes that location's inventory.<\/strong> Grocery items survive but lose their location tag.<\/li>\n<li><strong>Deleting a recipe deletes every meal-plan entry that used it.<\/strong><\/li>\n<li><strong>Deleting a person deletes their allergies.<\/strong><\/li>\n<li><strong>Deleting a recipe you published does not remove the public copy.<\/strong> Use <strong>Manage Recipe<\/strong> on the marketplace to take that down.<\/li>\n<\/ul>\n<p>Leaving a household by accepting an invitation elsewhere does not delete the old household's data — it stays with the household you left.<\/p>\n<h2 id=\"if-something-goes-wrong\">If something goes wrong<\/h2>\n<ul>\n<li><strong>You published a recipe by mistake.<\/strong> Open <strong>Manage Recipe<\/strong> on the marketplace copy. Deleting your private recipe alone will not remove it.<\/li>\n<li><strong>You uploaded a receipt photo you would rather not have sent.<\/strong> Contact support.<\/li>\n<li><strong>Another member changed or deleted something of yours.<\/strong> Every member has full edit rights, and there is no per-member history to restore from.<\/li>\n<li><strong>You cannot delete a person.<\/strong> You will see <strong>\"Cannot delete the active person. Please switch to a different person first.\"<\/strong> Change the header <strong>Active Person<\/strong>, then delete.<\/li>\n<\/ul>\n<h2 id=\"good-to-know\">Good to know<\/h2>\n<ul>\n<li>Alerts are in-app only. Pantry Tab does not email or push notify you, so nothing about your pantry arrives outside the app.<\/li>\n<li>The <strong>/terms<\/strong>, <strong>/privacy<\/strong> and <strong>/disclaimer<\/strong> pages in the app are <strong>currently placeholders<\/strong>. They are where the authoritative policy will live, but they do not carry it today. For any question about how your data is held, retained or deleted, contact support and get the answer in writing — do not rely on this article for that.<\/li>\n<li>Allergy matching is keyword-based and is not medical advice. See <a href=\"#how-allergy-warnings-work\">How allergy warnings work, and their limits<\/a>.<\/li>\n<\/ul>\n<h2 id=\"related\">Related<\/h2>\n<ul>\n<li><a href=\"#households-and-sharing\">Households: sharing your kitchen<\/a><\/li>\n<li><a href=\"#publishing-recipes\">Publishing, rating, and reviewing recipes<\/a><\/li>\n<li><a href=\"#kroger-connect\">Connecting your Kroger account<\/a><\/li>\n<li><a href=\"#limits-and-known-issues\">Limits and known issues<\/a><\/li>\n<\/ul>", "text": "This article describes what Pantry Tab actually does with your information, based on how the app behaves. It is not a legal policy — see the last section for where policy questions go. What your household sees A household is one shared kitchen. Everyone in it sees, and can edit, all of this: Inventory at every location The grocery list Recipes in the household library The meal plan People profiles, including the details you record on them Allergies, including who has them and how severe they are Stores and locations There is no per member privacy inside a household . If you would not want another member to read something, do not record it against a person profile. This matters most for allergies: allergy entries name the person, the allergen and the severity, and those warnings appear on inventory cards, grocery rows, meal cards and recipe detail for everyone in the household. One place the app does hold back: when the AI plans a week of dinners, it shows household allergies generically as \"will be avoided\" rather than listing them, so an allergy is not spelled out on a shared screen. What stays yours alone These are tied to your account, not the household: Your profile Recipes you save from the marketplace Your Kroger connection Your billing and subscription Household members cannot see any of these, and they do not move with you if you join a different household. What is public Publishing a recipe makes a separate public copy. Anyone can see it, including people who are not signed in to Pantry Tab. Ratings and comments on marketplace recipes are public in the same way. Kitchen Talk topics and comments are visible to every signed in Pantry Tab user. Treat the forum as a public place: no personal addresses, and no photos of anything you would not show a stranger. You can edit or delete only your own topics and comments. Publishing is a deliberate act. Nothing in your household library is public until you use Post to Marketplace? . Photos you scan When you scan a shelf, a receipt, or a recipe photo, that image is sent for AI analysis so the app can read it and give you a result back. The app then shows you a review step, and nothing is added to your inventory or library until you confirm. Receipts deserve a moment's thought. A receipt photo can carry more than the shopping — store and date, and sometimes card or loyalty details printed at the bottom. Pantry Tab reads the store name, the total, the date and the line items, and skips non food lines, but the photo you upload is the whole picture. Crop or cover anything you would rather not send. Some features also look things up outside the app: barcode scanning checks public product databases, recipe discovery uses a recipe service, and the Crowdsourced prices tab searches prices reported by the community from stores worldwide. Those lookups are searches for product information, not uploads of your pantry. Connecting Kroger Connecting sends you to Kroger to sign in. You enter your Kroger details on Kroger's own page. Pantry Tab never sees your Kroger password. The connection link is valid for 15 minutes . If you take longer, press Connect again. The connection lets Pantry Tab push items into your Kroger pickup cart. It cannot read your cart back , so it never learns what you actually bought at Kroger. Disconnect ends the connection and the Send to Kroger Pickup card stops appearing. Disconnecting does not empty or change your Kroger cart, and it does not touch your Kroger account or anything held at Kroger's end. Manage that in the Kroger app. It also does not change your Pantry Tab grocery list. Payment details Manage subscription on the Billing page opens the payment provider's billing portal, and that is where card details are entered, updated and stored. Pantry Tab does not store your card. Cancelling is done there too. Your subscription is matched by email address . If you pay with a different email than the one you sign in with, the app will keep showing you as Free — contact support rather than paying twice. What deleting removes Deleting cascades, and there is no undo: Deleting a household deletes all of its data — inventory, grocery list, recipes, meal plan, people and allergies. Deleting a location deletes that location's inventory. Grocery items survive but lose their location tag. Deleting a recipe deletes every meal plan entry that used it. Deleting a person deletes their allergies. Deleting a recipe you published does not remove the public copy. Use Manage Recipe on the marketplace to take that down. Leaving a household by accepting an invitation elsewhere does not delete the old household's data — it stays with the household you left. If something goes wrong You published a recipe by mistake. Open Manage Recipe on the marketplace copy. Deleting your private recipe alone will not remove it. You uploaded a receipt photo you would rather not have sent. Contact support. Another member changed or deleted something of yours. Every member has full edit rights, and there is no per member history to restore from. You cannot delete a person. You will see \"Cannot delete the active person. Please switch to a different person first.\" Change the header Active Person , then delete. Good to know Alerts are in app only. Pantry Tab does not email or push notify you, so nothing about your pantry arrives outside the app. The /terms , /privacy and /disclaimer pages in the app are currently placeholders . They are where the authoritative policy will live, but they do not carry it today. For any question about how your data is held, retained or deleted, contact support and get the answer in writing — do not rely on this article for that. Allergy matching is keyword based and is not medical advice. See How allergy warnings work, and their limits how allergy warnings work . Related Households: sharing your kitchen households and sharing Publishing, rating, and reviewing recipes publishing recipes Connecting your Kroger account kroger connect Limits a"}], "categories": [{"name": "Getting Started", "icon": "M12 2 3 7v10l9 5 9-5V7z M12 22V12 M3 7l9 5 9-5", "ids": ["welcome-to-pantry-tab", "create-your-account", "install-on-your-phone", "tour-of-the-app", "your-first-week"]}, {"name": "Your Household", "icon": "M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z", "ids": ["households-and-sharing", "inviting-and-managing-members", "people-profiles", "multiple-locations"]}, {"name": "Pantry Inventory", "icon": "M4 3h16v6H4z M4 9v12h16V9 M9 13h6", "ids": ["adding-items-manually", "barcode-scanning", "scanning-a-shelf", "scanning-a-receipt", "managing-your-inventory", "expiry-and-low-stock"]}, {"name": "Grocery List", "icon": "M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6 M10 21h.01 M17 21h.01", "ids": ["using-the-grocery-list", "ai-grocery-list", "shopping-calculator", "coupons", "kroger-connect", "kroger-send-to-cart"]}, {"name": "Recipes", "icon": "M4 4h13a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z M8 8h8 M8 12h8", "ids": ["adding-recipes", "importing-recipes", "managing-recipes", "what-can-i-make"]}, {"name": "Meal Planning", "icon": "M8 2v4 M16 2v4 M3 10h18 M5 6h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z", "ids": ["meal-planner-basics", "ai-week-planner", "prep-sheets"]}, {"name": "Allergies & Safety", "icon": "M12 2 3 6v6c0 5 3.8 9.4 9 10 5.2-.6 9-5 9-10V6z M12 8v5 M12 16h.01", "ids": ["allergies-setup", "how-allergy-warnings-work"]}, {"name": "Prices & Savings", "icon": "M12 1v22 M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6", "ids": ["price-tracking", "crowdsourced-prices"]}, {"name": "Community", "icon": "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M23 21v-2a4 4 0 0 0-3-3.9 M16 3.1a4 4 0 0 1 0 7.8", "ids": ["browse-mar const A = DATA.articles, CATS = DATA.categories;
const BY = Object.fromEntries(A.map(a => [a.id, a]));
const ORDER = CATS.flatMap(c => c.ids);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- theme ---------- */
const SUN = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>';
const MOON = '<path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8z"/>';
function setTheme(t){
  document.documentElement.dataset.theme = t;
  document.getElementById('themeIcon').innerHTML = t === 'dark' ? SUN : MOON;
  try{ localStorage.setItem('pt-help-theme', t); }catch(e){}
}
setTheme((()=>{ try{ return localStorage.getItem('pt-help-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark':'light'); }catch(e){ return 'light'; } })());
document.getElementById('themeBtn').onclick = () =>
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* ---------- sidebar ---------- */
document.getElementById('side').innerHTML = CATS.map(c => `
  <h4><svg viewBox="0 0 24 24"><path d="${c.icon}"/></svg>${esc(c.name)}</h4>
  ${c.ids.map(id => `<a href="#${id}" data-id="${id}">${esc(BY[id].title)}</a>`).join('')}
`).join('');
document.getElementById('fcount').textContent =
  `${A.length} articles across ${CATS.length} topics · Last updated 18 August 2026`;

/* ---------- search ---------- */
function search(q){
  const terms = q.toLowerCase().split(/\s+/).filter(t => t.length > 1);
  if (!terms.length) return [];
  return A.map(a => {
    const t = a.title.toLowerCase(), s = a.summary.toLowerCase();
    const k = a.keywords.join(' ').toLowerCase(), b = a.text.toLowerCase();
    let score = 0;
    for (const term of terms){
      let hit = 0;
      if (t.includes(term)) hit += t.startsWith(term) ? 60 : 40;
      if (k.includes(term)) hit += 22;
      if (s.includes(term)) hit += 14;
      const n = b.split(term).length - 1;
      if (n) hit += Math.min(12, 3 + n);
      if (!hit) return null;
      score += hit;
    }
    return { a, score };
  }).filter(Boolean).sort((x, y) => y.score - x.score).slice(0, 9).map(r => r.a);
}
function snippet(a, q){
  const terms = q.toLowerCase().split(/\s+/).filter(t => t.length > 1);
  let src = a.summary, low = a.text.toLowerCase(), at = -1;
  for (const term of terms){ const i = low.indexOf(term); if (i > -1){ at = i; break; } }
  if (at > -1 && !terms.some(t => a.summary.toLowerCase().includes(t))){
    const s = Math.max(0, at - 55);
    src = (s ? '…' : '') + a.text.slice(s, s + 165).trim() + '…';
  }
  let out = esc(src);
  for (const term of terms)
    out = out.replace(new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','ig'),'<mark>$1</mark>');
  return out;
}

function wireSearch(wrap){
  const input = wrap.querySelector('input'), box = wrap.querySelector('.results');
  let sel = -1, cur = [];
  const close = () => { box.classList.remove('on'); sel = -1; };
  const render = () => {
    const q = input.value.trim();
    if (!q){ close(); return; }
    cur = search(q);
    box.innerHTML = cur.length
      ? cur.map((a,i) => `<a class="res" href="#${a.id}" data-i="${i}">
          <div class="rc">${esc(a.category)}</div>
          <div class="rt">${esc(a.title)}</div>
          <div class="rs">${snippet(a, q)}</div></a>`).join('')
      : `<div class="nores">No articles match “${esc(q)}”.<br>Try a word from the screen you are looking at.</div>`;
    box.classList.add('on'); sel = -1;
  };
  input.addEventListener('input', render);
  input.addEventListener('focus', () => { if (input.value.trim()) render(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ input.blur(); close(); return; }
    if (!cur.length || !box.classList.contains('on')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : cur.length - 1) + (sel < 0 && e.key === 'ArrowUp' ? 1 : 0)) % cur.length;
      [...box.children].forEach((el,i) => el.classList.toggle('sel', i === sel));
      box.children[sel]?.scrollIntoView({ block:'nearest' });
    } else if (e.key === 'Enter' && sel > -1){
      e.preventDefault(); location.hash = cur[sel].id; input.blur(); close();
    }
  });
  box.addEventListener('click', () => { close(); input.blur(); });
  document.addEventListener('click', e => { if (!wrap.contains(e.target)) close(); });
  return input;
}
const headInput = wireSearch(document.getElementById('hSearch'));
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault();
    (document.querySelector('.hero input') || headInput).focus();
  }
});

/* ---------- routing ---------- */
const main = document.getElementById('main'), side = document.getElementById('side');
const POPULAR = ['welcome-to-pantry-tab','scanning-a-shelf','ai-week-planner',
                 'how-allergy-warnings-work','kroger-send-to-cart','troubleshooting'];

function renderHome(){
  document.body.classList.add('home');
  main.innerHTML = `
    <section class="hero">
      <h1>How can we help?</h1>
      <p>Guides for every part of Pantry Tab, from your first shelf scan to sending a
         grocery list straight to a Kroger pickup cart.</p>
      <div class="searchwrap" id="heroSearch">
        <div class="searchbox">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" placeholder="Search help articles" aria-label="Search help articles" autocomplete="off">
        </div>
        <div class="results"></div>
      </div>
      <div class="pills">${POPULAR.map(id =>
        `<a class="pill" href="#${id}">${esc(BY[id].title)}</a>`).join('')}</div>
    </section>
    <div class="grid">${CATS.map(c => `
      <div class="card">
        <h3><svg viewBox="0 0 24 24"><path d="${c.icon}"/></svg>${esc(c.name)}</h3>
        <p class="cnt">${c.ids.length} article${c.ids.length > 1 ? 's' : ''}</p>
        <ul>${c.ids.map(id => `<li><a href="#${id}">${esc(BY[id].title)}</a></li>`).join('')}</ul>
      </div>`).join('')}</div>`;
  wireSearch(document.getElementById('heroSearch'));
  side.querySelectorAll('a').forEach(a => a.classList.remove('on'));
}

function renderArticle(a){
  document.body.classList.remove('home');
  const i = ORDER.indexOf(a.id), prev = BY[ORDER[i - 1]], next = BY[ORDER[i + 1]];
  main.innerHTML = `
    <article>
      <div class="crumb"><a href="#">Help Center</a> › <span>${esc(a.category)}</span></div>
      <h1>${esc(a.title)}</h1>
      <p class="lede">${esc(a.summary)}</p>
      <div class="body">${a.html}</div>
      <div class="foot"><div class="nextprev">
        ${prev ? `<a class="np" href="#${prev.id}"><span>Previous</span><em>${esc(prev.title)}</em></a>` : '<span></span>'}
        ${next ? `<a class="np n" href="#${next.id}"><span>Next</span><em>${esc(next.title)}</em></a>` : ''}
      </div></div>
    </article>`;
  side.querySelectorAll('a').forEach(el => el.classList.toggle('on', el.dataset.id === a.id));
  const on = side.querySelector('a.on');
  if (on && innerWidth > 900) on.scrollIntoView({ block:'nearest' });
  document.title = a.title + ' · Pantry Tab Help Center';
}

function route(){
  const id = decodeURIComponent(location.hash.replace(/^#/, ''));
  side.classList.remove('open');
  if (id && BY[id]) renderArticle(BY[id]);
  else { renderHome(); document.title = 'Pantry Tab Help Center'; }
  scrollTo({ top:0 });
}
addEventListener('hashchange', route);
document.getElementById('homeLink').onclick = e => {
  e.preventDefault(); history.pushState('', '', location.pathname); route();
};
document.getElementById('menuBtn').onclick = e => {
  e.stopPropagation(); side.classList.toggle('open');
};
document.addEventListener('click', e => {
  if (side.classList.contains('open') && !side.contains(e.target)) side.classList.remove('open');
});
route();
</script>
