    <title>Pantry Tab - Your Kitchen Companion</title>
    <script>
      // Single Page Apps for GitHub Pages — restore path encoded by 404.html
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <meta name="description" content="Pantry Tab helps you manage your pantry, track inventory, plan meals, and compare prices across stores. Stop wasting food and money." />
